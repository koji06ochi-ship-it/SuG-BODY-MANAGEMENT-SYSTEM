<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050403"><title>S.u.G QUEST｜MANHOLE CARDS V8</title><style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head>
<body>
<iframe id="app" src="./quest-transport-map-v7-person-art.html?v=manhole-v8-20260907"></iframe>
<script>
const app=document.getElementById('app');
const INFRA=[
 {id:'mh-kanan',type:'INFRA / MANHOLE',name:'河南マンホール',mark:'◎',crest:'河',sub:'地上に見える、地下インフラへの入口。河南を歩いた証。',need:s=>!!s.kananManhole,moved:'WATER / WASTEWATER',next:'河南 PERSON / CARGO QUEST',role:'河南AREA KEYを構成する独立INFRA CARD。マンホールから地域の水と暮らしへつなぐ。',certainty:'● 現地マンホール条件で取得',glow:'#2d5360',art:'#487e8d',mini:'#3e6d79'},
 {id:'mh-chihaya',type:'INFRA / MANHOLE',name:'千早赤阪マンホール',mark:'◎',crest:'千',sub:'山側の暮らしを支える地下インフラ。千早赤阪を歩いた証。',need:s=>!!s.chihayaManhole,moved:'WATER / WASTEWATER',next:'千早城・金剛山 ROUTE',role:'千早赤阪ROUTE KEYを構成する独立INFRA CARD。山の水と人の移動を同じ地図上でつなぐ。',certainty:'● 現地マンホール条件で取得',glow:'#35564d',art:'#527c6e',mini:'#496d62'},
 {id:'mh-taishi',type:'INFRA / MANHOLE',name:'太子マンホール',mark:'◎',crest:'太',sub:'竹内街道の町にある現代インフラ。古代の道と現代の地下を重ねる。',need:s=>!!s.taishiManhole,moved:'WATER / WASTEWATER',next:'聖徳太子・竹内街道',role:'太子TRANSPORT KEYを構成する独立INFRA CARD。街道の運搬史と現代インフラを接続する。',certainty:'● 現地マンホール条件で取得',glow:'#584a37',art:'#806c4c',mini:'#6c5b42'},
 {id:'mh-tenma',type:'INFRA / MANHOLE',name:'天満マンホール探索',mark:'◎',crest:'天',sub:'都市の地下を流れる水の入口。山から街へ届いた物語を都市インフラへ。',need:s=>!!s.tenmaManhole,moved:'WATER / WASTEWATER / CITY FLOW',next:'大川・堂島川・SEASON 02',role:'天満CITY GATEを構成する独立INFRA CARD。SEASON 01の終点とSEASON 02の入口をつなぐ。',certainty:'● 現地マンホール探索条件で取得',glow:'#2d4758',art:'#466b82',mini:'#3d5d70'}
];
function reachV5(){
  const v7=app.contentDocument;if(!v7)return null;
  const v6f=v7.getElementById('app');if(!v6f||!v6f.contentDocument)return null;
  const v6=v6f.contentDocument;
  const v5f=v6.getElementById('app');if(!v5f||!v5f.contentDocument)return null;
  return {d:v5f.contentDocument,w:v5f.contentWindow};
}
function install(){
  const r=reachV5();if(!r||!r.d.body||r.d.querySelector('[data-manhole-v8]'))return false;
  const {d,w}=r;
  const marker=d.createElement('meta');marker.dataset.manholeV8='';d.head.appendChild(marker);
  const s=d.createElement('style');
  s.textContent=`
    .miniCard.infraCard{background:radial-gradient(circle at 50% 0,#17313b,#080a0a 44%,#050403 78%);border-color:#526f79}
    .miniCard.infraCard .miniType{color:#8fd3e6}.miniCard.infraCard .miniState{color:#80e6aa}
    .miniCard.infraCard .miniArt{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 42%,#496f7c,#0d171a 66%,#050403);font-size:0}
    .miniCard.infraCard .miniArt:before{content:'◎';font:700 54px Georgia,'Yu Mincho',serif;color:#b9e4ef;text-shadow:0 4px 20px #000}
    .front.infraFront:before{background:radial-gradient(circle at 50% 16%,#214a59,#0b1418 40%,#050403 76%)}
    .front.infraFront .art:before{background:radial-gradient(circle at 50% 38%,#5b8794,#15262b 58%,#050403 100%)}
    .front.infraFront .art:after{content:'◎';color:#c8edf5;font-size:112px;opacity:.9}
    .front.infraFront .crest{border-color:#5e8f9f;color:#bfeaf3}
  `;d.head.appendChild(s);

  const originalRender=w.renderCollection;
  function readState(){try{return JSON.parse(w.localStorage.getItem('sugQuestTransportV2')||'{}')}catch(e){return {}}}
  function frontHTML(c){return `<div class="frame"></div><div class="frontTop"><span class="frontType">${c.type}</span><span class="frontNo">S.u.G QUEST / S01</span></div><div class="art" data-mark="${c.mark}"><div class="crest">${c.crest}</div></div><div><div class="frontName">${c.name}</div><div class="frontSub">${c.sub}</div></div><div class="frontFoot"><span>INFRA COLLECTION</span><b>GET</b></div>`}
  function backHTML(c){return `<div class="backType">${c.type} / TRANSPORT CARD</div><h2>${c.name}</h2><div class="backIntro">運ばれた道を、歩いてたどる。マンホールは、地下を流れる都市インフラが地上に現れる入口。</div><div class="section"><b>WHAT MOVED?</b><p>${c.moved}</p></div><div class="section"><b>NEXT ROUTE</b><p>${c.next}</p></div><div class="section"><b>ROLE</b><p>${c.role}</p></div><div class="certainty">${c.certainty}</div>`}
  function openInfra(c){
    const f=d.getElementById('front');f.className='face front infraFront';f.style.setProperty('--glow',c.glow);f.style.setProperty('--art',c.art);f.innerHTML=frontHTML(c);
    d.getElementById('backFace').innerHTML=backHTML(c);d.getElementById('flip').classList.remove('flipped');d.getElementById('flipBtn').textContent='裏面を見る';d.getElementById('reveal').classList.add('on');
  }
  function appendInfra(){
    const grid=d.getElementById('grid');if(!grid)return;
    grid.querySelectorAll('.infraCard').forEach(x=>x.remove());
    const st=readState();
    INFRA.forEach(c=>{
      const ok=c.need(st),b=d.createElement('button');b.className='miniCard infraCard '+(ok?'':'locked');b.dataset.id=c.id;b.style.setProperty('--mini',c.mini);
      b.innerHTML=`<div class="miniArt"></div><div class="miniType">${c.type}</div><h3>${c.name}</h3><div class="miniState">${ok?'GET ✓｜タップでカードを見る':'LOCKED'}</div>`;
      b.onclick=()=>{if(c.need(readState())){d.getElementById('collection').classList.remove('on');openInfra(c)}};grid.appendChild(b);
    });
  }
  w.renderCollection=function(){if(typeof originalRender==='function')originalRender();appendInfra()};
  const btn=d.getElementById('collectionBtn');if(btn)btn.textContent='CARD 09';
  const title=d.querySelector('.headTitle');if(title)title.textContent='CARD COLLECTION / 09';
  appendInfra();
  new MutationObserver(()=>{if(d.getElementById('collection')?.classList.contains('on')&&!d.querySelector('.infraCard'))appendInfra()}).observe(d.body,{childList:true,subtree:true});
  return true;
}
app.addEventListener('load',()=>{let n=0;const t=setInterval(()=>{n++;if(install()||n>60)clearInterval(t)},150)});
</script>
</body></html>
