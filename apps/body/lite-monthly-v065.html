<script>
(async()=>{
 try{
  const r=await fetch('./lite-monthly-v064.html?fresh='+Date.now(),{cache:'no-store'});
  let html=await r.text();
  const css=`<style id="sug-ai-avatar-v067">
.sugAiAvatarBox{position:relative;margin:10px 0 12px;padding:13px 12px;border:1px solid rgba(222,184,84,.34);background:radial-gradient(circle at 84% 20%,rgba(226,183,78,.09),transparent 27%),linear-gradient(145deg,rgba(20,18,14,.88),rgba(6,8,13,.92));box-shadow:inset 0 0 30px rgba(229,185,66,.035)}
.sugAiAvatarCopy{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.sugAiAvatarCopy b{font-family:Georgia,"Hiragino Mincho ProN",serif;color:#ead49b;font-size:14px;letter-spacing:.08em}.sugAiAvatarCopy span{color:#9c927c;font-size:9px;line-height:1.55}

.cardImage.aiGenerated{box-shadow:inset 0 0 75px rgba(228,184,75,.07)}.cardImage.aiGenerated:before{content:"AI QUEST HERO";position:absolute;z-index:11;left:50%;bottom:18px;transform:translateX(-50%);padding:6px 10px;border:1px solid rgba(224,184,82,.42);border-radius:999px;background:rgba(4,5,8,.68);backdrop-filter:blur(8px);color:#d9bc69;font-size:7px;letter-spacing:.16em;white-space:nowrap}

  const familyNav=`<script>document.addEventListener('DOMContentLoaded',()=>{const nav=document.querySelector('.bottomNav');if(!nav)return;const items=[...nav.querySelectorAll('a,button')];const item=items.find(x=>(x.textContent||'').includes('コレクション'));if(!item)return;item.addEventListener('click',e=>{e.preventDefault();location.href='./lite-collection-v066.html?v=066'});});<\/script>`;
  const treasureSave=`<script>(()=>{function boot(){if(document.getElementById('treasureSaveFx'))return;const fx=document.createElement('div');fx.id='treasureSaveFx';fx.innerHTML='<div class="treasureSaveCard" role="dialog" aria-modal="true" aria-labelledby="treasureSaveTitle"><div class="treasureSeal">✦</div><div class="treasureEy">FAMILY TREASURE</div><h3 id="treasureSaveTitle">家族の宝箱に保存しました</h3><p>今月の一歩と人生の断片が、<br>あなたの物語として残りました。</p><div class="treasureActions"><button id="treasureClose" type="button">この画面に戻る</button><a class="primary" href="./lite-collection-v066.html?v=066">宝箱を見る</a></div></div>';document.body.appendChild(fx);const close=()=>fx.classList.remove('open');fx.querySelector('#treasureClose').addEventListener('click',close);fx.addEventListener('click',e=>{if(e.target===fx)close()});document.addEventListener('click',e=>{const btn=e.target.closest&&e.target.closest('#saveCard');if(!btn)return;const card=document.querySelector('.questCard');if(card){card.classList.remove('sugTreasureSaved');void card.offsetWidth;card.classList.add('sugTreasureSaved');const r=card.getBoundingClientRect();const nav=[...document.querySelectorAll('.bottomNav a,.bottomNav button')].find(x=>(x.textContent||'').includes('コレクション'));const tr=nav?nav.getBoundingClientRect():{left:innerWidth*.76,top:innerHeight-38,width:20,height:20};const clone=card.cloneNode(true);clone.classList.add('sugTreasureFly');Object.assign(clone.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:Math.min(r.height,460)+'px'});document.body.appendChild(clone);const dx=(tr.left+tr.width/2)-(r.left+r.width/2),dy=(tr.top+tr.height/2)-(r.top+Math.min(r.height,460)/2);const anim=clone.animate([{transform:'translate(0,0) scale(1)',opacity:.94},{transform:'translate('+dx+'px,'+dy+'px) scale(.10)',opacity:.12}],{duration:760,easing:'cubic-bezier(.22,.8,.22,1)',fill:'forwards'});anim.onfinish=()=>clone.remove()}setTimeout(()=>fx.classList.add('open'),430)});}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();})();<\/script>`;
  html=html.replace('</head>',css+'</head>');

 }catch(e){document.getElementById('loading').innerHTML='<div><b>読み込みに失敗しました</b><small>ページを再読み込みしてください。</small></div>'}
})();
