<!doctype html>
<html lang="ja">
<head>

<title>S.u.G BODY Lite｜家族の宝箱 v0.6.8</title>
<style>
:root{--gold:#e4c56f;--gold2:#9b7833;--cream:#f7edd2;--muted:#978d78;--line:rgba(219,178,76,.38)}
*{box-sizing:border-box}html,body{margin:0;background:#02040a;color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}body{min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 74% 0,rgba(42,67,115,.43),transparent 30%),radial-gradient(ellipse at 14% 24%,rgba(120,82,30,.19),transparent 31%),linear-gradient(180deg,#050812,#03050b 44%,#020306 100%);background-attachment:fixed}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.58;background-image:radial-gradient(circle at 12% 13%,rgba(255,238,186,.86) 0 1px,transparent 1.7px),radial-gradient(circle at 80% 18%,rgba(194,213,255,.76) 0 1px,transparent 1.6px),radial-gradient(circle at 63% 37%,rgba(234,193,96,.74) 0 1px,transparent 1.7px);background-size:210px 210px,290px 290px,255px 255px}.app{position:relative;z-index:2;max-width:760px;margin:auto;padding:0 12px 42px}.topbar{position:sticky;top:0;z-index:40;margin:0 -12px;padding:calc(12px + env(safe-area-inset-top)) 17px 11px;background:linear-gradient(180deg,rgba(2,4,10,.98),rgba(2,4,10,.88),transparent);backdrop-filter:blur(15px)}.brand{display:flex;align-items:center;justify-content:space-between}.brandLeft{display:flex;align-items:center;gap:10px}.crest{width:37px;height:37px;border:1px solid #87682e;border-radius:50%;display:grid;place-items:center;font-family:Georgia,serif;font-weight:900;color:var(--gold);background:radial-gradient(circle,#302410,#090908 68%)}.brandName{font-family:Georgia,"Hiragino Mincho ProN",serif;color:#e8d29a;font-size:15px;letter-spacing:.13em}.brandSub{font-size:7.5px;color:#817866;margin-top:2px}.hero{position:relative;margin:0 -12px;padding:24px 20px 26px;border-bottom:1px solid rgba(208,170,78,.24);background:radial-gradient(circle at 72% 16%,rgba(221,174,65,.14),transparent 25%),linear-gradient(180deg,rgba(3,5,11,.12),rgba(3,5,11,.91))}.ey{font-size:8px;letter-spacing:.24em;color:#b89a50;font-weight:900}.hero h1{font-family:Georgia,"Hiragino Mincho ProN",serif;font-size:35px;line-height:1.1;letter-spacing:.04em;margin:9px 0 8px;color:#efd991}.hero p{margin:0;font-family:Georgia,"Hiragino Mincho ProN",serif;color:#c4b690;font-size:12px;line-height:1.8}.year{margin-top:12px;border:1px solid var(--line);padding:15px;background:linear-gradient(145deg,rgba(17,15,11,.94),rgba(6,7,10,.94));box-shadow:0 18px 60px rgba(0,0,0,.46)}.yearTop{display:flex;justify-content:space-between;gap:10px}.yearTitle{font-family:Georgia,"Hiragino Mincho ProN",serif;color:#efd888;font-size:23px}.yearTag{font-size:7px;color:#a48c51;letter-spacing:.18em;border:1px solid rgba(196,157,64,.38);padding:6px 8px;height:max-content}.yearStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px;padding-top:12px;border-top:1px solid rgba(173,138,54,.25)}.yearStats span{display:block;color:#8f856f;font-size:7px}.yearStats b{display:block;color:#ead18a;font-family:Georgia,serif;font-size:18px;margin-top:4px}.head{display:flex;justify-content:space-between;align-items:end;margin:20px 3px 9px}.head h2{margin:0;font-family:Georgia,"Hiragino Mincho ProN",serif;color:#ead49b;font-size:20px}.head small{color:#7d7567;font-size:7px;letter-spacing:.12em}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{position:relative;overflow:hidden;min-height:316px;border:1px solid rgba(213,173,72,.46);background:linear-gradient(180deg,#151824,#090a0e 63%,#100c06);box-shadow:0 18px 50px rgba(0,0,0,.45);cursor:pointer}.card:after{content:"";position:absolute;inset:6px;border:1px solid rgba(232,194,97,.27);pointer-events:none}.art{height:190px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(217,174,78,.16),transparent 28%),linear-gradient(180deg,#141c2b,#080a11 72%,#120d07)}.art:after{content:"";position:absolute;inset:auto 0 0;height:75px;background:linear-gradient(transparent,#08090d)}.art img{width:100%;height:100%;object-fit:cover;display:block}.seal{position:absolute;inset:0;display:grid;place-items:center;color:#d6b75f;font-size:46px}.rarity{position:absolute;right:9px;top:9px;z-index:4;padding:5px 7px;border:1px solid #81642a;background:rgba(5,6,9,.78);color:#d8ba67;font-size:7px;text-align:center}.body{position:relative;z-index:2;padding:10px 11px 13px}.month{font-size:8px;color:#a58e54;letter-spacing:.13em}.title{font-family:Georgia,"Hiragino Mincho ProN",serif;color:#efd995;font-size:16px;line-height:1.35;margin-top:4px}.story{font-size:8px;line-height:1.55;color:#a99e83;margin-top:4px}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:9px;padding-top:8px;border-top:1px solid rgba(163,130,51,.21)}.mini span{font-size:6px;color:#817967;display:block}.mini b{font-size:10px;color:#d8c085;display:block;margin-top:2px}.familyBadge{margin-top:8px;border-left:2px solid #b78e37;padding:5px 0 5px 7px;color:#d6c397;font-size:7.5px;line-height:1.45}.empty{grid-column:1/-1;padding:36px 18px;text-align:center;border:1px solid rgba(213,173,72,.31);background:rgba(7,8,12,.82)}.empty b{display:block;font-family:Georgia,"Hiragino Mincho ProN",serif;color:#dfc475;font-size:20px;margin-bottom:8px}.empty p{font-size:9px;color:#948a76;line-height:1.7}.cta{display:inline-block;margin-top:10px;padding:10px 16px;border:1px solid #9c7932;border-radius:999px;color:#ebcf78;text-decoration:none;font-size:9px;background:linear-gradient(180deg,rgba(68,49,18,.9),rgba(16,12,7,.94))}.note{margin:15px 3px 0;color:#756e61;font-size:7.5px;line-height:1.6}.bottomNav{position:fixed;z-index:70;left:0;right:0;bottom:0;height:calc(78px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(4,5,8,.95);border-top:1px solid rgba(166,132,52,.26);backdrop-filter:blur(18px)}.bottomNav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-decoration:none;color:#777268;font-size:8px}.bottomNav a.active{color:#d8b95f}.ico{font-size:19px}.modal{position:fixed;z-index:100;inset:0;display:none;align-items:flex-end;background:rgba(0,0,0,.72);backdrop-filter:blur(8px)}.modal.open{display:flex}.sheet{width:100%;max-width:760px;margin:auto;max-height:90vh;overflow:auto;border:1px solid rgba(224,183,84,.45);border-bottom:0;background:linear-gradient(180deg,#0d1018,#050609);padding:14px 14px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -20px 70px rgba(0,0,0,.7)}.close{display:block;margin-left:auto;border:1px solid #765f31;background:#0b0b0b;color:#d6bd79;border-radius:50%;width:34px;height:34px}.detailArt{height:330px;position:relative;overflow:hidden;border:1px solid rgba(222,181,81,.4);background:#0b0d13;margin-top:8px}.detailArt img{width:100%;height:100%;object-fit:cover}.detailTitle{font-family:Georgia,"Hiragino Mincho ProN",serif;color:#f0da94;font-size:27px;margin:14px 2px 3px}.detailStory{color:#b2a486;font-size:10px}.detailGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:13px}.stat{border:1px solid rgba(184,147,61,.23);padding:10px;background:rgba(16,14,10,.55)}.stat span{font-size:7px;color:#8b826e}.stat b{display:block;color:#e7ce87;font-size:16px;margin-top:3px}.box{margin-top:12px;border:1px solid rgba(184,147,61,.26);padding:13px;background:linear-gradient(145deg,rgba(39,28,10,.42),rgba(6,7,10,.8))}.box small{color:#a58c4c;font-size:7px;letter-spacing:.13em}.box p{margin:7px 0 0;font-family:Georgia,"Hiragino Mincho ProN",serif;color:#d8c79b;font-size:12px;line-height:1.75}.familyEdit textarea{width:100%;min-height:88px;margin-top:9px;resize:vertical;border:1px solid rgba(202,160,65,.42);border-radius:10px;background:#07080c;color:#f2e6c8;padding:11px;font:inherit;font-size:12px;line-height:1.6;outline:none}.familyEdit textarea:focus{border-color:#c39a43;box-shadow:0 0 0 2px rgba(195,154,67,.08)}.familyActions{display:flex;gap:8px;margin-top:8px}.familyActions button{flex:1;border:1px solid #94712c;border-radius:999px;padding:10px;background:linear-gradient(180deg,rgba(71,51,18,.94),rgba(19,13,7,.96));color:#efd37b;font-weight:900;font-size:9px}.familyStatus{min-height:14px;margin-top:7px;color:#88cf91;font-size:8px}
@media(max-width:420px){.cards{gap:8px}.card{min-height:305px}.art{height:178px}.title{font-size:15px}.hero h1{font-size:32px}}
</style>
</head>
<body>
<main class="app">
<header class="topbar"><div class="brand"><div class="brandLeft"><div class="crest">S</div><div><div class="brandName">S.u.G BODY Lite</div><div class="brandSub">歩くことで、人生は少しずつ強くなる。</div></div></div><div style="color:#d7b65d;font-size:24px">☰</div></div></header>
<section class="hero"><div class="ey">FAMILY TREASURE</div><h1>家族の宝箱</h1><p>その月の一歩と、<br>家族の言葉を一緒に残す。</p></section>
<section class="year"><div class="yearTop"><div><div class="yearTitle">YEAR QUEST CARD</div><div style="font-size:8px;color:#91856f;margin-top:4px" id="yearSub">今年の物語</div></div><div class="yearTag">ANNUAL STORY</div></div><div class="yearStats"><div><span>保存カード</span><b id="yearMonths">0</b></div><div><span>平均歩数</span><b id="yearSteps">--</b></div><div><span>QUEST日数</span><b id="yearQuest">0</b></div></div></section>
<div class="head"><h2>月間QUEST CARD</h2><small>MONTHLY ARCHIVE</small></div>
<section class="cards" id="cards"></section>
<p class="note">※月間カード・AI主人公画像・家族コメントはこの端末内に保存されます。</p>
</main>
<nav class="bottomNav"><a href="./lite-quest-v065.html?v=067"><span class="ico">⌂</span><span>ホーム</span></a><a href="./lite-monthly-v065.html?v=067"><span class="ico">▥</span><span>今月の変化</span></a><a href="./lite-quest-v065.html?v=067#quest"><span class="ico">⚑</span><span>QUEST</span></a><a class="active" href="./lite-collection-v068.html?v=068"><span class="ico">◇</span><span>コレクション</span></a><a href="./lite-quest-v065.html?v=067"><span class="ico">●</span><span>マイページ</span></a></nav>
<div class="modal" id="modal"><div class="sheet"><button class="close" id="close">×</button><div class="detailArt" id="detailArt"><div class="seal">✦</div></div><div class="detailTitle" id="detailTitle"></div><div class="detailStory" id="detailStory"></div><div class="detailGrid"><div class="stat"><span>★ RANK</span><b id="detailStars"></b></div><div class="stat"><span>平均神宝</span><b id="detailTreasure"></b></div><div class="stat"><span>平均歩数</span><b id="detailSteps"></b></div><div class="stat"><span>QUEST参加</span><b id="detailQuest"></b></div><div class="stat"><span>外出日数</span><b id="detailOutside"></b></div><div class="stat"><span>記録日数</span><b id="detailDays"></b></div></div><div class="box"><small>人生の断片</small><p id="detailFragment">—</p></div><div class="box familyEdit"><small>家族からのひとこと</small><textarea id="familyComment" maxlength="120" placeholder="例：今月もよく歩いたね。次は一緒にQUEST行こう。"></textarea><div class="familyActions"><button id="familySave" type="button">この言葉を残す</button></div><div class="familyStatus" id="familyStatus"></div></div></div></div>
<script>
(()=>{'use strict';
const CARDS='sug_body_lite_month_cards_v1',COMMENTS='sug_body_lite_family_comments_v1',PHOTO_DB='sug_body_lite_photos_v1',PHOTO_STORE='photos';
const $=s=>document.querySelector(s);const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function db(){return new Promise((res,rej)=>{const r=indexedDB.open(PHOTO_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(PHOTO_STORE))r.result.createObjectStore(PHOTO_STORE)};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function photoGet(k){try{const d=await db();return await new Promise((res,rej)=>{const r=d.transaction(PHOTO_STORE).objectStore(PHOTO_STORE).get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}catch{return null}}
async function heroFor(month){return await photoGet('hero-ai:'+month)||await photoGet('hero:'+month)}
function fmtSteps(v){return v==null?'--':Math.round(v).toLocaleString()}
let currentMonth='';
async function render(){const all=read(CARDS,{}),comments=read(COMMENTS,{}),months=Object.keys(all).sort().reverse(),wrap=$('#cards');const y=String(new Date().getFullYear());const thisYear=months.filter(m=>m.startsWith(y));const ys=thisYear.map(m=>all[m]);$('#yearSub').textContent=y+'年の物語';$('#yearMonths').textContent=thisYear.length;const steps=ys.map(x=>Number(x.avgSteps)).filter(Number.isFinite);$('#yearSteps').textContent=steps.length?Math.round(steps.reduce((a,b)=>a+b,0)/steps.length).toLocaleString():'--';$('#yearQuest').textContent=ys.reduce((a,x)=>a+(Number(x.questDays)||0),0);if(!months.length){wrap.innerHTML='<div class="empty"><b>まだ宝箱は空です</b><p>今月の変化からQUEST CARDを保存すると、<br>ここにあなたの物語が並びます。</p><a class="cta" href="./lite-monthly-v065.html?v=067">今月のカードを見る</a></div>';return}wrap.innerHTML='';for(const m of months){const c=all[m]||{},comment=comments[m]||'',el=document.createElement('article');el.className='card';el.dataset.month=m;el.innerHTML='<div class="art"><div class="seal">✦</div><div class="rarity">RARE<br>'+('★'.repeat(Number(c.stars)||1))+'</div></div><div class="body"><div class="month">'+esc(m.replace('-',' / '))+'</div><div class="title">'+esc(c.title||'星を見上げる旅人')+'</div><div class="story">'+esc(c.story||'今日の一歩が、物語の始まり。')+'</div><div class="mini"><div><span>歩数</span><b>'+fmtSteps(c.avgSteps)+'</b></div><div><span>QUEST</span><b>'+(Number(c.questDays)||0)+'日</b></div><div><span>外出</span><b>'+(Number(c.outsideDays)||0)+'日</b></div></div>'+(comment?'<div class="familyBadge">家族より｜'+esc(comment)+'</div>':'')+'</div>';const art=el.querySelector('.art'),blob=await heroFor(m);if(blob){const img=document.createElement('img');img.src=URL.createObjectURL(blob);art.prepend(img);const seal=art.querySelector('.seal');if(seal)seal.remove()}el.addEventListener('click',()=>openDetail(m,c));wrap.appendChild(el)}}
async function openDetail(m,c){currentMonth=m;const comments=read(COMMENTS,{});$('#detailTitle').textContent=c.title||'星を見上げる旅人';$('#detailStory').textContent=c.story||'今日の一歩が、物語の始まり。';$('#detailStars').textContent='★'.repeat(Number(c.stars)||1)+'☆'.repeat(Math.max(0,5-(Number(c.stars)||1)));$('#detailTreasure').textContent=c.treasureAvg==null?'--':Number(c.treasureAvg).toFixed(1)+' / 10';$('#detailSteps').textContent=fmtSteps(c.avgSteps)+' 歩';$('#detailQuest').textContent=(Number(c.questDays)||0)+' 日';$('#detailOutside').textContent=(Number(c.outsideDays)||0)+' 日';$('#detailDays').textContent=(Number(c.recordDays)||0)+' 日';$('#detailFragment').textContent=c.fragment||'今月、残しておきたい出来事はまだありません。';$('#familyComment').value=comments[m]||'';$('#familyStatus').textContent='';const art=$('#detailArt');art.innerHTML='<div class="seal">✦</div>';const blob=await heroFor(m);if(blob){const img=document.createElement('img');img.src=URL.createObjectURL(blob);art.innerHTML='';art.appendChild(img)}$('#modal').classList.add('open')}
$('#familySave').addEventListener('click',()=>{if(!currentMonth)return;const comments=read(COMMENTS,{}),v=$('#familyComment').value.trim();if(v)comments[currentMonth]=v;else delete comments[currentMonth];localStorage.setItem(COMMENTS,JSON.stringify(comments));$('#familyStatus').textContent=v?'家族の言葉を宝箱に残しました。':'家族コメントを空欄に戻しました。';render()});$('#close').addEventListener('click',()=>$('#modal').classList.remove('open'));$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))$('#modal').classList.remove('open')});render();
})();
</script>
</body>
</html>
