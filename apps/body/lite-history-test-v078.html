<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02040a"><title>S.u.G｜歴史カード超軽量確認</title><style>*{box-sizing:border-box}html,body{margin:0;background:#02040a;color:#f5e8bd;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}body{min-height:100vh;padding:calc(12px + env(safe-area-inset-top)) 12px 24px}.wrap{max-width:430px;margin:auto}.head{font-size:11px;color:#a99054;margin-bottom:8px}.controls{display:grid;gap:6px;margin-bottom:12px}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}button{border:1px solid #5f4c24;border-radius:8px;background:#0b0c11;color:#978b70;padding:9px 3px;font-size:10px;font-weight:800}button.on{background:#3a2a0e;color:#f4d77f;border-color:#b58c34}.card{width:min(82vw,320px);aspect-ratio:3/4;margin:0 auto;border:1px solid #a47c2d;border-radius:14px;overflow:hidden;background:#07080c;box-shadow:0 10px 28px #000}.card img{display:block;width:100%;height:100%;object-fit:cover}.partial img{opacity:.55}.status{text-align:center;margin-top:9px;font-size:11px;color:#d6ba70}.note{text-align:center;margin-top:4px;font-size:8px;color:#716956}.back{display:block;text-align:center;margin-top:14px;color:#b79b56;text-decoration:none;font-size:10px}</style></head><body><div class="wrap"><div class="head">S.u.G QUEST｜超軽量カード確認</div><div class="controls"><div class="row" id="regions"><button class="on" data-r="kanan">河南町</button><button data-r="taishi">太子町</button><button data-r="kusunoki">千早赤阪村</button></div><div class="row" id="stages"><button class="on" data-s="0">0/5 裏面</button><button data-s="3">3/5 半解放</button><button data-s="5">5/5 完成</button></div></div><div class="card" id="card"><img id="img" src="./assets/history-lite/back-v078.jpg?v=078" alt="歴史カード"></div><div class="status" id="status">封印中｜裏面</div><div class="note">本番データには一切保存しません</div><a class="back" href="./lite-history-v075.html?v=075">本番の歴史の断片へ戻る</a></div><script>(()=>{let region='kanan',stage=0;const img=document.getElementById('img'),card=document.getElementById('card'),status=document.getElementById('status');const files={kanan:'kanan-v078.jpg',taishi:'taishi-v078.jpg',kusunoki:'kusunoki-v078.jpg'};function render(){card.className='card'+(stage===3?' partial':'');img.src=stage===0?'./assets/history-lite/back-v078.jpg?v=078':'./assets/history-lite/'+files[region]+'?v=078';status.textContent=stage===0?'封印中｜裏面':stage===3?'第一解放｜3 / 5':'CARD COMPLETE｜5 / 5'}document.getElementById('regions').onclick=e=>{const b=e.target.closest('button[data-r]');if(!b)return;region=b.dataset.r;document.querySelectorAll('#regions button').forEach(x=>x.classList.toggle('on',x===b));render()};document.getElementById('stages').onclick=e=>{const b=e.target.closest('button[data-s]');if(!b)return;stage=Number(b.dataset.s);document.querySelectorAll('#stages button').forEach(x=>x.classList.toggle('on',x===b));render()}})();</script></body></html>
