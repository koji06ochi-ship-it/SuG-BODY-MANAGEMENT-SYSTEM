<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070708">
<title>S.u.G ROM / CARE V27.82</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#070708;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans",sans-serif}body{display:grid;grid-template-rows:auto 1fr;overflow:hidden}.bar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:#09090bf4;border-bottom:1px solid #28282e;backdrop-filter:blur(14px);z-index:5}.back,.mode{border:1px solid #34343b;background:#151518;color:#ddd;border-radius:10px;padding:8px 10px;font-weight:900;font-size:10px}.title{text-align:center;min-width:0}.title b{display:block;font-size:12px;letter-spacing:.06em}.title small{display:block;font-size:8px;color:#61adff;margin-top:2px}.modes{display:flex;gap:5px}.mode.on{border-color:#4a85bd;color:#9fd0ff;background:#102034}.frame{width:100%;height:100%;border:0;background:#070708}.status{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:10;border:1px solid #2f4358;background:#0d151eeb;color:#9fd0ff;border-radius:999px;padding:6px 9px;font-size:8px;pointer-events:none;transition:.25s}.status.ok{opacity:0;transform:translateY(4px)}
</style>
</head>
<body>
<header class="bar">
  <button id="back" class="back" type="button">← BODY</button>
  <div class="title"><b>ROM / CARE</b><small>SHARED ASSESSMENT · V27.82</small></div>
  <div class="modes"><button class="mode on" data-mode="rom" type="button">ROM</button><button class="mode" data-mode="care" type="button">CARE</button></div>
</header>
<iframe id="legacy" class="frame" src="../../index.html?native=ios&v=27.82" title="S.u.G ROM CARE"></iframe>
<div id="status" class="status">ROMを接続中...</div>
<script>
const frame=document.getElementById('legacy');const status=document.getElementById('status');let target='rom';let attempts=0;let timer=null;
function hub(){const native=new URLSearchParams(location.search).get('native')==='ios';location.href='./hub-v27.82.html'+(native?'?native=ios&v=27.82':'?v=27.82')}
document.getElementById('back').onclick=hub;
function setMode(mode){target=mode;document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));attempts=0;status.classList.remove('ok');status.textContent=(mode==='rom'?'ROM':'CARE')+'を接続中...';activate()}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
function activate(){attempts++;try{const d=frame.contentDocument;if(!d)throw new Error('document not ready');const tab=d.querySelector('.tab[data-tab="'+target+'"]');const panel=d.getElementById(target);if(tab&&panel){tab.click();setTimeout(()=>{try{panel.scrollIntoView({block:'start'})}catch(_e){}},120);status.textContent=(target==='rom'?'ROM':'CARE')+' 接続済み';status.classList.add('ok');clearInterval(timer);return true}}catch(_e){}if(attempts>60){status.textContent='接続待ち：ログイン後に自動で開きます';attempts=0}return false}
frame.addEventListener('load',()=>{attempts=0;activate();clearInterval(timer);timer=setInterval(activate,500)});timer=setInterval(activate,500);
</script>
</body>
</html>
