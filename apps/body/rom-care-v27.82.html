<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070708">
<title>S.u.G ROM / CARE V27.82</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#070708;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans",sans-serif}body{display:grid;grid-template-rows:auto 1fr;overflow:hidden}.bar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:#09090bf4;border-bottom:1px solid #28282e;backdrop-filter:blur(14px);z-index:5}.back,.mode{border:1px solid #34343b;background:#151518;color:#ddd;border-radius:10px;padding:8px 10px;font-weight:900;font-size:10px}.title{text-align:center;min-width:0}.title b{display:block;font-size:12px;letter-spacing:.06em}.title small{display:block;font-size:8px;color:#61adff;margin-top:2px}.modes{display:flex;gap:5px}.mode.on{border-color:#4a85bd;color:#9fd0ff;background:#102034}.frame{width:100%;height:100%;border:0;background:#070708}.status{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:10;border:1px solid #2f4358;background:#0d151eeb;color:#9fd0ff;border-radius:999px;padding:6px 9px;font-size:8px;pointer-events:none;transition:.25s}.status.ok{opacity:0;transform:translateY(4px)}
</style>
</head>
<body>
<header class="bar">
  <button id="back" class="back" type="button">← BODY</button>
  <div class="title"><b>ROM / CARE</b><small>SHARED ASSESSMENT · V27.82</small></div>
  <div class="modes"><button class="mode on" data-mode="rom" type="button">ROM</button><button class="mode" data-mode="care" type="button">CARE</button></div>
</header>
<iframe id="legacy" class="frame" src="about:blank" title="S.u.G ROM CARE"></iframe>
<div id="status" class="status">ROMを接続中...</div>
<script src="../shared/rom-care-v27.82.js?v=27.82"></script>
<script>
const shared=window.SuGRomCare;
const context=shared.queryContext();
const frame=document.getElementById('legacy');
const status=document.getElementById('status');
let target=context.section;
let ready=false;
let timeout=null;

function updateMode(mode){
  target=shared.normalizeSection(mode);
  document.querySelectorAll('.mode').forEach(button=>button.classList.toggle('on',button.dataset.mode===target));
}
function showStatus(connected=false){
  status.textContent=(target==='rom'?'ROM':'CARE')+(connected?' 接続済み':'を接続中...');
  status.classList.toggle('ok',connected);
}
function postMode(){
  if(!frame.contentWindow)return;
  const origin=location.origin&&location.origin!=='null'?location.origin:'*';
  frame.contentWindow.postMessage({type:shared.messages.setSection,section:target},origin);
}
function setMode(mode){
  updateMode(mode);showStatus(false);postMode();
}

document.getElementById('back').onclick=()=>{location.href=shared.returnUrl(context)};
document.querySelectorAll('.mode').forEach(button=>button.onclick=()=>setMode(button.dataset.mode));
window.addEventListener('message',event=>{
  if(location.origin&&location.origin!=='null'&&event.origin!==location.origin)return;
  if(event.source!==frame.contentWindow)return;
  if(event.data?.type===shared.messages.ready){
    ready=true;updateMode(event.data.section);showStatus(true);clearTimeout(timeout);
  }else if(event.data?.type===shared.messages.section){
    updateMode(event.data.section);showStatus(true);
  }
});
frame.addEventListener('load',()=>{ready=false;showStatus(false);postMode()});
updateMode(target);showStatus(false);
frame.src=shared.legacyPageUrl(context);
timeout=setTimeout(()=>{if(!ready)status.textContent='接続待ち：ログイン後に自動で開きます'},15000);
</script>
</body>
</html>
