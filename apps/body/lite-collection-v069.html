<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02040a"><title>S.u.G BODY Lite｜家族の宝箱 v0.6.9 YEAR</title><style>html,body{margin:0;background:#02040a;color:#e4c56f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#loading{min-height:100vh;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 15%,#172443,#070910 52%,#020307)}#loading b{font-family:Georgia,"Hiragino Mincho ProN",serif;font-size:23px;display:block;margin-bottom:8px}#loading small{color:#8c8169}</style></head>
<body><div id="loading"><div><b>家族の宝箱</b><small>YEAR QUEST CARD を読み込み中…</small></div></div>
<script>
(async()=>{try{const r=await fetch('./lite-collection-v068.html?fresh='+Date.now(),{cache:'no-store'});let html=await r.text();const css=`<style id="sug-year-v069">.year{cursor:pointer;position:relative;transition:transform .18s ease,border-color .18s ease}.year:active{transform:scale(.992)}.yearOpen{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(177,140,54,.22);color:#d9bd6d;font-size:9px;font-weight:900}.yearOpen span:last-child{font-size:18px;line-height:1}.year:hover{border-color:rgba(226,185,84,.62)}</style>`;const js=`<script>document.addEventListener('DOMContentLoaded',()=>{const y=document.querySelector('.year');if(y){const row=document.createElement('div');row.className='yearOpen';row.innerHTML='<span>YEAR QUEST CARDを開く</span><span>›</span>';y.appendChild(row);y.setAttribute('role','button');y.setAttribute('tabindex','0');const go=()=>location.href='./lite-year-v069.html?v=069';y.addEventListener('click',go);y.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')go()})}document.querySelectorAll('a[href*="lite-collection-v068.html"]').forEach(a=>a.href='./lite-collection-v069.html?v=069');});<\/script>`;html=html.replace('</head>',css+'</head>').replace(/v0\.6\.8/g,'v0.6.9 YEAR').replace('</body>',js+'</body>');document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').innerHTML='<div><b>読み込みに失敗しました</b><small>ページを再読み込みしてください。</small></div>'}})();
</script></body></html>
