<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070708"><title>S.u.G BODY OPERATOR</title><style>*{box-sizing:border-box}body{margin:0;background:#070708;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:820px;margin:auto;padding:18px}.hero{padding:40px 0 22px}.ey{font-size:10px;letter-spacing:.16em;color:#d9b85f;font-weight:900}.hero h1{font-size:38px;margin:7px 0}.sub{font-size:12px;color:#85858d;line-height:1.6}.card{border:1px solid #29292e;background:#101012;border-radius:20px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{border:1px solid #2e2e34;border-radius:13px;padding:12px;background:#0b0b0d}.metric span{font-size:8px;color:#777}.metric b{display:block;margin-top:5px;color:#efcf74;font-size:17px}.row{border-top:1px solid #28282d;padding:12px 0}.row:first-child{border-top:0}.rowHead{display:flex;justify-content:space-between;gap:8px}.row small{display:block;color:#777;margin-top:5px;line-height:1.5}.btn,input,select{width:100%;border-radius:10px;padding:10px;border:1px solid #36363d;background:#0b0b0d;color:#fff}.btn{margin-top:8px;background:#d2aa46;color:#111;font-weight:900}.danger{background:#241112;color:#ff8d8d;border-color:#6b3030}.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}.form .wide{grid-column:1/-1}.status{font-size:10px;color:#d9b85f;margin-top:8px}.badge{font-size:8px;padding:4px 7px;border:1px solid #555;border-radius:999px}.warn{border:1px solid #6e5724;background:#18130a;color:#d8ba6a;border-radius:14px;padding:11px;font-size:10px;line-height:1.6;margin-bottom:12px}.authGate{position:fixed;inset:0;z-index:99;background:#070708;display:flex;align-items:center;justify-content:center;padding:22px}.authBox{width:min(430px,100%);border:1px solid #735e2e;background:#101012;border-radius:22px;padding:20px}.authBox h2{margin:6px 0 12px}.hide{display:none!important}@media(max-width:520px){.grid,.form{grid-template-columns:1fr}.form .wide{grid-column:auto}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div id="authGate" class="authGate"><div class="authBox"><div class="ey">TRAINER AUTH · V27.51</div><h2>管理者確認</h2><div id="authMsg" class="sub">ログイン状態を確認中…</div><div id="loginForm" class="hide"><input id="email" type="email" placeholder="メール"><input id="password" type="password" placeholder="パスワード" style="margin-top:8px"><button class="btn" id="loginBtn">TRAINER LOGIN</button></div></div></div><main id="app" class="w hide"><section class="hero"><div class="ey">S.u.G OSAKA · BODY OPERATOR · V27.51</div><h1>MANAGEMENT</h1><div class="sub">TRAINER認証済み。会員・提携店・特典を管理。</div></section><section class="card"><div class="ey">MEMBERS</div><h2>会員状態</h2><button class="btn" id="refreshMembers">会員一覧を更新</button><div id="memberStatus" class="status"></div><div id="memberList"></div></section><section class="card"><div class="ey">REWARD BUDGET</div><h2>今月の特典原資</h2><div class="grid"><div class="metric"><span>使用済み</span><b id="used">¥0</b></div><div class="metric"><span>残り</span><b id="remain">¥0</b></div><div class="metric"><span>上限</span><b id="max">¥20,000</b></div></div></section><section class="card"><div class="ey">REWARD SETTINGS</div><h2>特典設定</h2><div id="rewardSettings"></div></section><section class="card"><div class="ey">CODE VERIFY</div><h2>交換コード確認</h2><input id="code" placeholder="SUG-..."><select id="partner"><option value="">店舗指定なし</option></select><button class="btn" id="verify">確認</button><div id="verifyResult" class="status"></div></section><section class="card"><div class="ey">PARTNER MASTER</div><h2>提携店</h2><div class="form"><input id="pName" placeholder="店舗名"><select id="pKind"><option>FOOD</option><option>BATH</option><option>CAFE</option><option>OTHER</option></select><input id="pDiscount" type="number" placeholder="割引額"><input id="pCost" type="number" placeholder="実費"><input id="pPoints" type="number" placeholder="必要pt"><input id="pLimit" type="number" placeholder="月上限"><input id="pMenu" class="wide" placeholder="対象メニュー"><input id="pAddress" class="wide" placeholder="住所"></div><button class="btn" id="addPartner">提携店を追加</button><div id="partnerStatus" class="status"></div><div id="partnerList"></div></section><section class="card"><div class="ey">ISSUED</div><h2>発行済み特典</h2><div id="history"></div></section></main><script src="../../shared/points-v27.16.js?v=27.51"></script><script src="../../shared/partners-v27.22.js?v=27.51"></script><script src="../../shared/rewards-v27.42.js?v=27.51"></script><script>(()=>{'use strict';const SUPA_URL='https://nnqzxcgkqjnmtzcvorha.supabase.co',SUPA_KEY='sb_publishable_zcn7r2YSKDZa1lXJvmk3sg_GulOJXwI',sb=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id),P=()=>window.SuGPointsV2716,R=()=>window.SuGRewardsV2742,PT=()=>window.SuGPartnersV2722;let trainer=null;function money(n){return'¥'+Number(n||0).toLocaleString()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function authorize(){const {data:{session}}=await sb.auth.getSession();if(!session){$('authMsg').textContent='TRAINERアカウントでログインしてください。';$('loginForm').classList.remove('hide');return false}const {data,error}=await sb.from('profiles').select('id,display_name,role').eq('id',session.user.id).maybeSingle();if(error||data?.role!=='trainer'){await sb.auth.signOut();$('authMsg').textContent='TRAINER権限がないため管理画面は開けません。';$('loginForm').classList.remove('hide');return false}trainer=data;$('authGate').classList.add('hide');$('app').classList.remove('hide');await loadMembers();render();return true}async function loadMembers(){if(!trainer)return;const {data,error}=await sb.from('profiles').select('id,display_name,role').order('display_name',{ascending:true});if(error){$('memberStatus').textContent='会員一覧取得不可｜'+error.message;$('memberList').innerHTML='';return}$('memberStatus').textContent=`${data.length}件｜${trainer.display_name||'TRAINER'}で認証済み`;$('memberList').innerHTML=data.filter(x=>x.role!=='trainer').map(x=>`<div class="row"><div class="rowHead"><b>${esc(x.display_name||'会員')}</b><span class="badge">${esc(String(x.role||'INVALID').toUpperCase())}</span></div><small>${esc(x.id)}</small><div class="form" style="margin-top:8px"><button class="btn" data-role-id="${esc(x.id)}" data-role="member">ACTIVE</button><button class="btn danger" data-role-id="${esc(x.id)}" data-role="inactive">無効化</button></div></div>`).join('')||'<div class="sub">会員なし</div>';document.querySelectorAll('[data-role-id]').forEach(b=>b.onclick=()=>setRole(b.dataset.roleId,b.dataset.role))}async function setRole(id,role){const {error}=await sb.from('profiles').update({role}).eq('id',id);$('memberStatus').textContent=error?'更新失敗｜'+error.message:'会員状態を更新しました';if(!error)await loadMembers()}function render(){if(!P()||!R()||!PT())return setTimeout(render,80);const b=P().budget(),max=Number(b.maxCostYen||20000),used=Number(b.usedCostYen||0);$('used').textContent=money(used);$('remain').textContent=money(Math.max(0,max-used));$('max').textContent=money(max);$('rewardSettings').innerHTML=R().catalog().map(x=>`<div class="row" data-r="${x.id}"><div class="rowHead"><b>${x.name}</b><span>${x.points.toLocaleString()}pt</span></div><div class="form" style="margin-top:8px"><input data-cost type="number" value="${x.costReady?x.costYen:''}" placeholder="実費"><input data-limit type="number" value="${x.monthlyLimit}" placeholder="月上限"><input data-days type="number" value="${x.validityDays}" placeholder="期限日数"><button class="btn" data-save="${x.id}">保存</button></div></div>`).join('');document.querySelectorAll('[data-save]').forEach(btn=>btn.onclick=()=>{const row=btn.closest('[data-r]'),id=btn.dataset.save,c=row.querySelector('[data-cost]').value;if(c)R().setCost(id,c);R().setLimit(id,row.querySelector('[data-limit]').value);R().setValidity(id,row.querySelector('[data-days]').value);render()});const partners=PT().list();$('partner').innerHTML='<option value="">店舗指定なし</option>'+partners.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');$('partnerList').innerHTML=partners.length?partners.map(p=>`<div class="row"><div class="rowHead"><b>${esc(p.name)}</b><span class="badge">${esc(p.kind)}</span></div><small>${esc(p.address||'')}${p.targetMenu?'｜'+esc(p.targetMenu):''}</small><small>${p.points||0}pt｜実費 ${money(p.costYen)}｜月上限 ${p.monthlyLimit||0}</small><button class="btn danger" data-del="${esc(p.id)}">削除</button></div>`).join(''):'<div class="sub">登録なし</div>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{PT().remove(b.dataset.del);render()});const rows=R().state().redemptions.slice(0,30);$('history').innerHTML=rows.length?rows.map(r=>`<div class="row"><div class="rowHead"><b>${esc(r.name)}</b><span class="badge">${esc(r.status||'ISSUED')}</span></div><small>${esc(r.code)}</small><small>${esc(r.partnerName||'')}${r.expiresAt?'｜期限 '+new Date(r.expiresAt).toLocaleDateString('ja-JP'):''}</small></div>`).join(''):'<div class="sub">発行履歴なし</div>'}$('loginBtn').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;$('authMsg').textContent='認証中…';const {error}=await sb.auth.signInWithPassword({email,password});if(error){$('authMsg').textContent='LOGIN ERROR｜'+error.message;return}await authorize()};$('refreshMembers').onclick=loadMembers;$('verify').onclick=()=>{const v=R().verifyCode($('code').value,{partnerId:$('partner').value});if(!v.ok){$('verifyResult').textContent='利用不可｜'+v.reason;return}const r=v.redemption;$('verifyResult').innerHTML=`有効｜${esc(r.name)}${r.partnerName?'｜'+esc(r.partnerName):''}<button id="consume" class="btn">${r.delivery==='COUPON'?'使用済みにする':'受取済みにする'}</button>`;$('consume').onclick=()=>{const out=R().consumeCode(r.code,{partnerId:$('partner').value});$('verifyResult').textContent=out.ok?'処理完了':'処理不可｜'+out.reason;render()}};$('addPartner').onclick=()=>{const out=PT().upsert({name:$('pName').value,kind:$('pKind').value,discountYen:$('pDiscount').value,costYen:$('pCost').value,points:$('pPoints').value,monthlyLimit:$('pLimit').value,targetMenu:$('pMenu').value,address:$('pAddress').value});$('partnerStatus').textContent=out.ok?'追加しました':'店舗名を入力してください';if(out.ok){['pName','pDiscount','pCost','pPoints','pLimit','pMenu','pAddress'].forEach(id=>$(id).value='');render()}};window.addEventListener('sug:rewards-change',render);window.addEventListener('sug:partners-change',render);window.addEventListener('sug:points-change',render);authorize()})();</script></body></html>
