<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070708"><title>S.u.G BODY OPERATOR</title><style>*{box-sizing:border-box}body{margin:0;background:#070708;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:820px;margin:auto;padding:18px}.hero{padding:40px 0 22px}.ey{font-size:10px;letter-spacing:.16em;color:#d9b85f;font-weight:900}.hero h1{font-size:38px;margin:7px 0}.sub{font-size:12px;color:#85858d;line-height:1.6}.card{border:1px solid #29292e;background:#101012;border-radius:20px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{border:1px solid #2e2e34;border-radius:13px;padding:12px;background:#0b0b0d}.metric span{font-size:8px;color:#777}.metric b{display:block;margin-top:5px;color:#efcf74;font-size:17px}.row{border-top:1px solid #28282d;padding:12px 0}.row:first-child{border-top:0}.rowHead{display:flex;justify-content:space-between;gap:8px}.row small{display:block;color:#777;margin-top:5px;line-height:1.5}.btn,input,select{width:100%;border-radius:10px;padding:10px;border:1px solid #36363d;background:#0b0b0d;color:#fff}.btn{margin-top:8px;background:#d2aa46;color:#111;font-weight:900}.danger{background:#241112;color:#ff8d8d;border-color:#6b3030}.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}.form .wide{grid-column:1/-1}.status{font-size:10px;color:#d9b85f;margin-top:8px}.badge{font-size:8px;padding:4px 7px;border:1px solid #555;border-radius:999px}.warn{border:1px solid #6e5724;background:#18130a;color:#d8ba6a;border-radius:14px;padding:11px;font-size:10px;line-height:1.6;margin-bottom:12px}@media(max-width:520px){.grid,.form{grid-template-columns:1fr}.form .wide{grid-column:auto}}</style></head><body><main class="w"><section class="hero"><div class="ey">S.u.G OSAKA · BODY OPERATOR · V27.50</div><h1>MANAGEMENT</h1><div class="sub">提携店・特典原価・発行済みコードを管理。</div></section><div class="warn">この画面は現在まだ端末内データ用の運営UIです。URLだけでは本物の認証になりません。会員横断管理はバックエンド認証・同期を入れてから有効化します。</div><section class="card"><div class="ey">REWARD BUDGET</div><h2>今月の特典原資</h2><div class="grid"><div class="metric"><span>使用済み</span><b id="used">¥0</b></div><div class="metric"><span>残り</span><b id="remain">¥0</b></div><div class="metric"><span>上限</span><b id="max">¥20,000</b></div></div></section><section class="card"><div class="ey">REWARD SETTINGS</div><h2>特典設定</h2><div id="rewardSettings"></div></section><section class="card"><div class="ey">CODE VERIFY</div><h2>交換コード確認</h2><input id="code" placeholder="SUG-..."><select id="partner"><option value="">店舗指定なし</option></select><button class="btn" id="verify">確認</button><div id="verifyResult" class="status"></div></section><section class="card"><div class="ey">PARTNER MASTER</div><h2>提携店</h2><div class="form"><input id="pName" placeholder="店舗名"><select id="pKind"><option>FOOD</option><option>BATH</option><option>CAFE</option><option>OTHER</option></select><input id="pDiscount" type="number" placeholder="割引額"><input id="pCost" type="number" placeholder="実費"><input id="pPoints" type="number" placeholder="必要pt"><input id="pLimit" type="number" placeholder="月上限"><input id="pMenu" class="wide" placeholder="対象メニュー"><input id="pAddress" class="wide" placeholder="住所"></div><button class="btn" id="addPartner">提携店を追加</button><div id="partnerStatus" class="status"></div><div id="partnerList"></div></section><section class="card"><div class="ey">ISSUED</div><h2>発行済み特典</h2><div id="history"></div></section></main><script src="../../shared/points-v27.16.js?v=27.50"></script><script src="../../shared/partners-v27.22.js?v=27.50"></script><script src="../../shared/rewards-v27.42.js?v=27.50"></script><script>(()=>{const $=id=>document.getElementById(id),P=()=>window.SuGPointsV2716,R=()=>window.SuGRewardsV2742,PT=()=>window.SuGPartnersV2722;function money(n){return'¥'+Number(n||0).toLocaleString()}function render(){if(!P()||!R()||!PT())return setTimeout(render,80);const b=P().budget(),max=Number(b.maxCostYen||20000),used=Number(b.usedCostYen||0);$('used').textContent=money(used);$('remain').textContent=money(Math.max(0,max-used));$('max').textContent=money(max);$('rewardSettings').innerHTML=R().catalog().map(x=>`<div class="row" data-r="${x.id}"><div class="rowHead"><b>${x.name}</b><span>${x.points.toLocaleString()}pt</span></div><div class="form" style="margin-top:8px"><input data-cost type="number" value="${x.costReady?x.costYen:''}" placeholder="実費"><input data-limit type="number" value="${x.monthlyLimit}" placeholder="月上限"><input data-days type="number" value="${x.validityDays}" placeholder="期限日数"><button class="btn" data-save="${x.id}">保存</button></div></div>`).join('');document.querySelectorAll('[data-save]').forEach(btn=>btn.onclick=()=>{const row=btn.closest('[data-r]'),id=btn.dataset.save,c=row.querySelector('[data-cost]').value;if(c)R().setCost(id,c);R().setLimit(id,row.querySelector('[data-limit]').value);R().setValidity(id,row.querySelector('[data-days]').value);render()});const partners=PT().list();$('partner').innerHTML='<option value="">店舗指定なし</option>'+partners.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');$('partnerList').innerHTML=partners.length?partners.map(p=>`<div class="row"><div class="rowHead"><b>${p.name}</b><span class="badge">${p.kind}</span></div><small>${p.address||''}${p.targetMenu?'｜'+p.targetMenu:''}</small><small>${p.points||0}pt｜実費 ${money(p.costYen)}｜月上限 ${p.monthlyLimit||0}</small><button class="btn danger" data-del="${p.id}">削除</button></div>`).join(''):'<div class="sub">登録なし</div>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{PT().remove(b.dataset.del);render()});const rows=R().state().redemptions.slice(0,30);$('history').innerHTML=rows.length?rows.map(r=>`<div class="row"><div class="rowHead"><b>${r.name}</b><span class="badge">${r.status||'ISSUED'}</span></div><small>${r.code}</small><small>${r.partnerName||''}${r.expiresAt?'｜期限 '+new Date(r.expiresAt).toLocaleDateString('ja-JP'):''}</small></div>`).join(''):'<div class="sub">発行履歴なし</div>'} $('verify').onclick=()=>{const v=R().verifyCode($('code').value,{partnerId:$('partner').value});if(!v.ok){$('verifyResult').textContent='利用不可｜'+v.reason;return}const r=v.redemption;$('verifyResult').innerHTML=`有効｜${r.name}${r.partnerName?'｜'+r.partnerName:''}<button id="consume" class="btn">${r.delivery==='COUPON'?'使用済みにする':'受取済みにする'}</button>`;$('consume').onclick=()=>{const out=R().consumeCode(r.code,{partnerId:$('partner').value});$('verifyResult').textContent=out.ok?'処理完了':'処理不可｜'+out.reason;render()}};$('addPartner').onclick=()=>{const out=PT().upsert({name:$('pName').value,kind:$('pKind').value,discountYen:$('pDiscount').value,costYen:$('pCost').value,points:$('pPoints').value,monthlyLimit:$('pLimit').value,targetMenu:$('pMenu').value,address:$('pAddress').value});$('partnerStatus').textContent=out.ok?'追加しました':'店舗名を入力してください';if(out.ok){['pName','pDiscount','pCost','pPoints','pLimit','pMenu','pAddress'].forEach(id=>$(id).value='');render()}};window.addEventListener('sug:rewards-change',render);window.addEventListener('sug:partners-change',render);window.addEventListener('sug:points-change',render);render()})();</script></body></html>
