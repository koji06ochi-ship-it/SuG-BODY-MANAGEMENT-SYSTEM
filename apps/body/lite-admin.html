<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070708"><title>S.u.G BODY Lite Admin</title><style>*{box-sizing:border-box}html,body{margin:0;background:#070708;color:#f7f7f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans",sans-serif}.w{max-width:900px;margin:auto;padding:18px}.hero{padding:44px 0 22px}.ey{font-size:10px;letter-spacing:.2em;color:#d9b85f;font-weight:900}.hero h1{font-size:40px;margin:8px 0}.sub,.last{color:#777;font-size:11px;line-height:1.6}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.box,.member{border:1px solid #29292e;background:#101012;border-radius:18px;padding:15px}.box span{font-size:8px;color:#666}.box b{display:block;color:#efcf74;font-size:24px;margin-top:5px}.member{margin-bottom:8px}.member>div:first-child{display:flex;justify-content:space-between;gap:10px}.member small{color:#888}.member.alert{border-color:#8c3c3c}.member.check,.member.watch{border-color:#7a632f}.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.mini span{border:1px solid #29292e;border-radius:10px;padding:8px;color:#777;font-size:8px}.mini b{display:block;color:#eee;font-size:13px;margin-top:4px}.last{margin-top:9px}.note{border:1px solid #4d4327;background:#17140d;border-radius:14px;padding:12px;margin-bottom:12px;color:#c6b98d;font-size:10px;line-height:1.7}@media(max-width:600px){.summary{grid-template-columns:repeat(2,1fr)}.mini{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="w"><section class="hero"><div class="ey">S.u.G BODY LITE · ADMIN PROTOTYPE</div><h1>管理ダッシュボード</h1><div class="sub">行政・施設・チーム向け。活動低下・痛み・QUEST参加を一覧化。</div></section><div class="note">現在はこの端末のデータでUIと判定ロジックを確認する段階。複数利用者の本番表示は、Supabase側の管理者権限・RLSを確定してから接続します。</div><section class="summary"><div class="box"><span>MEMBERS</span><b id="adminTotal">0</b></div><div class="box"><span>ALERT</span><b id="adminAlert">0</b></div><div class="box"><span>CHECK</span><b id="adminCheck">0</b></div><div class="box"><span>QUEST DAYS</span><b id="adminQuest">0</b></div></section><section><div class="ey" style="margin:18px 0 10px">MEMBER STATUS</div><div id="memberRows"></div></section></main><script src="./lite-admin.js?v=0.1.0"></script></body></html>
