<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090a">
<title>S.u.G 会員登録</title>
<style>
:root{--bg:#09090a;--card:#151517;--line:#5c4820;--gold:#e9c45a;--text:#f5f3ee;--muted:#aaa7a0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#211b10 0,#09090a 42%,#060607 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;display:flex;align-items:center;justify-content:center;padding:22px}
.card{width:min(560px,100%);background:linear-gradient(180deg,#171719,#101012);border:1px solid var(--line);border-radius:28px;padding:28px 22px;box-shadow:0 24px 70px rgba(0,0,0,.45);text-align:center}
.logo{width:min(360px,92%);height:auto;margin:2px auto 18px;display:block}.kicker{color:var(--gold);font-weight:800;letter-spacing:.08em;font-size:13px}.title{font-size:26px;font-weight:900;margin:12px 0 10px}.desc{font-size:16px;line-height:1.8;color:#d6d2ca;margin:0 auto 22px;max-width:430px}.note{font-size:13px;line-height:1.65;color:var(--muted);margin:18px auto 0;max-width:430px}.btn{width:100%;border:0;border-radius:16px;padding:17px 18px;font-size:20px;font-weight:900;background:linear-gradient(180deg,#f1d574,#c99d31);color:#080808;box-shadow:0 8px 22px rgba(202,158,49,.22)}.btn:disabled{opacity:.45}.err{margin-top:14px;color:#ff9393;font-weight:700;line-height:1.55}.mascot{width:150px;max-width:42%;margin:22px auto 2px;display:block}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="./brand-header.png?v=24-5-line-safe" alt="S.u.G OSAKA">
  <div class="kicker">S.u.G MEMBERS ONLY</div>
  <div class="title">会員登録のご案内</div>
  <p class="desc">下のボタンを押すと、S.u.G会員登録を開始します。<br>次の画面でご自身のパスワードを設定してください。</p>
  <button id="startBtn" class="btn" type="button">登録をはじめる</button>
  <div id="err" class="err"></div>
  <img class="mascot" src="./mascot-highfive.png?v=24-5-line-safe" alt="">
  <p class="note">このページを開いただけでは登録は進みません。<br>「登録をはじめる」を押したときだけ登録処理を開始します。</p>
</main>
<script>
function decodeLink(){
  const raw=(location.hash||'').replace(/^#/,'');
  const p=new URLSearchParams(raw);
  const token=p.get('t');
  if(!token)return '';
  try{
    let b64=token.replace(/-/g,'+').replace(/_/g,'/');
    while(b64.length%4)b64+='=';
    return atob(b64);
  }catch(_e){return ''}
}
const actionLink=decodeLink();
const btn=document.getElementById('startBtn');
const err=document.getElementById('err');
if(!actionLink){btn.disabled=true;err.textContent='招待リンクを確認できません。管理者から届いた新しいリンクを開いてください。'}
btn.addEventListener('click',()=>{
  if(!actionLink)return;
  btn.disabled=true;
  btn.textContent='登録画面を開いています…';
  location.href=actionLink;
});
</script>
</body>
</html>
