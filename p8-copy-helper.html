<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>S.u.G P8 COPY</title>
<style>
  *{box-sizing:border-box} body{margin:0;background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:min(560px,100%);background:#151515;border:1px solid #333;border-radius:22px;padding:24px}
  h1{font-size:24px;margin:0 0 10px} p{color:#bbb;line-height:1.55;margin:0 0 18px}
  .btn,label{display:block;width:100%;padding:16px 18px;border-radius:14px;border:0;font-weight:800;font-size:17px;text-align:center;text-decoration:none;margin-top:12px;cursor:pointer}
  label{background:#fff;color:#000}.btn{background:#d9b968;color:#111}.ghost{background:#252525;color:#fff}
  input{position:absolute;left:-9999px}
  #status{margin-top:16px;padding:13px 14px;border-radius:12px;background:#202020;color:#ddd;font-size:14px;white-space:pre-wrap}
  .small{font-size:12px;color:#888;margin-top:14px}
</style>
</head>
<body>
<main class="card">
  <h1>P8をコピー</h1>
  <p>ファイルはこのiPhone内で読み取るだけ。アップロード・保存・送信はしません。</p>
  <label for="file">1. 鍵ファイルを選ぶ</label>
  <input id="file" type="file" accept=".p8,.txt,text/plain,application/octet-stream">
  <button id="copy" class="btn" disabled>2. 鍵の中身をコピー</button>
  <a class="btn ghost" href="https://github.com/koji06ochi-ship-it/SuG-BODY-MANAGEMENT-SYSTEM/settings/secrets/actions">3. GitHub Secretを開く</a>
  <div id="status">まだファイルを選んでいません。</div>
  <div class="small">正しい鍵なら BEGIN PRIVATE KEY / END PRIVATE KEY を自動確認します。鍵本文は画面に表示しません。</div>
</main>
<script>
(() => {
  const file = document.getElementById('file');
  const copy = document.getElementById('copy');
  const status = document.getElementById('status');
  let keyText = '';

  function normalize(raw) {
    const s = String(raw || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
    const m = s.match(/-----BEGIN PRIVATE KEY-----[\s\S]*?-----END PRIVATE KEY-----/);
    return m ? m[0].trim() + '\n' : '';
  }

  file.addEventListener('change', async () => {
    copy.disabled = true;
    keyText = '';
    const f = file.files && file.files[0];
    if (!f) { status.textContent = 'ファイルが選ばれていません。'; return; }
    try {
      const text = await f.text();
      keyText = normalize(text);
      if (!keyText) {
        status.textContent = 'このファイルから PRIVATE KEY を確認できませんでした。元の AuthKey_*.p8 を選んでください。';
        return;
      }
      copy.disabled = false;
      status.textContent = '✓ 鍵を確認しました。次に「2. 鍵の中身をコピー」を押してください。';
    } catch (e) {
      status.textContent = 'ファイルを読めませんでした。もう一度選び直してください。';
    }
  });

  copy.addEventListener('click', async () => {
    if (!keyText) return;
    try {
      await navigator.clipboard.writeText(keyText);
      status.textContent = '✓ コピー完了。次に「3. GitHub Secretを開く」→ ASC_API_KEY_P8 を編集して貼り付けて保存。';
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = keyText; ta.setAttribute('readonly','');
      ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, ta.value.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      status.textContent = ok ? '✓ コピー完了。次にGitHub Secretへ貼り付けて保存。' : 'コピーできませんでした。Safariで開き直してください。';
    }
  });
})();
</script>
</body>
</html>
