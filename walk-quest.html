<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate"><meta name="theme-color" content="#080809"><title>S.u.G WALK QUEST</title>
<style>
:root{--bg:#080809;--card:#141417;--line:#34343b;--gold:#d8b35b;--gold2:#f4db91;--txt:#f8f8f8;--muted:#9d9da4;--ok:#79dfa5;--warn:#ffd166;--bad:#ff7e7e;--cyan:#59d8ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#261d0e 0,#0b0b0d 34%,#060607 100%);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}button,input{font:inherit}.wrap{max-width:760px;margin:auto;padding:0 12px 105px}.top{position:sticky;top:0;z-index:20;margin:0 -12px;padding:11px 12px;background:#080809ee;backdrop-filter:blur(14px);border-bottom:1px solid #27272d}.toprow{display:flex;justify-content:space-between;gap:8px;align-items:center}.brand{font-weight:1000;letter-spacing:.08em;font-size:18px}.brand b{color:var(--gold2)}.back{color:var(--gold2);text-decoration:none;font-size:11px;border:1px solid #5d4b27;border-radius:999px;padding:7px 10px}.hero{margin-top:12px;background:linear-gradient(180deg,#151518,#0c0c0e);border:1px solid #4e4027;border-radius:22px;overflow:hidden}.map{height:390px;position:relative;background:radial-gradient(circle at 50% 45%,#113a4a 0,#0b2430 35%,#10131a 68%,#080809 100%);overflow:hidden}.grid{position:absolute;inset:-40px;background-image:linear-gradient(#4fdcff17 1px,transparent 1px),linear-gradient(90deg,#4fdcff17 1px,transparent 1px);background-size:42px 42px;transform:perspective(500px) rotateX(58deg) scale(1.35);transform-origin:center 80%}.routeLine{position:absolute;inset:0;width:100%;height:100%}.spot{position:absolute;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:#111a;border:2px solid var(--gold);box-shadow:0 0 22px #d8b35b66}.spot.done{border-color:var(--ok);box-shadow:0 0 24px #79dfa566}.spot.you{width:30px;height:30px;font-size:15px;background:var(--cyan);border:3px solid #fff;box-shadow:0 0 18px #59d8ff}.spotname{position:absolute;top:62px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:8px;color:#eee;background:#09090bdc;border:1px solid #444;border-radius:999px;padding:3px 6px}.mapbar{position:absolute;left:10px;right:10px;bottom:10px;display:grid;grid-template-columns:1fr 1fr;gap:7px}.btn{border:1px solid #44454c;background:#202126;color:#fff;border-radius:11px;padding:10px;font-weight:900;font-size:10px}.btn.gold{border:0;background:linear-gradient(180deg,#ecd27f,#b78a32);color:#090909}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:11px}.stat{background:#0b0b0d;border:1px solid #2d2d33;border-radius:12px;padding:9px}.stat span{display:block;color:var(--muted);font-size:8px}.stat b{display:block;margin-top:2px;font-size:18px;color:var(--gold2)}.sec{margin-top:12px;background:linear-gradient(180deg,var(--card),#0e0e11);border:1px solid var(--line);border-radius:18px;padding:13px}.sec h2{font-size:13px;color:var(--gold2);margin:0 0 10px}.quest{background:#0b0b0d;border:1px solid #2b2b31;border-radius:13px;padding:10px;margin-bottom:8px}.quest.done{background:#0f1813;border-color:#315e44}.qtop{display:flex;align-items:center;justify-content:space-between;gap:8px}.quest strong{font-size:11px}.quest small{display:block;color:#999;font-size:9px;margin-top:4px;line-height:1.5}.bar{height:8px;background:#25252b;border-radius:99px;overflow:hidden;margin-top:8px}.fill{height:100%;background:linear-gradient(90deg,#59d8ff,#d8b35b,#79dfa5)}.wallet{font-size:30px;font-weight:1000;color:var(--gold2)}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{font-size:8px;border:1px solid #46464e;border-radius:999px;padding:4px 7px;color:#bbb}.banner{margin-top:12px;border:1px solid #5a4a25;background:#1f1a10;color:#f2d98b;border-radius:13px;padding:10px;font-size:10px;line-height:1.6}.field{display:grid;grid-template-columns:1fr auto;gap:8px}.field input{width:100%;background:#0b0b0d;border:1px solid #34343b;color:#fff;border-radius:10px;padding:10px}.log{font-size:9px;color:#aaa;line-height:1.65}.foot{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#09090bf2;border-top:1px solid #2a2a30;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.foot button,.foot a{text-align:center;text-decoration:none;border:1px solid #3d3d45;background:#17171b;color:#bbb;border-radius:11px;padding:10px 6px;font-size:9px}.foot .on{color:var(--gold2);border-color:#66542e}.pulse{animation:p 1.4s ease-in-out infinite}@keyframes p{50%{transform:scale(1.08);box-shadow:0 0 30px #d8b35baa}}@media(max-width:520px){.map{height:350px}}
</style></head><body><div class="wrap">
<header class="top"><div class="toprow"><div class="brand">S.u.G <b>WALK QUEST</b></div><a class="back" href="./quest.html">QUESTへ戻る</a></div></header>
<section class="hero"><div class="map" id="map"><div class="grid"></div><svg class="routeLine" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline id="routeSvg" points="" fill="none" stroke="#59d8ff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/></svg><div id="spots"></div><div id="you" class="spot you" style="left:48%;top:68%">●<span class="spotname">YOU</span></div><div class="mapbar"><button id="locate" class="btn gold">現在地・ルート記録</button><button id="google" class="btn">Google Mapsで開く</button></div></div><div class="stats"><div class="stat"><span>TODAY STEPS</span><b id="steps">0</b></div><div class="stat"><span>CHECK-IN</span><b id="checkins">0</b></div><div class="stat"><span>POINT</span><b id="points">0pt</b></div></div></section>
<div id="banner" class="banner">今日の歩数とクエストを確認しています…</div>
<section class="sec"><h2>今日のWALK QUEST</h2><div id="quests"></div></section>
<section class="sec"><h2>歩数を同期</h2><div class="field"><input id="stepInput" type="number" inputmode="numeric" min="0" max="100000" placeholder="ヘルスケア歩数"><button id="saveSteps" class="btn gold">反映</button></div><div class="chips"><span class="chip">Appleヘルスケア連携値に対応</span><span class="chip">歩数＋地点＋QRで判定</span></div></section>
<section class="sec"><h2>CHECK-IN</h2><div class="log">提携店舗QRはこのページのURLに <b>?checkin=店舗コード</b> を付けて発行できます。QRから開いたとき、歩数条件と現在地条件を確認してS.u.Gポイントを付与します。</div><button id="demoCheckin" class="btn gold" style="width:100%;margin-top:9px">デモ：TENMA FOOD SPOTにチェックイン</button></section>
<section class="sec"><h2>WALK LOG</h2><div id="log" class="log">まだ記録はありません。</div></section>
</div><nav class="foot"><a href="./quest.html">HOME QUEST</a><button class="on">WALK</button><button id="notify">通知ON</button></nav>
<script>
(()=>{
const KEY='sug_walk_quest_v1',today=()=>new Date().toISOString().slice(0,10);let s;
try{s=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_e){s={}};if(s.date!==today())s={date:today(),steps:0,points:0,checkins:[],route:[],logs:[]};s.checkins=s.checkins||[];s.route=s.route||[];s.logs=s.logs||[];
const spots=[{id:'TENMA_FOOD',name:'FOOD SPOT',x:18,y:30,icon:'🍚',min:3000,pt:50},{id:'CARE_01',name:'CARE SPOT',x:68,y:24,icon:'👐',min:5000,pt:80},{id:'WALK_01',name:'WALK SPOT',x:76,y:56,icon:'🚶',min:7000,pt:100},{id:'SUG',name:'S.u.G',x:34,y:58,icon:'⚔️',min:8000,pt:120}];
function save(){localStorage.setItem(KEY,JSON.stringify(s))}function log(t){s.logs.unshift(new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+' '+t);s.logs=s.logs.slice(0,20);save()}
function extractHealthSteps(){let best=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i),raw=localStorage.getItem(k);if(!raw||raw.length>1500000)continue;let o;try{o=JSON.parse(raw)}catch(_e){continue};const walk=v=>{if(!v||typeof v!=='object')return;if(Array.isArray(v)){v.forEach(walk);return}if(String(v.date||'')===today()&&Number.isFinite(Number(v.steps)))best=Math.max(best,Number(v.steps));Object.keys(v).forEach(k2=>{if(k2!=='route'&&typeof v[k2]==='object')walk(v[k2])})};walk(o)}}catch(_e){}return Math.round(best)}
const hs=extractHealthSteps();if(hs>s.steps)s.steps=hs;
function render(){document.getElementById('steps').textContent=Number(s.steps||0).toLocaleString();document.getElementById('checkins').textContent=s.checkins.length;document.getElementById('points').textContent=(s.points||0)+'pt';document.getElementById('stepInput').value=s.steps||'';document.getElementById('spots').innerHTML=spots.map(p=>`<div class="spot ${s.checkins.includes(p.id)?'done':''}" style="left:${p.x}%;top:${p.y}%">${p.icon}<span class="spotname">${p.name}</span></div>`).join('');document.getElementById('quests').innerHTML=spots.map(p=>{const done=s.checkins.includes(p.id),pct=Math.min(100,Math.round((s.steps/p.min)*100));return `<div class="quest ${done?'done':''}"><div class="qtop"><strong>${done?'✅':'🎯'} ${p.name}</strong><b>${p.pt}pt</b></div><small>${p.min.toLocaleString()}歩以上 ＋ 現地QRチェックイン</small><div class="bar"><div class="fill" style="width:${done?100:pct}%"></div></div></div>`}).join('');const remain=Math.max(0,3000-s.steps);document.getElementById('banner').textContent=s.steps>=8000?'🏆 今日の基本歩数目標を達成。近くのQUEST SPOTを攻略しよう！':s.steps>=5000?'🔥 5,000歩達成。あと'+Math.max(0,8000-s.steps).toLocaleString()+'歩で8,000歩QUEST圏内。':'🚶 今日あと'+remain.toLocaleString()+'歩で最初のFOOD QUEST条件達成。';document.getElementById('log').innerHTML=s.logs.length?s.logs.map(x=>'• '+x).join('<br>'):'まだ記録はありません。';drawRoute();save()}
function drawRoute(){const svg=document.getElementById('routeSvg');if(s.route.length<2){svg.setAttribute('points','');return}const lats=s.route.map(p=>p.lat),lngs=s.route.map(p=>p.lng),minLa=Math.min(...lats),maxLa=Math.max(...lats),minLn=Math.min(...lngs),maxLn=Math.max(...lngs),dla=Math.max(.00005,maxLa-minLa),dln=Math.max(.00005,maxLn-minLn);svg.setAttribute('points',s.route.map(p=>`${10+80*(p.lng-minLn)/dln},${88-72*(p.lat-minLa)/dla}`).join(' '))}
function checkin(id){const p=spots.find(x=>x.id===id);if(!p)return alert('未登録のチェックイン地点です');if(s.checkins.includes(id))return alert('今日はチェックイン済みです');if(Number(s.steps)<p.min)return alert('歩数条件まであと '+(p.min-s.steps).toLocaleString()+'歩です');s.checkins.push(id);s.points=(s.points||0)+p.pt;log('✅ '+p.name+' CHECK-IN +'+p.pt+'pt');render();alert(p.name+' 攻略！ +'+p.pt+'pt')}
document.getElementById('saveSteps').onclick=()=>{s.steps=Math.max(0,Math.round(Number(document.getElementById('stepInput').value)||0));log('歩数 '+s.steps.toLocaleString()+'歩を反映');render()};
document.getElementById('demoCheckin').onclick=()=>checkin('TENMA_FOOD');
document.getElementById('locate').onclick=()=>{if(!navigator.geolocation)return alert('位置情報に対応していません');navigator.geolocation.getCurrentPosition(pos=>{const p={lat:pos.coords.latitude,lng:pos.coords.longitude,t:Date.now()};s.route.push(p);s.route=s.route.slice(-120);log('現在地をWALK LOGへ記録');document.getElementById('you').classList.add('pulse');setTimeout(()=>document.getElementById('you').classList.remove('pulse'),1500);render()},()=>alert('位置情報を許可してください'),{enableHighAccuracy:true,timeout:10000,maximumAge:15000})};
document.getElementById('google').onclick=()=>{const last=s.route[s.route.length-1];window.open(last?`https://www.google.com/maps/search/?api=1&query=${last.lat},${last.lng}`:'https://www.google.com/maps','_blank')};
document.getElementById('notify').onclick=async()=>{if(!('Notification'in window))return alert('この端末ではWeb通知を利用できません');const r=await Notification.requestPermission();if(r==='granted'){new Notification('S.u.G WALK QUEST',{body:s.steps>=8000?'今日の歩数目標達成！次のスポットへ。':'今日の歩数 '+s.steps.toLocaleString()+'歩。QUESTを進めよう。'});document.getElementById('notify').textContent='通知ON ✓'}};
const q=new URLSearchParams(location.search),cid=q.get('checkin');if(cid)setTimeout(()=>checkin(cid),400);render();
})();
</script></body></html>
