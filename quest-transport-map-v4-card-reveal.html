<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050403">
<title>S.u.G QUEST｜CARD REVEAL</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif}button{font:inherit}
#base{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
#collectionBtn{position:fixed;z-index:90;right:14px;bottom:calc(142px + env(safe-area-inset-bottom));border:1px solid #a17b34;border-radius:999px;padding:10px 13px;background:linear-gradient(135deg,#251a08,#090705);color:#ffe29a;font-size:10px;font-weight:900;box-shadow:0 8px 24px #000a}
.reveal{position:fixed;z-index:200;inset:0;display:none;align-items:center;justify-content:center;padding:calc(18px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 16%,#35270e,#050403 42%,#000 76%)}.reveal.on{display:flex}.revealInner{width:min(360px,94vw)}
.revealKicker{text-align:center;color:#d8b35b;font:700 9px Arial,sans-serif;letter-spacing:.18em;margin-bottom:10px}.revealTitle{text-align:center;color:#ffe6a6;font:700 24px Georgia,'Yu Mincho',serif;margin:0 0 13px}
.flipWrap{width:100%;aspect-ratio:3/4.7;perspective:1400px}.flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .58s cubic-bezier(.2,.75,.2,1)}.flip.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;border:2px solid #c79a42;border-radius:22px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 18px 44px #000d,0 0 26px #d2a44033}.front{display:flex;flex-direction:column;justify-content:space-between;padding:22px;background:radial-gradient(circle at 50% 18%,#2e482d,#0e1c12 36%,#060504 72%)}.front.legend{background:radial-gradient(circle at 50% 18%,#5c4115,#1d1207 38%,#060403 75%)}.frontTop{display:flex;justify-content:space-between;align-items:center}.frontType{color:#f0c86d;font:700 10px Arial,sans-serif;letter-spacing:.15em}.frontNo{color:#9d927f;font:700 9px monospace}.frontCenter{text-align:center}.frontMark{width:96px;height:96px;margin:0 auto 16px;border:1px solid #b98d3d;border-radius:50%;display:grid;place-items:center;color:#ffe29a;font:700 34px Georgia,'Yu Mincho',serif;background:#090806cc;box-shadow:inset 0 0 28px #d1a33b1c}.frontName{color:#fff0c8;font:700 32px Georgia,'Yu Mincho',serif;line-height:1.2}.frontSub{margin-top:8px;color:#d4c6aa;font-size:10px;line-height:1.6}.frontFoot{text-align:center;color:#958b78;font-size:8px;letter-spacing:.08em}.backFace{transform:rotateY(180deg);padding:20px;background:radial-gradient(circle at 50% 0,#29371f,#0c0d09 36%,#050403 72%);overflow:auto}.backType{color:#d9b459;font:700 9px Arial,sans-serif;letter-spacing:.15em}.backFace h2{margin:6px 0 14px;color:#ffe6a6;font:700 25px Georgia,'Yu Mincho',serif}.section{margin:10px 0;padding:11px;border:1px solid #584421;border-radius:11px;background:#0b0906cc}.section b{display:block;margin-bottom:6px;color:#e5bd63;font-size:9px;letter-spacing:.08em}.section p{margin:0;color:#e2d8c5;font-size:10px;line-height:1.65}.certainty{font-size:8px;color:#9f9582;margin-top:10px;line-height:1.6}
.revealActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.revealActions button{padding:12px;border:1px solid #7a5e2f;border-radius:10px;background:#0d0a06;color:#f1cc75;font-weight:900}.revealActions .primary{background:linear-gradient(#f2d789,#b78930);color:#171006;border-color:#f3da8c}
.collection{position:fixed;z-index:180;inset:0;display:none;overflow:auto;background:#020202;padding:calc(15px + env(safe-area-inset-top)) 14px calc(35px + env(safe-area-inset-bottom))}.collection.on{display:block}.head{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:42px 1fr 42px;align-items:center;background:linear-gradient(#020202 78%,#02020200);padding-bottom:10px}.head button{border:0;background:none;color:#f3ce77;font-size:32px}.headTitle{text-align:center;color:#f3ce77;font:700 22px Georgia,'Yu Mincho',serif}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.miniCard{min-height:154px;padding:12px;border:1px solid #5e4a28;border-radius:13px;background:radial-gradient(circle at 50% 0,#24351f,#090a07 42%,#050403 78%);color:#fff;text-align:left}.miniCard.locked{opacity:.42;filter:grayscale(.7)}.miniCard.legend{background:radial-gradient(circle at 50% 0,#45300f,#120c05 44%,#050403 78%)}.miniType{color:#d8b158;font:700 7px Arial,sans-serif;letter-spacing:.12em}.miniCard h3{margin:7px 0 6px;color:#ffe6a3;font:700 17px Georgia,'Yu Mincho',serif}.miniCard p{margin:0;color:#bdb29e;font-size:8px;line-height:1.5}.miniState{margin-top:9px;padding-top:7px;border-top:1px solid #44351e;color:#8df4a5;font-size:7px}.miniCard.locked .miniState{color:#8f887a}
</style>
</head>
<body>
<iframe id="base" src="./quest-transport-map-v3-gps.html?v=card-reveal-20260907"></iframe>
<button id="collectionBtn">CARD</button>
<section class="reveal" id="reveal" aria-hidden="true"><div class="revealInner"><div class="revealKicker">NEW CARD UNLOCKED</div><h1 class="revealTitle">CARD GET</h1><div class="flipWrap"><div class="flip" id="flip"><div class="face front" id="front"></div><div class="face backFace" id="backFace"></div></div></div><div class="revealActions"><button id="flipBtn">裏面を見る</button><button class="primary" id="closeReveal">COLLECTIONへ</button></div></div></section>
<section class="collection" id="collection"><div class="head"><button id="closeCollection">‹</button><div class="headTitle">CARD COLLECTION</div><div></div></div><div class="grid" id="grid"></div></section>
<script>
const STORAGE='sugQuestTransportV2';
const SEEN='sugQuestCardRevealSeenV1';
const defs=[
{id:'kanan',type:'AREA KEY',name:'河南',mark:'河',sub:'山側の入口。水・農産物・歴史を次の地域へ。',need:s=>s.kanan&&s.kananManhole,moved:'WATER / FOOD / PEOPLE',next:'千早赤阪・太子',certainty:'● 現地GPS・INFRA KEY取得で解放'},
{id:'chihaya',type:'ROUTE KEY',name:'千早赤阪',mark:'千',sub:'山・峠・千早城。身体を使って越えるルート。',need:s=>s.chihaya&&s.chihayaManhole,moved:'PEOPLE / GOODS',next:'南河内 山側MASTER',certainty:'● 現地GPS・INFRA KEY取得で解放'},
{id:'taishi',type:'TRANSPORT KEY',name:'太子',mark:'太',sub:'竹内街道。人・物・文化が往来する道。',need:s=>s.taishi&&s.taishiManhole,moved:'PEOPLE / GOODS / CULTURE',next:'天満・大阪市',certainty:'● 現地GPS・INFRA KEY取得で解放'},
{id:'tenma',type:'CITY GATE',name:'天満',mark:'天',sub:'山から街へ。水・商い・都市インフラの接続点。',need:s=>s.tenma&&s.tenmaManhole,moved:'WATER / PEOPLE / GOODS',next:'大川・堂島川',certainty:'● 現地GPS・CITY GATE取得で解放'},
{id:'legend1',type:'LEGEND',name:'山から街へ',mark:'道',sub:'南河内3地域から天満へ。SEASON 01 COMPLETE.',need:s=>s.kanan&&s.kananManhole&&s.chihaya&&s.chihayaManhole&&s.taishi&&s.taishiManhole&&s.tenma&&s.tenmaManhole,moved:'WATER / FOOD / PEOPLE / GOODS / CULTURE',next:'SEASON 02｜街から海へ',certainty:'MASTER条件：河南＋千早赤阪＋太子＋天満',legend:true}
];
function readState(){try{return JSON.parse(localStorage.getItem(STORAGE)||'{}')}catch(e){return {}}}
function readSeen(){try{return JSON.parse(localStorage.getItem(SEEN)||'[]')}catch(e){return []}}
function writeSeen(a){localStorage.setItem(SEEN,JSON.stringify(a))}
let currentCard=null;
function frontHTML(c){return `<div class="frontTop"><span class="frontType">${c.type}</span><span class="frontNo">S.u.G QUEST</span></div><div class="frontCenter"><div class="frontMark">${c.mark}</div><div class="frontName">${c.name}</div><div class="frontSub">${c.sub}</div></div><div class="frontFoot">TAP / FLIP TO DISCOVER</div>`}
function backHTML(c){return `<div class="backType">${c.type} / TRANSPORT CARD</div><h2>${c.name}</h2><div class="section"><b>WHAT MOVED?</b><p>${c.moved}</p></div><div class="section"><b>NEXT ROUTE</b><p>${c.next}</p></div><div class="section"><b>ROLE</b><p>${c.sub}</p></div><div class="certainty">${c.certainty}</div>`}
function openReveal(c){currentCard=c;document.getElementById('front').className='face front'+(c.legend?' legend':'');document.getElementById('front').innerHTML=frontHTML(c);document.getElementById('backFace').innerHTML=backHTML(c);document.getElementById('flip').classList.remove('flipped');document.getElementById('flipBtn').textContent='裏面を見る';document.getElementById('reveal').classList.add('on');document.getElementById('reveal').setAttribute('aria-hidden','false')}
function closeReveal(){document.getElementById('reveal').classList.remove('on');document.getElementById('reveal').setAttribute('aria-hidden','true');openCollection()}
function available(){const s=readState();return defs.filter(d=>d.need(s))}
function checkNew(){const got=available(),seen=readSeen();const fresh=got.find(c=>!seen.includes(c.id));if(fresh){seen.push(fresh.id);writeSeen(seen);openReveal(fresh)}renderCollection()}
function renderCollection(){const s=readState();document.getElementById('grid').innerHTML=defs.map(c=>{const ok=c.need(s);return `<button class="miniCard ${ok?'':'locked'} ${c.legend?'legend':''}" data-id="${c.id}"><div class="miniType">${c.type}</div><h3>${c.name}</h3><p>${c.sub}</p><div class="miniState">${ok?'GET ✓｜タップでカードを見る':'LOCKED'}</div></button>`}).join('');document.querySelectorAll('.miniCard').forEach(b=>b.onclick=()=>{const c=defs.find(x=>x.id===b.dataset.id);if(c&&c.need(readState())){document.getElementById('collection').classList.remove('on');openReveal(c)}})}
function openCollection(){renderCollection();document.getElementById('collection').classList.add('on')}
document.getElementById('collectionBtn').onclick=openCollection;document.getElementById('closeCollection').onclick=()=>document.getElementById('collection').classList.remove('on');document.getElementById('closeReveal').onclick=closeReveal;document.getElementById('flipBtn').onclick=()=>{const f=document.getElementById('flip');f.classList.toggle('flipped');document.getElementById('flipBtn').textContent=f.classList.contains('flipped')?'表面を見る':'裏面を見る'};document.getElementById('flip').onclick=()=>document.getElementById('flipBtn').click();
let last=JSON.stringify(readState());setInterval(()=>{const now=JSON.stringify(readState());if(now!==last){last=now;checkNew()}},500);window.addEventListener('storage',checkNew);renderCollection();setTimeout(checkNew,700);
</script>
</body>
</html>
