function validPlan(x){
 if(!x||typeof x!=='object'||Array.isArray(x))return false;
 if(!programs.some(([name])=>name===x.method)||!mainLifts.includes(x.exercise)||![2,3,4].includes(x.days)||![1,2,3,4].includes(x.week))return false;
 if(x.reference!==null&&safeNumber(x.reference,1,600)===null)return false;
 if(['5/3/1','5×5'].includes(x.method)&&x.reference===null)return false;
 if(typeof x.createdAt!=='string'||x.createdAt.length>40||!Array.isArray(x.sessions)||x.sessions.length!==x.days)return false;
 return x.sessions.every(y=>y&&typeof y.title==='string'&&y.title.length<=100&&typeof y.detail==='string'&&y.detail.length<=400);
}
function makePlan(method,exercise,days,reference,week){
 const base=methodSessionCatalog[method]||[];
 let sessions=[];
 if(method==='5/3/1'){
  const mat=[[[65,5],[75,5],[85,'5+']],[[70,3],[80,3],[90,'3+']],[[75,5],[85,3],[95,'1+']],[[40,5],[50,5],[60,5]]][week-1];
  const tm=reference*.9;
  const detail=mat.map(([pct,reps])=>`${pct}%TM: ${round(Math.round(tm*pct/100/2.5)*2.5,1)}kg × ${reps}回`).join(' ／ ');
  sessions.push({title:'DAY 1｜主種目 '+exercise,detail:detail+'。最終セットの「+」は限界までの強制ではない。'});
  for(let n=1;n<days;n++)sessions.push({title:`DAY ${n+1}｜補助・回復`,detail:'主種目と異なる動作・可動域・回復を確認。別種目へこの重量を流用しない。'});
 }else if(method==='5×5'){
  for(let n=0;n<days;n++)sessions.push({title:`DAY ${n+1}｜${exercise}`,detail:`ワーキング重量 ${reference}kg × 5回 × 5セット（候補値）。全セット達成・フォーム・痛み・回復を見て次回の変更を判断。自動増量なし。`});
 }else{
  const fallback=[['DAY 1｜主種目','主種目と反復数を記録し、無理なく実施'],['DAY 2｜補助日','目的に合う補助種目と回復状況を確認'],['DAY 3｜再評価','以前の記録とフォームを比較']];
  for(let n=0;n<days;n++){
   const item=(base.length?base:fallback)[n%(base.length||fallback.length)];
   sessions.push({title:item[0]+(n>=3?'（追加）':''),detail:item[1]});
  }
 }
 const plan={method,exercise,days,reference,week,createdAt:new Date().toISOString(),sessions};
 return validPlan(plan)?plan:null;
}

function methodEvidence(weeks=methodCompareWeeks,exercise=methodCompareExercise){
 const end=dateISO(),start=new Date(end+'T12:00:00Z');start.setUTCDate(start.getUTCDate()-weeks*7+1);
 const from=start.toISOString().slice(0,10);
 const available=state.logs.filter(l=>l.date>=from&&l.date<=end&&(exercise==='all'||exercise===l.exercise));
 const entries=available.filter(l=>l.method&&programs.some(([name])=>name===l.method));
 const byMethod=new Map();
 for(const l of entries){if(!byMethod.has(l.method))byMethod.set(l.method,[]);byMethod.get(l.method).push(l)}
 const groups=[...byMethod].map(([method,rows])=>{
  const dated=rows.slice().sort((a,b)=>a.date.localeCompare(b.date)||(a.at||'').localeCompare(b.at||''));
  const liftSet=new Set(dated.map(l=>l.exercise));
  const sets=dated.reduce((a,l)=>a+l.sets,0);
  const tonnage=round(dated.reduce((a,l)=>a+setTonnage(l),0),1);
  const pain=dated.filter(l=>l.pain!=='none'||setFlags(l)).length;
  const uncertain=dated.filter(l=>l.quality!=='stable'||l.fatigue==='high').length;
  // Must share exercise/reps/sets for even a descriptive comparison.
  const matches=new Map();
  for(const l of dated){const key=l.exercise+'|'+l.reps+'|'+l.sets;if(!matches.has(key))matches.set(key,[]);matches.get(key).push(l)}
  const candidates=[...matches.values()].filter(a=>a.length>=2&&new Set(a.map(l=>l.date)).size>=2&&a.every(l=>!nonUniformSets(l))).sort((a,b)=>b.length-a.length);
  const comparable=candidates[0]||null;
  const first=comparable?.[0],last=comparable?.at(-1);
  const change=comparable?round(last.weight-first.weight,1):null;
  return {method,entries:dated.length,days:new Set(dated.map(l=>l.date)).size,sets,tonnage,pain,uncertain,lifts:[...liftSet],comparable,first,last,change};
 }).sort((a,b)=>b.entries-a.entries||a.method.localeCompare(b.method));
 const foodDays=new Set(state.nutrition.meals.filter(m=>m.day>=from&&m.day<=end).map(m=>m.day)).size;

function comboEvidence(weeks=methodCompareWeeks,exercise=methodCompareExercise){

  const techniques=Array.isArray(l.techniques)?l.techniques:[];

function nutrition(){let n=state.nutrition;let m=macro();let ts=totals(n.meals.filter(x=>x.day===dateISO()));return `${header('NUTRITION','食べる力が、<em>カラダをつくる。</em>')}<p class="lead">目的別の食事プランと摂取記録。kcal・PFCは設定値と参考食品値をもとに集計する。</p>${chooseGoal()}<div class="segmented" style="margin:18px 0">${[['plan','食事プラン'],['log','食事記録'],['strategy','栄養戦略']].map(([k,t])=>`<button class="chip ${nutritionSub===k?'active':''}" data-nsub="${k}">${t}</button>`).join('')}</div>${nutritionSub==='plan'?nutritionPlan(m):nutritionSub==='log'?nutritionLog(ts,m):nutritionStrategy()}`}
const alternativeMeals=[['onigiri','egg','yogurt','banana'],['rice','salmon','vegetables'],['banana','yogurt','egg'],['rice','chicken','vegetables']];
function mealKey(goal,day,i){return `${goal}_${day}_${i}`}
function effectiveMeals(goal,day){let base=(day==='rest'?plansRest:plans)[goal];let swaps=state.nutrition.menuSwaps||{};return base.map(([label,...ids],i)=>[label,...(swaps[mealKey(goal,day,i)]?alternativeMeals[i]:ids)])}
function macroDifference(m,sum){if(!m)return '<p class="tiny">体重と目標kcalの設定後に、献立例とのPFC差を参考表示します。</p>';
 let entries=[['エネルギー',m.cal,sum.k,'kcal'],['P',m.protein,sum.p,'g'],['F',m.fat,sum.f,'g'],['C',m.carb,sum.c,'g']];
 return `<div class="four">${entries.map(([name,target,actual,unit])=>`<div class="metric"><small>${name}｜目標との差</small><strong style="font-size:18px">${round(actual-target,1)>0?'+':''}${round(actual-target,1)}<em>${unit}</em></strong><span class="tiny">献立例 ${round(actual,1)} / 目標 ${target}</span></div>`).join('')}</div><p class="tiny">差は食品カタログの概算値と入力された目標との算術比較で、食事処方ではありません。献立の分量を自動変更していません。</p>`;
}
function nutritionPlan(m){let n=state.nutrition;let goal=state.goal||'maintain';let selections=effectiveMeals(goal,n.day);let sum=totals(selections.flatMap(([a,...ids])=>ids.map(id=>({id,qty:1}))));return `${sect('栄養目標を設定','YOUR NUTRITION TARGET')}<div class="panel padded"><form class="formstack" id="nutritionForm"><div class="form-row"><div>${field('bodyWeight','現在の体重（kg）','type="number" min="25" max="300" step="0.1" placeholder="未設定"',n.weight??'')}</div><div>${field('calorieTarget','1日の目標エネルギー（kcal）','type="number" min="900" max="6000" step="10" placeholder="本人・指導者が設定"',n.kcal??'')}</div></div><div class="form-row"><div><label for="proteinRange" class="field-label">たんぱく質設定（g/kg）</label><select id="proteinRange" class="field">${[1.4,1.6,1.8,2,2.2].map(v=>`<option value="${v}" ${v===n.protein?'selected':''}>${v} g/kg</option>`).join('')}</select></div><div><label class="field-label" for="fatRange">脂質配分</label><select class="field" id="fatRange">${[[.2,'20%'],[.25,'25%'],[.3,'30%']].map(([v,t])=>`<option value="${v}" ${v===n.fatShare?'selected':''}>${t}</option>`).join('')}</select></div></div><button type="submit" class="primary">栄養目標を計算・保存</button><p class="tiny">自動の必要カロリー算出ではありません。本人・専門家が設定したkcalをPFCに配分する試作。体重・年齢・競技量などに基づく必要量の評価、体調確認は別途必要です。</p></form></div>${sect('計算結果',m?'USER-ENTERED TARGET':'NEED INPUT')}${m?`<div class="four"><div class="metric"><small>目標 kcal</small><strong>${num(m.cal)}</strong></div><div class="metric"><small>たんぱく質 P</small><strong>${m.protein}<em>g</em></strong></div><div class="metric"><small>脂質 F</small><strong>${m.fat}<em>g</em></strong></div><div class="metric"><small>炭水化物 C</small><strong>${m.carb}<em>g</em></strong></div></div>`:'<div class="empty">体重と1日の目標エネルギーを入力すると、PFCの配分例が表示されます。</div>'}${sect('目的別の一日献立','SAMPLE · NOT PERSONALISED')}<div class="chipset" style="margin-bottom:12px"><button class="chip ${n.day==='training'?'active':''}" data-nutrition-day="training">トレーニング日</button><button class="chip ${n.day==='rest'?'active':''}" data-nutrition-day="rest">休養日</button></div><div class="panel padded"><div class="eyebrow" style="margin-bottom:9px">MEAL IDEAS · FOOD-BASED</div>${selections.map(([label,...ids])=>`<div class="nutr-row"><img src="${assetUrl(foodCatalog.find(x=>x.id===ids[0]).img)}" alt="献立の参考画像"><div><b>${label}</b><small>${ids.map(id=>foodCatalog.find(x=>x.id===id).name).join('・')}</small></div><div class="right">約${Math.round(totals(ids.map(id=>({id,qty:1}))).k)} kcal<br><button class="secondary" style="font-size:10px;min-height:31px;padding:6px 8px;margin-top:7px" data-swap-meal="${mealKey(goal,n.day,selections.findIndex(item=>item[0]===label))}">別案に切替</button></div></div>`).join('')}<div class="notice" style="margin-top:13px">この献立例の合計は約${Math.round(sum.k)}kcal。目標kcalと自動で一致させていません。食品成分は試作用概算値であり、精密な栄養計算や医療用食事指導には使用しないでください。</div></div>${sect('献立例と目標PFCの差','ILLUSTRATIVE · NOT PRESCRIPTION')}${macroDifference(m,sum)}<div class="actions"><button class="secondary" data-nsub="log">実際に食べた物を記録 →</button></div>`}
function nutritionLog(ts,m){return `${sect('食事を記録','NO AUTOMATIC ASSUMPTIONS')}<div class="panel padded"><form id="foodForm" class="formstack"><div>${field('foodRecordDate','食事を記録する日','type="date" required',dateISO())}</div><div class="form-row"><div><label class="field-label" for="foodSelect">食べた物（標準量の概算）</label><select class="field" id="foodSelect">${foodCatalog.map(f=>`<option value="${f.id}">${esc(f.name)}｜約${f.k} kcal</option>`).join('')}</select></div><div>${field('foodQty','何食分？','type="number" min="0.25" max="10" step="0.25" required',1)}</div></div><button type="submit" class="primary">食事記録に追加</button></form><p class="tiny">記録は入力した時点の簡易記録です。個別の食材量・銘柄・調理法で大きく変化します。</p></div>${sect('今日の食事記録',`${state.nutrition.meals.filter(x=>x.day===dateISO()).length} ITEMS TODAY`)}<div class="four"><div class="metric"><small>推定 kcal</small><strong>${ts.k?Math.round(ts.k):'—'}</strong></div><div class="metric"><small>推定 P</small><strong>${ts.k?round(ts.p,1):'—'}<em>g</em></strong></div><div class="metric"><small>推定 F</small><strong>${ts.k?round(ts.f,1):'—'}<em>g</em></strong></div><div class="metric"><small>推定 C</small><strong>${ts.k?round(ts.c,1):'—'}<em>g</em></strong></div></div>${m?`<div class="notice green" style="margin-top:12px">目標${m.cal}kcalに対し、入力分は約${Math.round(ts.k)}kcal。未記録の食事があれば、1日の摂取量全体とは一致しません。</div>`:''}${state.nutrition.meals.length?`<div class="panel padded" style="margin-top:12px">${state.nutrition.meals.map((m,i)=>{let f=foodCatalog.find(x=>x.id===m.id);return `<div class="nutr-row"><img src="${assetUrl(f.img)}" alt="参考画像"><div><b>${esc(f.name)}</b><small>${m.qty}食分・${esc(m.day)}</small></div><div class="right">約${Math.round(f.k*m.qty)}kcal<br><button class="danger" data-delete-food="${i}">削除</button></div></div>`}).join('')}</div>`:'<div class="empty" style="margin-top:12px">まだ食事の記録がありません。</div>'}`}
const eventTypes={endurance:'持久系・長時間競技',team:'球技・複数試合',physique:'ボディコンテスト',strength:'筋力競技・計量種目'};

 };

 if(type==='endurance'&&duration>=1.5){const lo=round(weight*10),hi=round(weight*12);cards=`<div class="four" style="margin-top:12px"><div class="metric"><small>参考糖質量／日</small><strong style="font-size:18px">${lo}〜${hi}<em>g</em></strong></div><div class="metric"><small>目安の期間</small><strong style="font-size:18px">36〜48<em>時間</em></strong></div></div><p class="tiny">90分以上の長時間持久系競技に対する成人の一般的参考範囲（10〜12 g/kg/日）。高い摂取量が必ず適切とは限らず、胃腸の耐性や運動量・体調を確認して専門家と調整。入力した食事プランへは反映しません。</p>`;}
 else if(type==='endurance')cards='<div class="notice green">90分未満の競技では典型的な高糖質ローディングを前提にしません。通常の食事と試合前後の補給を優先。</div>';
 if(type==='physique')cards='<div class="notice green">コンテストのカーボアップは持久系の「10〜12 g/kg」を転用しません。まず練習時の試行データ、本人の体重・写真・胃腸状態を確認します。自動の水分・塩分操作はありません。</div>';

 return `<div class="panel padded gold" style="margin-top:16px"><div class="eyebrow">EVENT PREPARATION · SAVED LOCALLY</div><h3>${esc(eventTypes[type])}</h3><p class="detail">大会：${esc(date)}　体重：${weight} kg　競技時間：約${duration}時間</p>${cards}<div class="loglist" style="margin-top:12px">${examples[type].map((str,i)=>`<div class="logitem"><div><strong>${['準備','直前・当日','競技中・終了後'][i]}</strong><small style="white-space:normal">${str}</small></div></div>`).join('')}</div><p class="tiny" style="margin-top:14px">これは教育目的の献立構成例であり食品量の確定処方ではありません。未成年や持病・服薬・体重階級に関する調整は適切な専門家と行ってください。</p></div>`;
}
function nutritionStrategy(){let strategy=state.nutrition.strategy;let ev=state.nutrition.event;return `${sect('試合・コンテストの栄養戦略','9 MODES · EDUCATIONAL')}<div class="chipset">${Object.keys(strategies).map(k=>`<button class="chip ${strategy===k?'active':''}" data-strategy="${k}">${strategies[k][0]}</button>`).join('')}</div><div class="panel padded gold" style="margin-top:14px"><div class="eyebrow">NUTRITION STRATEGY</div><h2>${strategies[strategy][0]}</h2><p class="detail">${strategies[strategy][1]}</p><div class="notice">カーボローディング＝長時間競技のエネルギー準備。カーボアップ＝コンテストなどでの身体の見え方の調整。どちらも一律処方はしません。脱水・利尿・塩分制限による急速減量の自動プランはありません。</div></div>${sect('大会から逆算する','EVENT PLANNER')}<div class="panel padded"><form class="formstack" id="eventForm"><div class="form-row"><div><label class="field-label" for="eventType">競技・コンテスト種別</label><select id="eventType" class="field">${Object.keys(eventTypes).map(k=>`<option value="${k}" ${ev?.type===k?'selected':''}>${eventTypes[k]}</option>`).join('')}</select></div><div>${field('eventDate','大会日','type="date" required',ev?.date||'')}</div></div><div class="form-row"><div>${field('eventWeight','体重（kg）','type="number" min="25" max="300" step="0.1" required placeholder="実測値を入力"',ev?.weight??state.nutrition.weight??'')}</div><div>${field('eventDuration','競技時間（時間）','type="number" min="0.25" max="24" step="0.25" required placeholder="例 2.5"',ev?.duration??'')}</div></div><button class="primary" type="submit">大会情報を保存・参考計画を表示</button><p class="tiny">日時と競技時間は本人が入力。結果を表示しても、通常のPFC目標・献立・食事記録は勝手に変更されません。</p></form></div>${eventAdvice(ev)}${eventTimeline(ev)}<div class="panel padded" style="margin-top:14px"><div class="eyebrow">EVIDENCE & SAFETY</div><p class="detail">持久系の糖質ローディングはHPRC（2026年）、競技中の補給はAIS、競技美のピーク調整は2024年レビューと2026年のトレーニングレビューを参照。競技美の糖質操作は効果を断定できるほどの実験的証拠がなく、少数の変数を事前に試す方針。</p><div class="actions"><button class="secondary" data-nsub="plan">通常の食事計画に戻る</button></div></div>`}

function mirror(){return `${header('MIRROR','見える変化が、<em>次の力になる。</em>')}<p class="lead">同じ条件で写真を比較し、身体の変化を確かめる。写真はこのタブを離れると破棄され、保存・送信しない。</p>${sect('写真比較','NO UPLOAD TO SERVER')}<div class="panel padded"><div class="mirror-grid"><div><label class="field-label" for="photoBefore">BEFORE</label><div class="photo">${photo.before?`<img src="${photo.before}" alt="比較前のユーザー選択写真">`:`<p>${ico('camera',28)}<br>比較前の写真を選択</p>`}<span class="label">BEFORE</span></div><input class="field" style="margin-top:9px;font-size:11px" id="photoBefore" type="file" accept="image/jpeg,image/png,image/webp"></div><div><label class="field-label" for="photoAfter">AFTER</label><div class="photo">${photo.after?`<img src="${photo.after}" alt="比較後のユーザー選択写真">`:`<p>${ico('camera',28)}<br>比較後の写真を選択</p>`}<span class="label">AFTER</span></div><input class="field" style="margin-top:9px;font-size:11px" id="photoAfter" type="file" accept="image/jpeg,image/png,image/webp"></div></div><div class="actions"><button class="secondary" data-mirror-mode="side">並列比較</button><button class="secondary" data-mirror-mode="overlay" ${!(photo.before&&photo.after)?'disabled':''}>重ね合わせ比較</button><button class="danger" data-act="clear-photos">写真を破棄</button></div>${mirrorMode==='overlay'&&photo.before&&photo.after?`<div style="padding:16px 0"><div class="compare-layer"><img src="${photo.before}" alt="比較前の写真"><img class="photo-after-overlay" id="overlayPhoto" src="${photo.after}" alt="比較後の写真" style="clip-path:inset(0 ${100-comparePct}% 0 0)"><div class="compare-divider" id="compareDivider" style="left:${comparePct}%"></div></div><label class="field-label" for="compareSlider" style="margin-top:14px">AFTER 表示範囲 ${comparePct}%</label><input style="width:100%;accent-color:var(--gold)" id="compareSlider" type="range" min="0" max="100" step="1" value="${comparePct}"></div>`:''}</div>${sect('比較の前に確認','撮影条件')}<div class="panel padded"><div class="two">${[['person','同一人物の写真'],['distance','撮影距離と画角が同等'],['light','照明条件が同等'],['pose','姿勢と表情が同等']].map(([k,t])=>`<label class="checkline"><input type="checkbox" data-condition="${k}"> ${t}</label>`).join('')}</div><div class="notice" style="margin-top:15px">撮影条件が異なれば見かけの変化を誤認します。写真だけで筋肉量・体脂肪率・体調を測定したとは表示しません。</div></div>${sect('身体測定の履歴','OPTIONAL SELF REPORT')}<div class="panel padded"><form id="bodyForm" class="formstack"><div>${field('bodyRecordDate','身体を測定した日','type="date" required',dateISO())}</div><div class="form-row"><div>${field('measureWeight','体重 kg（任意）','type="number" step="0.1" min="20" max="350" placeholder="例 65.3"','')}</div><div>${field('measureWaist','腹囲 cm（任意）','type="number" step="0.1" min="25" max="200" placeholder="例 80"','')}</div></div><button class="secondary" type="submit">測定記録を保存</button></form></div>${state.bodyRecords.length?`<div class="loglist" style="margin-top:12px">${state.bodyRecords.slice().reverse().slice(0,10).map(l=>`<div class="logitem"><div><strong>${esc(l.date)}</strong><small>体重 ${l.weight===null?'未入力':l.weight+'kg'}／腹囲 ${l.waist===null?'未入力':l.waist+'cm'}</small></div><button class="danger" data-delete-body="${esc(l.id)}">削除</button></div>`).join('')}</div>`:''}`}
function coachTrainingEvidence(){
 const today=dateISO();const from=isoShift(today,-(coachReportWeeks*7-1));
 const logs=state.logs.filter(l=>l.date>=from&&l.date<=today&&(coachReportExercise==='all'||l.exercise===coachReportExercise))
   .slice().sort((a,b)=>a.date.localeCompare(b.date)||(a.at||'').localeCompare(b.at||''));
 const techniqueLogs=logs.filter(l=>Array.isArray(l.techniques)&&l.techniques.length);
 const byMethod=new Map();
 for(const l of logs){const name=l.method||'方式未指定';if(!byMethod.has(name))byMethod.set(name,0);byMethod.set(name,byMethod.get(name)+1)}
 return {today,from,logs,techniqueLogs,byMethod};
}
function buildCoachReport(){

 if(logs.length){
  const valid=logs.filter(l=>Number.isFinite(l.rir));

  if(hasSetDetails(last)){lines.push(`最新ログのセット別実績（本人入力）：総挙上量 ${round(setTonnage(last),1)}kg`);last.setDetails.forEach((d,i)=>lines.push(`SET${i+1}: ${d.weight}kg×${d.reps}回／RIR ${d.rir}／テンポ ${d.tempo||'未記録'}／技法 ${d.technique||'未指定'}／違和感 ${d.pain==='none'?'なし':d.pain==='minor'?'あり':'強い'}`));}
 } else lines.push('期間内の実施記録はありません。');

 }

function longTermWeeks(count=trendWeeks){

  if(!old||(r.at||'')>=(old.at||''))latest.set(r.date,r);
 }

  const age=count-i-1;

  const first=new Date(last.getTime()-6*86400000);
  const startISO=first.toISOString().slice(0,10),endISO=last.toISOString().slice(0,10);
  const weights=[...latest.values()].filter(r=>r.date>=startISO&&r.date<=endISO);
  const avg=weights.length?round(weights.reduce((a,r)=>a+r.weight,0)/weights.length,2):null;
  const foodDays=new Set(state.nutrition.meals.filter(m=>m.day>=startISO&&m.day<=endISO).map(m=>m.day)).size;
  const trainingDays=new Set(state.logs.filter(l=>l.date>=startISO&&l.date<=endISO).map(l=>l.date)).size;
  return {start:startISO,end:endISO,weightDays:weights.length,average:avg,foodDays,trainingDays};
 });

// STAGE 09: weekly review, evidence gating, and deliberate (never automatic) application.
function uniqueWeeklyWeights(days){
 const byDay=new Map();
 for(const r of state.bodyRecords){if(r.weight===null||!days.includes(r.date))continue;
   const prev=byDay.get(r.date);if(!prev||(r.at||'')>=(prev.at||''))byDay.set(r.date,r);
 }
 return [...byDay.values()].sort((a,b)=>a.date.localeCompare(b.date));
}
function weeklyReviewEvidence(){
 const now=dateISO(),weeks=compareWeek(now),cur=uniqueWeeklyWeights(weeks.current.days),pre=uniqueWeeklyWeights(weeks.previous.days);
 const avg=x=>x.length?round(x.reduce((s,r)=>s+r.weight,0)/x.length,2):null;
 const c=avg(cur),p=avg(pre),change=c!==null&&p!==null?round(c-p,2):null;
 const kcal=macro()?.cal??null;
 const event=state.nutrition.event;
 const daysTill=event?Math.round((Date.parse(event.date+'T12:00:00Z')-Date.parse(now+'T12:00:00Z'))/86400000):null;
 const eventRestricted=daysTill!==null&&daysTill>=0&&daysTill<=14;
 const strategyRestricted=state.nutrition.strategy!=='basic';
 const issues=[];
 if(cur.length<2||pre.length<2)issues.push('両週それぞれ異なる日付の体重測定が2日以上必要');
 if(weeks.current.foodDays<5||weeks.previous.foodDays<5)issues.push('両週とも食事記録が5日以上必要');
 if(kcal===null)issues.push('NUTRITIONで目標kcalの設定が必要');
 if(!['cut','bulk','maintain'].includes(state.goal))issues.push('目標を減量・増量・維持から選択');
 if(eventRestricted||strategyRestricted)issues.push('競技直前・特殊栄養戦略中は一般的なkcal変更を保留');
 const fingerprint=JSON.stringify({goal:state.goal,kcal,strategy:state.nutrition.strategy,event:state.nutrition.event,
   body:state.bodyRecords.map(r=>[r.id,r.date,r.weight,r.at]),food:state.nutrition.meals.map(m=>[m.id,m.qty,m.day]),training:state.logs.map(l=>[l.id,l.date,l.weight,l.reps,l.sets]),recovery:state.recoveryLogs.map(r=>[r.id,r.date,r.sleep,r.fatigue])});
 return {current:weeks.current,previous:weeks.previous,cur,pre,currentAvg:c,previousAvg:p,change,kcal,daysTill,issues,ready:issues.length===0,fingerprint};
}
function weekDecisionValid(x){
 if(!x||typeof x!=='object'||Array.isArray(x))return false;
 if(typeof x.id!=='string'||x.id.length>100||typeof x.createdAt!=='string'||!Number.isFinite(Date.parse(x.createdAt)))return false;
 if(!['keep','increase','decrease','review-training'].includes(x.action)||!['draft','applied'].includes(x.status))return false;
 if(!Number.isInteger(x.delta)||x.delta<0||x.delta>300||(x.action==='increase'||x.action==='decrease')&&(x.delta<50||x.delta%50!==0))return false;
 if(!['increase','decrease'].includes(x.action)&&x.delta!==0)return false;
 if(typeof x.reason!=='string'||x.reason.trim().length<5||x.reason.length>600)return false;
 if(!['cut','bulk','maintain'].includes(x.goal)||!Number.isFinite(x.baselineKcal)||x.baselineKcal<900||x.baselineKcal>6000)return false;
 if(typeof x.fingerprint!=='string'||x.fingerprint.length>180000||typeof x.weekEnd!=='string'||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(x.weekEnd))return false;
 if(x.status==='applied'&&(!Number.isFinite(Date.parse(x.appliedAt||''))||!Number.isFinite(x.appliedKcal)))return false;
 return true;
}

  <p class="tiny">カーボローディング・コンテストのピークウィーク中は通常の週次カロリー変更と区別します。未成年や個別の健康問題がある場合には、この試作の数値変更機能を自己処方として使わないでください。</p>

// STAGE 08: actual-data comparisons only. Missing entries never become zero-intake days.
function dateOffset(iso,offset){const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+offset);return d.toISOString().slice(0,10)}
function analyticsRange(endISO,back=6){const out=[];for(let n=back;n>=0;n--)out.push(dateOffset(endISO,-n));return out}
function recordedDay(day){
 const training=state.logs.filter(l=>l.date===day);
 const foods=state.nutrition.meals.filter(m=>m.day===day);
 const nutrition=totals(foods);
 const body=state.bodyRecords.filter(r=>r.date===day).at(-1)||null;
 const recovery=state.recoveryLogs.find(r=>r.date===day)||null;
 const weighted=training.filter(l=>l.weight>0).reduce((a,l)=>a+setTonnage(l),0);
 return {day,training,foods,nutrition,body,recovery,weighted,sets:training.reduce((a,l)=>a+l.sets,0)};
}
function compareWeek(endISO){
 const current=analyticsRange(endISO),prior=analyticsRange(dateOffset(endISO,-7));
 const summarise=days=>{
   const records=days.map(recordedDay);
   return {days,records,trainingDays:records.filter(x=>x.training.length>0).length,trainingSessions:records.reduce((v,x)=>v+x.training.length,0),sets:records.reduce((v,x)=>v+x.sets,0),weighted:records.reduce((v,x)=>v+x.weighted,0),foodDays:records.filter(x=>x.foods.length>0).length,foodKcal:records.reduce((v,x)=>v+x.nutrition.k,0),recoveryDays:records.filter(x=>x.recovery).length};
 };
 return {current:summarise(current),previous:summarise(prior)};
}
function recentBodyTrend(today){
 const found=state.bodyRecords.filter(x=>x.date<=today && x.weight!==null).slice().sort((a,b)=>a.date.localeCompare(b.date)||(a.at||'').localeCompare(b.at||''));
 if(found.length<2)return null;
 const last=found.at(-1);
 const first=found.find(x=>x.date!==last.date);
 if(!first)return null;
 return {first,last,delta:round(last.weight-first.weight,2),days:Math.round((Date.parse(last.date+'T00:00:00Z')-Date.parse(first.date+'T00:00:00Z'))/86400000)};
}

<script id="sug-method-guide-js">/* S.u.G TRAINING METHOD GUIDE 2026-11-01: education layer only, no storage writes */
(function(){'use strict';
if(!window.__SUG_METHOD_GUIDES__)return;
const db=window.__SUG_METHOD_GUIDES__;
const byName=new Map(db.evolink.map(x=>[x.name,x]));
const byId=new Map(db.prism.map(x=>[x.id,x]));
const byMode=new Map(db.overload.map(x=>[x.id,x]));
const role=window.__SUG_METHOD_GUIDE_ROLE__;
const safe=(v)=>String(v==null?'':v).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function card(d,tag=''){
 if(!d)return '<p class="smg-note">方法を選択してください。</p>';
 return `<article class="smg-card" aria-label="${safe(d.name)}の説明">${tag?`<small class="smg-tag">${safe(tag)}</small>`:''}<h4>${safe(d.name)}</h4>
  <dl><dt>意味・やり方</dt><dd>${safe(d.meaning)}</dd><dt>目的</dt><dd>${safe(d.purpose)}</dd><dt>メリット</dt><dd>${safe(d.pros)}</dd><dt>デメリット・限界</dt><dd>${safe(d.cons)}</dd><dt>向いている場面</dt><dd>${safe(d.suited)}</dd><dt>確認する指標</dt><dd>${safe(d.check)}</dd></dl>${d.caution?`<p class="smg-note">注意：${safe(d.caution)}</p>`:''}</article>`;
}
function create(cls){let e=document.createElement('section');e.className='sug-method-guide '+cls;e.setAttribute('aria-label','トレーニング方式の詳しい説明');return e;}
let lastMethod='', lastA='',lastB='',lastMode='';
function update(){
 if(role==='evolink'){
  const active=document.querySelector('button[data-method].active');
  if(active){const name=active.getAttribute('data-method'), container=active.closest('.two');
   if(container){let guide=document.getElementById('smg-evolink');if(!guide){guide=create('smg-main');guide.id='smg-evolink';container.insertAdjacentElement('afterend',guide);lastMethod='';}
    if(lastMethod!==name){guide.innerHTML=`<h3>このトレーニング法を選ぶ理由</h3>${card(byName.get(name))}<p class="smg-cite">方法の得失は条件付き。どの方式が最適かは目的・経験・回復状況と記録で再評価します。</p>`;lastMethod=name;}
   }
  }else{lastMethod='';}
 }
 if(role==='prism'){
  const a=document.getElementById('bp-p-method-a'),b=document.getElementById('bp-p-method-b');
  const target=document.getElementById('bp-p-comparison');
  if(a&&b&&target){let guide=document.getElementById('smg-prism');if(!guide){guide=create('smg-comparison');guide.id='smg-prism';target.insertAdjacentElement('afterend',guide);lastA='';lastB='';}
   if(a.value!==lastA||b.value!==lastB){guide.innerHTML=`<h3>方法A・B｜メリットとデメリット</h3><div class="smg-cols">${card(byId.get(a.value),'方法A')}${card(byId.get(b.value),'方法B')}</div><p class="smg-cite">比較は教育用です。選択・比較しても週間計画や学習履歴を自動変更しません。</p>`;lastA=a.value;lastB=b.value;}
  }
 }
 const mode=document.querySelector('#sug-overload-panel [data-so="mode"]');
 const grid=document.querySelector('#sug-overload-panel .so-grid');
 if(mode&&grid){let guide=document.getElementById('smg-overload');if(!guide){guide=create('smg-overload');guide.id='smg-overload';grid.insertAdjacentElement('afterend',guide);lastMode='';}
  if(lastMode!==mode.value){guide.innerHTML=`<h3>選択した負荷調整方式の意味</h3>${card(byMode.get(mode.value))}<p class="smg-cite">計算結果は提案候補。BMI・性別による一律の重量補正はせず、未確認データから増量を自動確定しません。</p>`;lastMode=mode.value;}
 }
}
let scheduled=false;
const schedule=()=>{if(scheduled)return;scheduled=true;Promise.resolve().then(()=>{scheduled=false;update()})};
document.addEventListener('change',e=>{if(e.target?.matches('#bp-p-method-a,#bp-p-method-b,#sug-overload-panel [data-so="mode"]'))schedule()});
document.addEventListener('click',e=>{if(e.target?.closest('button[data-method]'))schedule()});
const obs=new MutationObserver(schedule);obs.observe(document.body,{childList:true,subtree:true});schedule();
})();
</script>

  const result={count:records.length,latest:latest?{date:latest.date,kg:Number(latest.weight),reps:Number(latest.reps),sets:Number(latest.sets),rir:latest.rir!=null?Number(latest.rir):null,pain:latest.pain||'unknown',quality:latest.quality||'unknown',fatigue:latest.fatigue||'unknown',method:latest.method||'',setDetails:Array.isArray(latest.setDetails)?latest.setDetails.map(d=>({weight:Number(d.weight),reps:Number(d.reps),rir:Number(d.rir),pain:d.pain||'unknown'})):null}:null,previous:prev?{date:prev.date,kg:Number(prev.weight),reps:Number(prev.reps),sets:Number(prev.sets)}:null,tonnageKg:tonnageLatest,previousTonnageKg:tonnagePrev,tonnageChangePct:tonnagePrev>0?fmt((tonnageLatest/tonnagePrev-1)*100,1):null,oneRM:null};

 function recoveryInfo(history){
  const records=(Array.isArray(history)?history:[]).filter(x=>validDate(x.date)).sort((a,b)=>b.date.localeCompare(a.date));
  const r=records[0];return r?{date:r.date,sleep:r.sleep,sleepQuality:r.sleepQuality,fatigue:r.fatigue,soreness:r.soreness,stress:r.stress,source:'EVOLINK手入力'}:null;
 }
 function assessRecovery(history,asOfDate){
  const asOf=validDate(asOfDate)?asOfDate:null;
  if(!asOf)return {status:'unknown',date:null,ageDays:null,notes:['比較基準日が未確認'],source:'EVOLINK手入力'};
  const listed=Array.isArray(history)?history:[];
  const dates=listed.filter(r=>r&&validDate(r.date)&&r.date<=asOf).sort((a,b)=>b.date.localeCompare(a.date));
  const r=dates[0];
  if(!r)return {status:'missing',date:null,ageDays:null,notes:['対象日以前の回復記録なし'],source:'EVOLINK手入力'};
  const [year,month,day]=asOf.split('-').map(Number), [ry,rm,rd]=r.date.split('-').map(Number);
  const ageDays=Math.round((Date.UTC(year,month-1,day)-Date.UTC(ry,rm-1,rd))/86400000);
  const values=[r.sleep,r.sleepQuality,r.fatigue,r.soreness,r.stress].map(x=>Number(x));
  const valid=[r.sleep,r.sleepQuality,r.fatigue,r.soreness,r.stress].every(x=>x!==null&&x!==undefined&&String(x).trim()!=='')&&Number.isFinite(values[0])&&values[0]>=0&&values[0]<=16&&values.slice(1).every(x=>Number.isInteger(x)&&x>=1&&x<=5);
  if(!valid)return {status:'invalid',date:r.date,ageDays,notes:['回復記録の数値が未入力または不正'],source:'EVOLINK手入力'};
  if(ageDays>3)return {status:'stale',date:r.date,ageDays,notes:['直近3日以内の回復記録がない'],source:'EVOLINK手入力'};
  const notes=[];
  if(values[0]<6)notes.push('睡眠6時間未満（自己申告）');
  if(values[1]<=2)notes.push('睡眠の質2/5以下（自己申告）');
  if(values[2]>=4)notes.push('疲労4/5以上（自己申告）');
  if(values[3]>=4)notes.push('筋肉痛4/5以上（自己申告）');
  if(values[4]>=4)notes.push('ストレス4/5以上（自己申告）');
  return {status:notes.length?'caution':'recorded',date:r.date,ageDays,notes:notes.length?notes:['記録上の確認項目に該当なし。回復良好の医学的判定ではない'],source:'EVOLINK手入力'};
 }
 function evaluate(p){
  const method=registry[p.method];if(!method)throw Error('登録されていない方式');
  const s=stats(p.logs,p.exercise||''), rec=assessRecovery(p.recoveryLogs,p.asOfDate);
  const result={method:p.method,category:method.category,family:method.family,metric:method.metric,goal:p.goal||'未設定',experience:p.experience||'未設定',sex:p.sex||'未設定',exercise:p.exercise||'',stats:s,recoveryRecord:rec,recoveryAssessment:rec,status:'review',nextLoadKg:null,calculations:[],reasons:[],requiresConfirmation:true,bodyConnected:false,source:'EVOLINK内の入力記録（BODY・ヘルスケア未接続）'};
  if(s.latest){result.calculations.push({label:'最新入力の総挙上重量',value:`${s.tonnageKg} kg・rep`,detail:'重量×回数×セット。ウォームアップを除外する仕組みではない'});if(s.tonnageChangePct!==null)result.calculations.push({label:'前回記録との総挙上重量差',value:`${s.tonnageChangePct>0?'+':''}${s.tonnageChangePct}%`,detail:'同一種目・別日の入力記録同士の比較'});if(s.oneRM)result.calculations.push({label:'参考推定1RM',value:`Epley ${s.oneRM.epley}kg ／ Brzycki ${s.oneRM.brzycki}kg`,detail:'1〜10回の入力値からの参考推定。最大挙上実測ではない'});}
  const mode=method.family;
  if(mode==='531'||mode==='dup'){
   if(p.oneRM!=null&&String(p.oneRM).trim()!==''){
    const rm=positive(p.oneRM,'1RM');if(rm>600)throw Error('1RMが入力範囲外');
    const percent=mode==='531'?nonNeg(p.tmPct??90,'TM%'):nonNeg(p.sessionPct??75,'当日強度%');
    if(percent<50||percent>100)throw Error('割合は50〜100%');
    const candidate=mode==='531'?overload.trainingMax(rm,percent,positive(p.increment||2.5,'重量刻み')):overload.percent1rm(rm,percent,positive(p.increment||2.5,'重量刻み'));
    result.calculations.push({label:mode==='531'?'Training Max候補':'DUP当日の参考重量',value:`${candidate} kg`,detail:'入力した1RMと指定%による算術計算。週別・種目別の処方全体ではない'});
   } else result.reasons.push('1RM未入力のため%による重量計算は保留');
  }
  if(mode==='taper'||mode==='deload'){
   if(s.latest&&p.reductionPct!=null&&String(p.reductionPct).trim()!==''){
    const r=nonNeg(p.reductionPct,'軽減率');if(!(r>0&&r<100))throw Error('軽減率は0〜100%未満');
    result.calculations.push({label:'任意の軽減計算（参考）',value:`${fmt(s.latest.kg*(1-r/100),2)} kg`,detail:'明示入力した軽減率で算術計算。提案・自動適用はしない'});
   }
  }
  if(['pace','cardio','time','tempo','interval','bilateral'].includes(mode)){
   if(p.durationSec!=null&&String(p.durationSec).trim()!==''){
    const t=positive(p.durationSec,'運動時間（秒）');if(t>86400)throw Error('時間は24時間以内');
    result.calculations.push({label:'入力した運動時間',value:`${fmt(t,1)} 秒`,detail:'実測時間との照合は未実施'});
    if(p.distanceM!=null&&String(p.distanceM).trim()!==''){
     const d=positive(p.distanceM,'距離（m）');if(d>100000)throw Error('距離が入力範囲外');
     result.calculations.push({label:'平均速度',value:`${fmt(d/t,2)} m/s`,detail:'距離÷所要時間。瞬間速度・地面反力ではない'});
    }
    if(mode==='interval'&&p.restSec!=null&&String(p.restSec).trim()!==''&&p.intervals!=null&&String(p.intervals).trim()!==''){
     const rest=nonNeg(p.restSec,'休息秒'),n=positive(p.intervals,'反復数');if(!Number.isInteger(n)||n>100)throw Error('反復数が不正');
     result.calculations.push({label:'HIIT仕事時間・休息時間',value:`${fmt(t*n,1)}秒 ／ ${fmt(rest*Math.max(0,n-1),1)}秒`,detail:'運動と休息の申告値による単純集計'});
    }
   }
  }
  if(mode==='power')result.reasons.push('速度・接地時間・地面反力は未接続。値を推測・生成しない');
  if(mode==='bilateral')result.reasons.push('左右別の実測値がないため左右差は算出しない');
  if(mode==='volume'||mode==='tempo'||mode==='bilateral'||mode==='time'||mode==='power'||mode==='pace'||mode==='cardio'||mode==='interval'||mode==='taper'){
   result.reasons.push('この方式は重量増加だけで評価できないため、実績指標を表示し増量は自動決定しない');
   result.status=s.latest?'metrics':'review';return result;
  }

    result.status='hold';result.reasons.push(rec.status==='caution'?'直近の回復自己申告に負荷の再確認が必要な項目あり。画面の選択より記録を優先して増量保留':rec.status==='stale'?'回復記録が3日より古いため増量保留。最新の状態を確認':'回復記録に不正な値があり増量保留');return result;
  }
  if(!s.latest||!(s.latest.kg>0)){result.reasons.push('同一種目の確認可能な重量記録がない');return result;}
  if(!['cut','bulk','maintain','sport'].includes(p.goal)){result.reasons.push('目的未設定。目的を選んでから負荷候補を検討する');return result;}
  if(!['novice','intermediate','advanced'].includes(p.experience)){result.reasons.push('経験区分の本人確認が必要');return result;}
  if(p.confirmed!==true){result.reasons.push('重量・回数の本人確認が未完了');return result;}
  if(p.formOK!==true){result.reasons.push('動作範囲とフォームの確認が未完了');return result;}
  if(s.latest.pain!=='none'){result.reasons.push('直近の痛み・違和感の記録を確認する必要がある');return result;}
  if(p.readinessConfirmed!==true||!['normal','good','low'].includes(p.recovery)){
    result.reasons.push('回復状態の本人確認がない（BODY・HealthKitは未接続）');return result;
  }
  if(p.recovery==='low'){result.status='hold';result.nextLoadKg=s.latest.kg;result.reasons.push('回復低下を申告したため増量候補を保留');return result;}
  const base={mode:'',currentKg:s.latest.kg,stepKg:positive(p.increment||2.5,'重量刻み'),goal:({cut:'hypertrophy',bulk:'hypertrophy',maintain:'maintenance',sport:'power'})[p.goal]||'hypertrophy',experience:p.experience||'intermediate',pain:false,acute:false,quality:'confirmed',recovery:p.recovery,formOK:true,increasePct:positive(p.increasePct||2.5,'増量率')};
  if(base.increasePct>10)throw Error('増量率は10%以下');
  let modeInput=null;
  if(mode==='double'){
   if(!s.previous||p.twoSessionsVerified!==true){result.reasons.push('別日2回の全セット達成確認が不足');return result;}
   if(s.previous.kg!==s.latest.kg){result.reasons.push('2回の重量が異なるため連続達成とは扱わない');return result;}
   base.mode='double_progression';base.repMax=positive(p.repTarget||10,'目標回数');
   base.completedReps=Math.min(s.latest.reps,s.previous.reps);base.streak=s.latest.reps>=base.repMax&&s.previous.reps>=base.repMax?2:0;base.requiredSessions=2;

  }else if(mode==='5x5'){
   if(s.latest.method!=='5×5'){result.reasons.push('直近の実施記録の方式が5×5ではない');return result;}
   const rows=s.latest.setDetails;
   if(s.latest.sets!==5||!Array.isArray(rows)||rows.length!==5){result.reasons.push('5セットすべての実記録が必要。TRAININGの履歴から各セットの重量・回数・違和感を入力してください');return result;}
   if(rows.some(d=>!(d.weight>0)||!Number.isInteger(d.reps)||d.reps<5||d.weight!==s.latest.kg||d.pain!=='none')){result.reasons.push('5×5の各セットを照合した結果、未達成・重量不一致・違和感のいずれかがあるため増量保留');return result;}
   result.calculations.push({label:'5×5実績照合',value:rows.map((d,i)=>`SET${i+1} ${d.weight}kg×${d.reps}回`).join(' ／ '),detail:'保存済みセット詳細5件を照合。確認チェックだけでは達成扱いにしない'});
   base.mode='five_by_five';base.completedReps=5;base.sets=5;base.streak=1;base.requiredSessions=1;modeInput=base;
  }else if(mode==='rir'){
   if(!Number.isFinite(s.latest.rir)||s.latest.rir<0||s.latest.rir>10){result.reasons.push('RIRの記録不足');return result;}
   base.mode='rir';base.observedRIR=s.latest.rir;base.targetRIR=nonNeg(p.targetRIR??2,'目標RIR');modeInput=base;
  }else if(mode==='deload'){
   result.status='metrics';result.reasons.push('任意のデロードは確認後に別途採用する。自動適用しない');return result;
  }else{
   result.status='metrics';result.reasons.push('方式固有の自動増量ルールを実装していない。別の計算式を強制適用しない');return result;
  }
  if(!overload)throw Error('保全済み負荷計算コアが見つからない');
  const r=overload.propose(modeInput);
  result.status=r.status;result.nextLoadKg=r.proposed_load_kg;result.reasons.push(r.reason);return result;
 }

 <label class="s30-field"><span>経験</span><select data-s30-field="experience">${options([['unknown','未設定'],['novice','初心者'],['intermediate','中級者'],['advanced','上級者']],ui.experience)}</select></label>
 <label class="s30-field"><span>性別（任意：一律補正には使用しない）</span><select data-s30-field="sex">${options([['unspecified','指定しない'],['male','男性'],['female','女性'],['other','その他・回答しない']],ui.sex)}</select></label>

function readForm(p){
 p.querySelectorAll('[data-s30-field]').forEach(el=>{ui[el.dataset.s30Field]=el.value});
 p.querySelectorAll('[data-s30-check]').forEach(el=>{ui[el.dataset.s30Check]=el.checked});
}
document.addEventListener('click',e=>{
 if(e.target.closest('#s30-go-training')){const f=window.__SUG_EVO_PROGRESS_GO_TRAINING__;if(typeof f==='function')f();return;}
 if(e.target.closest('#s30-go-records')){const f=window.__SUG_EVO_PROGRESS_GO_RECORDS__;if(typeof f==='function')f();return;}
 const panel=e.target.closest('#s30-training-panel');if(!panel)return;
 if(e.target.closest('#s30-clear')){ui.confirmed=ui.formOK=ui.readinessConfirmed=ui.twoSessionsVerified=false;previousResult=null;mountRefresh(panel);return;}
 if(!e.target.closest('#s30-evaluate'))return;
 readForm(panel);
 const c=context();if(!c)return;
 try{previousResult=eng.evaluate({...ui,method:c.method,goal:ui.goal==='unknown'?c.goal:ui.goal,logs:c.logs,recoveryLogs:c.recoveryLogs,asOfDate:c.today});lastIdentity=getId();}
 catch(error){previousResult=null;panel.querySelector('#s30-output').textContent='計算保留：'+String(error.message||error);return;}
 panel.querySelector('#s30-output').innerHTML=resultHtml(previousResult);
});
function mountRefresh(panel){const page=document.body.dataset.evoPage;panel.remove();mount(page);}
window.__SUG_PROGRESS_UI__={mount};
mount(document.body.dataset.evoPage);
})();
