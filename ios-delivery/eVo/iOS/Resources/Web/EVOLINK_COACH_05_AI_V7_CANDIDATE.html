<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EVOLINK COACH｜統合候補</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#061510;color:#f2ebdc;font:15px system-ui}.app{max-width:520px;margin:auto;padding:25px 22px;min-height:100vh;background:radial-gradient(ellipse at 85% 10%,#244a36,transparent 45%),#061510}h1{font:32px Georgia,serif;color:#e5c477}h2{font-size:18px;color:#e5c477;margin-top:32px}p{line-height:1.7}label{display:block;margin:15px 0 5px}input,textarea,select{width:100%;background:#102b21;border:1px solid #82724d;border-radius:7px;color:#fff;padding:11px;font:inherit}textarea{min-height:85px}button{margin:14px 8px 0 0;background:#e5c477;color:#102b21;padding:12px 15px;border:0;border-radius:7px;font-weight:bold}.muted{color:#b6c5b8;font-size:13px}.line{border-top:1px solid #746341;padding-top:18px;margin-top:22px}#response{white-space:pre-line;line-height:1.8}</style></head><body><main class="app"><h1>S.u.G EVOLINK</h1><p class="muted">BE CONFIDENT. NEVER OVERCONFIDENT.</p><h2>COACH｜今日の経験を考える</h2><p>答えを押しつけず、記録と自分の言葉から次の選択を考える。</p><label for="feeling">今日の感覚</label><select id="feeling"><option value="unsure">わからない</option><option value="frustrated">悔しい</option><option value="anxious">不安</option><option value="confident">手応えがある</option><option value="neutral">いつもどおり</option></select><label for="words">自分の言葉</label><textarea id="words" placeholder="今日どんなことがあった？"></textarea><label for="targetRir">目標RIR（未設定可）</label><input id="targetRir" type="number" min="0" max="10" placeholder="未設定"><label for="recovery">回復状態</label><select id="recovery"><option value="">未記録</option><option value="good">良好</option><option value="normal">普通</option><option value="poor">不良</option></select><label for="pain">痛みの申告</label><select id="pain"><option value="unknown">未回答</option><option value="no">なし</option><option value="yes">あり</option></select><button id="think">考える</button><div class="line"><h2>COACHからの問い</h2><p id="response" role="status">記録を確認して、次の選択を考えよう。</p><label for="choice">自分で選ぶこと</label><select id="choice"><option value="unsure">まだ決めない</option><option value="continue">続ける</option><option value="adjust">調整する</option><option value="rest">休む</option></select><label for="reflection">気づいたこと</label><textarea id="reflection" placeholder="何を試して、どう感じた？"></textarea><label><input type="checkbox" id="saveConsent" style="width:auto">この端末に振り返りを保存することに同意</label><button id="save">端末に保存</button><button id="clear">保存を削除</button><p id="saveStatus" class="muted" role="status"></p></div><p class="muted">生成AI未接続。心理診断・自動負荷変更なし。正式画面の代替ではない独立候補。</p><section id="ai-free-dialogue" style="margin:26px 0;border-top:1px solid #82724d;padding-top:20px"><h2>自由対話AI｜接続準備</h2><p class="muted">現在は生成AI未接続。実際のAI応答はまだありません。入力は送信前に本人の同意を確認します。</p><label for="ai-user-message">相談したいこと</label><textarea id="ai-user-message" maxlength="600" placeholder="自分の言葉で自由に書く"></textarea><label><input id="ai-send-consent" type="checkbox" style="width:auto">この相談内容をAIへ送ることに同意する（現在はローカル試験のみ）</label><button id="ai-check" type="button">接続状態を確認</button><p id="ai-status" role="status" class="muted"></p></section></main><script src="EVOLINK_ADAPT_ENGINE_CANDIDATE.js"></script><script src="EVOLINK_ADAPT_PSYCHOLOGY_CANDIDATE.js"></script><script src="EVOLINK_COACH_ADAPT_BRIDGE_CANDIDATE.js"></script><script src="EVOLINK_TRAINING_ADAPTER_CANDIDATE.js"></script><script src="EVOLINK_SHARED_REFLECTION.js"></script><script>
'use strict';const $=id=>document.getElementById(id),fields=['feeling','words','choice','reflection','targetRir','recovery','pain'];
function data(){return Object.fromEntries(fields.map(id=>[id,$(id).value]))}
function training(){try{const v=JSON.parse(localStorage.getItem('evolink_training_v2')||'[]');return Array.isArray(v)?v:[]}catch{return []}}
function render(){const d=data(),ctx=EVOLINK_TRAINING_ADAPTER.build(training(),d);if(ctx.painUnknown){$('response').textContent='痛みの有無が未回答です。負荷の判断は保留します。\n'+EVOLINK_COACH_ADAPT_BRIDGE.build(ctx).coach.question;return}const r=EVOLINK_COACH_ADAPT_BRIDGE.build(ctx);$('response').textContent=[r.coach.opening,r.coach.question,'ADAPT: '+r.adapt.status+'／'+r.adapt.reasons.join('・'),'記録 '+ctx.recordCount+'件。自動変更なし。'].filter(Boolean).join('\n')}
$('think').onclick=render;
$('save').onclick=()=>{try{const r=EVOLINK_SHARED.save(localStorage,data(),$('saveConsent').checked);$('saveStatus').textContent=r.saved?'この端末に保存しました。':'保存には同意が必要です。'}catch{$('saveStatus').textContent='保存できませんでした。'}};
$('clear').onclick=()=>{EVOLINK_SHARED.clear(localStorage);$('saveStatus').textContent='保存データを削除しました。'};
try{const d=EVOLINK_SHARED.read(localStorage);for(const id of fields)$(id).value=d[id]}catch{}
</script><script id="ai-offline-ui">(function(){'use strict';const $=id=>document.getElementById(id);$('ai-check').addEventListener('click',async()=>{if(!$('ai-send-consent').checked){$('ai-status').textContent='同意が必要です。送信していません。';return}if(!$('ai-user-message').value.trim()){$('ai-status').textContent='相談内容を入力してください。';return}try{const r=await fetch('/api/coach',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({aiConsent:true,message:$('ai-user-message').value})});if(!r.ok)throw Error('local server unavailable');const data=await r.json();$('ai-status').textContent=data.reply||'生成AI未接続';}catch{$('ai-status').textContent='ローカル検証サーバーに接続できません。外部AIには送信していません。';}})})();</script></body></html>
