<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070708"><title>S.u.G SHRINE QUEST V26.5.206</title><style>:root{--bg:#070708;--card:#111216;--line:#30323a;--gold:#d8b35b;--gold2:#f3dc95;--txt:#f7f7f8;--muted:#9497a1;--ok:#79dfa5;--blue:#78b7ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#2b210f 0,#0b0b0d 33%,#060607 75%);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}button,input{font:inherit}.wrap{max-width:820px;margin:auto;padding:0 12px 105px}.top{position:sticky;top:0;z-index:40;margin:0 -12px;padding:11px 12px;background:#08090af2;backdrop-filter:blur(16px);border-bottom:1px solid #2a2b30}.toprow{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:1000;letter-spacing:.08em;font-size:17px}.brand b{color:var(--gold2)}.sub{font-size:8px;color:#777}.wallet{font-size:10px;color:var(--gold2);border:1px solid #66542e;border-radius:999px;padding:6px 10px}.hero,.sec{margin-top:12px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,#131419,#0d0e11);padding:14px}.hero{border-color:#544525;background:linear-gradient(145deg,#1b160d,#101116 62%,#09090b)}.eyebrow{font-size:9px;font-weight:900;letter-spacing:.16em;color:var(--gold2)}.hero h1{font-size:24px;line-height:1.25;margin:5px 0 8px}.hero p{font-size:10px;line-height:1.75;color:#b8bac1;margin:0}.filters{display:flex;gap:6px;overflow:auto;margin-top:12px}.filter{white-space:nowrap;border:1px solid #373943;background:#0b0c0f;color:#bbb;border-radius:999px;padding:7px 10px;font-size:9px}.filter.on{background:linear-gradient(180deg,#efd582,#b78a32);color:#080808}.sectop{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}.sectop h2{margin:0;font-size:13px;color:var(--gold2)}.sectop small{font-size:8px;color:#777}.shrine{border:1px solid #30333a;background:#090a0d;border-radius:16px;padding:12px;margin-bottom:8px}.head{display:grid;grid-template-columns:50px 1fr auto;gap:9px;align-items:center}.mark{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#251f12,#0d0e10);border:1px solid #68552e;color:var(--gold2);font-weight:1000;font-size:17px}.head h3{font-size:13px;margin:0}.head small{font-size:8px;color:#94979f}.pt{font-size:9px;color:var(--gold2)}.why{margin-top:9px;padding:10px;border-left:3px solid var(--gold);background:#15130d;border-radius:9px;font-size:9px;line-height:1.7}.page{display:none}.page.on{display:block}.mapwrap{position:relative;min-height:760px;border:1px solid #30333a;border-radius:18px;background:radial-gradient(circle at 50% 12%,#201a0e,#0a0b0e 55%);overflow:hidden}.mapwrap svg{position:absolute;inset:0;width:100%;height:100%;z-index:1}.edge{stroke:#393a40;stroke-width:1.7;opacity:.55}.edge.next{stroke:#d8b35b;stroke-width:3;opacity:1;filter:drop-shadow(0 0 6px #d8b35baa)}.hub,.node{position:absolute;z-index:2;transform:translate(-50%,-50%);text-align:center}.hub{width:138px;min-height:108px;border-radius:50%;display:grid;place-items:center;padding:13px;background:radial-gradient(circle,#382b11,#12100b 70%);border:2px solid #a98536;box-shadow:0 0 30px #d8b35b44}.hub b{font-size:14px;color:var(--gold2)}.hub small{display:block;font-size:7px;color:#aaa;margin-top:4px}.node{width:118px;padding:10px 7px;border-radius:15px;border:1px solid #3a3c45;background:#0d0e12f2;box-shadow:0 8px 18px #0008}.node.done{border-color:#4d9a6a;box-shadow:0 0 20px #79dfa544}.node.next{border-color:#d8b35b;box-shadow:0 0 25px #d8b35b55;animation:pulse 1.8s infinite}.node.lock{opacity:.32;filter:grayscale(1)}.node b{display:block;font-size:9px}.node small{display:block;margin-top:3px;color:#888;font-size:7px}.nodeico{font-size:20px}@keyframes pulse{50%{box-shadow:0 0 36px #f3dc9588}}.legend{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.leg{font-size:7px;border:1px solid #3e4149;border-radius:999px;padding:5px 7px;color:#aaa}.routebox{border:1px solid #32343d;border-radius:15px;padding:11px;background:#0a0b0e;margin-top:10px}.routebox h3{font-size:11px;margin:0;color:var(--gold2)}.routebox p{font-size:8px;line-height:1.6;color:#9da0a8}.foot{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:#090a0cf0;border-top:1px solid #292b31}.nav{border:0;background:none;color:#888b94;font-size:8px}.nav b{display:block;font-size:18px}.nav.on{color:var(--gold2)}.info{font-size:9px;line-height:1.8;color:#b8bac1}.item{border:1px solid #30333a;border-radius:14px;padding:12px;margin-bottom:8px}.item.lock{opacity:.35}</style></head><body><div class="wrap"><header class="top"><div class="toprow"><div><div class="brand">S.u.G <b>SHRINE QUEST</b></div><div class="sub">V26.5.206 WALK • DISCOVER • CONNECT</div></div><div id="wallet" class="wallet">0 pt</div></div></header><main id="home" class="page on"><section class="hero"><div class="eyebrow">OSAKA PILOT</div><h1>神様から、神社が枝分かれする。</h1><p>神社名を並べるだけではなく、祭神・信仰を中心に「なぜつながる？」を歩いて解放する。</p></section><section class="sec"><div class="sectop"><h2>神社を探す</h2><small>北区＋饒速日ルート</small></div><div id="list"></div></section></main><main id="network" class="page"><section class="sec"><div class="sectop"><h2>神縁 NETWORK</h2><small>訪問で点灯・次候補が発光</small></div><div class="legend"><span class="leg">緑＝訪問済</span><span class="leg">金＝次候補</span><span class="leg">暗＝未解放</span></div><div class="filters" id="routeFilters"></div><div id="map" class="mapwrap"></div><div id="routebox"></div></section></main><main id="collection" class="page"><section class="sec"><div class="sectop"><h2>収集</h2><small>CHECK INで解放</small></div><div id="items"></div></section></main><main id="learn" class="page"><section class="sec"><div class="sectop"><h2>学ぶ</h2><small>情報の確度を分離</small></div><div class="why"><b>●公式確認</b> 神社公式・神社庁・自治体等<br><b>○伝承</b> 神社伝承・系図<br><b>△仮説</b> 比較・探索仮説</div></section></main></div><nav class="foot"><button class="nav on" data-page="home"><b>⛩</b>探す</button><button class="nav" data-page="network"><b>⌘</b>つながり</button><button class="nav" data-page="collection"><b>◈</b>収集</button><button class="nav" data-page="learn"><b>文</b>学ぶ</button></nav><script>const S=[{id:'tenmangu',name:'大阪天満宮',area:'北区天神橋',sys:'天神',deity:'菅原道真公',mark:'天',pt:100,item:'天満の天神章'},{id:'tsunashiki',name:'綱敷天神社',area:'北区神山町',sys:'天神',deity:'菅原道真公',mark:'綱',pt:100,item:'綱敷天神章'},{id:'tsuyu',name:'露天神社',area:'北区曽根崎',sys:'天神',deity:'菅原道真公ほか',mark:'露',pt:100,item:'お初天神章'},{id:'nagarahachi',name:'長柄八幡宮',area:'北区長柄中',sys:'八幡',deity:'八幡大神',mark:'八',pt:100,item:'長柄八幡章'},{id:'minamihachi',name:'南長柄八幡宮',area:'北区長柄中',sys:'八幡',deity:'八幡大神',mark:'南',pt:100,item:'南長柄八幡章'},{id:'yasaka',name:'八阪神社',area:'北区大淀中',sys:'スサノオ',deity:'素盞嗚尊系',mark:'八',pt:100,item:'大仁八阪章'},{id:'susanoo',name:'素盞烏尊神社',area:'北区大淀南',sys:'スサノオ',deity:'素盞嗚尊',mark:'素',pt:100,item:'浦江八坂章'},{id:'iwafune',name:'磐船神社',area:'大阪府交野市',sys:'饒速日・物部',deity:'饒速日命',mark:'磐',pt:150,item:'天磐船章'},{id:'iwafune2',name:'磐船大神社',area:'大阪府河南町',sys:'饒速日・物部',deity:'饒速日命系伝承',mark:'船',pt:150,item:'河南磐船章'},{id:'isonokami',name:'石上神宮',area:'奈良県天理市',sys:'饒速日・物部',deity:'布都御魂大神ほか',mark:'石',pt:200,item:'石上神宝章'}];const routes={天神:{hub:'菅原道真公',why:'天神信仰は、なぜ各地の「天満宮」「天神社」へ広がったのか。',ids:['tenmangu','tsunashiki','tsuyu']},八幡:{hub:'八幡大神',why:'八幡信仰と地域の八幡宮をたどる。',ids:['nagarahachi','minamihachi']},スサノオ:{hub:'素盞嗚尊',why:'八坂・祇園信仰と素盞嗚尊のつながりをたどる。',ids:['yasaka','susanoo']},'饒速日・物部':{hub:'饒速日命',why:'天磐船・饒速日命から物部・石上へ。伝承と史料を分けながら歩く。',ids:['iwafune','iwafune2','isonokami']}};let done=JSON.parse(localStorage.getItem('shrine206')||'[]'),route='天神';function save(){localStorage.setItem('shrine206',JSON.stringify(done))}function renderList(){list.innerHTML=S.map(s=>`<div class="shrine"><div class="head"><div class="mark">${s.mark}</div><div><h3>${s.name}</h3><small>${s.area}｜${s.deity}</small></div><div class="pt">+${s.pt}pt</div></div><div class="why">WHY? ${routes[s.sys]?.why||'地域と祭神のつながりを追う。'}</div><button onclick="check('${s.id}')" style="width:100%;margin-top:9px;padding:10px;border:0;border-radius:10px;background:linear-gradient(#efd582,#b58a35);font-weight:900">${done.includes(s.id)?'✓ CHECKED':'現地でCHECK IN'}</button></div>`).join('')}function check(id){if(!done.includes(id)){done.push(id);save()}renderList();renderMap();renderItems()}function renderFilters(){routeFilters.innerHTML=Object.keys(routes).map(r=>`<button class="filter ${r===route?'on':''}" onclick="route='${r}';renderFilters();renderMap()">${r}</button>`).join('')}function renderMap(){const R=routes[route],ids=R.ids,n=ids.length,cx=50,cy=48,rad=34;let nodes='',lines='';ids.forEach((id,i)=>{let s=S.find(x=>x.id===id),a=(-90+i*(360/n))*Math.PI/180,x=cx+Math.cos(a)*rad,y=cy+Math.sin(a)*rad;let visited=done.includes(id),prev=i===0||done.includes(ids[i-1]),state=visited?'done':prev?'next':'lock';lines+=`<line class="edge ${state==='next'?'next':''}" x1="${cx}%" y1="${cy}%" x2="${x}%" y2="${y}%"/>`;nodes+=`<button class="node ${state}" style="left:${x}%;top:${y}%" onclick="selectNode('${id}')"><div class="nodeico">⛩</div><b>${s.name}</b><small>${visited?'訪問済':state==='next'?'次の候補':'未解放'}</small></button>`});map.innerHTML=`<svg>${lines}</svg><div class="hub" style="left:${cx}%;top:${cy}%"><div><b>${R.hub}</b><small>${route} NETWORK</small></div></div>${nodes}`;routebox.innerHTML=`<div class="routebox"><h3>${route}ルート</h3><p>${R.why}</p><div class="info">訪問済 ${ids.filter(x=>done.includes(x)).length}/${ids.length}　→ 次の候補が金色に発光</div></div>`}function selectNode(id){let s=S.find(x=>x.id===id);routebox.innerHTML=`<div class="routebox"><h3>${s.name}</h3><p>${s.deity}｜${s.area}</p><div class="info">WHY? ${routes[s.sys].why}<br>${done.includes(id)?'✓ 訪問済':'現地チェックインでこの神縁を解放'}</div></div>`}function renderItems(){items.innerHTML=S.map(s=>`<div class="item ${done.includes(s.id)?'':'lock'}"><b>${done.includes(s.id)?'◈':'◇'} ${s.item}</b><div class="info">${s.name}</div></div>`).join('')}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.getElementById(b.dataset.page).classList.add('on');if(b.dataset.page==='network')renderMap()});renderList();renderFilters();renderMap();renderItems();wallet.textContent=done.reduce((a,id)=>a+(S.find(x=>x.id===id)?.pt||0),0)+' pt';</script></body></html>
