<style>

2000;inset:0;display:none;align-items:center;justify-content:center;padding:calc(18px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 12%,#4b3510,#080604 46%,#000 82%)}.reveal.on{display:flex}.inner{width:min(360px,94vw)}.kicker{text-align:center;color:#d8b35b;font:700 9px Arial,sans-serif;letter-spacing:.18em;margin-bottom:8px}.title{text-align:center;color:#ffe6a6;font:700 24px Georgia,'Yu Mincho',serif;margin:0 0 12px}.flipWrap{width:100%;aspect-ratio:3/4.7;perspective:1400px}.flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .58s cubic-bezier(.2,.75,.2,1)}.flip.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;border:2px solid #c79a42;border-radius:22px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 18px 44px #000d,0 0 28px #d2a44033}.front{padding:18px;background:#080604;display:flex;flex-direction:column;justify-content:space-between}.front:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 15%,#4a3a20,#0b0907 42%,#050403 78%)}.front>*{position:relative;z-index:1}.frontTop{display:flex;justify-content:space-between}.frontType{padding:5px 8px;border:1px solid #a17a35;border-radius:999px;background:#0b0907cc;color:#f0c86d;font:700 9px Arial,sans-serif}.frontNo{color:#c5bda9;font:700 8px monospace}.hero{height:58%;border:1px solid #7d622f;border-radius:14px;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#806a3c,#19130b 58%,#050403);color:#f0cf78;font:700 92px Georgia,'Yu Mincho',serif;text-shadow:0 5px 24px #000}.frontName{text-align:center;color:#fff0c8;font:700 27px Georgia,'Yu Mincho',serif}.frontSub{text-align:center;color:#d4c6aa;font-size:9px;line-height:1.55}.foot{display:flex;justify-content:space-between;color:#958b78;font-size:7px}.foot b{color:#d7b25b}.backFace{transform:rotateY(180deg);padding:18px;background:radial-gradient(circle at 50% 0,#29371f,#0c0d09 36%,#050403 72%);overflow:auto}.backType{color:#d9b459;font:700 9px Arial,sans-serif;letter-spacing:.15em}.backFace h2{margin:6px 0 12px;color:#ffe6a6;font:700 25px Georgia,'Yu Mincho',serif}.section{margin:9px 0;padding:10px;border:1px solid #584421;border-radius:11px;background:#0b0906cc}.section b{display:block;margin-bottom:5px;color:#e5bd63;font-size:8px;letter-spacing:.08em}.section p{margin:0;color:#e2d8c5;font-size:10px;line-height:1.6}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions button{padding:12px;border:1px solid #7a5e2f;border-radius:10px;background:#0d0a06;color:#f1cc75;font-weight:900}.actions .primary{background:linear-gradient(#f2d789,#b78930);color:#171006;border-color:#f3da8c}
</style></head>
<body>
<iframe id="app" src="./quest-transport-map-v10-card-conditions.html?v=mission-card-v11-20260907"></iframe>
<button class="collectBtn" id="collectBtn">COLLECTION 24</button>
<section class="overlay" id="collection"><div class="head"><button class="close" id="closeCollection">‹</button><h1>SEASON 01｜24 CARDS</h1><div class="count" id="count">0 / 24</div></div><div class="grid" id="grid"></div></section>
<section class="reveal" id="reveal"><div class="inner"><div class="kicker">MISSION COMPLETE</div><h1 class="title">CARD GET</h1><div class="flipWrap"><div class="flip" id="flip"><div class="face front" id="front"></div><div class="face backFace" id="back"></div></div></div><div class="actions"><button id="flipBtn">裏面を見る</button><button class="primary" id="nextBtn">次へ</button></div></div></section>
<script>
const PILOT='sugQuestFieldV10',SEEN='sugQuestRevealSeenV11';
const cards=[
['01','河南','PERSON','河','山側の入口。水・農産物・歴史を次の地域へ。','WATER / FOOD / PEOPLE','02 河南マンホール → 03 農産物'],
['02','河南マンホール','INFRA / MANHOLE','◎','地下インフラへの入口。河南を歩いた証。','WATER / WASTEWATER','03 河南の農産物'],
['03','河南の農産物','CARGO','穫','山側で生まれ、街へ運ばれる地域の恵み。','FOOD / AGRI GOODS','04 山の水 → 太子'],
['04','山の水','WATER','水','暮らしと農を支え、川・都市へ続く水。','WATER','天満天神の水 → 大川'],
['05','楠木正成〈千早城〉','PERSON','楠','千早城と山側の歴史を歩いて追う。','PEOPLE / MILITARY','06 マンホール → 07 金剛山・峠'],
['06','千早赤阪マンホール','INFRA / MANHOLE','◎','山側の暮らしを支える地下インフラ。','WATER / WASTEWATER','07 金剛山・峠'],
['07','金剛山・峠','ROUTE','峠','身体を使って越える山側の運搬路。','PEOPLE / GOODS','08 千早攻略'],
['08','千早攻略','ACHIEVEMENT','城','千早の人物・INFRA・ROUTEをつないだ証。','PEOPLE / MILITARY / GOODS','09 聖徳太子'],
['09','聖徳太子','PERSON','太','太子町と王陵・街道を歩いて追う。','PEOPLE / CULTURE','10 太子マンホール → 11 竹内街道'],
['10','太子マンホール','INFRA / MANHOLE','◎','古代の道と現代の地下インフラを重ねる。','WATER / WASTEWATER','11 竹内街道'],
['11','竹内街道','ROUTE','道','人・物・文化が往来した古代の道。','PEOPLE / GOODS / CULTURE','12 往来・街道'],
['12','往来・街道','TRANSPORT','往','街道の「運ぶ機能」そのものをカード化。','PEOPLE / GOODS / CULTURE','13 天満 CITY GATE'],
['13','菅原道真','PERSON','天','天満の学問・水・都市の入口。','PEOPLE / CULTURE','14 天満マンホール → 16 川の町'],
['14','天満マンホール探索','INFRA / MANHOLE','◎','都市の地下を流れる水の入口。','WATER / WASTEWATER / CITY FLOW','15 商い → 16 川の町'],
['15','天満の商い','SHOP / SUPPLY','商','届いた物が売買され、人が集まる供給点。','FOOD / GOODS / MONEY / PEOPLE','16 天満・川の町'],
['16','天満・川の町','ROUTE','川','天満から大川へ。都市と水運をつなぐ。','WATER / PEOPLE / GOODS','SEASON 02 大川・堂島川'],
['17','近鉄','TRANSPORT','鉄','南河内と大阪都市圏をつなぐ現代交通。','PEOPLE','18 鉄道駅'],
['18','鉄道駅','TRANSPORT','駅','人の流れが集まり分岐するHUB。','PEOPLE','天満・大阪市各AREA'],
['19','米・野菜・水','CARGO','荷','複数地域を横断する生活CARGO。','FOOD / WATER / GOODS','15 天満の商い'],
['20','刀剣','EQUIPMENT','刀','人物と歴史QUESTを強化する装備。','EQUIPMENT / PEOPLE','武将・國重系QUEST'],
['21','甲冑','EQUIPMENT','甲','武将・戦・移動を支えた防具。','EQUIPMENT / MILITARY','PHASE 2 甲冑＋刀'],
['22','家紋','CREST','紋','人物・氏族・地域史を追うコレクションキー。','IDENTITY / PEOPLE','武将・氏族SECRET'],
['23','山側三地域制覇','MASTER','山','河南・千早赤阪・太子を歩いてつないだ証。','WATER / FOOD / PEOPLE / GOODS / CULTURE','13 天満 CITY GATE'],
['24','山から街へ','LEGEND','道','SEASON 01 COMPLETE。南河内から天満へ。','ALL TRANSPORT','SEASON 02｜街から海へ']
].map(x=>({id:x[0],name:x[1],type:x[2],mark:x[3],sub:x[4],moved:x[5],next:x[6]}));
function pilot(){try{return JSON.parse(localStorage.getItem(PILOT)||'{"got":{}}')}catch(e){return {got:{}}}}function seen(){try{return JSON.parse(localStorage.getItem(SEEN)||'[]')}catch(e){return []}}function saveSeen(v){localStorage.setItem(SEEN,JSON.stringify(v))}
let queue=[],showing=false,lastGot={};
function renderCollection(){const p=pilot(),got=p.got||{},n=cards.filter(c=>got[c.id]).length;document.getElementById('count').textContent=`${n} / 24`;document.getElementById('grid').innerHTML=cards.map(c=>`<button class="card ${got[c.id]?'':'locked'}" data-id="${c.id}"><div class="art">${c.mark}</div><div class="type">S01-${c.id} / ${c.type}</div><h3>${c.name}</h3><div class="state">${got[c.id]?'GET ✓｜タップで見る':'LOCKED'}</div></button>`).join('');document.querySelectorAll('.card').forEach(b=>b.onclick=()=>{const c=cards.find(x=>x.id===b.dataset.id);if(c&&got[c.id])openReveal(c,false)})}
function frontHTML(c){return `<div class="frontTop"><span class="frontType">${c.type}</span><span class="frontNo">S01-${c.id}</span></div><div class="hero">${c.mark}</div><div><div class="frontName">${c.name}</div><div class="frontSub">${c.sub}</div></div><div class="foot"><span>TRANSPORT COLLECTION</span><b>GET</b></div>`}
function backHTML(c){return `<div class="backType">S01-${c.id} / ${c.type}</div><h2>${c.name}</h2><div class="section"><b>WHAT MOVED?</b><p>${c.moved}</p></div><div class="section"><b>NEXT ROUTE</b><p>${c.next}</p></div><div class="section"><b>MISSION STATUS</b><p>条件達成済み。CARD COLLECTIONへ保存されました。</p></div>`}
function openReveal(c,fromQueue=true){showing=true;document.getElementById('front').innerHTML=frontHTML(c);document.getElementById('back').innerHTML=backHTML(c);document.getElementById('flip').classList.remove('flipped');document.getElementById('flipBtn').textContent='裏面を見る';document.getElementById('reveal').classList.add('on');document.getElementById('nextBtn').textContent=(fromQueue&&queue.length)?'次のCARD':'COLLECTIONへ';document.getElementById('nextBtn').dataset.queue=fromQueue?'1':'0'}
function scan(){const got=pilot().got||{},s=seen();for(const c of cards){if(got[c.id]&&!lastGot[c.id]&&!s.includes(c.id)){queue.push(c);s.push(c.id)}}lastGot={...got};saveSeen(s);renderCollection();if(!showing&&queue.length)openReveal(queue.shift(),true)}
document.getElementById('collectBtn').onclick=()=>{renderCollection();document.getElementById('collection').classList.add('on')};document.getElementById('closeCollection').onclick=()=>document.getElementById('collection').classList.remove('on');document.getElementById('flipBtn').onclick=()=>{const f=document.getElementById('flip');f.classList.toggle('flipped');document.getElementById('flipBtn').textContent=f.classList.contains('flipped')?'表面を見る':'裏面を見る'};document.getElementById('nextBtn').onclick=()=>{document.getElementById('reveal').classList.remove('on');showing=false;if(queue.length)openReveal(queue.shift(),true);else{renderCollection();document.getElementById('collection').classList.add('on')}};
lastGot={...((pilot().got)||{})};const s0=seen();for(const c of cards)if(lastGot[c.id]&&!s0.includes(c.id)){queue.push(c);s0.push(c.id)}saveSeen(s0);renderCollection();if(queue.length)openReveal(queue.shift(),true);setInterval(scan,350);
</script></body></html>
