<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050403">
<title>S.u.G QUEST｜GPS CHECK-IN</title>
<style>
:root{--gold:#e8bd58;--gold2:#ffe8a0;--green:#62e783;--mut:#a99f8c;--line:#6d542b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif}
#base{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
#gpsBtn{position:fixed;z-index:40;left:14px;bottom:calc(86px + env(safe-area-inset-bottom));border:1px solid #4f9c64;border-radius:999px;padding:12px 15px;background:linear-gradient(135deg,#173921,#070a07);color:#bff8ca;font-weight:900;box-shadow:0 8px 30px #000b,0 0 18px #45bd6b44}
#panel{position:fixed;z-index:50;inset:0;display:none;overflow:auto;background:radial-gradient(circle at 50% 0,#142419,#050505 32%,#020202 72%);padding:calc(14px + env(safe-area-inset-top)) 14px calc(45px + env(safe-area-inset-bottom))}
#panel.on{display:block}.head{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:42px 1fr 42px;align-items:center;padding:5px 0 12px;background:linear-gradient(#040604 78%,#04060400)}
.back{border:0;background:none;color:var(--gold2);font-size:32px}.brand{text-align:center;color:var(--gold2);font:700 22px Georgia,'Yu Mincho',serif}.sub{text-align:center;color:#a9c6ad;font-size:8px;letter-spacing:.15em}.hero{padding:16px;border:1px solid #4b7858;border-radius:16px;background:linear-gradient(145deg,#122017,#080b08 60%,#030303);margin-bottom:12px}.hero h1{margin:4px 0 6px;color:#dff4d9;font:700 24px Georgia,'Yu Mincho',serif}.hero p{margin:0;color:#c8c6bb;font-size:10px;line-height:1.7}.accuracy{margin-top:9px;padding:8px 10px;border:1px solid #425545;border-radius:10px;background:#070907;color:#aeb7aa;font-size:9px}.list{display:grid;gap:9px}.spot{padding:12px;border:1px solid #515044;border-radius:13px;background:linear-gradient(135deg,#10100d,#050504)}.spot.ok{border-color:#4f9c64;box-shadow:0 0 16px #45bd6b22}.spotTop{display:flex;justify-content:space-between;gap:8px}.type{color:#c8a95e;font:700 8px Arial,sans-serif;letter-spacing:.12em}.state{color:#968e80;font-size:8px}.spot.ok .state{color:#8df4a5}.spot h3{margin:5px 0 4px;color:#f2e0ac;font-size:15px}.spot p{margin:0;color:#b8af9e;font-size:9px;line-height:1.55}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.chip{padding:4px 7px;border:1px solid #4e493b;border-radius:999px;color:#c7beab;font-size:7px}.chip.warn{border-color:#775e2b;color:#e0bd67}.check{width:100%;margin-top:9px;padding:10px;border:1px solid #5aa66e;border-radius:9px;background:linear-gradient(#6ce78b,#329b55);color:#071009;font-weight:900;font-size:10px}.check:disabled{opacity:.45}.distance{margin-top:7px;color:#a9a294;font-size:8px}.note{margin:14px 0;padding:11px;border-left:3px solid #d6a74a;background:#100c06;color:#cfc2aa;font-size:9px;line-height:1.65}.toast{position:fixed;z-index:80;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,24px);width:min(360px,90vw);padding:11px 13px;border:1px solid #5b9d69;border-radius:12px;background:#081109f2;color:#c7ffd3;font-size:10px;opacity:0;pointer-events:none;transition:.25s}.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<iframe id="base" src="./quest-transport-map-v2.html?v=gps-wrapper-20260907"></iframe>
<button id="gpsBtn">GPS CHECK</button>
<section id="panel" aria-hidden="true">
 <div class="head"><button class="back" id="back">‹</button><div><div class="brand">S.u.G QUEST</div><div class="sub">GPS FIELD CHECK-IN</div></div><div></div></div>
 <div class="hero"><div class="sub">FIELD MODE</div><h1>現地到達で、KEYを解放。</h1><p>端末の位置情報を使い、対象地点から一定距離以内に入った時だけCHECK-INできます。取得状態はTRANSPORT MAPと共有されます。</p><div class="accuracy" id="gpsStatus">位置情報：未取得</div></div>
 <div class="list" id="list"></div>
 <div class="note"><b>GPS設計について</b><br>河南・千早赤阪・太子は、公式マンホールカード配布拠点をFIELD CHECKPOINTとして設定。天満は大阪天満宮周辺を暫定CHECKPOINTとして実装しています。天満のデザインマンホール個体位置は現地確認後に座標を確定します。</div>
</section>
<div class="toast" id="toast"></div>
<script>
const STORAGE='sugQuestTransportV2';
const RADIUS=180;
const spots=[
 {id:'kanan',manhole:'kananManhole',name:'河南町役場',type:'KANAN / INFRA KEY',lat:34.4916299,lng:135.6297076,desc:'河南町の公式マンホールカード配布拠点をFIELD CHECKPOINTとして使用。',mode:'official-card'},
 {id:'chihaya',manhole:'chihayaManhole',name:'千早赤阪村役場',type:'CHIHAAYA / INFRA KEY',lat:34.4644967,lng:135.6224417,desc:'千早赤阪村の公式マンホールカード配布拠点をFIELD CHECKPOINTとして使用。',mode:'official-card'},
 {id:'taishi',manhole:'taishiManhole',name:'道の駅 近つ飛鳥の里・太子',type:'TAISHI / INFRA KEY',lat:34.5167666,lng:135.6584825,desc:'太子町の公式マンホールカード配布拠点をFIELD CHECKPOINTとして使用。',mode:'official-card'},
 {id:'tenma',manhole:'tenmaManhole',name:'大阪天満宮',type:'TENMA / CITY GATE',lat:34.695530,lng:135.512634,desc:'SEASON 01→02の接続地点。天満天神の水・歴史・周辺マンホールへ接続。',mode:'provisional'}
];
let current=null;
function read(){try{return JSON.parse(localStorage.getItem(STORAGE)||'{}')}catch(e){return {}}}
function write(s){localStorage.setItem(STORAGE,JSON.stringify(s))}
function hav(a,b,c,d){const R=6371000,p=Math.PI/180;const x=(c-a)*p,y=(d-b)*p;const aa=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(aa))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
function render(){const s=read();const box=document.getElementById('list');box.innerHTML=spots.map((p,i)=>{const done=!!s[p.id]&&!!s[p.manhole];const dist=current?Math.round(hav(current.lat,current.lng,p.lat,p.lng)):null;const near=dist!==null&&dist<=RADIUS;return `<article class="spot ${done?'ok':''}"><div class="spotTop"><span class="type">${p.type}</span><span class="state">${done?'GET ✓':near?'CHECK-IN READY':'LOCKED'}</span></div><h3>${p.name}</h3><p>${p.desc}</p><div class="meta"><span class="chip">GPS ${RADIUS}m</span><span class="chip">${p.mode==='official-card'?'公式カード配布拠点':'CITY GATE'}</span>${p.mode==='provisional'?'<span class="chip warn">座標は周辺暫定</span>':''}</div><div class="distance">${dist===null?'現在地を取得すると距離を表示':`現在地から約 ${dist.toLocaleString()}m`}</div><button class="check" data-i="${i}" ${done||!near?'disabled':''}>${done?'取得済み':'CHECK-INしてKEY取得'}</button></article>`}).join('');box.querySelectorAll('.check').forEach(b=>b.onclick=()=>check(Number(b.dataset.i)))}
function check(i){const p=spots[i];if(!current)return;const d=hav(current.lat,current.lng,p.lat,p.lng);if(d>RADIUS){toast('対象地点から離れています');return}const s=read();s[p.id]=true;s[p.manhole]=true;if(p.id==='tenma')s.tenmaWater=true;write(s);toast(`${p.name}｜KEY取得`);render();document.getElementById('base').contentWindow.location.reload()}
function locate(){if(!navigator.geolocation){document.getElementById('gpsStatus').textContent='位置情報：この端末では利用できません';return}document.getElementById('gpsStatus').textContent='位置情報：取得中…';navigator.geolocation.getCurrentPosition(pos=>{current={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy};document.getElementById('gpsStatus').textContent=`位置情報：取得済み｜精度 ±${Math.round(pos.coords.accuracy)}m`;render()},err=>{document.getElementById('gpsStatus').textContent='位置情報：取得できません（設定を確認）';toast('位置情報の許可が必要です')},{enableHighAccuracy:true,timeout:12000,maximumAge:10000})}
document.getElementById('gpsBtn').onclick=()=>{document.getElementById('panel').classList.add('on');document.getElementById('panel').setAttribute('aria-hidden','false');render();locate()};document.getElementById('back').onclick=()=>{document.getElementById('panel').classList.remove('on');document.getElementById('panel').setAttribute('aria-hidden','true')};render();
</script>
</body>
</html>
