<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050403"><title>S.u.G QUEST｜PERSON ART V7</title><style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head>
<body>
<iframe id="app" src="./quest-transport-map-v6-real-art.html?v=person-art-v7-20260907"></iframe>
<script>
const app=document.getElementById('app');
function reachV5(){
  const v6=app.contentDocument;if(!v6)return null;
  const inner=v6.getElementById('app');if(!inner||!inner.contentDocument)return null;
  return inner.contentDocument;
}
function install(){
  const d=reachV5();if(!d||d.querySelector('[data-person-art-v7]'))return false;
  const marker=d.createElement('meta');marker.dataset.personArtV7='';d.head.appendChild(marker);
  const s=d.createElement('style');
  s.textContent=`
    .art[data-mark="太"]:before{background-image:linear-gradient(180deg,#0000 42%,#050403e8 94%),url('./assets/quest/taishi-person-card-scenes-20260905.webp?v=person-art-v7');background-size:500% auto;background-position:0% 0%;background-repeat:no-repeat}
    .art[data-mark="太"]:after{display:none}
    .art[data-mark="天"]:before{background-image:linear-gradient(180deg,#0000 42%,#050403e8 94%),url('./assets/quest/tenma-michizane-20260906.webp?v=person-art-v7');background-size:cover;background-position:center top;background-repeat:no-repeat}
    .art[data-mark="天"]:after{display:none}
    .art[data-mark="太"],.art[data-mark="天"]{box-shadow:inset 0 0 40px #0008,0 7px 20px #0008}
    .art[data-mark="太"] .crest{background:#080705dd;color:#ffe6a6}
    .art[data-mark="天"] .crest{font-size:0;background:#080705dd url('./assets/quest/tenma-symbol-tenjin-ume-20260906.svg?v=person-art-v7') center/72% 72% no-repeat}
    .miniArt.realTaishi{background-image:linear-gradient(180deg,#0000 42%,#050403e8 94%),url('./assets/quest/taishi-person-card-scenes-20260905.webp?v=person-art-v7');background-size:500% auto;background-position:0% 0%;background-repeat:no-repeat;color:transparent}
    .miniArt.realTenma{background-image:linear-gradient(180deg,#0000 42%,#050403e8 94%),url('./assets/quest/tenma-michizane-20260906.webp?v=person-art-v7');background-size:cover;background-position:center top;background-repeat:no-repeat;color:transparent}
  `;
  d.head.appendChild(s);
  function tagMini(){
    d.querySelectorAll('.miniCard').forEach(card=>{
      const h=card.querySelector('h3'),art=card.querySelector('.miniArt');if(!h||!art)return;
      const name=h.textContent.trim();
      if(name==='太子')art.classList.add('realTaishi');
      if(name==='天満')art.classList.add('realTenma');
    });
  }
  tagMini();
  new MutationObserver(tagMini).observe(d.body,{childList:true,subtree:true});
  return true;
}
app.addEventListener('load',()=>{let n=0;const t=setInterval(()=>{n++;if(install()||n>40)clearInterval(t)},150)});
</script>
</body></html>
