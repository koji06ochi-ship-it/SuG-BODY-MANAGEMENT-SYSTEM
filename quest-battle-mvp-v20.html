<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03050a">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<title>S.u.G QUEST｜BATTLE MVP V20</title>
<style>
:root{
  --bg:#03050a;--panel:#080b13;--panel2:#0d1019;--line:#6d5228;
  --gold:#d9b45e;--gold2:#ffe5a2;--ink:#f8f2e5;--muted:#aaa291;
  --green:#72e69a;--red:#ff786f;--blue:#6ec9ec;--purple:#b99af4;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
.battleLauncher{position:fixed;z-index:5000;right:12px;top:calc(12px + env(safe-area-inset-top));border:1px solid #d0a64b;border-radius:999px;padding:10px 13px;background:linear-gradient(145deg,#251a08,#080704);color:#ffe39b;font-size:10px;font-weight:1000;letter-spacing:.07em;box-shadow:0 8px 24px #000c,0 0 20px #d5a8442c}
.battleLauncher b{color:#82eda3}
.battleLayer{position:fixed;z-index:6000;inset:0;display:none;overflow:auto;background:radial-gradient(circle at 50% -5%,#15233b 0,#080a11 34%,#020306 76%);padding:calc(10px + env(safe-area-inset-top)) 12px calc(28px + env(safe-area-inset-bottom))}
.battleLayer.on{display:block}
.shell{width:min(440px,100%);margin:0 auto}
.topbar{position:sticky;top:calc(-10px - env(safe-area-inset-top));z-index:10;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:10px 0 12px;background:linear-gradient(#05070ddd 75%,#05070d00);backdrop-filter:blur(8px)}
.backBtn,.iconBtn{width:42px;height:42px;border:0;background:none;color:var(--gold2);font-size:30px}
.brand{text-align:center}.brand b{display:block;color:var(--gold2);font:700 20px Georgia,"Yu Mincho",serif;letter-spacing:.04em}.brand span{display:block;margin-top:2px;color:#8fa1b8;font-size:7px;font-weight:900;letter-spacing:.2em}
.screen{animation:fade .22s ease}@keyframes fade{from{opacity:.25;transform:translateY(5px)}to{opacity:1;transform:none}}
.eyebrow{color:var(--gold);font-size:8px;font-weight:1000;letter-spacing:.18em}
.heroIntro{position:relative;overflow:hidden;margin-top:5px;padding:18px 16px;border:1px solid #7a5c2b;border-radius:19px;background:linear-gradient(145deg,#171106,#090b12 58%,#05070c);box-shadow:0 18px 46px #0008}
.heroIntro:after{content:"";position:absolute;inset:auto -45px -68px auto;width:180px;height:180px;border:1px solid #d5a94a25;border-radius:50%;box-shadow:0 0 0 28px #d5a94a0b,0 0 0 56px #d5a94a07}
.heroIntro h1{position:relative;z-index:1;margin:6px 0 7px;color:#fff0c2;font:700 29px/1.08 Georgia,"Yu Mincho",serif}.heroIntro p{position:relative;z-index:1;margin:0;color:#c6beaf;font-size:10px;line-height:1.7}
.modeChips{position:relative;z-index:1;display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.modeChips span{padding:5px 7px;border:1px solid #4f432d;border-radius:999px;background:#06070bcc;color:#c9b888;font-size:7px;font-weight:900}
.deckHead{display:flex;justify-content:space-between;align-items:end;margin:18px 2px 8px}.deckHead h2{margin:0;color:#f0d58f;font-size:12px;letter-spacing:.08em}.deckHead span{color:#8c887f;font-size:8px}
.deck{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.deckCard{position:relative;min-width:0;overflow:hidden;border:1px solid #584624;border-radius:11px;background:linear-gradient(160deg,#121520,#07090f);box-shadow:0 8px 18px #0007}
.deckArt{height:83px;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 50% 28%,var(--card-glow,#6f572e),#08090e 72%);color:#ffe3a0;font:700 29px Georgia,"Yu Mincho",serif}
.deckArt.masashige{background-image:linear-gradient(180deg,#0000 35%,#06070ded 93%),url('./assets/quest/chihaya-masashige-20260905.png?v=battle-v20');background-size:cover;background-position:center 24%;color:transparent}
.deckCard.locked .deckArt{filter:grayscale(1);opacity:.34}.deckCard.locked:after{content:"LOCKED";position:absolute;inset:34px 3px auto;text-align:center;color:#ddd6c9;font-size:7px;font-weight:1000;letter-spacing:.12em}
.deckMeta{padding:7px 5px 8px}.deckMeta b{display:block;overflow:hidden;color:#f1ddb0;font-size:8px;line-height:1.2;white-space:nowrap;text-overflow:ellipsis}.deckMeta span{display:block;margin-top:3px;color:#908b80;font-size:6px;line-height:1.25}
.bossPreview{display:grid;grid-template-columns:72px 1fr;gap:11px;align-items:center;margin-top:12px;padding:11px;border:1px solid #613833;border-radius:14px;background:linear-gradient(135deg,#180b0a,#09090e)}
.bossSeal{height:72px;border:1px solid #81433e;border-radius:12px;display:grid;place-items:center;background:radial-gradient(circle,#7f2a24,#120706 70%);color:#ffe1cb;font:700 34px Georgia,"Yu Mincho",serif}.bossPreview h3{margin:3px 0;color:#ffd8c5;font:700 17px Georgia,"Yu Mincho",serif}.bossPreview p{margin:0;color:#a89d93;font-size:8px;line-height:1.55}
.primary,.secondary,.danger{width:100%;margin-top:11px;padding:14px;border-radius:12px;font-weight:1000;letter-spacing:.05em}.primary{border:1px solid #f4d785;background:linear-gradient(#f3d986,#ae7d25);color:#171006;box-shadow:0 10px 25px #0008}.secondary{border:1px solid #65502a;background:#0b0c10;color:#e7c46e}.danger{border:1px solid #623b37;background:#110807;color:#d9958f;font-size:9px}.note{margin:12px 2px 0;color:#797b80;font-size:7px;line-height:1.6}
.unlockBox{margin-top:13px;padding:15px;border:1px dashed #725b30;border-radius:14px;text-align:center;background:#090a0d}.unlockBox b{display:block;color:#f0d48f;font:700 18px Georgia,"Yu Mincho",serif}.unlockBox p{margin:7px 0 0;color:#a7a094;font-size:9px;line-height:1.6}
.saved{margin-top:10px;padding:9px 11px;border:1px solid #315e42;border-radius:10px;color:#9cf0b3;background:#07110b;font-size:8px;font-weight:900}
.hud{margin-top:4px;padding:12px;border:1px solid #544327;border-radius:15px;background:#070910cc}.round{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.round b{color:#f2d27d;font-size:10px}.round span{color:#87909e;font-size:8px}.fighters{display:grid;grid-template-columns:1fr 36px 1fr;align-items:center;gap:7px}.fighter{text-align:center}.fighterName{height:26px;color:#eadcbf;font-size:9px;font-weight:900}.fighterHp{height:8px;overflow:hidden;border-radius:999px;background:#1b1d22}.fighterHp i{display:block;height:100%;width:100%;transition:width .35s ease;background:linear-gradient(90deg,#3fb463,#87eda2)}.fighter.enemy .fighterHp i{background:linear-gradient(90deg,#8f2723,#ff7b69)}.hpText{margin-top:4px;color:#a59d90;font:700 8px monospace}.vs{color:#806d4b;text-align:center;font:700 11px Georgia,serif}
.arena{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.portrait{position:relative;height:150px;overflow:hidden;border:1px solid #574628;border-radius:15px;background:#08090d}.portrait.hero{background-image:linear-gradient(180deg,#0000 35%,#06070dfa 93%),url('./assets/quest/chihaya-masashige-20260905.png?v=battle-v20');background-size:cover;background-position:center 25%}.portrait.enemy{background:radial-gradient(circle at 50% 31%,#7c2b26,#210a09 38%,#060609 76%)}.portrait.enemy:before{content:"六";position:absolute;inset:24px 0 auto;text-align:center;color:#ffcfb6;font:700 72px Georgia,"Yu Mincho",serif;text-shadow:0 0 28px #ff493c55}.portrait .tag{position:absolute;left:8px;right:8px;bottom:8px;padding:6px;border:1px solid #7a6030;border-radius:8px;background:#050609dc;text-align:center;color:#e8cc82;font-size:7px;font-weight:900}.statusLine{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;min-height:25px}.statusLine span{padding:5px 7px;border:1px solid #39404b;border-radius:999px;background:#080a10;color:#aeb7c5;font-size:7px;font-weight:900}.statusLine .on{border-color:#71602f;color:#efd17c}.apBox{display:flex;justify-content:space-between;align-items:center;margin-top:7px;padding:8px 9px;border:1px solid #354151;border-radius:9px;background:#070a10;color:#aab4c4;font-size:8px}.apBox b{color:#8fd5f1;font:900 10px monospace}
.battleCards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}.battleCard{position:relative;min-width:0;min-height:128px;padding:0;border:1px solid #5c4928;border-radius:11px;overflow:hidden;background:#080a0f;color:#fff;text-align:left;transition:.14s}.battleCard:active{transform:scale(.96)}.battleCard:disabled{opacity:.35;filter:grayscale(.7)}.battleCard .miniArt{height:64px;display:grid;place-items:center;background:radial-gradient(circle,var(--card-glow,#66522e),#07080c 72%);color:#ffe0a0;font:700 25px Georgia,"Yu Mincho",serif}.battleCard .miniArt.masashige{background-image:linear-gradient(180deg,#0000 36%,#06070def 92%),url('./assets/quest/chihaya-masashige-20260905.png?v=battle-v20');background-size:cover;background-position:center 24%;color:transparent}.battleCard .cardText{padding:6px 5px}.battleCard b{display:block;color:#f2dfb4;font-size:7px;line-height:1.25}.battleCard small{display:block;margin-top:3px;color:#9c978c;font-size:6px;line-height:1.25}.battleCard .cost{position:absolute;right:4px;top:4px;min-width:18px;padding:3px;border:1px solid #7192a5;border-radius:999px;background:#071019e8;text-align:center;color:#9edcf4;font:900 7px monospace}.battleCard.used:after{content:"USED";position:absolute;inset:0;display:grid;place-items:center;background:#020306bb;color:#bbb3a5;font-size:8px;font-weight:1000;letter-spacing:.12em}
.log{margin-top:9px;padding:9px 10px;border:1px solid #30343e;border-radius:10px;background:#05070b;max-height:92px;overflow:auto}.log p{margin:0 0 5px;color:#aeb4bd;font-size:8px;line-height:1.45}.log p:first-child{color:#f0d17b}.log p:last-child{margin-bottom:0}
.turnBtn{margin-top:9px;padding:12px;border:1px solid #67522c;border-radius:11px;background:linear-gradient(145deg,#171108,#090a0e);color:#e9c86e;font-weight:1000;width:100%}
.result{text-align:center;margin-top:9px;padding:18px 14px;border:1px solid #82642d;border-radius:18px;background:radial-gradient(circle at 50% 0,#3b2a0c,#0a0b10 45%,#040509 80%)}.result .big{margin:6px 0;color:#ffe49d;font:700 34px Georgia,"Yu Mincho",serif}.result p{margin:0;color:#bcb3a3;font-size:9px;line-height:1.65}.rewardCard{width:min(250px,75vw);aspect-ratio:3/4.7;margin:15px auto;padding:14px;border:2px solid #d2a448;border-radius:19px;background:radial-gradient(circle at 50% 12%,#73521b,#171006 42%,#050506 76%);box-shadow:0 16px 40px #000c,0 0 28px #d0a23f33;display:flex;flex-direction:column;justify-content:space-between}.rewardCard .rewardSeal{height:62%;display:grid;place-items:center;border:1px solid #947035;border-radius:13px;background:radial-gradient(circle,#71332a,#100807 70%);color:#ffe2b0;font:700 74px Georgia,"Yu Mincho",serif}.rewardCard h2{margin:0;color:#fff0bd;font:700 22px Georgia,"Yu Mincho",serif}.rewardCard small{color:#bba66d;font-size:7px;letter-spacing:.12em}
.lose{border-color:#653834;background:radial-gradient(circle at 50% 0,#32110f,#09090e 48%,#040509 80%)}
.toast{position:fixed;z-index:7000;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));width:min(390px,90vw);transform:translate(-50%,25px);padding:11px 13px;border:1px solid #5b8c68;border-radius:12px;background:#071109f3;color:#bdf8c9;font-size:9px;font-weight:900;opacity:0;pointer-events:none;transition:.22s}.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:360px){.deckArt{height:70px}.portrait{height:130px}.battleCard{min-height:119px}.battleCard .miniArt{height:58px}.heroIntro h1{font-size:26px}}
</style>
</head>
<body>
<iframe id="app" src="./quest.html?v=battle-mvp-v20-iphone-direct-20260908" allow="geolocation"></iframe>
<button id="battleLauncher" class="battleLauncher">⚔ BATTLE <b>MVP</b></button>
<section id="battleLayer" class="battleLayer" aria-hidden="true">
  <div class="shell">
    <header class="topbar">
      <button id="closeBattle" class="backBtn" aria-label="閉じる">‹</button>
      <div class="brand"><b>S.u.G QUEST</b><span>CARD BATTLE / FIELD TEST</span></div>
      <span></span>
    </header>
    <main id="screen"></main>
  </div>
</section>
<div id="toast" class="toast"></div>
<script>
const STORAGE='sugQuestBattleMvpV20';
const PLAYER_MAX=80,BOSS_MAX=120;
const CARD_DEFS=[
  {id:'masashige',type:'BATTLE 武将',name:'楠木正成',effect:'敵へ攻撃',mark:'楠',glow:'#6f3d28',art:'masashige'},
  {id:'egg',type:'SUPPORT / FOOD',name:'河南の卵',effect:'体力＋24',mark:'卵',glow:'#806a35'},
  {id:'kintetsu',type:'SUPPORT / TRANSPORT',name:'近鉄',effect:'移動コスト−1',mark:'鉄',glow:'#624785'},
  {id:'hakkenya',type:'駅守将 / RIVER GATE',name:'八軒家浜',effect:'水軍援護を強化',mark:'川',glow:'#2d647d'},
  {id:'kunishige',type:'SUPPORT / EQUIPMENT',name:'刀剣 國重',effect:'正成の攻撃＋8',mark:'刀',glow:'#72542e'}
];
const layer=document.getElementById('battleLayer');
const screen=document.getElementById('screen');
const toastBox=document.getElementById('toast');
let battle=null,toastTimer=null;

function freshStore(){return {unlocked:false,wins:0,bestTurns:null,victoryCard:false,lastPlayed:null}}
function loadStore(){try{return {...freshStore(),...JSON.parse(localStorage.getItem(STORAGE)||'{}')}}catch(e){return freshStore()}}
function saveStore(v){localStorage.setItem(STORAGE,JSON.stringify(v))}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){clearTimeout(toastTimer);toastBox.textContent=msg;toastBox.classList.add('on');toastTimer=setTimeout(()=>toastBox.classList.remove('on'),1900)}
function openBattle(){layer.classList.add('on');layer.setAttribute('aria-hidden','false');renderDeck()}
function closeBattle(){layer.classList.remove('on');layer.setAttribute('aria-hidden','true')}

function deckCard(c,unlocked){return `<div class="deckCard ${unlocked?'':'locked'}"><div class="deckArt ${c.art||''}" style="--card-glow:${c.glow}">${esc(c.mark)}</div><div class="deckMeta"><b>${esc(c.name)}</b><span>${esc(c.type)}<br>${esc(c.effect)}</span></div></div>`}

function renderDeck(){
  const s=loadStore();
  screen.innerHTML=`
    <section class="screen">
      <div class="heroIntro">
        <div class="eyebrow">BATTLE MVP 01 / ONE BATTLE</div>
        <h1>集めたカードを、<br>戦力に変える。</h1>
        <p>スタンプで終わらない。現地で得た武将・食・交通・駅守将・装備を組み合わせ、六波羅追討軍を突破する機能実験。</p>
        <div class="modeChips"><span>5 CARD DECK</span><span>TURN BATTLE</span><span>LOCAL SAVE</span><span>FIELD TEST</span></div>
      </div>
      <div class="deckHead"><h2>PILOT LOADOUT｜5</h2><span>${s.unlocked?'取得済み':'未取得'}</span></div>
      <div class="deck">${CARD_DEFS.map(c=>deckCard(c,s.unlocked)).join('')}</div>
      <div class="bossPreview"><div class="bossSeal">六</div><div><div class="eyebrow">BOSS / ROKUHARA</div><h3>六波羅追討軍</h3><p>ゲーム演出用の初回BOSS。史実上の経路・構成は正式版で史料区分を付けて実装。</p></div></div>
      ${s.unlocked?`
        <button id="startBattle" class="primary">この5枚で戦う</button>
        ${s.victoryCard?`<div class="saved">✓ 勝利カード「六波羅追討軍突破」保存済み｜勝利 ${s.wins}回${s.bestTurns?`｜最短 ${s.bestTurns}ターン`:''}</div>`:''}
        <button id="resetData" class="danger">BATTLE MVPの実験データをリセット</button>
      `:`<div class="unlockBox"><b>まず5枚を取得</b><p>本番はGPS・歩数・店舗QUESTで1枚ずつ解放。今回は効果検証のため、実験用デッキを一括取得します。</p></div><button id="claimCards" class="primary">実験用5枚をCARD GET</button>`}
      <p class="note">※効果数値・敵設定・カード画像はMVP用の仮仕様。近鉄・八軒家浜との連携を示すものではありません。家紋は使用していません。</p>
    </section>`;
  document.getElementById('claimCards')?.addEventListener('click',claimCards);
  document.getElementById('startBattle')?.addEventListener('click',startBattle);
  document.getElementById('resetData')?.addEventListener('click',resetData);
}

function claimCards(){const s=loadStore();s.unlocked=true;saveStore(s);renderDeck();toast('5 CARD GET｜バトルデッキを解放しました')}
function resetData(){if(!confirm('BATTLE MVPの勝利回数・取得状態をリセットしますか？'))return;localStorage.removeItem(STORAGE);battle=null;renderDeck();toast('BATTLE MVPをリセットしました')}

function startBattle(){
  battle={turn:1,hp:PLAYER_MAX,boss:BOSS_MAX,ap:2,moveCost:2,attack:18,navy:false,used:{egg:false,kintetsu:false,hakkenya:false,kunishige:false},ended:false,log:['六波羅追討軍が進路を塞いだ。5枚のカードで突破せよ。']};
  renderFight();
}
function pct(v,max){return Math.max(0,Math.min(100,Math.round(v/max*100)))}
function canPay(n){if(battle.ap<n){addLog(`行動力が足りない。必要 ${n} / 残り ${battle.ap}`);return false}battle.ap-=n;return true}
function addLog(msg){battle.log.unshift(msg);battle.log=battle.log.slice(0,7)}
function hitBoss(n,label){battle.boss=Math.max(0,battle.boss-n);addLog(`${label}｜敵へ ${n} DAMAGE`)}

function useCard(id){
  if(!battle||battle.ended)return;
  if(id==='masashige'){
    if(!canPay(battle.moveCost)){renderFight();return}
    const damage=battle.attack+(battle.navy?4:0);
    hitBoss(damage,`楠木正成の攻撃${battle.navy?'＋水軍連携':''}`);
  }
  if(id==='egg'){
    if(battle.used.egg){return}
    if(battle.hp>=PLAYER_MAX){addLog('体力は満タン。河南の卵はまだ温存できる。');renderFight();return}
    if(!canPay(1)){renderFight();return}
    battle.used.egg=true;const before=battle.hp;battle.hp=Math.min(PLAYER_MAX,battle.hp+24);addLog(`河南の卵｜体力を ${battle.hp-before} 回復`);
  }
  if(id==='kintetsu'){
    if(battle.used.kintetsu)return;
    battle.used.kintetsu=true;battle.moveCost=1;addLog('近鉄｜移動コスト 2 → 1。正成が1ターンに2回動ける。');
  }
  if(id==='hakkenya'){
    if(battle.used.hakkenya)return;
    if(!canPay(1)){renderFight();return}
    battle.used.hakkenya=true;battle.navy=true;hitBoss(16,'八軒家浜｜水軍援護');addLog('駅守将効果｜以後、正成の攻撃に水軍連携＋4。');
  }
  if(id==='kunishige'){
    if(battle.used.kunishige)return;
    if(!canPay(1)){renderFight();return}
    battle.used.kunishige=true;battle.attack+=8;addLog('刀剣 國重を装備｜楠木正成の攻撃 18 → 26。');
  }
  if(battle.boss<=0){winBattle();return}
  renderFight();
}

function endTurn(){
  if(!battle||battle.ended)return;
  const damage=14;battle.hp=Math.max(0,battle.hp-damage);addLog(`六波羅追討軍の反撃｜${damage} DAMAGE`);
  if(battle.hp<=0){loseBattle();return}
  battle.turn+=1;battle.ap=2;addLog(`TURN ${battle.turn}｜行動力が2に回復。`);renderFight();
}
function winBattle(){
  battle.ended=true;const s=loadStore();s.wins=(s.wins||0)+1;s.victoryCard=true;s.lastPlayed=Date.now();s.bestTurns=s.bestTurns?Math.min(s.bestTurns,battle.turn):battle.turn;saveStore(s);renderResult(true,s)
}
function loseBattle(){battle.ended=true;renderResult(false,loadStore())}

function battleCard(c){
  let cost='1',used=false,disabled=false;
  if(c.id==='masashige'){cost=String(battle.moveCost);disabled=battle.ap<battle.moveCost}
  if(c.id==='kintetsu'){cost='0';used=battle.used.kintetsu}
  if(c.id==='egg'){used=battle.used.egg;disabled=battle.hp>=PLAYER_MAX||battle.ap<1}
  if(c.id==='hakkenya'){used=battle.used.hakkenya;disabled=battle.ap<1}
  if(c.id==='kunishige'){used=battle.used.kunishige;disabled=battle.ap<1}
  return `<button class="battleCard ${used?'used':''}" data-card="${c.id}" ${used||disabled?'disabled':''} style="--card-glow:${c.glow}"><span class="cost">${cost}</span><div class="miniArt ${c.art||''}">${esc(c.mark)}</div><div class="cardText"><b>${esc(c.name)}</b><small>${esc(c.effect)}</small></div></button>`;
}

function renderFight(){
  screen.innerHTML=`<section class="screen">
    <div class="hud">
      <div class="round"><b>TURN ${battle.turn}</b><span>BOSSを0にすれば勝利</span></div>
      <div class="fighters">
        <div class="fighter"><div class="fighterName">楠木正成</div><div class="fighterHp"><i style="width:${pct(battle.hp,PLAYER_MAX)}%"></i></div><div class="hpText">HP ${battle.hp} / ${PLAYER_MAX}</div></div>
        <div class="vs">VS</div>
        <div class="fighter enemy"><div class="fighterName">六波羅追討軍</div><div class="fighterHp"><i style="width:${pct(battle.boss,BOSS_MAX)}%"></i></div><div class="hpText">HP ${battle.boss} / ${BOSS_MAX}</div></div>
      </div>
    </div>
    <div class="arena"><div class="portrait hero"><span class="tag">BATTLE 武将｜楠木正成</span></div><div class="portrait enemy"><span class="tag">BOSS｜六波羅追討軍</span></div></div>
    <div class="statusLine">
      <span class="${battle.moveCost===1?'on':''}">移動COST ${battle.moveCost}</span>
      <span class="${battle.attack>18?'on':''}">正成ATK ${battle.attack}</span>
      <span class="${battle.navy?'on':''}">水軍連携 ${battle.navy?'ON':'OFF'}</span>
      <span class="${battle.used.egg?'on':''}">卵 ${battle.used.egg?'使用済':'READY'}</span>
    </div>
    <div class="apBox"><span>行動力｜カード右上が消費値</span><b>${battle.ap} / 2</b></div>
    <div class="battleCards">${CARD_DEFS.map(battleCard).join('')}</div>
    <div class="log">${battle.log.map(x=>`<p>${esc(x)}</p>`).join('')}</div>
    <button id="endTurn" class="turnBtn">ターン終了 → 敵の反撃</button>
    <button id="quitBattle" class="secondary">デッキ画面へ戻る</button>
  </section>`;
  screen.querySelectorAll('[data-card]').forEach(b=>b.addEventListener('click',()=>useCard(b.dataset.card)));
  document.getElementById('endTurn').addEventListener('click',endTurn);
  document.getElementById('quitBattle').addEventListener('click',renderDeck);
}

function renderResult(win,s){
  screen.innerHTML=`<section class="screen">
    <div class="result ${win?'':'lose'}">
      <div class="eyebrow">${win?'MISSION COMPLETE':'MISSION FAILED'}</div>
      <div class="big">${win?'VICTORY':'撤退'}</div>
      <p>${win?`TURN ${battle.turn}で六波羅追討軍を突破。<br>集めたカードの効果が勝敗に反映された。`:'体力が尽きた。カードを使う順番を変えて再挑戦。'}</p>
      ${win?`<div class="rewardCard"><small>ACHIEVEMENT / MVP-01</small><div class="rewardSeal">破</div><div><h2>六波羅追討軍突破</h2><small>VICTORY CARD｜保存済み</small></div></div>`:''}
    </div>
    <button id="retry" class="primary">同じ5枚で再戦</button>
    <button id="backDeck" class="secondary">デッキ・取得状況を見る</button>
    ${win?`<div class="saved">✓ 勝利 ${s.wins}回｜最短 ${s.bestTurns}ターン｜この端末に保存済み</div>`:''}
  </section>`;
  document.getElementById('retry').addEventListener('click',startBattle);
  document.getElementById('backDeck').addEventListener('click',renderDeck);
}

document.getElementById('battleLauncher').addEventListener('click',openBattle);
document.getElementById('closeBattle').addEventListener('click',closeBattle);
</script>
</body>
</html>
