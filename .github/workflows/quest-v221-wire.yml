name: QUEST V26.5.221 wire
on:
  push:
    paths:
      - '.github/workflows/quest-v221-wire.yml'
jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Wire V221
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('quest.html')
          s=p.read_text()
          s=s.replace('V26.5.220','V26.5.221').replace('v=26.5.220','v=26.5.221')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add quest.html
          git diff --cached --quiet && exit 0
          git commit -m 'Activate QUEST V26.5.221 gallery reset'
          git push
