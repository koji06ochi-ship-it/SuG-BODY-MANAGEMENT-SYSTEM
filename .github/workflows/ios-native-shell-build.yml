name: iOS native shell build

on:
  push:
    branches:
      - recovery/ios-native-shell
      - main
    paths:
      - 'ios/**'
      - '.github/workflows/ios-native-shell-build.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-native-shell-build.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for iPhone Simulator
        working-directory: ios
        run: |
          xcodebuild \
            -project SuGMember.xcodeproj \
            -scheme SuGMember \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
