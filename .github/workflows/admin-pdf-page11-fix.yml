name: Admin PDF page 11 overlap fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-pdf-page11-fix.yml'

permissions:
  contents: write

jobs:
  fix-page-11:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF/image tools and Japanese font
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pillow
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Rebuild page 11 right side without black enclosure
        run: |
          python - <<'PY'
          import os
          import pathlib
          import pymupdf
          from PIL import Image, ImageDraw, ImageFont

          pdf_path = pathlib.Path('docs/admin/SuG_QUEST_Admin_Final.pdf')
          preview_path = pathlib.Path('docs/admin/SuG_QUEST_Admin_Final_page11.png')
          report_path = pathlib.Path('docs/admin/SuG_QUEST_Admin_Page11_fix.txt')
          work_png = pathlib.Path('docs/admin/.page11_work.png')

          font_candidates = [
              '/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc',
              '/usr/share/fonts/opentype/noto/NotoSansCJKjp-Regular.otf',
              '/usr/share/fonts/opentype/noto/NotoSerifCJK-Regular.ttc',
          ]
          font_file = next((p for p in font_candidates if os.path.exists(p)), None)
          if not font_file:
              raise SystemExit('Japanese Noto CJK font not found')

          doc = pymupdf.open(pdf_path)
          if len(doc) < 11:
              raise SystemExit(f'PDF has only {len(doc)} pages')
          page = doc[10]
          page_rect = page.rect

          # Page 11 is rasterized, so edit the rendered page directly.
          scale = 2.5
          pix = page.get_pixmap(matrix=pymupdf.Matrix(scale, scale), alpha=False)
          img = Image.frombytes('RGB', (pix.width, pix.height), pix.samples)
          W, H = img.size
          gray = img.convert('L')
          gp = gray.load()

          # Detect the large dark panel on the right in the middle of the page.
          sx0, sx1 = int(W * 0.50), int(W * 0.995)
          sy0, sy1 = int(H * 0.18), int(H * 0.80)
          search_w = sx1 - sx0

          active_rows = []
          for y in range(sy0, sy1):
              dark = 0
              for x in range(sx0, sx1, 2):
                  if gp[x, y] < 70:
                      dark += 1
              if dark >= (search_w / 2) * 0.22:
                  active_rows.append(y)

          def groups(vals):
              if not vals:
                  return []
              out = []
              a = b = vals[0]
              for v in vals[1:]:
                  if v <= b + 1:
                      b = v
                  else:
                      out.append((a, b))
                      a = b = v
              out.append((a, b))
              return out

          row_groups = [g for g in groups(active_rows) if g[1] - g[0] > H * 0.08]
          if row_groups:
              py0, py1 = max(row_groups, key=lambda g: g[1] - g[0])
          else:
              py0, py1 = int(H * 0.34), int(H * 0.68)

          active_cols = []
          panel_h_probe = max(1, py1 - py0 + 1)
          for x in range(sx0, sx1):
              dark = 0
              for y in range(py0, py1 + 1, 2):
                  if gp[x, y] < 70:
                      dark += 1
              if dark >= (panel_h_probe / 2) * 0.34:
                  active_cols.append(x)

          col_groups = [g for g in groups(active_cols) if g[1] - g[0] > W * 0.10]
          if col_groups:
              px0, px1 = max(col_groups, key=lambda g: g[1] - g[0])
          else:
              px0, px1 = int(W * 0.62), int(W * 0.985)

          # Expand slightly to include rounded corners / anti-aliasing.
          mx = max(4, int(W * 0.004))
          my = max(4, int(H * 0.005))
          px0 = max(0, px0 - mx)
          px1 = min(W - 1, px1 + mx)
          py0 = max(0, py0 - my)
          py1 = min(H - 1, py1 + my)
          panel_w = px1 - px0 + 1
          panel_h = py1 - py0 + 1

          # Safety check: this must be a substantial right-side panel, not a random word.
          if panel_w < W * 0.18 or panel_h < H * 0.14 or px0 < W * 0.48:
              raise SystemExit(f'Unsafe panel detection: {(px0, py0, px1, py1)} on {(W, H)}')

          draw = ImageDraw.Draw(img)
          white = (255, 255, 255)
          dark_text = (23, 28, 38)
          gold = (188, 145, 47)
          box_fill = (247, 248, 250)
          box_outline = (222, 226, 232)

          # Remove the black panel completely. No replacement enclosure/frame.
          draw.rectangle((px0, py0, px1, py1), fill=white)

          # The old panel was covering the right half of two data boxes.
          # Clean and rebuild those two boxes so the diagram is complete again.
          data_x0 = max(int(W * 0.40), int(px0 - panel_w * 0.40))
          data_x1 = int(px0 + panel_w * 0.16)
          data_x1 = min(data_x1, int(px0 + panel_w * 0.20))
          box_h = max(36, int(panel_h * 0.145))
          box1_y0 = int(py0 - panel_h * 0.025)
          box2_y0 = int(py0 + panel_h * 0.225)
          clean_x0 = max(0, data_x0 - 8)
          clean_x1 = min(W - 1, data_x1 + 8)
          clean_y0 = max(0, box1_y0 - 8)
          clean_y1 = min(H - 1, box2_y0 + box_h + 8)
          draw.rectangle((clean_x0, clean_y0, clean_x1, clean_y1), fill=white)

          radius = max(8, int(box_h * 0.18))
          for y0, label in [(box1_y0, '活動量'), (box2_y0, '心拍・安静時心拍')]:
              rect = (data_x0, y0, data_x1, y0 + box_h)
              draw.rounded_rectangle(rect, radius=radius, fill=box_fill, outline=box_outline, width=max(1, int(W * 0.0012)))
              fsize = max(18, int(box_h * 0.34))
              font = ImageFont.truetype(font_file, fsize)
              bb = draw.textbbox((0, 0), label, font=font)
              tw, th = bb[2] - bb[0], bb[3] - bb[1]
              tx = data_x0 + (data_x1 - data_x0 - tw) / 2
              ty = y0 + (box_h - th) / 2 - bb[1]
              draw.text((tx, ty), label, font=font, fill=dark_text)

          # Rebuild the arrow toward the selected-warrior section.
          text_x0 = int(px0 + panel_w * 0.43)
          text_x1 = int(px1 - panel_w * 0.055)
          arrow_y = int(py0 + panel_h * 0.51)
          arrow_x0 = int(data_x1 + panel_w * 0.055)
          arrow_x1 = int(text_x0 - panel_w * 0.08)
          if arrow_x1 > arrow_x0 + 20:
              lw = max(4, int(H * 0.004))
              draw.line((arrow_x0, arrow_y, arrow_x1, arrow_y), fill=gold, width=lw)
              ah = max(9, int(panel_h * 0.035))
              draw.polygon([(arrow_x1, arrow_y), (arrow_x1 - ah, arrow_y - ah), (arrow_x1 - ah, arrow_y + ah)], fill=gold)

          # Unboxed text section at the far right.
          heading_size = max(22, int(panel_h * 0.070))
          body_size = max(15, int(panel_h * 0.045))
          heading_font = ImageFont.truetype(font_file, heading_size)
          body_font = ImageFont.truetype(font_file, body_size)
          text_y = int(py0 + panel_h * 0.06)
          draw.text((text_x0, text_y), '選んだ武将', font=heading_font, fill=gold)

          body_lines = [
              '元気 / 疲労 / 回復不足',
              '行動力 / スタミナ / 成長',
              '今日のおすすめQUEST',
          ]
          line_gap = int(body_size * 1.65)
          body_y = int(text_y + heading_size * 1.75)
          for i, line in enumerate(body_lines):
              # Shrink only if a line would exceed the right margin.
              font = body_font
              bb = draw.textbbox((0, 0), line, font=font)
              if bb[2] - bb[0] > text_x1 - text_x0:
                  small = max(12, int(body_size * 0.82))
                  font = ImageFont.truetype(font_file, small)
              draw.text((text_x0, body_y + i * line_gap), line, font=font, fill=dark_text)

          # Save the rebuilt page image and overlay it over the old rasterized page.
          img.save(work_png, format='PNG', optimize=True)
          page.insert_image(page_rect, filename=str(work_png), overlay=True)

          temp_pdf = pdf_path.with_name(pdf_path.stem + '_tmp.pdf')
          doc.save(temp_pdf, garbage=4, deflate=True, clean=True)
          doc.close()
          temp_pdf.replace(pdf_path)
          work_png.unlink(missing_ok=True)

          # Re-render page 11 from the saved PDF: this is the authoritative preview.
          check = pymupdf.open(pdf_path)
          check_page = check[10]
          check_pix = check_page.get_pixmap(matrix=pymupdf.Matrix(2.0, 2.0), alpha=False)
          check_pix.save(preview_path)

          # Validate that the former panel region is no longer a large black block.
          scale_back = 2.0 / scale
          clip = pymupdf.Rect(px0 / scale, py0 / scale, px1 / scale, py1 / scale)
          cp = check_page.get_pixmap(matrix=pymupdf.Matrix(1.0, 1.0), clip=clip, alpha=False)
          s = cp.samples
          n = cp.n
          dark_count = 0
          total = cp.width * cp.height
          for i in range(0, len(s), n):
              if (s[i] + s[i + 1] + s[i + 2]) / 3 < 65:
                  dark_count += 1
          dark_ratio = dark_count / max(total, 1)
          check.close()
          if dark_ratio > 0.20:
              raise SystemExit(f'Validation failed: former panel remains too dark ({dark_ratio:.4f})')

          report = [
              'Page 11 raster rebuild completed.',
              f'render_size={W}x{H}',
              f'detected_old_panel_px={(px0, py0, px1, py1)}',
              f'rebuilt_data_boxes_px={(data_x0, box1_y0, data_x1, box2_y0 + box_h)}',
              f'unboxed_text_origin_px={(text_x0, text_y)}',
              f'former_panel_dark_ratio_after={dark_ratio:.4f}',
              'style=white background; no enclosing black rectangle; right data boxes restored',
          ]
          report_path.write_text('\n'.join(report) + '\n', encoding='utf-8')
          print(report_path.read_text(encoding='utf-8'))
          PY

      - name: Commit corrected PDF and page 11 preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/admin/SuG_QUEST_Admin_Final.pdf \
                  docs/admin/SuG_QUEST_Admin_Final_page11.png \
                  docs/admin/SuG_QUEST_Admin_Page11_fix.txt
          git commit -m 'fix: rebuild admin PDF page 11 without overlapping box'
          git push
