name: EVOLINK 7-screen existing-signature TestFlight
on:
  push:
    branches: ['sug/evolink-7screen-testflight-20261115']
    paths: ['.github/workflows/evolink-7screen-20261115.yml','ci/evolink-20261115/**']
permissions:
  contents: write
concurrency:
  group: evolink-7screen-20261115
  cancel-in-progress: false
jobs:
  testflight:
    if: github.repository == 'koji06ochi-ship-it/SuG-BODY-MANAGEMENT-SYSTEM' && github.actor == 'koji06ochi-ship-it' && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 45
    env:
      EVOLINK_BUILD_NUMBER: '4'
      ASC_API_KEY_ID: MM98J638B7
      ASC_API_ISSUER_ID: d3a981e0-7557-4223-a67f-d026debee303
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      SUG_SIX_BUILD_ASSET_KEY: ${{ secrets.SUG_SIX_BUILD_ASSET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated existing-CI dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/evolink-python"
          "$RUNNER_TEMP/evolink-python/bin/python" -m pip install --quiet --disable-pip-version-check 'cryptography==50.0.2' 'PyJWT==2.10.1' 'requests==2.32.5'
          echo "$RUNNER_TEMP/evolink-python/bin" >> "$GITHUB_PATH"
      - name: Authenticate original candidate and reuse existing certificate/profile
        run: python3 ci/evolink-20261115/release.py prepare
      - name: Archive and export EVOLINK only
        run: bash ci/evolink-20261115/build.sh
      - name: Verify exported IPA signature and all original WebContent
        run: python3 ci/evolink-20261115/release.py verify
      - name: Upload verified IPA once
        run: python3 ci/evolink-20261115/release.py upload
      - name: Check Apple processing and attach existing internal group
        run: python3 ci/evolink-20261115/release.py processing
      - name: Preserve evidence and encrypted IPA without Actions artifact storage
        if: always()
        run: |
          python3 ci/evolink-20261115/release.py preserve
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ci/evolink-20261115/results/
          if ! git diff --cached --quiet; then
            git commit -m 'EVOLINK build 4 execution evidence and encrypted IPA [skip ci]'
            RESULT_BRANCH="sug/evolink-7screen-testflight-20261115-results-${GITHUB_RUN_ID}"
            git push origin "HEAD:refs/heads/$RESULT_BRANCH"
            echo "Evidence: https://github.com/$GITHUB_REPOSITORY/tree/$RESULT_BRANCH/ci/evolink-20261115/results" >> "$GITHUB_STEP_SUMMARY"
          fi
