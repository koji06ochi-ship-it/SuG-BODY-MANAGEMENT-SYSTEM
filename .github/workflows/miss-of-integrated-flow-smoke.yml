name: MISS OF integrated flow smoke

on:
  push:
    branches:
      - body/miss-of-integrated-flow
    paths:
      - 'apps/body/miss-of-integrated-flow-v27.81.js'
      - 'apps/body/miss-of-integrated-flow-v27.81.css'
      - 'apps/body/health-bridge-v27.64.js'
      - 'apps/body/assets/miss/**'
      - 'tests/miss-of-integrated-flow-smoke.mjs'
      - 'tests/miss-of-runtime-playwright.mjs'
      - '.github/workflows/miss-of-integrated-flow-smoke.yml'
  pull_request:
    paths:
      - 'apps/body/miss-of-integrated-flow-v27.81.js'
      - 'apps/body/miss-of-integrated-flow-v27.81.css'
      - 'apps/body/health-bridge-v27.64.js'
      - 'apps/body/assets/miss/**'
      - 'tests/miss-of-integrated-flow-smoke.mjs'
      - 'tests/miss-of-runtime-playwright.mjs'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check apps/body/miss-of-integrated-flow-v27.81.js
          node --check apps/body/health-bridge-v27.64.js
          node --check tests/miss-of-runtime-playwright.mjs
      - name: Integrated flow contract
        run: node tests/miss-of-integrated-flow-smoke.mjs
      - name: Browser runtime dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser runtime 390px
        run: |
          python3 -m http.server 4173 > /tmp/sug-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/apps/body/best-of-miss-demo-v27.76.html >/dev/null; then break; fi
            sleep 0.5
          done
          node tests/miss-of-runtime-playwright.mjs
      - name: Diff whitespace
        run: git diff --check HEAD~1 HEAD
