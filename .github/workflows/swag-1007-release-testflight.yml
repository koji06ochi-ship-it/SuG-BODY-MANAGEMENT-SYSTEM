name: S.u.G SWAG Build 1007 - Signed Release & TestFlight Upload

on:
  push:
    branches:
      - 'sug/swag-1007-appstore'
  workflow_dispatch:
    inputs:
      build_number:
        description: 'iOS Build Number (CURRENT_PROJECT_VERSION)'
        required: true
        default: '1007'
      upload_to_testflight:
        description: 'Upload signed IPA to App Store Connect / TestFlight'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sug-swag-1007-release
  cancel-in-progress: false

jobs:
  build-and-upload-swag:
    if: >-
      github.ref == 'refs/heads/sug/swag-1007-appstore' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[swag-build-1007]'))
    runs-on: macos-26
    timeout-minutes: 12
    env:
      BUILD_NUMBER: ${{ github.event_name == 'push' && '1007' || inputs.build_number }}
      APP_BUNDLE_ID: jp.sugosaka.member
      APP_SCHEME: SuGBODY
      APP_PROJECT: ios-delivery/BODY/iOS/SuGBODY.xcodeproj
      ARCHIVE_PATH: ${{ github.workspace }}/build/SuGSWAG.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export
      ASC_API_KEY_ID: MM98J638B7
      ASC_API_ISSUER_ID: d3a981e0-7557-4223-a67f-d026debee303
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Run static CI & syntax validation
        run: |
          set -euo pipefail
          node ios-delivery/ci/validate.mjs --app BODY
          node ios-delivery/ci/navigation-race.test.mjs
          while IFS= read -r file; do plutil -lint "$file"; done < <(find ios-delivery/BODY/iOS -type f \( -name '*.plist' -o -name '*.entitlements' -o -name '*.xcprivacy' -o -name 'project.pbxproj' \))

      - name: Normalize App Store Connect private key
        run: python3 ios/scripts/normalize_asc_key.py

      - name: Install App Store Connect API dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/sug-python"
          "$RUNNER_TEMP/sug-python/bin/python" -m pip install --quiet --disable-pip-version-check pyjwt cryptography requests
          echo "$RUNNER_TEMP/sug-python/bin" >> "$GITHUB_PATH"

      - name: Prepare dedicated Apple Distribution signing assets
        id: signing
        run: |
          python3 ios/scripts/appstore_signing.py prepare \
            --output-dir "$RUNNER_TEMP/sug-signing" \
            --state-file "$RUNNER_TEMP/ios-signing-swag.json"

      - name: Install signing certificate & provisioning profile
        env:
          P12_PATH: ${{ steps.signing.outputs.p12_path }}
          P12_PASSWORD: ${{ steps.signing.outputs.p12_password }}
          PROFILE_PATH: ${{ steps.signing.outputs.profile_path }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/sug-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

      - name: Select Xcode 26+
        run: |
          set -euo pipefail
          XCODE_APP="/Applications/Xcode_26.6.app"
          if [ ! -d "$XCODE_APP" ]; then
            XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | tail -1 || true)
          fi
          test -n "$XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          case "$(xcrun --sdk iphoneos --show-sdk-version)" in 26.*|27.*) ;; *) echo "iOS 26 SDK or later required"; exit 1 ;; esac

      - name: Archive signed S.u.G SWAG Release IPA
        run: |
          set -euo pipefail
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || { echo "Invalid build number"; exit 1; }
          mkdir -p "$(dirname "$ARCHIVE_PATH")"
          xcodebuild \
            -project "$APP_PROJECT" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Export App Store IPA
        run: |
          set -euo pipefail
          mkdir -p "$EXPORT_PATH"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$APP_BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload signed IPA to App Store Connect / TestFlight
        if: ${{ github.event_name == 'push' || inputs.upload_to_testflight == true }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          IPA_PATH=$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"
