name: iOS TestFlight build status

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Existing App Store Connect build number to inspect'
        required: true
        default: '291'
        type: string

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      APP_BUNDLE_ID: jp.sugosaka.member
      ASC_API_KEY_ID: MM98J638B7
      ASC_API_ISSUER_ID: d3a981e0-7557-4223-a67f-d026debee303
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Normalize App Store Connect private key
        run: python3 ios/scripts/normalize_asc_key.py

      - name: Install read-only status dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet pyjwt cryptography requests

      - name: Wait for internal TestFlight availability
        run: |
          python3 ios/scripts/appstore_build_status.py \
            --build-number '${{ inputs.build_number }}' \
            --wait-seconds 1200 \
            --interval-seconds 30
