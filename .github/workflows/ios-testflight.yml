name: iOS TestFlight upload

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testflight:
    runs-on: macos-15
    env:
      APP_BUNDLE_ID: jp.sugosaka.member
      APP_NAME: S.u.G
      APP_SKU: SUG-IOS-20260908
      APP_PRIMARY_LOCALE: ja
      APP_SCHEME: SuGMember
      APP_PROJECT: SuGMember.xcodeproj
      ARCHIVE_PATH: ${{ github.workspace }}/build/SuGMember.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export
      ASC_API_KEY_ID: M98C96K4YC
      ASC_API_ISSUER_ID: d3a981e0-7557-4223-a67f-d026debee303
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify App Store Connect private key secret
        run: |
          set -euo pipefail
          if [ -z "${ASC_API_KEY_P8:-}" ]; then
            echo "Missing GitHub Actions secret: ASC_API_KEY_P8"
            exit 1
          fi

      - name: Normalize App Store Connect private key
        run: |
          set -euo pipefail
          ENCODED=$(printf '%s' "$ASC_API_KEY_P8" | base64 | tr -d '\n')
          echo "ASC_API_KEY_P8_BASE64=$ENCODED" >> "$GITHUB_ENV"

      - name: Install App Store Connect API dependencies
        run: python3 -m pip install --quiet --disable-pip-version-check pyjwt cryptography requests

      - name: Ensure Bundle ID, HealthKit and App Store app exist
        working-directory: ios
        run: python3 scripts/appstore_bootstrap.py

      - name: Clean previous S.u.G CI signing assets
        run: python3 ios/scripts/appstore_signing.py cleanup-state --state-file .ci-state/ios-signing.json

      - name: Create rotating distribution certificate and App Store profile
        id: signing
        run: |
          python3 ios/scripts/appstore_signing.py prepare \
            --output-dir "$RUNNER_TEMP/sug-signing" \
            --state-file .ci-state/ios-signing.json

      - name: Persist signing resource IDs for next rotation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-state/ios-signing.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: rotate iOS signing state [skip ci]"
            git push
          fi

      - name: Install rotating signing assets
        env:
          P12_PATH: ${{ steps.signing.outputs.p12_path }}
          P12_PASSWORD: ${{ steps.signing.outputs.p12_password }}
          PROFILE_PATH: ${{ steps.signing.outputs.profile_path }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/sug-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Archive signed iOS app
        working-directory: ios
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$ARCHIVE_PATH")"
          xcodebuild \
            -project "$APP_PROJECT" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Export IPA
        run: |
          set -euo pipefail
          mkdir -p "$EXPORT_PATH"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$APP_BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to App Store Connect / TestFlight
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          IPA_PATH=$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SuGMember-TestFlight
          path: build/export/*.ipa
          if-no-files-found: ignore
