name: Flutter QUEST bootstrap

on:
  push:
    paths:
      - '.github/workflows/flutter-quest-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native Flutter scaffold without losing QUEST code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sugquest
          cp flutter_quest_mvp/lib/main.dart /tmp/sugquest/main.dart
          cp flutter_quest_mvp/pubspec.yaml /tmp/sugquest/pubspec.yaml
          cd flutter_quest_mvp
          flutter create --project-name sug_quest_mvp --org jp.sug --platforms=android,ios,web .
          cp /tmp/sugquest/main.dart lib/main.dart
          cp /tmp/sugquest/pubspec.yaml pubspec.yaml
          sed -i "/import 'dart:math' as math;/d" lib/main.dart
          rm -f test/widget_test.dart analysis_options.yaml
          mkdir -p assets
          cp ../assets/quest/chihaya-masashige-20260905.png assets/quest_avatar_chibi.png

      - name: Add visible web boot shell
        shell: python
        run: |
          from pathlib import Path
          p = Path('flutter_quest_mvp/web/index.html')
          s = p.read_text()
          s = s.replace('<body>', '''<body style="margin:0;background:#081018;color:#f6d77a;font-family:-apple-system,BlinkMacSystemFont,sans-serif;">
            <div id="boot-status" style="position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:#081018;z-index:999999;padding:24px;">
              <div><div style="font-size:28px;font-weight:900;letter-spacing:.04em;">S.u.G QUEST</div><div id="boot-detail" style="margin-top:10px;font-size:12px;color:#ddd;">APP LOADING...</div></div>
            </div>
            <script>
              (() => {
                const hideWhenFlutterStarts = () => {
                  if (document.querySelector('flt-glass-pane, flt-scene-host')) {
                    document.getElementById('boot-status')?.remove();
                    return true;
                  }
                  return false;
                };
                new MutationObserver(hideWhenFlutterStarts).observe(document.documentElement,{childList:true,subtree:true});
                setTimeout(() => {
                  if (!hideWhenFlutterStarts()) {
                    const d=document.getElementById('boot-detail');
                    if(d) d.textContent='起動に時間がかかっています。再読み込みしてください。';
                  }
                },12000);
              })();
            </script>''')
          p.write_text(s)

      - name: Add Android and iOS location permissions
        shell: python
        run: |
          from pathlib import Path

          manifest = Path('flutter_quest_mvp/android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'''
          if 'ACCESS_FINE_LOCATION' not in text:
              text = text.replace(marker, perms, 1)
              manifest.write_text(text)

          plist = Path('flutter_quest_mvp/ios/Runner/Info.plist')
          text = plist.read_text()
          if 'NSLocationWhenInUseUsageDescription' not in text:
              text = text.replace('</dict>', '    <key>NSLocationWhenInUseUsageDescription</key>\n    <string>S.u.G QUESTで現在地とQUESTスポットの到着判定に使用します。</string>\n</dict>', 1)
              plist.write_text(text)

      - name: Resolve packages
        working-directory: flutter_quest_mvp
        run: flutter pub get

      - name: Analyze
        working-directory: flutter_quest_mvp
        run: flutter analyze

      - name: Build web preview
        working-directory: flutter_quest_mvp
        run: flutter build web --release --base-href "/SuG-BODY-MANAGEMENT-SYSTEM/flutter-native-preview/" --pwa-strategy=none

      - name: Browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sug-site
          mkdir -p /tmp/sug-site/SuG-BODY-MANAGEMENT-SYSTEM/flutter-native-preview
          cp -R flutter_quest_mvp/build/web/. /tmp/sug-site/SuG-BODY-MANAGEMENT-SYSTEM/flutter-native-preview/
          python3 -m http.server 8080 --directory /tmp/sug-site >/tmp/sug-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=15000 \
            --dump-dom http://127.0.0.1:8080/SuG-BODY-MANAGEMENT-SYSTEM/flutter-native-preview/ \
            >/tmp/sug-dom.html 2>/tmp/sug-chrome.log || {
              cat /tmp/sug-chrome.log
              exit 1
            }
          if ! grep -Eq 'flt-glass-pane|flt-scene-host' /tmp/sug-dom.html; then
            echo 'Flutter did not render a visible root.'
            cat /tmp/sug-chrome.log
            tail -100 /tmp/sug-dom.html
            exit 1
          fi
          echo 'Flutter browser boot confirmed.'

      - name: Stage preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf flutter-native-preview
          mkdir -p flutter-native-preview
          cp -R flutter_quest_mvp/build/web/. flutter-native-preview/

      - name: Commit generated native app and preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter_quest_mvp flutter-native-preview
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "feat: publish browser-verified Flutter QUEST preview"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
