name: Flutter QUEST bootstrap

on:
  push:
    paths:
      - '.github/workflows/flutter-quest-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native Flutter scaffold without losing QUEST code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sugquest
          cp flutter_quest_mvp/lib/main.dart /tmp/sugquest/main.dart
          cp flutter_quest_mvp/pubspec.yaml /tmp/sugquest/pubspec.yaml
          cd flutter_quest_mvp
          flutter create --project-name sug_quest_mvp --org jp.sug --platforms=android,ios,web .
          cp /tmp/sugquest/main.dart lib/main.dart
          cp /tmp/sugquest/pubspec.yaml pubspec.yaml
          sed -i "/import 'dart:math' as math;/d" lib/main.dart
          rm -f test/widget_test.dart analysis_options.yaml
          mkdir -p assets
          base64 -d ../.ci-state/player-avatar-small.b64 > assets/quest_avatar_chibi.webp

      - name: Patch player avatar and map-first navigation
        shell: python
        run: |
          from pathlib import Path
          p = Path('flutter_quest_mvp/lib/main.dart')
          s = p.read_text()
          s = s.replace("'assets/quest_avatar_chibi.png'", "'assets/quest_avatar_chibi.webp'")
          s = s.replace("width: 90,\n            height: 112,", "width: 88,\n            height: 118,")
          s = s.replace("fit: BoxFit.contain,", "fit: BoxFit.contain, filterQuality: FilterQuality.high,")
          s = s.replace("      const PlaceholderPage(title: 'SHOP', message: '店舗特典・地域商品は実証後に接続'),\n      MyPage(cards: _cards, gpsMessage: _gpsMessage),\n", "")
          s = s.replace("          NavigationDestination(icon: Icon(Icons.storefront_outlined), selectedIcon: Icon(Icons.storefront), label: 'SHOP'),\n          NavigationDestination(icon: Icon(Icons.person_outline), selectedIcon: Icon(Icons.person), label: 'MY PAGE'),\n", "")
          s = s.replace("height: 72,", "height: 68,")
          p.write_text(s)

      - name: Add visible web boot shell
        shell: python
        run: |
          from pathlib import Path
          p = Path('flutter_quest_mvp/web/index.html')
          s = p.read_text()
          if 'S.u.G QUEST LOADING' not in s:
            s = s.replace('<body>', '<body style="margin:0;background:#080b0f"><div id="boot" style="position:fixed;inset:0;display:grid;place-items:center;color:#e0b654;font:700 18px system-ui;background:#080b0f;z-index:9999">S.u.G QUEST LOADING</div>')
            s = s.replace('</body>', '<script>window.addEventListener("flutter-first-frame",()=>{document.getElementById("boot")?.remove();});</script></body>')
            p.write_text(s)

      - name: Add Android and iOS location permissions
        shell: python
        run: |
          from pathlib import Path
          manifest = Path('flutter_quest_mvp/android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'''
          if 'ACCESS_FINE_LOCATION' not in text:
              text = text.replace(marker, perms, 1)
              manifest.write_text(text)
          plist = Path('flutter_quest_mvp/ios/Runner/Info.plist')
          text = plist.read_text()
          if 'NSLocationWhenInUseUsageDescription' not in text:
              text = text.replace('</dict>', '    <key>NSLocationWhenInUseUsageDescription</key>\n    <string>S.u.G QUESTで現在地とQUESTスポットの到着判定に使用します。</string>\n</dict>', 1)
              plist.write_text(text)

      - name: Resolve packages
        working-directory: flutter_quest_mvp
        run: flutter pub get

      - name: Analyze
        working-directory: flutter_quest_mvp
        run: flutter analyze

      - name: Build web preview
        working-directory: flutter_quest_mvp
        run: flutter build web --release --base-href "/SuG-BODY-MANAGEMENT-SYSTEM/flutter-native-preview/"

      - name: Browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          cd flutter_quest_mvp/build/web
          python3 -m http.server 8765 >/tmp/sug-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && break || sleep 1; done
          grep -q 'S.u.G QUEST LOADING' index.html
          test -s main.dart.js

      - name: Stage preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf flutter-native-preview
          mkdir -p flutter-native-preview
          cp -R flutter_quest_mvp/build/web/. flutter-native-preview/

      - name: Commit generated native app and preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter_quest_mvp flutter-native-preview
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "feat: player avatar map-first Flutter QUEST"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
