<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050403">
<title>S.u.G QUEST｜PERSISTENT CARD V19</title>
<style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block;background:#000}</style>
</head>
<body>
<iframe id="app" src="./quest-transport-map-v18-one-tap-demo.html?v=persistent-v19-20260907" allow="geolocation"></iframe>
<script>
const app=document.getElementById('app');
const ART='./assets/quest/tenma-michizane-20260906.webp?v=v19';

function walkDocs(doc,out=[],depth=0){
  if(!doc||depth>16)return out;
  out.push(doc);
  try{
    for(const f of [...doc.querySelectorAll('iframe')]){
      try{if(f.contentDocument)walkDocs(f.contentDocument,out,depth+1)}catch(e){}
    }
  }catch(e){}
  return out;
}

function ensureStyle(d){
  if(!d?.head||d.getElementById('sug-v19-style'))return;
  const st=d.createElement('style');
  st.id='sug-v19-style';
  st.textContent=`
    .card[data-id="13"] .art{
      background-image:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.18)),url('${ART}')!important;
      background-position:center 18%!important;background-size:cover!important;background-repeat:no-repeat!important;
      color:transparent!important;text-shadow:none!important;font-size:0!important;
    }
    #front .hero.sugMichizaneArt{
      background-image:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.2)),url('${ART}')!important;
      background-position:center 16%!important;background-size:cover!important;background-repeat:no-repeat!important;
      color:transparent!important;text-shadow:none!important;font-size:0!important;
    }
  `;
  d.head.appendChild(st);
}

function patchCollection(d){
  try{
    const c=d.querySelector('.card[data-id="13"] .art');
    if(c){c.textContent='';c.setAttribute('aria-label','菅原道真カードアート')}
  }catch(e){}
}

function patchReveal(d){
  try{
    const no=d.querySelector('#front .frontNo')?.textContent?.trim();
    if(no!=='S01-13')return;
    const hero=d.querySelector('#front .hero');
    if(hero){hero.textContent='';hero.classList.add('sugMichizaneArt');hero.setAttribute('aria-label','菅原道真カードアート')}
    const back=d.getElementById('back');
    if(back){
      back.innerHTML=`<div class="backType">S01-13 / PERSON</div><h2>菅原道真</h2><div class="section"><b>WHAT MOVED?</b><p>WATER / PEOPLE / GOODS / KNOWLEDGE・CULTURE</p></div><div class="section"><b>NEXT ROUTE</b><p>大阪天満宮 → 天満マンホール → 大川 → 堂島川 → 大阪湾</p></div><div class="section"><b>REGION / STATUS</b><p>TENMA｜GPS・5,000歩・人物QUEST CLEAR｜CARD COLLECTION保存済み。</p></div>`;
    }
  }catch(e){}
}

function patchAll(){
  const docs=walkDocs(document,[]);
  docs.forEach(d=>{ensureStyle(d);patchCollection(d);patchReveal(d)});
}

let obs=[];
function installObservers(){
  obs.forEach(o=>{try{o.disconnect()}catch(e){}});obs=[];
  const docs=walkDocs(document,[]);
  docs.forEach(d=>{
    try{
      ensureStyle(d);patchCollection(d);patchReveal(d);
      const o=new MutationObserver(()=>{patchCollection(d);patchReveal(d)});
      o.observe(d.documentElement||d.body,{childList:true,subtree:true,characterData:true});
      obs.push(o);
    }catch(e){}
  });
}

app.addEventListener('load',()=>{
  let n=0;
  const t=setInterval(()=>{
    n++;patchAll();
    if(n===8)installObservers();
    if(n>80)clearInterval(t);
  },150);
});
setInterval(patchAll,1200);
</script>
</body>
</html>
