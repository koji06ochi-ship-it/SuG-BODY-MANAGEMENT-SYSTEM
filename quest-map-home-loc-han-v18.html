<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><title>S.u.G QUEST｜TENMA GAME MAP V18</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071019}.map{position:fixed;inset:0;background:#071019 url('./assets/tenma-game-map-v1.jpg?v=18') center/cover no-repeat}.gps{position:fixed;left:5%;top:13%;z-index:5;padding:8px 12px;border:2px solid #c99d4b;border-radius:999px;background:#151713e8;color:#f7df9c;font:900 10px -apple-system}.hot{position:fixed;z-index:4;border:0;background:transparent}.k{left:7%;top:15%;width:22%;height:15%}.t{left:38%;top:18%;width:28%;height:14%}.u{right:4%;top:19%;width:24%;height:16%}.r{left:21%;top:28%;width:28%;height:16%}.a{right:2%;top:37%;width:27%;height:17%}.sheet{position:fixed;z-index:10;left:4%;right:4%;bottom:-55%;padding:16px;background:#eed9a5;border:4px ridge #765225;border-radius:18px;transition:.2s;color:#24170d}.sheet.on{bottom:4%}.sheet h2{font-family:serif}.btn{padding:11px;margin:4px;border:2px solid #56391d;border-radius:8px;font-weight:900}</style></head><body><div class="map"></div><div id="gps" class="gps">GPS待機中</div><button class="hot k" data-id="kuni"></button><button class="hot t" data-id="tenmangu"></button><button class="hot u" data-id="tsukushi"></button><button class="hot r" data-id="ryo"></button><button class="hot a" data-id="tako"></button><section id="sheet" class="sheet"><button id="x" class="btn">×</button><h2 id="n"></h2><p id="d"></p><p id="g"></p><button id="go" class="btn">ここへ行く</button><button id="get" class="btn">GPS CHECK</button></section><script>const P={ryo:{n:'焼肉ホルモン瞭 天満店',lat:34.704843,lng:135.511216,r:70,g:'焼肉ホルモン瞭 PARTNER CARD'},tenmangu:{n:'大阪天満宮',lat:34.6961,lng:135.5125,r:90,g:'大阪天満宮 DISCOVERY'},kuni:{n:'刀剣 國重',lat:null,lng:null,r:70,g:'刀剣 國重 CARD'},tsukushi:{n:'天満つくし',lat:null,lng:null,r:70,g:'店舗DISCOVERY'},tako:{n:'名物ばぁちゃんのたこ焼き',lat:null,lng:null,r:70,g:'店舗DISCOVERY'}};let u=null,last=null,lastT=null,speed=null,walk=0,s=null;const $=i=>document.getElementById(i);function h(a,b){const R=6371000,t=Math.PI/180,d1=(b.lat-a.lat)*t,d2=(b.lng-a.lng)*t,q=Math.sin(d1/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(q))}navigator.geolocation.watchPosition(p=>{let now=p.timestamp||Date.now(),c={lat:p.coords.latitude,lng:p.coords.longitude};if(last){let d=h(last,c),dt=Math.max(1,(now-lastT)/1000);speed=p.coords.speed!=null?p.coords.speed*3.6:d/dt*3.6;if(speed<=12&&d<120)walk+=d}last=c;lastT=now;u=c;$('gps').textContent='GPS LIVE｜'+(speed==null?'--':speed.toFixed(1))+' km/h｜歩行 '+Math.round(walk)+'m';render()},()=>{$('gps').textContent='GPS取得不可'},{enableHighAccuracy:true,maximumAge:1000,timeout:15000});function render(){if(!s)return;let m=u&&s.lat!=null?h(u,s):null;$('n').textContent=s.n;$('d').textContent=m==null?'位置確認待ち':'現在地から '+Math.round(m)+'m';$('g').textContent='GET: '+s.g;$('go').disabled=s.lat==null}document.querySelectorAll('.hot').forEach(b=>b.onclick=()=>{s=P[b.dataset.id];$('sheet').classList.add('on');render()});$('x').onclick=()=>$('sheet').classList.remove('on');$('go').onclick=()=>{if(s&&s.lat!=null)location.href='https://maps.apple.com/?daddr='+s.lat+','+s.lng+'&dirflg=w'};$('get').onclick=()=>{if(!s||s.lat==null)return alert('位置確認待ち');let d=u?h(u,s):99999;if(d<=s.r&&walk>=15&&(speed==null||speed<=12))alert('CARD GET! '+s.n);else alert('GPS到達＋歩行15mでGET')};</script></body></html>
