<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><title>S.u.G QUEST｜TENMA GAME MAP V18</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071019;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.screen{position:fixed;inset:0;background:#071019;overflow:hidden}.mapimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center}.gps{position:absolute;z-index:8;left:5%;top:12.8%;padding:7px 11px;border-radius:999px;background:#151713e8;border:2px solid #c99d4b;color:#f7df9c;font-size:10px;font-weight:900;box-shadow:0 6px 16px #0008}.live{color:#66e8a7}.hot{position:absolute;z-index:6;border:0;background:transparent;border-radius:24px;touch-action:manipulation}.hot:active{background:#ffd36f22}.h-kuni{left:7%;top:15.2%;width:22%;height:15%}.h-tenmangu{left:38%;top:18%;width:28%;height:14%}.h-tsukushi{right:4%;top:19%;width:24%;height:16%}.h-ryo{left:21%;top:28%;width:28%;height:16%}.h-tako{right:2%;top:37%;width:27%;height:17%}.loc{position:absolute;z-index:9;right:6%;bottom:19.5%;width:58px;height:58px;border-radius:50%;border:3px solid #c99d4b;background:#161714e8;color:#f2d688;font-size:25px;box-shadow:0 7px 18px #0009}.nav{position:absolute;z-index:9;left:0;right:0;bottom:0;height:12.2%;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:transparent;color:transparent}.sheet{position:absolute;z-index:20;left:3%;right:3%;bottom:-70%;max-height:54%;overflow:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(#f6e8c1,#d8be82);border:4px ridge #765225;border-radius:18px 18px 8px 8px;color:#24170d;box-shadow:0 -12px 35px #000a;transition:.22s}.sheet.on{bottom:2%}.close{float:right;width:38px;height:38px;border:0;border-radius:50%;background:#171511;color:#f1d176;font-size:22px}.tag{font-size:10px;font-weight:900;color:#795126;letter-spacing:.08em}.sheet h2{margin:7px 42px 7px 0;font:900 24px "Yu Mincho",serif}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.box{padding:9px;background:#fff9e9aa;border:1px solid #9d7844;border-radius:8px;font-size:11px}.get{padding:10px;background:#1c1a15;color:#f5d889;border:2px solid #a37a37;border-radius:9px;font-weight:900}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.btn{padding:12px;border-radius:10px;border:2px solid #56391d;font-weight:900}.go{background:#ddb968;color:#24170d}.claim{background:#24462f;color:#dcf5df}.btn:disabled{opacity:.45}.reward{position:absolute;z-index:30;inset:0;display:none;place-items:center;background:#071019dd;padding:24px}.reward.on{display:grid}.rewardCard{width:min(340px,90vw);padding:24px;background:linear-gradient(#f5e5bb,#d3b573);border:5px ridge #8f652c;text-align:center;box-shadow:0 0 40px #e0b14e88;color:#24170d}.rewardCard b{display:block;font:900 30px Georgia,"Yu Mincho",serif}.rewardCard .icon{font-size:66px}.rewardCard button{margin-top:15px;padding:11px 28px;border:0;border-radius:8px;background:#191713;color:#f3d47d;font-weight:900}.toast{position:absolute;z-index:40;left:50%;top:47%;transform:translate(-50%,-50%);padding:10px 14px;border-radius:999px;background:#111e;color:#fff;font-weight:900;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.on{opacity:1}</style></head><body><main class="screen"><img class="mapimg" src="./assets/tenma-game-map-v1.jpg?v=18a" alt="S.u.G QUEST 天満ゲームMAP"><div id="gps" class="gps">GPS待機中</div><button class="hot h-kuni" data-id="kuni" aria-label="刀剣 國重"></button><button class="hot h-tenmangu" data-id="tenmangu" aria-label="大阪天満宮"></button><button class="hot h-tsukushi" data-id="tsukushi" aria-label="天満つくし"></button><button class="hot h-ryo" data-id="ryo" aria-label="焼肉ホルモン瞭"></button><button class="hot h-tako" data-id="tako" aria-label="名物ばぁちゃんのたこ焼き"></button><button id="loc" class="loc">⌖</button><nav class="nav"><button aria-label="MAP"></button><button id="quest" aria-label="QUEST"></button><button id="collection" aria-label="COLLECTION"></button><button id="shop" aria-label="SHOP"></button><button id="mypage" aria-label="MY PAGE"></button></nav><section id="sheet" class="sheet"><button id="close" class="close">×</button><div id="tag" class="tag"></div><h2 id="name"></h2><div class="meta"><div class="box"><b>現在地から</b><br><span id="dist">--</span></div><div class="box"><b>取得条件</b><br><span id="rule"></span></div></div><div id="get" class="get"></div><div class="actions"><button id="go" class="btn go">ここへ行く</button><button id="claim" class="btn claim">GPS CHECK</button></div></section><section id="reward" class="reward"><div class="rewardCard"><small>CARD / DISCOVERY</small><div id="rewardIcon" class="icon"></div><b>GET!</b><p id="rewardName"></p><button id="rewardClose">MAPへ戻る</button></div></section><div id="toast" class="toast"></div></main><script>const STORE='sugQuestTenmaGameV18',MAX=12,REQ=15;const P={ryo:{id:'ryo',name:'焼肉ホルモン瞭 天満店',cat:'PARTNER / SHOP',icon:'🥩',lat:34.704843,lng:135.511216,r:70,get:'焼肉ホルモン瞭 PARTNER CARD',rule:'歩行＋GPS現地到達'},tenmangu:{id:'tenmangu',name:'大阪天満宮',cat:'HISTORY / SHRINE',icon:'⛩️',lat:34.6961,lng:135.5125,r:90,get:'大阪天満宮 DISCOVERY',rule:'歩行＋GPS現地到達'},kuni:{id:'kuni',name:'刀剣 國重',cat:'HISTORY / SHOP',icon:'⚔️',lat:null,lng:null,r:70,get:'刀剣 國重 CARD',rule:'位置確認後にGPS取得を有効化'},tsukushi:{id:'tsukushi',name:'天満つくし',cat:'SHOP',icon:'🍜',lat:null,lng:null,r:70,get:'店舗DISCOVERY',rule:'location_pending'},tako:{id:'tako',name:'名物ばぁちゃんのたこ焼き',cat:'SHOP',icon:'🐙',lat:null,lng:null,r:70,get:'店舗DISCOVERY',rule:'location_pending'}};let state;try{state=JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){state={}}if(!Array.isArray(state.owned))state.owned=[];let user=null,last=null,lastT=null,speed=null,walk=0,sel=null,watch=null,tt=null;const $=id=>document.getElementById(id);function save(){localStorage.setItem(STORE,JSON.stringify(state))}function hav(a,b){const R=6371000,t=Math.PI/180,d1=(b.lat-a.lat)*t,d2=(b.lng-a.lng)*t,q=Math.sin(d1/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function fmt(m){if(m==null)return'位置確認待ち';return m<1000?Math.round(m)+' m':(m/1000).toFixed(1)+' km'}function status(){$('gps').innerHTML='<span class="live">● GPS LIVE</span>｜'+(speed==null?'--':speed.toFixed(1))+' km/h｜歩行 '+Math.round(walk)+'m'}function pos(p){const now=p.timestamp||Date.now(),cur={lat:p.coords.latitude,lng:p.coords.longitude};if(last&&lastT){const d=hav(last,cur),dt=Math.max(1,(now-lastT)/1000);speed=p.coords.speed!=null&&p.coords.speed>=0?p.coords.speed*3.6:d/dt*3.6;if(speed<=MAX&&d<120)walk+=d}last=cur;lastT=now;user=cur;status();if(sel)render()}function gps(){if(watch!=null)navigator.geolocation.clearWatch(watch);if(!navigator.geolocation){$('gps').textContent='GPS非対応';return}watch=navigator.geolocation.watchPosition(pos,()=>{$('gps').textContent='GPS取得不可'},{enableHighAccuracy:true,maximumAge:1000,timeout:15000})}function toast(t){clearTimeout(tt);$('toast').textContent=t;$('toast').classList.add('on');tt=setTimeout(()=>$('toast').classList.remove('on'),1700)}function openPoint(p){sel=p;$('sheet').classList.add('on');render()}function render(){if(!sel)return;const d=user&&sel.lat!=null?hav(user,sel):null;$('tag').textContent=sel.cat;$('name').textContent=sel.name;$('dist').textContent=fmt(d);$('rule').textContent=sel.rule;$('get').innerHTML='<b>GET</b><br>'+sel.get+(state.owned.includes(sel.id)?'<br>✓ 取得済み':'');$('go').disabled=sel.lat==null;$('claim').disabled=state.owned.includes(sel.id);$('claim').textContent=state.owned.includes(sel.id)?'GET済み':'GPS CHECK'}document.querySelectorAll('.hot').forEach(b=>b.onclick=()=>openPoint(P[b.dataset.id]));$('close').onclick=()=>{$('sheet').classList.remove('on')};$('loc').onclick=()=>{gps();toast('現在地を更新')};$('go').onclick=()=>{if(!sel||sel.lat==null)return;location.href='https://maps.apple.com/?daddr='+sel.lat+','+sel.lng+'&dirflg=w'};$('claim').onclick=()=>{if(!sel)return;if(sel.lat==null)return toast('このPOINTは位置確認待ち');if(!user)return toast('GPS取得中');const d=hav(user,sel);if(d>sel.r)return toast('あと約'+Math.max(0,Math.round(d-sel.r))+'m');if(speed!=null&&speed>MAX)return toast('高速移動中は取得できません');if(walk<REQ)return toast('歩行判定 あと'+Math.ceil(REQ-walk)+'m');if(!state.owned.includes(sel.id)){state.owned.push(sel.id);save()}$('sheet').classList.remove('on');$('rewardIcon').textContent=sel.icon;$('rewardName').textContent=sel.get;$('reward').classList.add('on')};$('rewardClose').onclick=()=>{$('reward').classList.remove('on')};$('quest').onclick=()=>location.href='./quest-battle-mvp-v20.html?v=tenma-game-v18';$('collection').onclick=()=>location.href='./quest-map-home-loc-han-v17.html?v=from-v18';$('shop').onclick=()=>toast('SHOPは次段階で正式接続');$('mypage').onclick=()=>toast('MY PAGEは次段階で正式接続');gps();</script></body></html>
