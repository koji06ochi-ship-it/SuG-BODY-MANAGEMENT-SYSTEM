<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><title>S.u.G QUEST｜TENMA GAME MAP V18</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071019;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.screen{position:fixed;inset:0;background:#071019;overflow:hidden}.mapimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center}.gps{position:absolute;z-index:8;left:5%;top:12.8%;padding:7px 11px;border-radius:999px;background:#151713e8;border:2px solid #c99d4b;color:#f7df9c;font-size:10px;font-weight:900;box-shadow:0 6px 16px #0008}.live{color:#66e8a7}.hot{position:absolute;z-index:6;border:0;background:transparent;border-radius:24px;touch-action:manipulation}.hot:active{background:#ffd36f22}.h-kuni{left:7%;top:15.2%;width:22%;height:15%}.h-tenmangu{left:38%;top:18%;width:28%;height:14%}.h-tsukushi{right:4%;top:19%;width:24%;height:16%}.h-ryo{left:21%;top:28%;width:28%;height:16%}.h-tako{right:2%;top:37%;width:27%;height:17%}.loc{position:absolute;z-index:9;right:6%;bottom:19.5%;width:58px;height:58px;border-radius:50%;border:3px solid #c99d4b;background:#161714e8;color:#f2d688;font-size:25px;box-shadow:0 7px 18px #0009}.nav{position:absolute;z-index:9;left:0;right:0;bottom:0;height:12.2%;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:transparent}.sheet{position:absolute;z-index:20;left:3%;right:3%;bottom:-70%;max-height:54%;overflow:auto;padding:16px;background:linear-gradient(#f6e8c1,#d8be82);border:4px ridge #765225;border-radius:18px;color:#24170d;box-shadow:0 -12px 35px #000a;transition:.22s}.sheet.on{bottom:2%}.close{float:right;width:38px;height:38px;border:0;border-radius:50%;background:#171511;color:#f1d176;font-size:22px}.tag{font-size:10px;font-weight:900;color:#795126}.sheet h2{margin:7px 42px 7px 0;font:900 24px "Yu Mincho",serif}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.box{padding:9px;background:#fff9e9aa;border:1px solid #9d7844;border-radius:8px;font-size:11px}.get{padding:10px;background:#1c1a15;color:#f5d889;border:2px solid #a37a37;border-radius:9px;font-weight:900}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.btn{padding:12px;border-radius:10px;border:2px solid #56391d;font-weight:900}.go{background:#ddb968}.claim{background:#24462f;color:#dcf5df}.toast{position:absolute;z-index:40;left:50%;top:47%;transform:translate(-50%,-50%);padding:10px 14px;border-radius:999px;background:#111e;color:#fff;font-weight:900;font-size:12px;opacity:0;transition:.2s}.toast.on{opacity:1}</style></head><body><main class="screen"><img class="mapimg" src="./assets/tenma-game-map-v1.jpg?v=18" alt="S.u.G QUEST 天満ゲームMAP"><div id="gps" class="gps">GPS待機中</div><button class="hot h-kuni" data-id="kuni"></button><button class="hot h-tenmangu" data-id="tenmangu"></button><button class="hot h-tsukushi" data-id="tsukushi"></button><button class="hot h-ryo" data-id="ryo"></button><button class="hot h-tako" data-id="tako"></button><button id="loc" class="loc">⌖</button><nav class="nav"><button></button><button id="quest"></button><button id="collection"></button><button id="shop"></button><button id="mypage"></button></nav><section id="sheet" class="sheet"><button id="close" class="close">×</button><div id="tag" class="tag"></div><h2 id="name"></h2><div class="meta"><div class="box"><b>現在地から</b><br><span id="dist">--</span></div><div class="box"><b>取得条件</b><br><span id="rule"></span></div></div><div id="get" class="get"></div><div class="actions"><button id="go" class="btn go">ここへ行く</button><button id="claim" class="btn claim">GPS CHECK</button></div></section><div id="toast" class="toast"></div></main><script>const P={ryo:{name:'焼肉ホルモン瞭 天満店',cat:'PARTNER / SHOP',lat:34.704843,lng:135.511216,r:70,get:'焼肉ホルモン瞭 PARTNER CARD',rule:'歩行＋GPS現地到達'},tenmangu:{name:'大阪天満宮',cat:'HISTORY / SHRINE',lat:34.6961,lng:135.5125,r:90,get:'大阪天満宮 DISCOVERY',rule:'歩行＋GPS現地到達'},kuni:{name:'刀剣 國重',cat:'HISTORY / SHOP',lat:null,lng:null,r:70,get:'刀剣 國重 CARD',rule:'location_pending'},tsukushi:{name:'天満つくし',cat:'SHOP',lat:null,lng:null,r:70,get:'店舗DISCOVERY',rule:'location_pending'},tako:{name:'名物ばぁちゃんのたこ焼き',cat:'SHOP',lat:null,lng:null,r:70,get:'店舗DISCOVERY',rule:'location_pending'}};let u=null,last=null,lastT=null,speed=null,walk=0,sel=null,watch=null;const $=i=>document.getElementById(i);function hav(a,b){const R=6371000,t=Math.PI/180,d1=(b.lat-a.lat)*t,d2=(b.lng-a.lng)*t,q=Math.sin(d1/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function fmt(m){return m==null?'位置確認待ち':m<1000?Math.round(m)+' m':(m/1000).toFixed(1)+' km'}function pos(p){const now=p.timestamp||Date.now(),cur={lat:p.coords.latitude,lng:p.coords.longitude};if(last&&lastT){const d=hav(last,cur),dt=Math.max(1,(now-lastT)/1000);speed=p.coords.speed!=null?p.coords.speed*3.6:d/dt*3.6;if(speed<=12&&d<120)walk+=d}last=cur;lastT=now;u=cur;$('gps').innerHTML='<span class="live">● GPS LIVE</span>｜'+(speed==null?'--':speed.toFixed(1))+' km/h｜歩行 '+Math.round(walk)+'m';if(sel)render()}function gps(){if(watch!=null)navigator.geolocation.clearWatch(watch);watch=navigator.geolocation.watchPosition(pos,()=>{$('gps').textContent='GPS取得不可'},{enableHighAccuracy:true,maximumAge:1000,timeout:15000})}function render(){if(!sel)return;const d=u&&sel.lat!=null?hav(u,sel):null;$('tag').textContent=sel.cat;$('name').textContent=sel.name;$('dist').textContent=fmt(d);$('rule').textContent=sel.rule;$('get').innerHTML='<b>GET</b><br>'+sel.get;$('go').disabled=sel.lat==null}document.querySelectorAll('.hot').forEach(b=>b.onclick=()=>{sel=P[b.dataset.id];$('sheet').classList.add('on');render()});$('close').onclick=()=>$('sheet').classList.remove('on');$('go').onclick=()=>{if(sel&&sel.lat!=null)location.href='https://maps.apple.com/?daddr='+sel.lat+','+sel.lng+'&dirflg=w'};$('claim').onclick=()=>{if(!sel||sel.lat==null){$('toast').textContent='位置確認待ち';$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),1500);return}const d=u?hav(u,sel):99999;if(d<=sel.r&&walk>=15&&(speed==null||speed<=12)){$('toast').textContent='CARD GET! '+sel.name}else{$('toast').textContent='GPS到達＋歩行15mでGET'}$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),1800)};$('loc').onclick=gps;$('quest').onclick=()=>location.href='./quest-battle-mvp-v20.html?v=v18';$('collection').onclick=()=>location.href='./quest-map-home-loc-han-v17.html?v=v18';gps();</script></body></html>
