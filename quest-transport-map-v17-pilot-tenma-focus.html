<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050403">
<title>S.u.G QUEST｜PILOT TENMA FOCUS V17</title>
<style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<iframe id="app" src="./quest-transport-map-v16-deep-mission-fix.html?v=pilot-tenma-focus-v17-20260907" allow="geolocation"></iframe>
<script>
const app=document.getElementById('app');
const BASE='sugQuestTransportV2',PILOT='sugQuestFieldV10';

function read(k,f='{}'){try{return JSON.parse(localStorage.getItem(k)||f)}catch(e){return JSON.parse(f)}}
function write(k,v){localStorage.setItem(k,JSON.stringify(v))}

function findElementDeep(doc,id,depth=0){
  if(!doc||depth>14)return null;
  try{
    const own=doc.getElementById(id);
    if(own)return own;
    for(const frame of [...doc.querySelectorAll('iframe')]){
      try{const found=findElementDeep(frame.contentDocument,id,depth+1);if(found)return found}catch(e){}
    }
  }catch(e){}
  return null;
}

function cleanAccidentalKanan(){
  const b=read(BASE),p=read(PILOT,'{"steps":{},"quests":{},"got":{}}');
  if(!b.kanan && !p.got?.['01'] && (p.steps?.kanan||0)===5000 && p.quests?.['kanan-person']){
    if(p.steps) delete p.steps.kanan;
    if(p.quests) delete p.quests['kanan-person'];
    write(PILOT,p);
  }
}

function saveTenmaGPS(){const b=read(BASE);b.tenma=true;write(BASE,b)}

function focusTenmaMission(){
  const missionBtn=findElementDeep(document,'missionBtn');
  if(!missionBtn)return false;
  missionBtn.click();
  const d=missionBtn.ownerDocument;
  setTimeout(()=>{
    try{
      if(!d.getElementById('sug-v17-style')){
        const st=d.createElement('style');st.id='sug-v17-style';
        st.textContent='.sugPilotFocus{border-color:#e7bd5b!important;box-shadow:0 0 0 2px #d9aa3a66,0 0 34px #d9aa3a44!important;animation:sugPulse 1.1s ease-in-out 2}@keyframes sugPulse{50%{transform:scale(1.012)}}';
        d.head.appendChild(st);
      }
      const missions=[...d.querySelectorAll('.mission')];
      const target=missions.find(m=>m.querySelector('.no')?.textContent.trim()==='S01-13');
      missions.forEach(m=>m.classList.remove('sugPilotFocus'));
      if(target){target.classList.add('sugPilotFocus');target.scrollIntoView({behavior:'smooth',block:'start'});}
    }catch(e){}
  },260);
  return true;
}

function install(){
  const pilotBtn=findElementDeep(document,'pilotBtn');
  if(!pilotBtn||pilotBtn.dataset.v17)return false;
  pilotBtn.dataset.v17='1';
  pilotBtn.onclick=()=>{
    cleanAccidentalKanan();
    saveTenmaGPS();
    const toast=findElementDeep(document,'toast');
    if(toast){toast.textContent='PILOT：天満 S01-13「菅原道真」へ移動します';toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),1800)}
    setTimeout(()=>focusTenmaMission(),180);
  };
  return true;
}

cleanAccidentalKanan();
app.addEventListener('load',()=>{let n=0;const t=setInterval(()=>{n++;if(install()||n>100)clearInterval(t)},120)});
</script>
</body>
</html>
