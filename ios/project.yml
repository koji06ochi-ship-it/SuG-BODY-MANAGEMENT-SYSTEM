name: SuGMember
options:
  bundleIdPrefix: jp.sugosaka
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
targets:
  SuGMember:
    type: application
    platform: iOS
    sources:
      - SuGMember
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.sugosaka.member
        CODE_SIGN_ENTITLEMENTS: SuGMember/SuGMember.entitlements
        INFOPLIST_KEY_NSHealthShareUsageDescription: S.u.Gで歩数・睡眠・心拍・体重を取得し、コンディション管理に使用します。
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: S.u.Gはヘルスケアへデータを書き込みません。
        GENERATE_INFOPLIST_FILE: YES
    entitlements:
      path: SuGMember/SuGMember.entitlements
