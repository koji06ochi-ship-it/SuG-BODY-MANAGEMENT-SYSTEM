<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0d1a22"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><title>S.u.G QUEST V6</title><link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"><style>*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}body{overflow:hidden;background:#1a2d37}#map{position:fixed;inset:0}.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{opacity:.45;font-size:8px}.top{position:fixed;z-index:10;left:14px;right:14px;top:calc(10px + env(safe-area-inset-top));display:flex;gap:10px;pointer-events:none}.brand,.area{pointer-events:auto;background:linear-gradient(#f4e6bf,#d5bd83);border:3px solid #51351b;box-shadow:0 5px 16px #0007;color:#1b120b}.brand{padding:10px 12px;border-radius:8px;flex:1}.brand b{display:block;font:800 21px Georgia,"Yu Mincho",serif}.brand span{font-size:9px;font-weight:800}.area{width:132px;padding:8px 10px;border-radius:8px}.area b{display:block;font:800 15px "Yu Mincho",serif}.area small{font-size:9px}.gps{position:fixed;z-index:11;right:16px;top:calc(94px + env(safe-area-inset-top));width:48px;height:48px;border-radius:50%;border:3px solid #d4ab53;background:#151813ed;color:#f3d47b;font-size:22px}.status{position:fixed;z-index:10;left:14px;top:calc(98px + env(safe-area-inset-top));padding:7px 10px;border-radius:999px;background:#171710e8;color:#f3e4bb;border:1px solid #b58d45;font-size:9px;font-weight:900}.next{position:fixed;z-index:10;left:14px;bottom:calc(92px + env(safe-area-inset-bottom));width:min(300px,72vw);padding:10px 12px;background:linear-gradient(#f5e8c4,#d6be87);border:3px solid #51351b;border-radius:8px;box-shadow:0 7px 18px #0007;color:#21150c}.next small{font-weight:900;color:#765128}.next b{display:block;font:800 20px "Yu Mincho",serif;margin:2px 0}.next span{font-size:11px;font-weight:800}.bottom{position:fixed;z-index:12;left:0;right:0;bottom:0;height:78px;padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);background:linear-gradient(#181713f7,#080b0df7);border-top:3px solid #9b7635}.nav{border:0;border-right:1px solid #554428;background:transparent;color:#d7bc78;font-weight:900;font-size:9px}.nav b{display:block;font-size:24px}.nav.on{background:#302514;color:#ffe09a}.quest{width:64px;height:86px;position:relative;filter:drop-shadow(0 7px 6px #0007);cursor:pointer}.quest .paper{position:absolute;left:4px;right:4px;top:0;height:64px;border:3px solid #53381d;border-radius:6px;background:linear-gradient(#f5e7bf,#d9c28d);box-shadow:inset 0 0 0 2px #cfa64e;display:grid;place-items:center;text-align:center;font:900 15px "Yu Mincho",serif;color:#28180d}.quest .pin{position:absolute;left:27px;bottom:2px;width:12px;height:12px;background:#a52d22;border:2px solid #f3cf72;border-radius:50%;box-shadow:0 0 12px #ffb04b}.quest.done{opacity:.5}.hero{width:104px;height:126px;position:relative;filter:drop-shadow(0 10px 7px #0008)}.halo{position:absolute;left:8px;bottom:2px;width:88px;height:30px;border-radius:50%;background:#37bff044;border:3px solid #78dcff;box-shadow:0 0 18px #44caff}.sam{position:absolute;left:20px;top:0;width:66px;height:108px;animation:bob .55s ease-in-out infinite alternate}.kab{position:absolute;left:2px;top:0;width:62px;height:38px;border-radius:18px 18px 7px 7px;background:linear-gradient(#0d1117,#3c3420);border:4px solid #d7aa44}.kab:before,.kab:after{content:"";position:absolute;top:-18px;width:28px;height:28px;border-top:5px solid #dfb64a}.kab:before{left:-10px;transform:rotate(-26deg);border-left:5px solid #dfb64a}.kab:after{right:-10px;transform:rotate(26deg);border-right:5px solid #dfb64a}.face{position:absolute;left:14px;top:34px;width:38px;height:34px;border-radius:10px;background:#e2b48f;border:3px solid #352116}.face:after{content:"•   •";position:absolute;left:7px;top:4px;color:#1f140d}.armor{position:absolute;left:8px;top:65px;width:51px;height:41px;border-radius:8px 8px 12px 12px;background:linear-gradient(90deg,#0d1625,#263b5a,#0d1625);border:4px solid #d1a541}.armor:before{content:"菊";display:block;text-align:center;color:#f0cf6e;font:bold 17px "Yu Mincho",serif;line-height:33px}.armor:after{content:"";position:absolute;right:-15px;top:1px;width:7px;height:49px;background:#17130f;border:2px solid #d1a443;transform:rotate(18deg);border-radius:5px}@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-6px)}}.sheet{position:fixed;z-index:20;left:0;right:0;bottom:-90vh;max-height:70vh;overflow:auto;padding:14px 16px calc(92px + env(safe-area-inset-bottom));background:linear-gradient(#f5e8c4,#d6bf89);border-top:4px solid #51351b;border-radius:22px 22px 0 0;transition:.22s}.sheet.on{bottom:0}.sheet h2{margin:2px 0 8px;font-family:"Yu Mincho",serif}.sheet p{font-size:12px;line-height:1.6}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{padding:13px;border-radius:10px;border:2px solid #5a3b1d;font-weight:900}.go{background:#e0bf70}.claim{background:#233e2d;color:#d7f3de}.close{float:right;border:0;background:#22180f;color:#f4db97;width:38px;height:38px;border-radius:50%;font-size:21px}</style></head><body><div id="map"></div><div class="top"><div class="brand"><b>S.u.G QUEST</b><span>歩いてつなぐ、歴史とカラダ</span></div><div class="area"><b>天満エリア</b><small id="progress">QUEST 0 / 0</small></div></div><button id="locate" class="gps">◎</button><div id="status" class="status">GPS待機中</div><div class="next"><small>NEXT QUEST</small><b id="nextName">近くのPOINT</b><span id="nextDist">GPSで目的地を探しています</span></div><nav class="bottom"><button class="nav on"><b>⌖</b>MAP</button><button id="collection" class="nav"><b>◇</b>COLLECTION</button><button id="quest" class="nav"><b>⚔</b>QUEST</button><button id="body" class="nav"><b>＋</b>BODY</button></nav><section id="sheet" class="sheet"><button id="close" class="close">×</button><h2 id="sheetName"></h2><p id="sheetText"></p><div class="actions"><button id="go" class="btn go">ここへ行く</button><button id="claim" class="btn claim">GPS CHECK</button></div></section><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>
const STORE='sugQuestMapHomeV1',MAX=12,REQ=15;let state;try{state=JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){state={}}if(!Array.isArray(state.owned))state.owned=[];const save=()=>localStorage.setItem(STORE,JSON.stringify(state));
const P=[{id:'osaka-tenmangu',n:'大阪天満宮',lat:34.6961,lng:135.5125,m:'⛩',g:'天満歴史カード候補',r:90},{id:'temma-station',n:'JR 天満駅',lat:34.7049,lng:135.5113,m:'駅',g:'天満駅カード',r:90},{id:'ogimachi',n:'扇町公園',lat:34.7051,lng:135.5088,m:'休',g:'休憩POINT',r:100},{id:'shop-pilot',n:'店舗POINT',lat:34.7041,lng:135.5095,m:'店',g:'SHOP CARD候補',r:90},{id:'water-pilot',n:'給水POINT',lat:34.7033,lng:135.5078,m:'水',g:'WATER CARD候補',r:90},{id:'sug-pilot',n:'S.u.G POINT',lat:34.7024,lng:135.5102,m:'S',g:'S.u.G CARD',r:90}];
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[135.5105,34.7032],zoom:15.8,pitch:62,bearing:-12,antialias:true});map.dragRotate.enable();map.touchZoomRotate.enableRotation();let user=null,heroM=null,last=null,walk=0,speed=null,selected=null;const markers=new Map();
function hav(a,b){const R=6371000,p=Math.PI/180,d1=(b.lat-a.lat)*p,d2=(b.lng-a.lng)*p,x=Math.sin(d1/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(x))}function qEl(p){const e=document.createElement('div');e.className='quest'+(state.owned.includes(p.id)?' done':'');e.innerHTML=`<div class="paper">${p.m}<br>${p.n.replace('POINT','')}</div><div class="pin"></div>`;e.onclick=()=>openP(p);return e}P.forEach(p=>markers.set(p.id,new maplibregl.Marker({element:qEl(p),anchor:'bottom'}).setLngLat([p.lng,p.lat]).addTo(map)));
function heroEl(){const e=document.createElement('div');e.className='hero';e.innerHTML='<div class="halo"></div><div class="sam"><div class="kab"></div><div class="face"></div><div class="armor"></div></div>';return e}
function nearest(){if(!user)return;let x=P.map(p=>[p,hav(user,p)]).sort((a,b)=>a[1]-b[1])[0];document.getElementById('nextName').textContent=x[0].n;document.getElementById('nextDist').textContent=`あと 約${Math.round(x[1])}m`}
function openP(p){selected=p;const d=user?hav(user,p):null;document.getElementById('sheetName').textContent=p.n;document.getElementById('sheetText').textContent=`GET：${p.g}\n距離：${d==null?'GPS待機中':Math.round(d)+'m'}\n条件：GPS到達＋速度${MAX}km/h以下＋起動中の歩行${REQ}m以上`;document.getElementById('sheet').classList.add('on');}
function claim(){if(!selected||!user)return alert('GPS位置情報を取得中');const d=hav(user,selected);if(d>selected.r)return alert(`あと約${Math.round(d-selected.r)}m`);if(speed!=null&&speed>MAX)return alert('高速移動中は取得できません');if(walk<REQ)return alert(`歩行判定 あと${Math.ceil(REQ-walk)}m`);if(!state.owned.includes(selected.id)){state.owned.push(selected.id);save();location.reload()}else alert('取得済み')}
function pos(p){const now={lat:p.coords.latitude,lng:p.coords.longitude,t:p.timestamp};if(last){const ds=hav(last,now),dt=(now.t-last.t)/1000,calc=dt>0?ds/dt*3.6:null;speed=p.coords.speed!=null?p.coords.speed*3.6:calc;if(dt>0&&ds<120&&speed!=null&&speed<=MAX)walk+=ds}last=now;user=now;if(!heroM)heroM=new maplibregl.Marker({element:heroEl(),anchor:'bottom'}).setLngLat([now.lng,now.lat]).addTo(map);else heroM.setLngLat([now.lng,now.lat]);map.easeTo({center:[now.lng,now.lat],zoom:16.2,pitch:62,bearing:-12,duration:900});document.getElementById('status').textContent=`GPS LIVE｜${speed==null?'--':speed.toFixed(1)} km/h｜歩行 ${Math.round(walk)}m`;nearest()}
function start(){navigator.geolocation?.watchPosition(pos,()=>document.getElementById('status').textContent='GPS取得不可',{enableHighAccuracy:true,maximumAge:1000,timeout:15000})}document.getElementById('locate').onclick=()=>{if(user)map.easeTo({center:[user.lng,user.lat],zoom:16.2,pitch:62,bearing:-12})};document.getElementById('close').onclick=()=>document.getElementById('sheet').classList.remove('on');document.getElementById('go').onclick=()=>selected&&(location.href=`https://maps.apple.com/?daddr=${selected.lat},${selected.lng}&dirflg=w`);document.getElementById('claim').onclick=claim;document.getElementById('quest').onclick=()=>location.href='./quest-battle-mvp-v20.html?v=map-gl-v6';document.getElementById('body').onclick=()=>location.href='./index.html?v=from-map-gl-v6';document.getElementById('collection').onclick=()=>alert(`MAP CARD ${state.owned.length}/${P.length}`);document.getElementById('progress').textContent=`QUEST ${state.owned.length} / ${P.length}`;start();
</script></body></html>
