<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#87a77e"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><title>S.u.G QUEST V8</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><style>*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}body{background:#8aa57e}#map{position:fixed;inset:0}.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{display:none}.top{position:fixed;z-index:20;left:14px;right:14px;top:calc(9px + env(safe-area-inset-top));display:flex;gap:8px;pointer-events:none}.brand,.area{background:linear-gradient(#f5e6bc,#d4b978);border:3px solid #4d3219;color:#20150c;box-shadow:0 5px 16px #0006}.brand{flex:1;padding:10px 12px;border-radius:7px}.brand b{display:block;font:900 21px Georgia,"Yu Mincho",serif}.brand small{font-size:9px;font-weight:900}.area{width:128px;padding:8px;border-radius:7px}.area b{display:block;font:900 14px "Yu Mincho",serif}.area small{font-size:9px}.status{position:fixed;z-index:20;left:14px;top:calc(84px + env(safe-area-inset-top));padding:7px 10px;border-radius:999px;background:#171710e8;border:2px solid #be9345;color:#f4dfaa;font-size:9px;font-weight:900}.gps{position:fixed;z-index:20;right:15px;top:calc(89px + env(safe-area-inset-top));width:50px;height:50px;border-radius:50%;background:#171713;border:3px solid #d2a84f;color:#f4d87c;font-size:22px}.marker{width:68px;height:108px;filter:drop-shadow(0 8px 7px #0007);cursor:pointer}.flag{position:absolute;left:7px;top:0;width:56px;min-height:78px;padding:9px 4px 20px;background:linear-gradient(90deg,#e7d3a0,#fff0c7,#e1ca93);border:3px solid #4b3019;border-radius:3px;text-align:center;color:#24160c;font:900 12px/1.15 "Yu Mincho",serif;box-shadow:inset 0 0 0 2px #b98e43}.flag:before,.flag:after{content:"";position:absolute;left:-7px;right:-7px;height:7px;background:#372416;border:2px solid #b98d40;border-radius:5px}.flag:before{top:-5px}.flag:after{bottom:-5px}.flag i{display:grid;place-items:center;margin:6px auto 0;width:36px;height:36px;border-radius:50%;background:#241812;color:#f0ce6b;font-style:normal;font-size:20px}.pin{position:absolute;left:26px;bottom:1px;width:17px;height:17px;border-radius:50%;background:#d13727;border:3px solid #f0c55b;box-shadow:0 0 15px #ff9d46}.marker.done{opacity:.45}.hero{width:138px;height:166px;filter:drop-shadow(0 12px 8px #0008)}.hero svg{width:138px;height:166px;overflow:visible;animation:bob .5s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.next{position:fixed;z-index:20;left:14px;bottom:calc(92px + env(safe-area-inset-bottom));width:min(320px,76vw);padding:10px 12px;background:linear-gradient(#f5e8c4,#d7be84);border:3px solid #50331a;border-radius:7px;box-shadow:0 7px 18px #0007;color:#21150c}.next small{font-weight:900;color:#765128}.next b{display:block;font:900 19px "Yu Mincho",serif}.next span{font-size:11px;font-weight:900}.bottom{position:fixed;z-index:21;left:0;right:0;bottom:0;height:80px;padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);background:linear-gradient(#181713f8,#080b0df8);border-top:3px solid #997335}.nav{border:0;border-right:1px solid #594628;background:transparent;color:#d5b975;font-size:8px;font-weight:900}.nav b{display:block;font-size:21px}.nav.on{background:#312514;color:#ffe19b}.sheet{position:fixed;z-index:30;left:0;right:0;bottom:-80vh;max-height:68vh;overflow:auto;padding:15px 16px calc(92px + env(safe-area-inset-bottom));background:linear-gradient(#f5e8c4,#d6bf89);border-top:4px solid #51351b;border-radius:20px 20px 0 0;transition:.2s}.sheet.on{bottom:0}.sheet h2{font-family:"Yu Mincho",serif}.close{float:right;border:0;border-radius:50%;width:38px;height:38px;background:#21170f;color:#f4da94;font-size:20px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{padding:13px;border-radius:9px;border:2px solid #56391c;font-weight:900}.go{background:#dfbe70}.claim{background:#243e2d;color:#d8f2df}</style></head><body><div id="map"></div><div class="top"><div class="brand"><b>S.u.G QUEST</b><small>歩いてつなぐ、歴史とカラダ</small></div><div class="area"><b>天満エリア</b><small id="progress">QUEST 0 / 0</small></div></div><div id="status" class="status">GPS待機中</div><button id="locate" class="gps">◎</button><div class="next"><small>NEXT QUEST</small><b id="nextName">近くのQUEST POINT</b><span id="nextDist">GPSで探索中</span></div><nav class="bottom"><button class="nav on"><b>⛩</b>MAP</button><button id="quest" class="nav"><b>▤</b>QUEST</button><button id="collection" class="nav"><b>◇</b>COLLECTION</button><button id="shop" class="nav"><b>店</b>SHOP</button><button id="body" class="nav"><b>＋</b>BODY</button></nav><section id="sheet" class="sheet"><button id="close" class="close">×</button><h2 id="sheetName"></h2><p id="sheetText"></p><div class="actions"><button id="go" class="btn go">ここへ行く</button><button id="claim" class="btn claim">GPS CHECK</button></div></section><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>
const STORE='sugQuestMapHomeV1',MAX=12,REQ=15;let state;try{state=JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){state={}}if(!Array.isArray(state.owned))state.owned=[];const save=()=>localStorage.setItem(STORE,JSON.stringify(state));const P=[{id:'osaka-tenmangu',n:'大阪天満宮',lat:34.6961,lng:135.5125,m:'⛩',r:90},{id:'temma-station',n:'JR 天満駅',lat:34.7049,lng:135.5113,m:'駅',r:90},{id:'ogimachi',n:'扇町公園',lat:34.7051,lng:135.5088,m:'休',r:100},{id:'shop-pilot',n:'店舗POINT',lat:34.7041,lng:135.5095,m:'店',r:90},{id:'water-pilot',n:'給水POINT',lat:34.7033,lng:135.5078,m:'水',r:90},{id:'sug-pilot',n:'S.u.G POINT',lat:34.7024,lng:135.5102,m:'S',r:90}];const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[135.5105,34.7032],zoom:16.1,pitch:65,bearing:-12,antialias:true});let user=null,last=null,walk=0,speed=null,heroM=null,selected=null;function hav(a,b){const R=6371000,p=Math.PI/180,d1=(b.lat-a.lat)*p,d2=(b.lng-a.lng)*p,x=Math.sin(d1/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
map.on('style.load',()=>{const st=map.getStyle(),layers=st.layers||[];let building=null;for(const l of layers){try{if(l.type==='symbol'){map.setLayoutProperty(l.id,'visibility','none');continue}const id=l.id.toLowerCase();if(l.type==='background')map.setPaintProperty(l.id,'background-color','#d5c79b');if(l.type==='fill'){if(id.includes('water'))map.setPaintProperty(l.id,'fill-color','#77a9b4');else if(id.includes('park')||id.includes('grass')||id.includes('wood')||id.includes('landuse'))map.setPaintProperty(l.id,'fill-color','#8fa77a');else if(id.includes('building')){map.setPaintProperty(l.id,'fill-color','#cdbb96');building=building||l}else map.setPaintProperty(l.id,'fill-opacity',.55)}if(l.type==='line'){if(id.includes('water'))map.setPaintProperty(l.id,'line-color','#5f8f9b');else if(id.includes('road')||id.includes('street')||id.includes('transport')){map.setPaintProperty(l.id,'line-color','#e7d7ab');map.setPaintProperty(l.id,'line-opacity',.9)}else map.setPaintProperty(l.id,'line-opacity',.35)}}catch(e){}}if(building&&building.source&&building['source-layer']){try{map.addLayer({id:'sug-3d-buildings',type:'fill-extrusion',source:building.source,'source-layer':building['source-layer'],filter:building.filter||['all'],minzoom:15,paint:{'fill-extrusion-color':'#c8b28b','fill-extrusion-height':['interpolate',['linear'],['zoom'],15,3,17,18],'fill-extrusion-base':0,'fill-extrusion-opacity':.72}})}catch(e){}}map.addSource('sugRoute',{type:'geojson',data:{type:'FeatureCollection',features:[]}});map.addLayer({id:'sugRouteGlow',type:'line',source:'sugRoute',paint:{'line-color':'#59d4ff','line-width':10,'line-opacity':.22,'line-blur':7}});map.addLayer({id:'sugRoute',type:'line',source:'sugRoute',paint:{'line-color':'#54cfff','line-width':4,'line-opacity':.9,'line-dasharray':[1,1.5]}});});
function qe(p){let e=document.createElement('div');e.className='marker'+(state.owned.includes(p.id)?' done':'');e.innerHTML=`<div class="flag">${p.n}<i>${p.m}</i></div><div class="pin"></div>`;e.onclick=()=>openP(p);return e}P.forEach(p=>new maplibregl.Marker({element:qe(p),anchor:'bottom'}).setLngLat([p.lng,p.lat]).addTo(map));function heroEl(){let e=document.createElement('div');e.className='hero';e.innerHTML=`<svg viewBox="0 0 138 166" xmlns="http://www.w3.org/2000/svg"><ellipse cx="69" cy="145" rx="55" ry="17" fill="#3cc8ff33" stroke="#6fdbff" stroke-width="4"/><circle cx="69" cy="72" r="27" fill="#e7b28d" stroke="#2a1a12" stroke-width="4"/><path d="M39 67Q43 28 69 25Q98 29 101 67L91 58Q82 43 70 46Q57 43 47 58Z" fill="#12151b"/><path d="M31 51Q33 20 69 16Q105 19 107 51L96 42Q72 31 42 43Z" fill="#11151a" stroke="#d8aa43" stroke-width="5"/><path d="M38 25L24 5M100 25L114 5M43 26Q69 0 95 26" fill="none" stroke="#e2b94e" stroke-width="7" stroke-linecap="round"/><circle cx="59" cy="73" r="3.7" fill="#24150e"/><circle cx="79" cy="73" r="3.7" fill="#24150e"/><path d="M61 85Q69 90 77 85" fill="none" stroke="#8d4937" stroke-width="2.5" stroke-linecap="round"/><path d="M39 98Q69 88 99 98L102 139Q69 153 36 139Z" fill="#11233a" stroke="#d1a441" stroke-width="5"/><path d="M46 107L92 107M44 119L94 119M42 131L96 131" stroke="#b7852f" stroke-width="4"/><circle cx="69" cy="112" r="13" fill="#c49837" stroke="#f0d16f" stroke-width="3"/><text x="69" y="118" text-anchor="middle" font-size="15" font-weight="900" fill="#16110c">菊</text><path d="M99 101L119 139" stroke="#22180f" stroke-width="7"/><path d="M116 137L127 151" stroke="#d3a443" stroke-width="4"/><path d="M39 104L21 126M99 104L116 122" stroke="#17243a" stroke-width="12" stroke-linecap="round"/><path d="M47 140L43 157M91 140L95 157" stroke="#151c28" stroke-width="12" stroke-linecap="round"/></svg>`;return e}
function near(){if(!user)return;const x=P.map(p=>[p,hav(user,p)]).sort((a,b)=>a[1]-b[1])[0];nextName.textContent=x[0].n;nextDist.textContent=`あと 約${Math.round(x[1])}m`;const src=map.getSource('sugRoute');if(src)src.setData({type:'Feature',geometry:{type:'LineString',coordinates:[[user.lng,user.lat],[x[0].lng,x[0].lat]]}})}function openP(p){selected=p;const d=user?hav(user,p):null;sheetName.textContent=p.n;sheetText.textContent=`距離：${d==null?'GPS待機中':Math.round(d)+'m'} ／ CARD GET条件：GPS到達・${MAX}km/h以下・歩行${REQ}m以上`;sheet.classList.add('on')}function pos(g){const n={lat:g.coords.latitude,lng:g.coords.longitude,t:g.timestamp};if(last){const ds=hav(last,n),dt=(n.t-last.t)/1000,calc=dt>0?ds/dt*3.6:null;speed=g.coords.speed!=null?g.coords.speed*3.6:calc;if(dt>0&&ds<120&&speed!=null&&speed<=MAX)walk+=ds}last=n;user=n;if(!heroM)heroM=new maplibregl.Marker({element:heroEl(),anchor:'bottom'}).setLngLat([n.lng,n.lat]).addTo(map);else heroM.setLngLat([n.lng,n.lat]);map.easeTo({center:[n.lng,n.lat],zoom:16.25,pitch:65,bearing:-12,duration:850});status.textContent=`GPS LIVE｜${speed==null?'--':speed.toFixed(1)} km/h｜歩行 ${Math.round(walk)}m`;near()}function claimNow(){if(!selected||!user)return alert('GPS取得中');const d=hav(user,selected);if(d>selected.r)return alert(`あと約${Math.round(d-selected.r)}m`);if(speed!=null&&speed>MAX)return alert('高速移動中は取得できません');if(walk<REQ)return alert(`歩行判定 あと${Math.ceil(REQ-walk)}m`);if(!state.owned.includes(selected.id)){state.owned.push(selected.id);save();location.reload()}else alert('取得済み')}navigator.geolocation?.watchPosition(pos,()=>status.textContent='GPS取得不可',{enableHighAccuracy:true,maximumAge:1000,timeout:15000});locate.onclick=()=>user&&map.easeTo({center:[user.lng,user.lat],zoom:16.25,pitch:65,bearing:-12});close.onclick=()=>sheet.classList.remove('on');go.onclick=()=>selected&&(location.href=`https://maps.apple.com/?daddr=${selected.lat},${selected.lng}&dirflg=w`);claim.onclick=claimNow;quest.onclick=()=>location.href='./quest-battle-mvp-v20.html?v=map-v8';body.onclick=()=>location.href='./index.html?v=map-v8';shop.onclick=()=>alert('SHOPは次段階で接続');collection.onclick=()=>alert(`MAP CARD ${state.owned.length}/${P.length}`);progress.textContent=`QUEST ${state.owned.length} / ${P.length}`;
</script></body></html>
