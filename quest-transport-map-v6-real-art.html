<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050403"><title>S.u.G QUEST｜REAL ART</title><style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head>
<body>
<iframe id="app" src="./quest-transport-map-v5-card-design.html?v=real-art-20260907"></iframe>
<script>
const app=document.getElementById('app');
app.addEventListener('load',()=>{
  const d=app.contentDocument;if(!d)return;
  const s=d.createElement('style');
  s.textContent=`
    .art[data-mark="河"]:before{background-image:linear-gradient(180deg,#0000 45%,#050403dd 92%),url('./assets/quest/kanan-person-card-scenes-20260904.webp?v=real-art-v6');background-size:300% 300%;background-position:50% 50%;background-repeat:no-repeat}
    .art[data-mark="河"]:after{display:none}
    .art[data-mark="千"]:before{background-image:linear-gradient(180deg,#0000 42%,#050403e8 94%),url('./assets/quest/chihaya-masashige-20260905.png?v=real-art-v6');background-size:cover;background-position:center 20%;background-repeat:no-repeat}
    .art[data-mark="千"]:after{display:none}
    .art[data-mark="河"],.art[data-mark="千"]{box-shadow:inset 0 0 40px #0008,0 7px 20px #0008}
    .art[data-mark="河"] .crest,.art[data-mark="千"] .crest{backdrop-filter:blur(5px);background:#080705d9}
    .miniArt.realKanan{background-image:linear-gradient(180deg,#0000 45%,#050403dd 92%),url('./assets/quest/kanan-person-card-scenes-20260904.webp?v=real-art-v6');background-size:300% 300%;background-position:50% 50%;background-repeat:no-repeat;color:transparent}
    .miniArt.realChihaya{background-image:linear-gradient(180deg,#0000 42%,#050403e8 94%),url('./assets/quest/chihaya-masashige-20260905.png?v=real-art-v6');background-size:cover;background-position:center 20%;background-repeat:no-repeat;color:transparent}
  `;
  d.head.appendChild(s);
  function tagMini(){d.querySelectorAll('.miniCard').forEach(card=>{const h=card.querySelector('h3');const art=card.querySelector('.miniArt');if(!h||!art)return;if(h.textContent.trim()==='河南')art.classList.add('realKanan');if(h.textContent.trim()==='千早赤阪')art.classList.add('realChihaya')})}
  tagMini();
  const mo=new MutationObserver(tagMini);mo.observe(d.body,{childList:true,subtree:true});
});
</script>
</body></html>
