<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/SuG-BODY-MANAGEMENT-SYSTEM/flutter-native-preview/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="sug_quest_mvp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>sug_quest_mvp</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;background:#081018;color:#f6d77a;font-family:-apple-system,BlinkMacSystemFont,sans-serif;">
  <div id="boot-status" style="position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:#081018;z-index:999999;padding:24px;">
    <div><div style="font-size:28px;font-weight:900;letter-spacing:.04em;">S.u.G QUEST</div><div id="boot-detail" style="margin-top:10px;font-size:12px;color:#ddd;">APP LOADING...</div></div>
  </div>
  <script>
    (() => {
      const hideWhenFlutterStarts = () => {
        if (document.querySelector('flt-glass-pane, flt-scene-host')) {
          document.getElementById('boot-status')?.remove();
          return true;
        }
        return false;
      };
      new MutationObserver(hideWhenFlutterStarts).observe(document.documentElement,{childList:true,subtree:true});
      setTimeout(() => {
        if (!hideWhenFlutterStarts()) {
          const d=document.getElementById('boot-detail');
          if(d) d.textContent='起動に時間がかかっています。再読み込みしてください。';
        }
      },12000);
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
