<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050403">
<title>S.u.G QUEST｜MAP LAUNCH FIX V14</title>
<style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<iframe id="app" src="./quest-transport-map-v13-go-field.html?v=map-launch-fix-v14-20260907" allow="geolocation"></iframe>
<script>
const app=document.getElementById('app');
function install(){
  try{
    const w=app.contentWindow;
    if(!w || typeof w.goMap!=='function') return false;
    w.goMap=function(best){
      const q=encodeURIComponent(best.spot.name);
      const url=`https://maps.apple.com/?daddr=${best.spot.lat},${best.spot.lng}&q=${q}&dirflg=w`;
      try{
        window.top.location.assign(url);
      }catch(e){
        window.open(url,'_blank','noopener');
      }
    };
    return true;
  }catch(e){return false}
}
app.addEventListener('load',()=>{let n=0;const t=setInterval(()=>{n++;if(install()||n>30)clearInterval(t)},100)});
</script>
</body>
</html>
