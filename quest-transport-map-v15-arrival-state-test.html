<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050403">
<title>S.u.G QUEST｜ARRIVAL STATE V15</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}.pilotBtn{position:fixed;z-index:1500;left:14px;bottom:calc(36px + env(safe-area-inset-bottom));padding:8px 11px;border:1px dashed #73603a;border-radius:999px;background:#080706e8;color:#a99a78;font:800 8px -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.06em}.pilotToast{position:fixed;z-index:1600;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;width:min(340px,90vw);padding:11px 13px;border:1px solid #4e6e56;border-radius:12px;background:#07110bcc;color:#b9f3c8;font:800 10px -apple-system,BlinkMacSystemFont,sans-serif;text-align:center;box-shadow:0 10px 28px #000c}.pilotToast.on{display:block}</style>
</head>
<body>
<iframe id="app" src="./quest-transport-map-v14-map-launch-fix.html?v=arrival-state-v15-20260907" allow="geolocation"></iframe>
<button id="pilotBtn" class="pilotBtn">PILOT FIELD TEST</button>
<div id="toast" class="pilotToast"></div>
<script>
const BASE='sugQuestTransportV2';
const app=document.getElementById('app');
function readBase(){try{return JSON.parse(localStorage.getItem(BASE)||'{}')}catch(e){return {}}}
function saveArrival(area){const s=readBase();s[area]=true;localStorage.setItem(BASE,JSON.stringify(s));window.dispatchEvent(new StorageEvent('storage',{key:BASE,newValue:JSON.stringify(s)}));return s}
function deepV13(){try{const v14=app.contentDocument;if(!v14)return null;const f=v14.getElementById('app');if(!f||!f.contentWindow)return null;return {w:f.contentWindow,d:f.contentDocument}}catch(e){return null}}
function install(){const r=deepV13();if(!r||typeof r.w.arrivalCheck!=='function'||r.w.__sugV15)return false;r.w.__sugV15=true;
  r.w.arrivalCheck=function(best){
    if(!r.w.navigator.geolocation)return;
    const box=r.d.getElementById('arriveStatus');if(box)box.textContent='現在地を確認中…';
    r.w.navigator.geolocation.getCurrentPosition(p=>{
      const d=r.w.hav(p.coords.latitude,p.coords.longitude,best.spot.lat,best.spot.lng);
      if(d<=180){
        saveArrival(best.area);
        if(box)box.textContent=`到着判定OK｜約${Math.round(d)}m｜GPS KEY保存 → MISSIONへ`;
        setTimeout(()=>{if(typeof r.w.openMission==='function')r.w.openMission()},650);
      }else if(box){box.textContent=`まだ到着前｜約${Math.round(d).toLocaleString()}m`;}
    },()=>{if(box)box.textContent='位置情報を取得できませんでした'},{enableHighAccuracy:true,timeout:7000,maximumAge:5000});
  };
  return true;
}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('on');setTimeout(()=>x.classList.remove('on'),2200)}
function pilot(){const r=deepV13();if(!r){toast('画面準備中。もう一度押してください');return}saveArrival('tenma');toast('PILOT：天満 GPS KEYだけ仮取得しました');setTimeout(()=>{try{if(typeof r.w.openMission==='function')r.w.openMission();else{const btn=r.d.getElementById('mission');if(btn)btn.click()}}catch(e){}},700)}
document.getElementById('pilotBtn').onclick=pilot;
app.addEventListener('load',()=>{let n=0;const t=setInterval(()=>{n++;if(install()||n>60)clearInterval(t)},120)});
</script>
</body>
</html>
