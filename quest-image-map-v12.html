tyle></head><body><div class="bg"></div><div id="live" class="live">GPS待機中</div><div class="pulse"></div><button class="hot h1" data-i="0"></button><button class="hot h2" data-i="1"></button><button class="hot h3" data-i="2"></button><button class="hot h4" data-i="3"></button><button class="hot h5" data-i="4"></button><section id="sheet" class="sheet"><button id="close" class="close">×</button><h2 id="name"></h2><p id="info"></p><div class="actions"><button id="go" class="btn go">ここへ行く</button><button id="claim" class="btn claim">GPS CHECK</button></div></section><script>const STORE='sugQuestMapHomeV1',MAX=12,REQ=15;let s;try{s=JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){s={}}if(!Array.isArray(s.owned))s.owned=[];const P=[{id:'kunishige',n:'刀剣 國重',lat:34.7008,lng:135.5098,r:90},{id:'osaka-tenmangu',n:'大阪天満宮',lat:34.6961,lng:135.5125,r:90},{id:'tsukushi',n:'天満つくし',lat:34.7043,lng:135.5118,r:90},{id:'ryo',n:'焼肉ホルモンりょう',lat:34.7050,lng:135.5110,r:90},{id:'takoyaki',n:'名物ばぁちゃんのたこ焼き',lat:34.7047,lng:135.5099,r:90}];let user=null,last=null,walk=0,speed=null,sel=null;function h(a,b){const R=6371000,p=Math.PI/180,d1=(b.lat-a.lat)*p,d2=(b.lng-a.lng)*p,z=Math.sin(d1/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(z))}function openP(p){sel=p;const d=user?Math.round(h(user,p)):null;name.textContent=p.n;info.textContent=`距離：${d==null?'GPS待機中':d+'m'}｜CARD GET条件：GPS到達・${MAX}km/h以下・歩行${REQ}m以上`;sheet.classList.add('on')}document.querySelectorAll('.hot').forEach(b=>b.onclick=()=>openP(P[+b.dataset.i]));close.onclick=()=>sheet.classList.remove('on');go.onclick=()=>sel&&(location.href=`https://maps.apple.com/?daddr=${sel.lat},${sel.lng}&dirflg=w`);claim.onclick=()=>{if(!sel||!user)return alert('GPS取得中');const d=h(user,sel);if(d>sel.r)return alert(`あと約${Math.round(d-sel.r)}m`);if(speed!=null&&speed>MAX)return alert('高速移動中は取得できません');if(walk<REQ)return alert(`歩行判定 あと${Math.ceil(REQ-walk)}m`);if(!s.owned.includes(sel.id)){s.owned.push(sel.id);localStorage.setItem(STORE,JSON.stringify(s));alert('CARD GET! '+sel.n);sheet.classList.remove('on')}else alert('取得済み')};navigator.geolocation?.watchPosition(g=>{const n={lat:g.coords.latitude,lng:g.coords.longitude,t:g.timestamp};if(last){const ds=h(last,n),dt=(n.t-last.t)/1000,calc=dt>0?ds/dt*3.6:null;speed=g.coords.speed!=null?g.coords.speed*3.6:calc;if(dt>0&&ds<120&&speed!=null&&speed<=MAX)walk+=ds}last=n;user=n;live.textContent=`GPS LIVE｜${speed==null?'--':speed.toFixed(1)} km/h｜歩行 ${Math.round(walk)}m`},()=>live.textContent='GPS取得不可',{enableHighAccuracy:true,maximumAge:1000,timeout:15000});</script></body></html>
