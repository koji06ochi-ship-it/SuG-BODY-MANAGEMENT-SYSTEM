<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b1822"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><title>S.u.G QUEST V13</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1822;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.world{position:fixed;inset:0;background:#0b1822}.world img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}.gps{position:fixed;z-index:10;left:4.5%;top:11.7%;padding:7px 11px;border-radius:999px;border:2px solid #b98e45;background:#11161bef;color:#fff;font-weight:900;font-size:12px;box-shadow:0 4px 12px #0008}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#1ee69d;margin-right:6px;box-shadow:0 0 8px #1ee69d}.hot{position:fixed;z-index:11;border:0;background:transparent}.h1{left:5%;top:16%;width:27%;height:25%}.h2{left:36%;top:17%;width:30%;height:21%}.h3{right:2%;top:20%;width:25%;height:22%}.h4{left:23%;top:29%;width:29%;height:22%}.h5{right:1%;top:37%;width:27%;height:24%}.nextHot{left:3%;bottom:13%;width:55%;height:17%}.nav{position:fixed;z-index:11;bottom:0;height:12%;border:0;background:transparent}.n1{left:0;width:20%}.n2{left:20%;width:20%}.n3{left:40%;width:20%}.n4{left:60%;width:20%}.n5{left:80%;width:20%}.sheet{position:fixed;z-index:30;left:0;right:0;bottom:-75vh;max-height:62vh;overflow:auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom));background:linear-gradient(#f6e8bf,#d6bd80);border-top:4px solid #51351b;border-radius:22px 22px 0 0;box-shadow:0 -8px 24px #0008;transition:.2s;color:#21150d}.sheet.on{bottom:0}.sheet h2{font:900 23px "Yu Mincho",serif}.sheet p{white-space:pre-line;font-size:13px;line-height:1.65;font-weight:700}.close{float:right;border:0;width:38px;height:38px;border-radius:50%;background:#21170f;color:#f4da94;font-size:20px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{padding:13px;border-radius:10px;border:2px solid #56391c;font-weight:900}.go{background:#dfbe70}.claim{background:#243e2d;color:#d8f2df}</style></head><body><div class="world"><img id="bg" alt="S.u.G QUEST 天満ゲームマップ"></div><div id="gps" class="gps"><span class="dot"></span>GPS LIVE｜-- km/h｜歩行 0m</div><button class="hot h1" data-id="kunishige"></button><button class="hot h2" data-id="tenmangu"></button><button class="hot h3" data-id="tsukushi"></button><button class="hot h4" data-id="ryo"></button><button class="hot h5" data-id="takoyaki"></button><button class="hot nextHot" data-id="kunishige"></button><button class="nav n1"></button><button class="nav n2" id="questNav"></button><button class="nav n3" id="collectionNav"></button><button class="nav n4"></button><button class="nav n5" id="bodyNav"></button><section id="sheet" class="sheet"><button id="close" class="close">×</button><h2 id="name"></h2><p id="info"></p><div class="actions"><button id="go" class="btn go">ここへ行く</button><button id="claim" class="btn claim">GPS CHECK</button></div></section><script>
fetch('./assets/quest-bg-v13-small.jpg.b64.txt?v=2',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()}).then(t=>{bg.src='data:image/jpeg;base64,'+t.trim()}).catch(()=>{document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;inset:35% 10% auto;z-index:99;color:white;text-align:center;font-weight:900">MAP画像読込エラー</div>')});
const STORE='sugQuestMapHomeV1',MAX=12,REQ=15;let st;try{st=JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){st={}}if(!Array.isArray(st.owned))st.owned=[];const P={kunishige:{n:'刀剣 國重',lat:34.7040,lng:135.5092,r:90},tenmangu:{n:'大阪天満宮',lat:34.6961,lng:135.5125,r:90},tsukushi:{n:'天満つくし',lat:34.7044,lng:135.5122,r:90},ryo:{n:'焼肉ホルモン りょう',lat:34.7041,lng:135.5095,r:90},takoyaki:{n:'名物ばぁちゃんのたこ焼き',lat:34.7047,lng:135.5127,r:90}};let u=null,last=null,walk=0,speed=null,sel=null;function hav(a,b){const R=6371000,p=Math.PI/180,d1=(b.lat-a.lat)*p,d2=(b.lng-a.lng)*p,z=Math.sin(d1/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(z))}function openP(id){sel=P[id];const d=u?hav(u,sel):null;name.textContent=sel.n;info.textContent='距離：'+(d==null?'GPS取得中':Math.round(d)+'m')+'\nCARD GET：GPS到達＋速度'+MAX+'km/h以下＋起動中の歩行'+REQ+'m以上';sheet.classList.add('on')}document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openP(b.dataset.id));close.onclick=()=>sheet.classList.remove('on');go.onclick=()=>sel&&(location.href='https://maps.apple.com/?daddr='+sel.lat+','+sel.lng+'&dirflg=w');claim.onclick=()=>{if(!sel||!u)return alert('GPS取得中');const d=hav(u,sel);if(d>sel.r)return alert('あと約'+Math.round(d-sel.r)+'m');if(speed!=null&&speed>MAX)return alert('高速移動中は取得できません');if(walk<REQ)return alert('歩行判定 あと'+Math.ceil(REQ-walk)+'m');const id=Object.keys(P).find(k=>P[k]===sel);if(!st.owned.includes(id)){st.owned.push(id);localStorage.setItem(STORE,JSON.stringify(st));alert('CARD GET! '+sel.n);sheet.classList.remove('on')}else alert('取得済み')};navigator.geolocation?.watchPosition(g=>{const n={lat:g.coords.latitude,lng:g.coords.longitude,t:g.timestamp};if(last){const ds=hav(last,n),dt=(n.t-last.t)/1000,calc=dt>0?ds/dt*3.6:null;speed=g.coords.speed!=null?g.coords.speed*3.6:calc;if(dt>0&&ds<120&&speed!=null&&speed<=MAX)walk+=ds}last=n;u=n;gps.innerHTML='<span class="dot"></span>GPS LIVE｜'+(speed==null?'--':speed.toFixed(1))+' km/h｜歩行 '+Math.round(walk)+'m'},()=>gps.textContent='GPS取得不可',{enableHighAccuracy:true,maximumAge:1000,timeout:15000});questNav.onclick=()=>location.href='./quest-battle-mvp-v20.html?v=image-v13';bodyNav.onclick=()=>location.href='./index.html?v=image-v13';collectionNav.onclick=()=>alert('MAP CARD '+st.owned.length+'/5');
</script></body></html>
