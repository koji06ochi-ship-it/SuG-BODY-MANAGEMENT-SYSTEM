<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#8fa47a"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><title>S.u.G QUEST V7</title><link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"><style>*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}body{background:#91a77b}#map{position:fixed;inset:0}.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{display:none}.top{position:fixed;z-index:20;left:14px;right:14px;top:calc(9px + env(safe-area-inset-top));display:flex;gap:9px;pointer-events:none}.scroll,.area{background:linear-gradient(#f4e4b8,#d5bb7d);border:3px solid #52351b;color:#1e140c;box-shadow:0 5px 14px #0007}.scroll{flex:1;padding:10px 13px;border-radius:6px}.scroll b{font:900 21px Georgia,"Yu Mincho",serif}.scroll small{display:block;font-size:9px;font-weight:900}.area{width:126px;padding:8px;border-radius:6px}.area b{font:900 14px "Yu Mincho",serif;display:block}.area small{font-size:9px}.status{position:fixed;z-index:20;left:14px;top:calc(82px + env(safe-area-inset-top));background:#171610e8;border:2px solid #bd9346;color:#f4dfaa;border-radius:999px;padding:7px 10px;font-size:9px;font-weight:900}.gps{position:fixed;z-index:20;right:15px;top:calc(88px + env(safe-area-inset-top));width:49px;height:49px;border-radius:50%;background:#171713;border:3px solid #d1a74e;color:#f4d77c;font-size:22px}.quest{width:70px;height:105px;filter:drop-shadow(0 8px 7px #0007);cursor:pointer}.banner{position:absolute;left:7px;top:0;width:56px;min-height:78px;padding:8px 4px 20px;background:linear-gradient(90deg,#e9d5a4,#fff1ca,#e4ce98);border:3px solid #4b321d;border-radius:3px;color:#24170d;text-align:center;font:900 13px/1.15 "Yu Mincho",serif;box-shadow:inset 0 0 0 2px #b78d43}.banner:before,.banner:after{content:"";position:absolute;left:-7px;right:-7px;height:7px;border-radius:5px;background:#3a2819;border:2px solid #b88c40}.banner:before{top:-5px}.banner:after{bottom:-5px}.icon{display:block;margin:5px auto 0;width:35px;height:35px;border-radius:50%;background:#251b13;color:#f1d16e;display:grid;place-items:center;font-size:20px}.pin{position:absolute;left:27px;bottom:1px;width:16px;height:16px;border-radius:50%;background:#c53325;border:3px solid #f0c55c;box-shadow:0 0 14px #ff8c38}.quest.done{opacity:.45}.hero{width:132px;height:154px;position:relative;filter:drop-shadow(0 12px 8px #0008)}.halo{position:absolute;left:8px;bottom:0;width:116px;height:39px;border-radius:50%;background:#39bdf035;border:3px solid #6bd7ff;box-shadow:0 0 20px #38c9ff}.sam{position:absolute;left:30px;top:0;width:74px;height:132px;animation:bob .5s ease-in-out infinite alternate}.kab{position:absolute;left:2px;top:0;width:70px;height:44px;border-radius:22px 22px 8px 8px;background:linear-gradient(#080c12,#332b19);border:4px solid #d9ad45}.kab:before,.kab:after{content:"";position:absolute;top:-22px;width:33px;height:33px;border-top:6px solid #e0b74b}.kab:before{left:-12px;border-left:6px solid #e0b74b;transform:rotate(-25deg)}.kab:after{right:-12px;border-right:6px solid #e0b74b;transform:rotate(25deg)}.face{position:absolute;left:15px;top:39px;width:43px;height:38px;border-radius:12px;background:#e1b18b;border:3px solid #342116}.face:after{content:"•   •";position:absolute;left:8px;top:5px}.armor{position:absolute;left:7px;top:73px;width:60px;height:54px;border-radius:8px 8px 14px 14px;background:linear-gradient(90deg,#0a1321,#20395d,#0a1321);border:4px solid #d0a23e}.armor:before{content:"菊";display:block;text-align:center;color:#f1cf69;font:bold 19px "Yu Mincho",serif;line-height:43px}.armor:after{content:"";position:absolute;right:-17px;top:0;width:8px;height:60px;background:#16120e;border:2px solid #d2a541;transform:rotate(17deg);border-radius:5px}@keyframes bob{to{transform:translateY(-6px)}}.next{position:fixed;z-index:20;left:14px;bottom:calc(91px + env(safe-area-inset-bottom));width:min(315px,76vw);padding:9px 11px;background:linear-gradient(#f5e7bf,#d6bd82);border:3px solid #51351b;border-radius:6px;box-shadow:0 7px 18px #0007;color:#21150c}.next small{font-weight:900;color:#765128}.next b{display:block;font:900 19px "Yu Mincho",serif}.next span{font-size:11px;font-weight:800}.bottom{position:fixed;z-index:21;left:0;right:0;bottom:0;height:79px;padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);background:linear-gradient(#181713f8,#080b0df8);border-top:3px solid #977135}.nav{border:0;border-right:1px solid #594627;background:transparent;color:#d6bb77;font-size:9px;font-weight:900}.nav b{display:block;font-size:23px}.nav.on{background:#312514;color:#ffe19b}.sheet{position:fixed;z-index:30;left:0;right:0;bottom:-80vh;max-height:68vh;overflow:auto;padding:15px 16px calc(92px + env(safe-area-inset-bottom));background:linear-gradient(#f5e8c4,#d6bf89);border-top:4px solid #51351b;border-radius:20px 20px 0 0;transition:.2s}.sheet.on{bottom:0}.sheet h2{font-family:"Yu Mincho",serif}.close{float:right;border:0;border-radius:50%;width:38px;height:38px;background:#21170f;color:#f4da94;font-size:20px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{padding:13px;border-radius:9px;border:2px solid #56391c;font-weight:900}.go{background:#dfbe70}.claim{background:#243e2d;color:#d8f2df}</style></head><body><div id="map"></div><div class="top"><div class="scroll"><b>S.u.G QUEST</b><small>歩いてつなぐ、歴史とカラダ</small></div><div class="area"><b>天満エリア</b><small id="progress">QUEST 0 / 0</small></div></div><div id="status" class="status">GPS待機中</div><button id="locate" class="gps">◎</button><div class="next"><small>NEXT QUEST</small><b id="nextName">近くのQUEST POINT</b><span id="nextDist">GPSで探索中</span></div><nav class="bottom"><button class="nav on"><b>⛩</b>MAP</button><button id="quest" class="nav"><b>▤</b>QUEST</button><button id="collection" class="nav"><b>◇</b>COLLECTION</button><button id="body" class="nav"><b>＋</b>BODY</button></nav><section id="sheet" class="sheet"><button id="close" class="close">×</button><h2 id="sheetName"></h2><p id="sheetText"></p><div class="actions"><button id="go" class="btn go">ここへ行く</button><button id="claim" class="btn claim">GPS CHECK</button></div></section><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>
const STORE='sugQuestMapHomeV1',MAX=12,REQ=15;let state;try{state=JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){state={}}if(!Array.isArray(state.owned))state.owned=[];const save=()=>localStorage.setItem(STORE,JSON.stringify(state));const P=[{id:'osaka-tenmangu',n:'大阪天満宮',lat:34.6961,lng:135.5125,m:'⛩',r:90},{id:'temma-station',n:'JR 天満駅',lat:34.7049,lng:135.5113,m:'駅',r:90},{id:'ogimachi',n:'扇町公園',lat:34.7051,lng:135.5088,m:'休',r:100},{id:'shop-pilot',n:'店舗POINT',lat:34.7041,lng:135.5095,m:'店',r:90},{id:'water-pilot',n:'給水POINT',lat:34.7033,lng:135.5078,m:'水',r:90},{id:'sug-pilot',n:'S.u.G POINT',lat:34.7024,lng:135.5102,m:'S',r:90}];const style={version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap'}},layers:[{id:'paper',type:'background',paint:{'background-color':'#d7c99a'}},{id:'osm',type:'raster',source:'osm',paint:{'raster-saturation':-0.72,'raster-contrast':-0.28,'raster-brightness-min':0.25,'raster-brightness-max':0.93,'raster-opacity':0.42,'raster-hue-rotate':18}}]};const map=new maplibregl.Map({container:'map',style,center:[135.5105,34.7032],zoom:16,pitch:58,bearing:-10,antialias:true});let user=null,last=null,walk=0,speed=null,heroM=null,selected=null;function hav(a,b){const R=6371000,p=Math.PI/180,d1=(b.lat-a.lat)*p,d2=(b.lng-a.lng)*p,x=Math.sin(d1/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(x))}function qe(p){let e=document.createElement('div');e.className='quest'+(state.owned.includes(p.id)?' done':'');e.innerHTML=`<div class="banner">${p.n}<span class="icon">${p.m}</span></div><div class="pin"></div>`;e.onclick=()=>openP(p);return e}P.forEach(p=>new maplibregl.Marker({element:qe(p),anchor:'bottom'}).setLngLat([p.lng,p.lat]).addTo(map));function he(){let e=document.createElement('div');e.className='hero';e.innerHTML='<div class="halo"></div><div class="sam"><div class="kab"></div><div class="face"></div><div class="armor"></div></div>';return e}function near(){if(!user)return;let x=P.map(p=>[p,hav(user,p)]).sort((a,b)=>a[1]-b[1])[0];nextName.textContent=x[0].n;nextDist.textContent=`あと 約${Math.round(x[1])}m`;}function openP(p){selected=p;let d=user?hav(user,p):null;sheetName.textContent=p.n;sheetText.textContent=`距離：${d==null?'GPS待機中':Math.round(d)+'m'} ／ CARD GET条件：GPS到達・${MAX}km/h以下・歩行${REQ}m以上`;sheet.classList.add('on')}function pos(g){let n={lat:g.coords.latitude,lng:g.coords.longitude,t:g.timestamp};if(last){let ds=hav(last,n),dt=(n.t-last.t)/1000,calc=dt>0?ds/dt*3.6:null;speed=g.coords.speed!=null?g.coords.speed*3.6:calc;if(dt>0&&ds<120&&speed!=null&&speed<=MAX)walk+=ds}last=n;user=n;if(!heroM)heroM=new maplibregl.Marker({element:he(),anchor:'bottom'}).setLngLat([n.lng,n.lat]).addTo(map);else heroM.setLngLat([n.lng,n.lat]);map.easeTo({center:[n.lng,n.lat],zoom:16.25,pitch:58,bearing:-10,duration:800});status.textContent=`GPS LIVE｜${speed==null?'--':speed.toFixed(1)} km/h｜歩行 ${Math.round(walk)}m`;near()}function claimNow(){if(!selected||!user)return alert('GPS取得中');let d=hav(user,selected);if(d>selected.r)return alert(`あと約${Math.round(d-selected.r)}m`);if(speed!=null&&speed>MAX)return alert('高速移動中は取得できません');if(walk<REQ)return alert(`歩行判定 あと${Math.ceil(REQ-walk)}m`);if(!state.owned.includes(selected.id)){state.owned.push(selected.id);save();location.reload()}else alert('取得済み')}navigator.geolocation?.watchPosition(pos,()=>status.textContent='GPS取得不可',{enableHighAccuracy:true,maximumAge:1000,timeout:15000});locate.onclick=()=>user&&map.easeTo({center:[user.lng,user.lat],zoom:16.25,pitch:58,bearing:-10});close.onclick=()=>sheet.classList.remove('on');go.onclick=()=>selected&&(location.href=`https://maps.apple.com/?daddr=${selected.lat},${selected.lng}&dirflg=w`);claim.onclick=claimNow;quest.onclick=()=>location.href='./quest-battle-mvp-v20.html?v=map-v7';body.onclick=()=>location.href='./index.html?v=map-v7';collection.onclick=()=>alert(`MAP CARD ${state.owned.length}/${P.length}`);progress.textContent=`QUEST ${state.owned.length} / ${P.length}`;
</script></body></html>
