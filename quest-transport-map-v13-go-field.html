<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050403"><title>S.u.G QUEST｜NEXT QUEST V13</title><style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif}iframe{border:0;width:100%;height:100%;display:block}#nextBtn{position:fixed;z-index:1200;right:14px;bottom:calc(88px + env(safe-area-inset-bottom));border:1px solid #b78a37;border-radius:999px;padding:11px 14px;background:linear-gradient(135deg,#2b1e08,#0a0805);color:#ffe29a;font-size:10px;font-weight:900;box-shadow:0 8px 24px #000b}.panel{position:fixed;z-index:1300;inset:0;display:none;background:radial-gradient(circle at 50% 0,#231a0b,#050403 38%,#000 78%);color:#fff;overflow:auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(34px + env(safe-area-inset-bottom))}.panel.on{display:block}.head{display:flex;align-items:center;gap:8px;position:sticky;top:0;background:linear-gradient(#050403 78%,#05040300);padding-bottom:12px}.back{border:0;background:none;color:#f2cc72;font-size:30px}.title{color:#ffe6a6;font:700 24px Georgia,'Yu Mincho',serif}.hero{border:1px solid #765a2b;border-radius:18px;padding:15px;background:linear-gradient(145deg,#120d07,#080604);box-shadow:0 12px 32px #0009}.kicker{color:#d5ae55;font-size:9px;font-weight:900;letter-spacing:.14em}.hero h2{margin:6px 0;color:#fff0bd;font:700 26px Georgia,'Yu Mincho',serif}.meta{color:#a79d8c;font-size:9px;line-height:1.55}.dist{margin-top:10px;color:#9ce8b2;font-size:11px;font-weight:900}.status{margin-top:8px;padding:8px 10px;border:1px solid #315d3d;border-radius:9px;color:#aef2bd;font-size:9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions button,.go{padding:12px;border:1px solid #665027;border-radius:10px;background:#0c0906;color:#e5bd63;font-weight:900}.go{display:block;width:100%;margin-top:8px;background:linear-gradient(#f0d37d,#b48a35);color:#171006}.arrival{display:block;width:100%;margin-top:8px;background:linear-gradient(135deg,#123c25,#07150d);border-color:#2d7a4c;color:#aef2bd}.section{margin-top:16px}.section h3{margin:0 0 8px;color:#d7b15a;font-size:11px;letter-spacing:.1em}.item{padding:11px;border:1px solid #3a2e1c;border-radius:12px;background:#0a0806;margin:7px 0}.itemTop{display:flex;justify-content:space-between;gap:8px}.itemName{color:#f2dfb2;font-weight:800}.itemNo{color:#8f8677;font:700 9px monospace}.small{color:#9e9588;font-size:9px;line-height:1.5;margin-top:5px}.empty{color:#8e877d;font-size:10px;padding:14px;border:1px dashed #3a3228;border-radius:10px}.note{margin-top:18px;color:#817a70;font-size:8px;line-height:1.6}</style></head><body>
<iframe id="app" src="./quest-transport-map-v11-mission-card-link.html?v=nextquest-v13-20260907"></iframe>
<button id="nextBtn">NEXT QUEST</button>
<section id="panel" class="panel"><div class="head"><button class="back" id="close">‹</button><div class="title">NEXT QUEST</div></div><div id="content"></div></section>
<script>
const PILOT='sugQuestFieldV10';
const spots={kanan:{name:'河南町役場',lat:34.4916299,lng:135.6297076},chihaya:{name:'千早赤阪村役場',lat:34.4644967,lng:135.6224417},taishi:{name:'道の駅 近つ飛鳥の里・太子',lat:34.5167666,lng:135.6584825},tenma:{name:'大阪天満宮',lat:34.695530,lng:135.512634}};
const cards=[['01','楠木正成〈河南〉','kanan'],['02','河南マンホール','kanan'],['03','河南の農産物','kanan'],['04','山の水','kanan'],['05','楠木正成〈千早城〉','chihaya'],['06','千早赤阪マンホール','chihaya'],['07','金剛山・峠','chihaya'],['08','千早攻略','chihaya'],['09','聖徳太子','taishi'],['10','太子マンホール','taishi'],['11','竹内街道','taishi'],['12','往来・街道','taishi'],['13','菅原道真','tenma'],['14','天満マンホール探索','tenma'],['15','天満の商い','tenma'],['16','天満・川の町','tenma'],['17','近鉄','taishi'],['18','鉄道駅','tenma'],['19','米・野菜・水','kanan'],['20','刀剣','tenma'],['21','甲冑','chihaya'],['22','家紋','kanan'],['23','山側三地域制覇','taishi'],['24','山から街へ','tenma']];
function read(k,f){try{return JSON.parse(localStorage.getItem(k)||f)}catch(e){return JSON.parse(f)}}function got(){return read(PILOT,'{"steps":{},"quests":{},"got":{}}').got||{}}function pendingByArea(a){const g=got();return cards.filter(c=>c[2]===a&&!g[c[0]])}function hav(a,b,c,d){const R=6371000,to=x=>x*Math.PI/180;const x=to(c-a),y=to(d-b),q=Math.sin(x/2)**2+Math.cos(to(a))*Math.cos(to(c))*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function choose(pos){let best=null;for(const a of Object.keys(spots)){const p=pendingByArea(a);if(!p.length)continue;const s=spots[a],dist=pos?hav(pos.coords.latitude,pos.coords.longitude,s.lat,s.lng):99999999,score=dist-(p.length*200);if(!best||score<best.score)best={area:a,spot:s,dist,pending:p,score}}return best}
function openMission(){document.getElementById('panel').classList.remove('on');const f=document.getElementById('app');try{const d=f.contentDocument;const btn=d?.getElementById('missionBtn');if(btn)btn.click()}catch(e){}}
function goMap(best){const q=encodeURIComponent(best.spot.name);const url=`https://maps.apple.com/?daddr=${best.spot.lat},${best.spot.lng}&q=${q}&dirflg=w`;location.href=url}
function arrivalCheck(best){if(!navigator.geolocation)return;const box=document.getElementById('arriveStatus');box.textContent='現在地を確認中…';navigator.geolocation.getCurrentPosition(p=>{const d=hav(p.coords.latitude,p.coords.longitude,best.spot.lat,best.spot.lng);box.textContent=d<=180?`到着判定OK｜約${Math.round(d)}m → MISSIONへ`:`まだ到着前｜約${Math.round(d).toLocaleString()}m`;if(d<=180)setTimeout(openMission,700)},()=>box.textContent='位置情報を取得できませんでした',{enableHighAccuracy:true,timeout:7000,maximumAge:5000})}
function render(best,locKnown){const c=document.getElementById('content');if(!best){c.innerHTML='<div class="empty">SEASON 01の取得対象はすべて完了。次はSEASON 02「街から海へ」。</div>';return}const next=best.pending.slice(0,4);c.innerHTML=`<div class="hero"><div class="kicker">RECOMMENDED FIELD</div><h2>${best.spot.name}</h2><div class="meta">${best.area.toUpperCase()} AREA｜未取得 ${best.pending.length} 枚</div><div class="dist">${locKnown?Math.round(best.dist).toLocaleString()+' m':'現在地未取得｜エリア優先度で表示'}</div><button class="go" id="go">現地へ向かう</button><button class="arrival" id="arrive">到着したらGPS CHECK</button><div id="arriveStatus" class="status">現地180m以内で到着判定 → MISSIONへ</div><div class="actions"><button id="gps">GPS再取得</button><button id="mission">MISSIONを見る</button></div></div><div class="section"><h3>ここで狙えるカード</h3>${next.map(x=>`<div class="item"><div class="itemTop"><div class="itemName">${x[1]}</div><div class="itemNo">S01-${x[0]}</div></div><div class="small">GPS / 歩数 / QUEST CLEAR条件をMISSIONで確認。</div></div>`).join('')}</div><div class="section"><h3>NEXT ROUTE</h3><div class="item"><div class="small">${best.area==='kanan'?'河南 → 千早赤阪 / 太子':best.area==='chihaya'?'千早赤阪 → 太子':best.area==='taishi'?'太子 → 天満':'天満 → 大川・堂島川｜SEASON 02'}</div></div></div>`;document.getElementById('go').onclick=()=>goMap(best);document.getElementById('arrive').onclick=()=>arrivalCheck(best);document.getElementById('gps').onclick=load;document.getElementById('mission').onclick=openMission}
function load(){if(!navigator.geolocation){render(choose(null),false);return}navigator.geolocation.getCurrentPosition(p=>render(choose(p),true),()=>render(choose(null),false),{enableHighAccuracy:true,timeout:7000,maximumAge:30000})}
document.getElementById('nextBtn').onclick=()=>{document.getElementById('panel').classList.add('on');load()};document.getElementById('close').onclick=()=>document.getElementById('panel').classList.remove('on');
</script></body></html>
