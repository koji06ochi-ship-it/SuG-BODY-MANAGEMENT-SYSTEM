<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><title>S.u.G QUEST｜ロケハン13 V15</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06100b}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="recon" src="./quest-map-home-loc-han-v14.html?v=hole-icon-v15" allow="geolocation"></iframe><script>
const outer=document.getElementById('recon');
function fix(){
  const vd=outer.contentDocument;if(!vd)return;
  const inner=vd.getElementById('app');if(!inner||!inner.contentDocument)return;
  const d=inner.contentDocument;
  if(!d.getElementById('mhHoleFix')){const s=d.createElement('style');s.id='mhHoleFix';s.textContent='.m-manhole{display:grid!important;font-size:17px!important}';d.head.appendChild(s)}
  d.querySelectorAll('.m-manhole').forEach(el=>{el.textContent='🕳️';el.style.display='grid'});
  d.querySelectorAll('.chip').forEach(b=>{if(b.textContent.trim()==='マンホール')b.style.display=''});
  vd.querySelectorAll('.rp b').forEach(b=>{if(/^蓋\s/.test(b.textContent))b.textContent=b.textContent.replace(/^蓋\s/,'🕳️ ')});
}
outer.addEventListener('load',()=>{setTimeout(fix,350);setTimeout(fix,1000);const vd=outer.contentDocument;const inner=vd?.getElementById('app');inner?.addEventListener('load',()=>{fix();new MutationObserver(fix).observe(inner.contentDocument.body,{subtree:true,childList:true})});new MutationObserver(fix).observe(vd.body,{subtree:true,childList:true})});
</script></body></html>
