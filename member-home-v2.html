</style></head><body><main class="wrap"><section class="hero"><div class="eyebrow">TODAY FLOW</div><h1>理想の身体</h1><div class="muted">理想を確認してから、今日の状態へ進みます。</div><button id="openIdeal" class="btn btnGold">理想を確認・変更する →</button></section><section class="card"><h2 class="sectionTitle">現在の理想</h2><div class="idealNow"><img id="idealThumb" class="idealThumb"><div class="idealMeta"><b id="idealName">未設定</b><small id="idealDetail">理想体型を選択してください</small></div></div></section><section class="card"><div class="eyebrow">TODAY CONDITION</div><h2 class="sectionTitle">今日の状態</h2><div id="condition" class="condition"></div><button id="saveCondition" class="btn btnGold">今日の状態を保存・判定 →</button><div id="saveState" class="saveState"></div></section><section class="card"><div class="eyebrow">TODAY DECISION</div><h2 class="sectionTitle">今日の判定</h2><div class="decision"><div id="decisionMain" class="decisionMain">未判定</div><div class="decisionGrid"><div><span>推奨時間</span><b id="decisionTime">--</b></div><div><span>推奨RIR</span><b id="decisionRir">--</b></div><div><span>強度</span><b id="decisionIntensity">--</b></div><div><span>方針</span><b id="decisionPolicy">--</b></div></div><div id="decisionReason" class="reason">今日の状態を入力して保存すると判定します。</div></div></section><section class="card"><div class="eyebrow">TODAY MENU</div><div class="menuHead"><div><h2 class="sectionTitle">今日のメニュー</h2><div id="menuSub" class="muted">判定後に生成します。</div></div><div id="menuDay" class="menuDay">--</div></div><div id="menuList"></div><div id="sessionTools" style="display:none"><div class="progress"><i id="progressBar"></i></div><div id="progressText" class="sessionStatus"></div><button id="finishSession" class="btn btnGold">セッション完了・保存</button><div id="sessionStatus" class="sessionStatus"></div></div></section><section class="card"><div class="eyebrow">PROGRESSION</div><h2 class="sectionTitle">e1RM・前回比・NEXT LOAD</h2><div id="analysisList"><div class="muted">セッション完了後に分析します。</div></div><div id="buildInfo" class="saveState">BUILD HTML 26.5.259</div></section></main><div id="idealModal" class="modal"><div class="sheet"><div class="toprow"><div><div class="eyebrow">S.u.G OSAKA</div><h2>理想の体型を選ぶ</h2></div><button id="closeIdeal" class="close">×</button></div><div class="seg"><button data-gender="male" class="on">男性｜ひょっとこ</button><button data-gender="female">女性｜おかめ</button></div><div id="typeRail" class="typeRail"></div><div class="modelCard"><img id="modelImg"><h2 id="modelName"></h2><div id="modelJp" class="muted"></div><div class="spec"><div><span>体脂肪率</span><b id="modelBf"></b></div><div><span>筋量</span><b id="modelMuscle"></b></div></div><button id="saveIdeal" class="btn btnGold">この体型を目標にする</button></div></div></div><script>
(()=>{'use strict';const IK='sug_ideal_shadow_v2',CK='sug_today_condition_v2',DK='sug_today_decision_v2',MK='sug_today_menu_v2',WK='sug_today_workout_v2',SK='sug_training_sessions_v2';const $=id=>document.getElementById(id),read=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},day=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const male=[['slim','SLIM','スリム','12–18%','LOW–MID','assets/ideal-vision/v26.5.20/slim.webp'],['athletic','ATHLETIC','アスレチック','10–15%','MID','assets/ideal-vision/v26.5.20/athletic.webp'],['fitness','FITNESS','フィットネス','8–13%','MID–HIGH','assets/ideal-vision/v26.5.20/fitness.webp'],['muscular','MUSCULAR','マスキュラー','10–15%','HIGH','assets/ideal-vision/v26.5.20/muscular.webp'],['physique','PHYSIQUE','フィジーク','7–12%','HIGH','assets/ideal-vision/v26.5.20/physique.webp']],female=[['slim','SLIM','スリム','22–28%','LOW–MID','assets/ideal-vision/v26.5.24/okame-slim.webp'],['athletic','ATHLETIC','アスレチック','20–26%','MID','assets/ideal-vision/v26.5.24/okame-athletic.webp'],['fitness','FITNESS','フィットネス','19–25%','MID–HIGH','assets/ideal-vision/v26.5.24/okame-fitness.webp'],['muscular','MUSCULAR','マスキュラー','18–25%','HIGH','assets/ideal-vision/v26.5.24/okame-muscular.webp'],['physique','PHYSIQUE','フィジーク','18–24%','HIGH','assets/ideal-vision/v26.5.24/okame-physique.webp']];let gender='male',idx=0,state={sleep:null,fatigue:null,stress:null,pain:null,steps:'',appetite:null},workout=null;const arr=()=>gender==='female'?female:male;function savedIdeal(){const s=read(IK);if(!s?.idealVisionType){$('idealThumb').style.visibility='hidden';return}const a=s.gender==='female'?female:male,x=a.find(v=>v[0]===s?.idealVisionType)||a[0];$('idealThumb').style.visibility='visible';$('idealThumb').src=x[5];$('idealName').textContent=x[1];$('idealDetail').textContent=`${s.gender==='female'?'女性':'男性'}｜体脂肪 ${x[3]}`}function picker(){const a=arr(),x=a[idx];$('typeRail').innerHTML=a.map((v,i)=>`<button data-i="${i}" class="${i===idx?'on':''}">${v[1]}</button>`).join('');$('typeRail').querySelectorAll('button').forEach(b=>b.onclick=()=>{idx=+b.dataset.i;picker()});$('modelImg').src=x[5];$('modelName').textContent=x[1];$('modelJp').textContent=x[2];$('modelBf').textContent=x[3];$('modelMuscle').textContent=x[4];document.querySelectorAll('[data-gender]').forEach(b=>b.classList.toggle('on',b.dataset.gender===gender))}$('openIdeal').onclick=()=>{const s=read(IK);gender=s?.gender||'male';idx=Math.max(0,arr().findIndex(v=>v[0]===s?.idealVisionType));picker();$('idealModal').classList.add('open');document.body.style.overflow='hidden'};$('closeIdeal').onclick=()=>{$('idealModal').classList.remove('open');document.body.style.overflow=''};document.querySelectorAll('[data-gender]').forEach(b=>b.onclick=()=>{gender=b.dataset.gender;idx=0;picker()});$('saveIdeal').onclick=()=>{const x=arr()[idx];localStorage.setItem(IK,JSON.stringify({...read(IK),at:new Date().toISOString(),gender,idealVisionType:x[0],idealVisionName:x[1],idealVisionBodyFat:x[3]}));savedIdeal();$('closeIdeal').click()};const qs=[['sleep','睡眠','悪い','良い'],['fatigue','疲労','強い','少ない'],['stress','ストレス','強い','少ない'],['pain','痛み','強い','なし'],['appetite','食欲','低い','高い']];function renderCondition(){const old=read(CK);if(old?.date===day())state={...state,...old};$('condition').innerHTML=qs.map(q=>`<div class="q"><div class="qhead"><b>${q[1]}</b><span>${state[q[0]]||'--'}/5</span></div><div class="choices">${[1,2,3,4,5].map(n=>`<button data-k="${q[0]}" data-v="${n}" class="${state[q[0]]===n?'on':''}">${n}</button>`).join('')}</div><div class="muted" style="display:flex;justify-content:space-between"><span>${q[2]}</span><span>${q[3]}</span></div></div>`).join('')+`<div class="q"><div class="qhead"><b>歩数</b><span>${state.steps!==''?Number(state.steps).toLocaleString()+'歩':'未入力'}</span></div><div class="steps"><input id="stepsInput" type="number" inputmode="numeric" value="${state.steps||''}" placeholder="今日の歩数"><button id="stepsSet" class="btn btnDark" style="width:auto;margin:0">設定</button></div></div>`;$('condition').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{state[b.dataset.k]=+b.dataset.v;renderCondition()});$('stepsSet').onclick=()=>{state.steps=$('stepsInput').value;renderCondition()}}function judge(s){if(['sleep','fatigue','stress','pain','appetite'].some(k=>!+s[k]))return null;const steps=Math.max(0,+s.steps||0),low=[s.sleep,s.fatigue,s.stress,s.appetite].filter(v=>v<=2).length;let r;if(s.pain<=2)r=['CARE FIRST','20–40分','4–5','低','痛み・ROM優先','痛みスコアが高いためCAREを優先。'];else if(low>=2||s.sleep===1||s.fatigue===1)r=['RECOVERY','20–40分','4–5','低','回復優先','複数の回復指標が低下。'];else if(low===1||s.sleep===3||s.fatigue===3||s.stress===3||steps>=20000)r=['LIGHT','35–55分','3–4','中低','ボリューム抑制','回復状態を考慮して余力を残す。'];else r=['TRAIN','50–75分','1–3','中〜高','通常トレ','主要な回復指標に大きな制限なし。'];return {mode:r[0],time:r[1],rir:r[2],intensity:r[3],policy:r[4],reason:r[5],date:day(),at:new Date().toISOString(),inputs:{...s,steps}}}function showDecision(r){if(!r||r.date!==day())return;$('decisionMain').textContent=r.mode;$('decisionTime').textContent=r.time;$('decisionRir').textContent=r.rir;$('decisionIntensity').textContent=r.intensity;$('decisionPolicy').textContent=r.policy;$('decisionReason').textContent=r.reason}const plans={PUSH:[['ベンチプレス','胸｜MID'],['インクラインDBプレス','上部胸｜MID'],['ケーブルフライ','胸｜CON'],['DBサイドレイズ','三角筋中部｜MID'],['ケーブルサイドレイズ','三角筋中部｜CON'],['トライセプスプレスダウン','上腕三頭筋｜CON']],PULL:[['デッドリフト','背面全体｜MID'],['バーベルロー','広背筋｜MID'],['DBベントオーバーロー','上背部｜MID'],['ラットプルダウン','広背筋｜CON'],['リアデルトフライ','三角筋後部｜CON'],['DBカール','上腕二頭筋｜MID'],['アブドミナル','腹筋｜CON']],LEGS:[['バックスクワット','脚全体｜MID'],['レッグプレス','大腿四頭筋｜MID'],['RDL','ハム・臀部｜STRETCH'],['ブルガリアンスクワット','脚・臀部｜MID'],['ケーブルアブダクション','中臀筋｜CON'],['ケーブルアダクション','内転筋｜CON'],['カーフレイズ','下腿｜CON']]};function menu(r){const wd=new Date().getDay(),split=wd===1||wd===4?'PUSH':wd===2||wd===5?'PULL':wd===3?'LEGS':'REST';if(split==='REST')return {date:day(),split,mode:r.mode,items:[],note:'土日は休養日。'};if(r.mode==='CARE FIRST')return {date:day(),split:'CARE',mode:r.mode,items:[['痛みのないROM','2','RIR 5','60秒','CARE'],['低負荷モビリティ','2','RIR 5','60秒','CARE']],note:'通常メニュー停止。'};const src=plans[split],light=r.mode==='LIGHT',rec=r.mode==='RECOVERY';return {date:day(),split,mode:r.mode,items:(rec?src.slice(0,4):src).map((x,i)=>[x[0],rec?(i?'1':'2'):light?(i<2?'3':'2'):(i<2?'4':'3'),rec?'RIR 4–5':light?'RIR 3–4':'RIR 1–3',i<2?'180秒':'90秒',x[1]]),note:rec?'回復優先でSET削減。':light?'総ボリュームを抑制。':'通常トレーニング。'}}function initWorkout(m){const old=read(WK);if(old?.date===day()&&old.split===m.split)return old;return {date:day(),split:m.split,mode:m.mode,startedAt:new Date().toISOString(),completedAt:null,exercises:m.items.map(x=>({name:x[0],meta:x[4],targetRir:x[2],rest:x[3],actualRest:parseInt(x[3])||null,sets:Array.from({length:Math.max(1,parseInt(x[1])||1)},(_,i)=>({set:i+1,reps:'',rir:'',load:'',done:false}))}))}}function saveWorkout(){localStorage.setItem(WK,JSON.stringify(workout))}function progress(){if(!workout)return;const a=workout.exercises.flatMap(x=>x.sets),n=a.filter(x=>x.done).length;$('progressBar').style.width=(a.length?n/a.length*100:0)+'%';$('progressText').textContent=`${n} / ${a.length} SET`}function showMenu(m){if(!m||m.date!==day())return;$('menuDay').textContent=m.split;$('menuSub').textContent=`${m.mode}｜${m.note}`;if(!m.items.length){$('menuList').innerHTML='<div class="muted">今日は休養日です。</div>';return}workout=initWorkout(m);$('sessionTools').style.display='block';$('menuList').innerHTML=workout.exercises.map((e,ei)=>`<div class="exercise"><div class="exhead"><div><b>${e.name}</b><div class="muted">${e.meta||''}</div></div><div class="dose">${e.targetRir}<br>REST ${e.rest}</div></div><div class="restActual"><span>実REST</span><input data-rest-e="${ei}" inputmode="numeric" type="number" min="0" max="900" value="${e.actualRest??parseInt(e.rest)||''}"><span>秒</span></div>${e.sets.map((s,si)=>`<div class="setrow"><span>${si+1}</span><input data-e="${ei}" data-s="${si}" data-f="load" inputmode="decimal" placeholder="kg" value="${s.load}"><input data-e="${ei}" data-s="${si}" data-f="reps" inputmode="numeric" placeholder="REP" value="${s.reps}"><input data-e="${ei}" data-s="${si}" data-f="rir" inputmode="decimal" placeholder="RIR" value="${s.rir}"><button data-done data-e="${ei}" data-s="${si}" class="${s.done?'done':''}">✓</button></div>`).join('')}</div>`).join('');$('menuList').querySelectorAll('input[data-f]').forEach(i=>i.onchange=()=>{workout.exercises[+i.dataset.e].sets[+i.dataset.s][i.dataset.f]=i.value;saveWorkout()});$('menuList').querySelectorAll('[data-rest-e]').forEach(i=>i.onchange=()=>{workout.exercises[+i.dataset.restE].actualRest=+i.value||null;saveWorkout()});$('menuList').querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{const s=workout.exercises[+b.dataset.e].sets[+b.dataset.s];s.done=!s.done;saveWorkout();b.classList.toggle('done',s.done);progress()});progress()}function best(ex){let b=null;ex.sets.filter(s=>s.done&&+s.load>0&&+s.reps>0).forEach(s=>{const reps=+s.reps,load=+s.load,rir=Math.max(0,+s.rir||0),effective=Math.min(15,reps+rir),e=load*(1+effective/30);if(!b||e>b.e)b={e,load,reps,rir}});return b}function previous(name,sessions){for(let i=sessions.length-1;i>=0;i--){const e=sessions[i]?.exercises?.find(x=>x.name===name);if(e){const b=best(e);if(b)return b}}return null}function nextLoad(cur,prev,mode){if(!cur)return 'DATA LOW';if(mode==='CARE FIRST')return 'CARE FIRST';if(mode==='RECOVERY')return 'RECOVERY FIRST';if(cur.rir>=4)return 'HOLD';if(!prev)return 'HOLD';const diff=(cur.e-prev.e)/prev.e*100;if(diff>=2&&cur.rir>=1)return 'LOAD UP';if(diff<=-5)return 'LOAD DOWN';return 'HOLD'}function showAnalysis(session,history){if(!session)return;const older=history.filter(x=>x.date!==session.date);const rows=session.exercises.map(e=>{const c=best(e);if(!c)return null;const p=previous(e.name,older),diff=p?((c.e-p.e)/p.e*100):null,n=nextLoad(c,p,session.mode);return `<div class="analysisItem"><div class="analysisTop"><b>${e.name}</b><span class="next">${n}</span></div><div class="metrics"><div class="metric"><span>e1RM</span><b>${c.e.toFixed(1)} kg</b></div><div class="metric"><span>前回比</span><b>${diff===null?'初回':(diff>=0?'+':'')+diff.toFixed(1)+'%'}</b></div><div class="metric"><span>BEST SET</span><b>${c.load}×${c.reps} RIR${c.rir}</b></div></div></div>`}).filter(Boolean);$('analysisList').innerHTML=rows.length?rows.join(''):'<div class="muted">重量・REPを記録すると分析できます。</div>'}function finish(){if(!workout)return;const all=workout.exercises.flatMap(x=>x.sets);if(!all.some(s=>s.done)){$('sessionStatus').textContent='完了SETを1つ以上チェックしてください';return}workout.completedAt=new Date().toISOString();saveWorkout();let h=read(SK);h=Array.isArray(h)?h:[];h=h.filter(x=>x.date!==day());h.push(workout);localStorage.setItem(SK,JSON.stringify(h));$('sessionStatus').textContent=`保存完了｜${all.filter(s=>s.done).length} SET`;showAnalysis(workout,h);window.dispatchEvent(new CustomEvent('sug:session-complete',{detail:workout}))}$('finishSession').onclick=finish;renderCondition();$('saveCondition').onclick=()=>{const s={...state,date:day(),at:new Date().toISOString()};localStorage.setItem(CK,JSON.stringify(s));const r=judge(s);if(!r){$('saveState').textContent='5項目を全部入力してください';return}localStorage.setItem(DK,JSON.stringify(r));showDecision(r);const m=menu(r);localStorage.setItem(MK,JSON.stringify(m));showMenu(m);$('saveState').textContent='保存・判定・メニュー生成しました'};savedIdeal();const r=read(DK);showDecision(r);let m=read(MK);if(r?.date===day()&&(!m||m.date!==day())){m=menu(r);localStorage.setItem(MK,JSON.stringify(m))}showMenu(m);const hist=read(SK);if(Array.isArray(hist)){const last=[...hist].reverse().find(x=>x.completedAt);if(last)showAnalysis(last,hist)}window.scrollTo(0,0)})();
</script><script src="assets/member/v2/rest-progression.js?v=26.5.259"></script></body></html>
