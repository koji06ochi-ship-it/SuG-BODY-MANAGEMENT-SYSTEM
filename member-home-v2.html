<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta name="theme-color" content="#080809"><title>S.u.G MEMBER HOME V2</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080809;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}body{overflow-x:hidden}.wrap{max-width:760px;margin:auto;padding:14px}.hero,.card{border:1px solid #34343b;background:linear-gradient(180deg,#151518,#101012);border-radius:18px;padding:16px;margin-bottom:12px}.hero{border-color:#7a6231;background:linear-gradient(145deg,#17140e,#0d0d0f)}.eyebrow{color:#d8b35b;font-size:11px;font-weight:900;letter-spacing:.12em}.hero h1{font-size:25px;margin:6px 0 4px}.muted{color:#9d9da3;font-size:12px;line-height:1.55}.btn{width:100%;border:0;border-radius:14px;padding:15px 12px;font-size:15px;font-weight:900;margin-top:9px}.btnGold{background:linear-gradient(#f0cf69,#c99a27);color:#111}.btnDark{background:#19191e;color:#e8cd7d;border:1px solid #5f4f25}.sectionTitle{font-size:15px;font-weight:900;margin:0 0 10px}.idealNow{display:flex;align-items:center;gap:12px}.idealThumb{width:88px;height:118px;object-fit:contain;background:#0a0a0c;border:1px solid #2d2d32;border-radius:12px}.idealMeta b{display:block;font-size:18px;color:#f1d17b}.idealMeta small{display:block;color:#aaa;margin-top:4px}.condition{display:grid;gap:10px}.q{background:#0d0d10;border:1px solid #2c2c32;border-radius:14px;padding:12px}.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}.qhead b{font-size:13px}.qhead span{font-size:12px;color:#f1d17b;font-weight:900}.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.choices button{min-height:38px;border:1px solid #34343b;border-radius:10px;background:#16161a;color:#aaa;font-size:11px;font-weight:900}.choices button.on{background:#d1a53d;color:#111;border-color:#f0cf69}.steps{display:grid;grid-template-columns:1fr auto;gap:8px}.steps input{width:100%;border:1px solid #34343b;border-radius:10px;background:#151519;color:#fff;padding:11px;font-size:16px}.saveState{font-size:11px;color:#8d8d94;margin-top:8px;text-align:center}.decision{border:1px solid #6e5828;border-radius:16px;background:#0e0d0b;padding:14px}.decisionMain{font-size:28px;font-weight:1000;color:#f1d17b}.decisionGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.decisionGrid div{background:#111115;border:1px solid #303037;border-radius:12px;padding:10px}.decisionGrid span{display:block;color:#8f8f95;font-size:9px}.decisionGrid b{display:block;margin-top:3px;font-size:16px}.reason{margin-top:10px;color:#aaa;font-size:11px;line-height:1.6}.menuHead{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:10px}.menuDay{font-size:24px;font-weight:1000;color:#f1d17b}.exercise{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-top:1px solid #26262b}.exercise:first-child{border-top:0}.exercise b{font-size:13px}.exercise small{display:block;color:#888;margin-top:3px}.dose{text-align:right;font-size:11px;color:#e6ca79;white-space:nowrap}.modal{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.88);display:none;overflow:auto}.modal.open{display:block}.sheet{max-width:760px;margin:auto;min-height:100%;background:#09090b;padding:14px}.toprow{display:flex;align-items:center;justify-content:space-between}.close{width:42px;height:42px;border-radius:50%;border:1px solid #444;background:#17171b;color:#fff;font-size:22px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.seg button,.typeRail button{padding:11px;border-radius:11px;border:1px solid #36363b;background:#151519;color:#bbb;font-weight:900}.seg button.on,.typeRail button.on{color:#111;background:linear-gradient(#f0cf69,#c99a27)}.typeRail{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;overflow:auto}.modelCard{margin-top:12px;border:1px solid #6e5828;border-radius:20px;background:#0e0d0b;padding:15px;text-align:center;min-height:560px}.modelCard img{width:100%;height:340px;object-fit:contain}.spec{display:grid;grid-template-columns:1fr 1fr;gap:8px}.spec div{background:#0d0d10;border:1px solid #303037;border-radius:12px;padding:11px}.spec span{display:block;color:#999;font-size:9px}.spec b{color:#f1d17b}@media(max-width:420px){.wrap{padding:11px}.typeRail{grid-template-columns:repeat(5,92px)}}
</style></head><body><main class="wrap">
<section class="hero"><div class="eyebrow">TODAY FLOW</div><h1>理想の身体</h1><div class="muted">理想を確認してから、今日の状態へ進みます。</div><button id="openIdeal" class="btn btnGold">理想を確認・変更する →</button></section>
<section class="card"><h2 class="sectionTitle">現在の理想</h2><div class="idealNow"><img id="idealThumb" class="idealThumb"><div class="idealMeta"><b id="idealName">未設定</b><small id="idealDetail">理想体型を選択してください</small></div></div></section>
<section class="card"><div class="eyebrow">TODAY CONDITION</div><h2 class="sectionTitle" style="margin-top:5px">今日の状態</h2><div class="condition" id="condition"></div><button id="saveCondition" class="btn btnGold">今日の状態を保存・判定 →</button><div id="saveState" class="saveState"></div></section>
<section class="card"><div class="eyebrow">TODAY DECISION</div><h2 class="sectionTitle" style="margin-top:5px">今日の判定</h2><div class="decision"><div id="decisionMain" class="decisionMain">未判定</div><div class="decisionGrid"><div><span>推奨時間</span><b id="decisionTime">--</b></div><div><span>推奨RIR</span><b id="decisionRir">--</b></div><div><span>強度</span><b id="decisionIntensity">--</b></div><div><span>方針</span><b id="decisionPolicy">--</b></div></div><div id="decisionReason" class="reason">今日の状態を入力して保存すると判定します。</div></div></section>
<section class="card"><div class="eyebrow">TODAY MENU</div><div class="menuHead"><div><h2 class="sectionTitle" style="margin:5px 0 2px">今日のメニュー</h2><div id="menuSub" class="muted">判定後に生成します。</div></div><div id="menuDay" class="menuDay">--</div></div><div id="menuList"></div></section>
</main>
<div id="idealModal" class="modal"><div class="sheet"><div class="toprow"><div><div class="eyebrow">S.u.G OSAKA</div><h2>理想の体型を選ぶ</h2></div><button id="closeIdeal" class="close">×</button></div><div class="seg"><button data-gender="male" class="on">男性｜ひょっとこ</button><button data-gender="female">女性｜おかめ</button></div><div id="typeRail" class="typeRail"></div><div class="modelCard"><img id="modelImg"><h2 id="modelName">SLIM</h2><div id="modelJp" class="muted">スリム</div><div class="spec"><div><span>体脂肪率</span><b id="modelBf"></b></div><div><span>筋量イメージ</span><b id="modelMuscle"></b></div></div><button id="saveIdeal" class="btn btnGold">この体型を目標にする</button></div></div></div>
<script>(()=>{'use strict';const IK='sug_ideal_shadow_v2',CK='sug_today_condition_v2',DK='sug_today_decision_v2',MK='sug_today_menu_v2';const $=id=>document.getElementById(id);function read(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}function day(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}const male=[['slim','SLIM','スリム','12–18%','LOW–MID','assets/ideal-vision/v26.5.20/slim.webp'],['athletic','ATHLETIC','アスレチック','10–15%','MID','assets/ideal-vision/v26.5.20/athletic.webp'],['fitness','FITNESS','フィットネス','8–13%','MID–HIGH','assets/ideal-vision/v26.5.20/fitness.webp'],['muscular','MUSCULAR','マスキュラー','10–15%','HIGH','assets/ideal-vision/v26.5.20/muscular.webp'],['physique','PHYSIQUE','フィジーク','7–12%','HIGH','assets/ideal-vision/v26.5.20/physique.webp']],female=[['slim','SLIM','スリム','22–28%','LOW–MID','assets/ideal-vision/v26.5.24/okame-slim.webp'],['athletic','ATHLETIC','アスレチック','20–26%','MID','assets/ideal-vision/v26.5.24/okame-athletic.webp'],['fitness','FITNESS','フィットネス','19–25%','MID–HIGH','assets/ideal-vision/v26.5.24/okame-fitness.webp'],['muscular','MUSCULAR','マスキュラー','18–25%','HIGH','assets/ideal-vision/v26.5.24/okame-muscular.webp'],['physique','PHYSIQUE','フィジーク','18–24%','HIGH','assets/ideal-vision/v26.5.24/okame-physique.webp']];let gender='male',idx=0,state={sleep:null,fatigue:null,stress:null,pain:null,steps:'',appetite:null};function arr(){return gender==='female'?female:male}function savedIdeal(){const s=read(IK);if(!s?.idealVisionType){$('idealThumb').style.visibility='hidden';return}const a=s.gender==='female'?female:male,x=a.find(v=>v[0]===s.idealVisionType)||a[0];$('idealThumb').style.visibility='visible';$('idealThumb').src=x[5];$('idealName').textContent=x[1];$('idealDetail').textContent=`${s.gender==='female'?'女性':'男性'}｜体脂肪 ${x[3]}`}function picker(){const a=arr(),x=a[idx];$('typeRail').innerHTML=a.map((v,i)=>`<button data-i="${i}" class="${i===idx?'on':''}">${v[1]}</button>`).join('');$('typeRail').querySelectorAll('button').forEach(b=>b.onclick=()=>{idx=+b.dataset.i;picker()});$('modelImg').src=x[5];$('modelName').textContent=x[1];$('modelJp').textContent=x[2];$('modelBf').textContent=x[3];$('modelMuscle').textContent=x[4];document.querySelectorAll('[data-gender]').forEach(b=>b.classList.toggle('on',b.dataset.gender===gender))}$('openIdeal').onclick=()=>{const s=read(IK);gender=s?.gender||'male';idx=Math.max(0,arr().findIndex(v=>v[0]===s?.idealVisionType));picker();$('idealModal').classList.add('open');document.body.style.overflow='hidden'};$('closeIdeal').onclick=()=>{$('idealModal').classList.remove('open');document.body.style.overflow=''};document.querySelectorAll('[data-gender]').forEach(b=>b.onclick=()=>{gender=b.dataset.gender;idx=0;picker()});$('saveIdeal').onclick=()=>{const x=arr()[idx],old=read(IK)||{};localStorage.setItem(IK,JSON.stringify({...old,at:new Date().toISOString(),gender,idealVisionType:x[0],idealVisionName:x[1],idealVisionBodyFat:x[3]}));savedIdeal();$('closeIdeal').click()};const qs=[['sleep','睡眠','悪い','良い'],['fatigue','疲労','強い','少ない'],['stress','ストレス','強い','少ない'],['pain','痛み','強い','なし'],['appetite','食欲','低い','高い']];function renderCondition(){const old=read(CK);if(old?.date===day())state={...state,...old};$('condition').innerHTML=qs.map(q=>`<div class="q"><div class="qhead"><b>${q[1]}</b><span>${state[q[0]]?state[q[0]]+'/5':'未入力'}</span></div><div class="choices">${[1,2,3,4,5].map(n=>`<button data-k="${q[0]}" data-v="${n}" class="${state[q[0]]===n?'on':''}">${n}</button>`).join('')}</div><div class="muted" style="display:flex;justify-content:space-between;margin-top:6px"><span>${q[2]}</span><span>${q[3]}</span></div></div>`).join('')+`<div class="q"><div class="qhead"><b>歩数</b><span>${state.steps!==''?Number(state.steps).toLocaleString()+'歩':'未入力'}</span></div><div class="steps"><input id="stepsInput" type="number" inputmode="numeric" value="${state.steps||''}" placeholder="今日の歩数"><button id="stepsSet" class="btn btnDark" style="width:auto;margin:0;padding:10px 14px">設定</button></div></div>`;$('condition').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{state[b.dataset.k]=+b.dataset.v;renderCondition()});$('stepsSet').onclick=()=>{state.steps=$('stepsInput').value;renderCondition()}}function judge(s){const req=['sleep','fatigue','stress','pain','appetite'];if(req.some(k=>!Number(s[k])))return null;const steps=Math.max(0,Number(s.steps)||0),low=[s.sleep,s.fatigue,s.stress,s.appetite].filter(v=>v<=2).length;let r;if(s.pain<=2)r={mode:'CARE FIRST',time:'20–40分',rir:'4–5',intensity:'低',policy:'痛み・ROM優先',reason:'痛みスコアが高いため、負荷を進めずCAREと動作確認を優先。'};else if(low>=2||s.sleep===1||s.fatigue===1)r={mode:'RECOVERY',time:'20–40分',rir:'4–5',intensity:'低',policy:'回復優先',reason:'複数の回復指標が低下。トレーニング量を落として回復を優先。'};else if(low===1||s.sleep===3||s.fatigue===3||s.stress===3||steps>=20000)r={mode:'LIGHT',time:'35–55分',rir:'3–4',intensity:'中低',policy:'ボリューム抑制',reason:steps>=20000?'歩数が多く全身疲労を考慮。通常よりボリュームを抑える。':'回復状態に軽い制限があるため余力を残す。'};else r={mode:'TRAIN',time:'50–75分',rir:'1–3',intensity:'中〜高',policy:'通常トレ',reason:'主要な回復指標に大きな制限なし。通常トレーニングを実施可能。'};return {...r,date:day(),at:new Date().toISOString(),inputs:{...s,steps}}}function showDecision(r){if(!r||r.date!==day())return;$('decisionMain').textContent=r.mode;$('decisionTime').textContent=r.time;$('decisionRir').textContent=r.rir;$('decisionIntensity').textContent=r.intensity;$('decisionPolicy').textContent=r.policy;$('decisionReason').textContent=r.reason}const plans={PUSH:[['ベンチプレス','胸｜MID'],['インクラインDBプレス','上部胸｜MID'],['ケーブルフライ','胸｜CON'],['DBサイドレイズ','三角筋中部｜MID'],['ケーブルサイドレイズ','三角筋中部｜CON'],['トライセプスプレスダウン','上腕三頭筋｜CON']],PULL:[['デッドリフト','背面全体｜MID'],['バーベルロー','広背筋｜MID'],['DBベントオーバーロー','上背部｜MID'],['ラットプルダウン','広背筋｜CON'],['リアデルトフライ','三角筋後部｜CON'],['DBカール','上腕二頭筋｜MID'],['アブドミナル','腹筋｜CON']],LEGS:[['バックスクワット','脚全体｜MID'],['レッグプレス','大腿四頭筋｜MID'],['RDL','ハム・臀部｜STRETCH'],['ブルガリアンスクワット','脚・臀部｜MID'],['ケーブルアブダクション','中臀筋｜CON'],['ケーブルアダクション','内転筋｜CON'],['カーフレイズ','下腿｜CON']]};function generateMenu(r){if(!r||r.date!==day())return null;const wd=new Date().getDay();let split=wd===1||wd===4?'PUSH':wd===2||wd===5?'PULL':wd===3?'LEGS':'REST';if(split==='REST')return {date:day(),split:'REST',mode:r.mode,items:[],note:'土日は休養日。歩行・軽いモビリティ・回復を優先。'};if(r.mode==='CARE FIRST')return {date:day(),split:'CARE',mode:r.mode,items:[['痛みのない範囲のROM','2–3 SET','RIR 5','60秒'],['低負荷モビリティ','10–15分','余力十分','—']],note:'痛みがあるため通常メニューは停止。'};if(r.mode==='RECOVERY')return {date:day(),split,mode:r.mode,items:plans[split].slice(0,4).map((x,i)=>[x[0],i===0?'2 SET':'1–2 SET','RIR 4–5','90–180秒']),note:'種目数・SET数を落とし、失敗反復なし。'};const light=r.mode==='LIGHT';return {date:day(),split,mode:r.mode,items:plans[split].map((x,i)=>[x[0],light?(i<2?'2–3 SET':'2 SET'):(i<2?'3–4 SET':'2–3 SET'),light?'RIR 3–4':'RIR 1–3',i<2?'180秒':'60–120秒',x[1]]),note:light?'通常より総ボリュームを約20–30%抑制。':'通常トレーニング。フォームとRIRを優先。'}}function showMenu(m){if(!m||m.date!==day())return;$('menuDay').textContent=m.split;$('menuSub').textContent=`${m.mode}｜${m.note}`;$('menuList').innerHTML=m.items.length?m.items.map(x=>`<div class="exercise"><div><b>${x[0]}</b><small>${x[4]||''}</small></div><div class="dose">${x[1]}<br>${x[2]}<br>REST ${x[3]}</div></div>`).join(''):'<div class="muted">今日は休養日です。</div>'}renderCondition();$('saveCondition').onclick=()=>{const saved={...state,date:day(),at:new Date().toISOString()};localStorage.setItem(CK,JSON.stringify(saved));const r=judge(saved);if(!r){$('saveState').textContent='睡眠・疲労・ストレス・痛み・食欲を全部入力してください';return}localStorage.setItem(DK,JSON.stringify(r));showDecision(r);const m=generateMenu(r);localStorage.setItem(MK,JSON.stringify(m));showMenu(m);$('saveState').textContent='保存・判定・メニュー生成しました'};savedIdeal();const r=read(DK);showDecision(r);let m=read(MK);if(r&&r.date===day()&&(!m||m.date!==day())){m=generateMenu(r);localStorage.setItem(MK,JSON.stringify(m))}showMenu(m);window.scrollTo(0,0)})();</script></body></html>
