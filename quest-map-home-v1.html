<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#06110c">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>S.u.G QUEST｜MAP HOME V1</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--gold:#d9b45e;--gold2:#ffe8a8;--bg:#07110d;--panel:#0d1712;--ink:#f7f3e8;--muted:#aab5ad;--green:#71e49a;--red:#ff7b6e}
*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}body{overflow:hidden;background:#06100b;color:var(--ink)}
#map{position:fixed;inset:0;z-index:1;background:#d9dfd8}.leaflet-control-attribution{font-size:8px}.leaflet-control-zoom{display:none}
.top{position:fixed;z-index:600;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px;pointer-events:none}.brand,.gps{pointer-events:auto;border:1px solid #6e5a32;background:#08100de8;backdrop-filter:blur(12px);box-shadow:0 8px 24px #0007}.brand{padding:9px 12px;border-radius:14px;flex:1}.brand b{display:block;color:var(--gold2);font:700 16px Georgia,"Yu Mincho",serif}.brand span{display:block;margin-top:2px;color:#aab4ac;font-size:7px;font-weight:900;letter-spacing:.12em}.gps{width:46px;height:46px;border-radius:14px;color:var(--gold2);display:grid;place-items:center;font-size:21px}
.status{position:fixed;z-index:590;left:10px;top:calc(73px + env(safe-area-inset-top));padding:7px 9px;border:1px solid #50644f;border-radius:999px;background:#07100de8;color:#d9eadb;font-size:8px;font-weight:900;box-shadow:0 6px 18px #0006}.status.bad{border-color:#80443c;color:#ffc0ba}.status b{color:var(--green)}
.filters{position:fixed;z-index:580;left:8px;right:8px;top:calc(108px + env(safe-area-inset-top));display:flex;gap:6px;overflow:auto;padding:2px 2px 8px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;border:1px solid #64706a;border-radius:999px;padding:7px 9px;background:#0a130fe8;color:#e4e7df;font-size:8px;font-weight:900}.chip.on{border-color:#d6ad57;background:#211b0d;color:#ffe29c}
.bottomnav{position:fixed;z-index:650;left:8px;right:8px;bottom:calc(7px + env(safe-area-inset-bottom));height:64px;padding:5px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border:1px solid #66532f;border-radius:18px;background:#07100df2;backdrop-filter:blur(15px);box-shadow:0 12px 34px #000b}.nav{border:0;border-radius:13px;background:none;color:#aab3ac;font-size:8px;font-weight:900}.nav b{display:block;font-size:18px;line-height:22px}.nav.on{background:#221c0e;color:#ffe29a}.nav small{font-size:7px;color:#79837c}
.marker{width:39px;height:39px;border-radius:13px;display:grid;place-items:center;border:2px solid #fff9;box-shadow:0 5px 14px #0007;color:#fff;font-size:18px;font-weight:1000}.marker.done{filter:saturate(.45);opacity:.62}.m-temple{background:#9c5f28}.m-shop{background:#ad4932}.m-water{background:#3281aa}.m-sug{background:#151515;color:#ffe399}.m-aed{background:#d34145}.m-rest{background:#5d8f63}.m-road{background:#798e39}.m-river{background:#347594}.m-manhole{background:#545b64}.m-station{background:#7557a4}.m-bus{background:#347065}.m-taxi{background:#b88432}.m-history{background:#67452d}
.avatarWrap{width:52px;height:60px;position:relative;filter:drop-shadow(0 5px 5px #0007)}.avatarHalo{position:absolute;left:6px;bottom:0;width:40px;height:16px;border-radius:50%;background:#4ec87855;border:2px solid #7cffaa99}.samurai{position:absolute;left:10px;top:0;width:34px;height:50px}.kabuto{position:absolute;left:3px;top:0;width:28px;height:17px;border-radius:15px 15px 7px 7px;background:linear-gradient(#d6b25d,#6d4f18);border:2px solid #2e240d}.kabuto:before,.kabuto:after{content:"";position:absolute;top:-7px;width:13px;height:13px;border-top:3px solid #e5c466}.kabuto:before{left:-5px;transform:rotate(-28deg);border-left:3px solid #e5c466}.kabuto:after{right:-5px;transform:rotate(28deg);border-right:3px solid #e5c466}.face{position:absolute;left:7px;top:13px;width:20px;height:17px;border-radius:8px;background:#f1c39f;border:2px solid #382418}.body{position:absolute;left:5px;top:29px;width:24px;height:20px;border-radius:6px 6px 9px 9px;background:#173b2c;border:2px solid #d0aa50}.body:before{content:"S";display:block;text-align:center;color:#f6d781;font:bold 11px Georgia}
.sheet{position:fixed;z-index:900;left:0;right:0;bottom:-90vh;max-height:78vh;overflow:auto;border-radius:24px 24px 0 0;border-top:1px solid #826a3c;background:linear-gradient(180deg,#101b15,#07100d 54%);box-shadow:0 -20px 60px #000b;padding:11px 16px calc(88px + env(safe-area-inset-bottom));transition:bottom .24s ease}.sheet.on{bottom:0}.grab{width:44px;height:4px;margin:0 auto 10px;border-radius:9px;background:#596159}.sheetHead{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}.sheet h2{margin:3px 0 2px;color:#fff0c6;font:700 22px Georgia,"Yu Mincho",serif}.sheet .type{color:var(--gold);font-size:8px;font-weight:1000;letter-spacing:.12em}.close{width:38px;height:38px;border:1px solid #4b554e;border-radius:12px;background:#0b1410;color:#ddd;font-size:20px}.photo{height:130px;margin:12px 0;border:1px solid #46534b;border-radius:15px;background:radial-gradient(circle at 50% 0,#283c30,#0b120f 65%);display:grid;place-items:center;color:#d9b763;font:700 42px Georgia}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{padding:9px;border:1px solid #39463e;border-radius:11px;background:#08100d}.stat span{display:block;color:#7f8d84;font-size:6px;font-weight:900}.stat b{display:block;margin-top:4px;color:#edf2ec;font-size:10px}.box{margin-top:9px;padding:11px;border:1px solid #3d4941;border-radius:12px;background:#08100d;color:#bac4bc;font-size:9px;line-height:1.55}.box b{color:#efd28b}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{margin-top:10px;padding:13px 9px;border-radius:12px;font-weight:1000}.go{border:1px solid #d2aa55;background:linear-gradient(#ebd184,#ae7b25);color:#191207}.claim{border:1px solid #6c9275;background:#102518;color:#aaf1bd}.claim:disabled{opacity:.4}.shopInfo{margin-top:9px;padding:10px;border-left:3px solid #ba653f;background:#180d09;color:#d7b8a8;font-size:8px;line-height:1.5}
.collectLayer{position:fixed;z-index:1200;inset:0;display:none;background:radial-gradient(circle at 50% 30%,#3b2b0d,#080b08 52%,#020403 80%);padding:calc(20px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));overflow:auto}.collectLayer.on{display:block}.collectShell{width:min(440px,100%);margin:auto}.collectTitle{text-align:center;color:#ffe3a0;font:700 24px Georgia,"Yu Mincho",serif}.count{text-align:center;color:#aaa;font-size:10px}.manholeProgress{margin:12px 0;padding:12px;border:1px solid #555c61;border-radius:13px;background:#0b0f12;color:#d8dde0;font-size:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.card{min-height:120px;padding:8px;border:1px solid #5c5036;border-radius:12px;background:linear-gradient(#15160f,#090b09);color:#ddd}.card.lock{opacity:.42;filter:grayscale(1)}.card .art{height:68px;border-radius:8px;display:grid;place-items:center;background:#1d2a21;color:#f0d27e;font-size:30px}.card b{display:block;margin-top:6px;font-size:8px}.card small{color:#8d978f;font-size:6px}
.reward{position:fixed;z-index:1500;inset:0;display:none;place-items:center;background:#000d;padding:25px}.reward.on{display:grid}.rewardCard{width:min(300px,82vw);aspect-ratio:3/4.2;border:2px solid #e1bc62;border-radius:22px;background:radial-gradient(circle at 50% 18%,#79591d,#1c1407 43%,#070906 76%);box-shadow:0 0 50px #dcb45055;text-align:center;padding:18px;animation:pop .48s ease}.rewardCard .big{height:58%;display:grid;place-items:center;border:1px solid #a68037;border-radius:15px;color:#ffe09a;font:700 82px Georgia}.rewardCard h2{color:#fff0c3;font:700 22px Georgia}.rewardCard p{color:#c3ae79;font-size:9px}@keyframes pop{from{transform:scale(.6) rotate(-5deg);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;z-index:2000;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;transition:.2s;padding:9px 12px;border:1px solid #588263;border-radius:999px;background:#08130dee;color:#c6f7d1;font-size:8px;font-weight:1000;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head><body>
<div id="map"></div>
<div class="top"><div class="brand"><b>S.u.G QUEST</b><span>MAP HOME / GPS FIELD V1</span></div><button id="locate" class="gps" aria-label="現在地">◎</button></div>
<div id="status" class="status bad">GPS待機中｜位置情報を許可</div>
<div id="filters" class="filters"></div>
<nav class="bottomnav"><button class="nav on"><b>⌖</b>MAP</button><button id="openCollection" class="nav"><b>◇</b>COLLECTION</button><button id="openQuest" class="nav"><b>⚔</b>QUEST<small>既存</small></button><button id="openBody" class="nav"><b>＋</b>BODY<small>既存</small></button></nav>
<section id="sheet" class="sheet"><div class="grab"></div><div class="sheetHead"><div><div id="sheetType" class="type"></div><h2 id="sheetName"></h2></div><button id="closeSheet" class="close">×</button></div><div id="sheetPhoto" class="photo"></div><div class="row"><div class="stat"><span>DISTANCE</span><b id="sheetDistance">--</b></div><div class="stat"><span>SPEED</span><b id="sheetSpeed">--</b></div><div class="stat"><span>WALK</span><b id="sheetWalk">--</b></div></div><div id="sheetGet" class="box"></div><div id="sheetRule" class="box"></div><div id="shopInfo"></div><div class="actions"><button id="goThere" class="btn go">ここへ行く</button><button id="claim" class="btn claim">GPS CHECK</button></div></section>
<section id="collectionLayer" class="collectLayer"><div class="collectShell"><button id="closeCollection" class="close">×</button><div class="collectTitle">COLLECTION</div><div id="collectionCount" class="count"></div><div id="manholeProgress" class="manholeProgress"></div><div id="collectionGrid" class="grid"></div></div></section>
<div id="reward" class="reward"><div class="rewardCard"><div id="rewardMark" class="big"></div><h2 id="rewardName"></h2><p>CARD GET｜COLLECTION登録済み</p><button id="rewardBack" class="btn go">地図へ戻る</button></div></div>
<div id="toast" class="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const STORE='sugQuestMapHomeV1';
const MAX_WALK_SPEED=12; // km/h: 車・電車通過を除外する最低限のMVP閾値
const REQUIRED_WALK_METERS=15;
const CATEGORIES={all:['ALL','全部','✦'],temple:['TEMPLE','神社・寺','社'],shop:['SHOP','店舗','店'],water:['WATER','給水・水','水'],sug:['S.u.G','S.u.G','S'],aed:['AED','AED','＋'],rest:['REST','温泉・休憩','湯'],road:['MICHI-NO-EKI','道の駅','道'],river:['KAWA-NO-EKI','川の駅','川'],manhole:['MANHOLE','マンホール','蓋'],station:['STATION','駅','駅'],bus:['CITY BUS','市バス','巴'],taxi:['TAXI','タクシー','車'],history:['HISTORY','城址・歴史','城']};
// 実在確認済みの代表地点＋MVP用仮POINT。仮POINTは本番データ差替を前提に明記。
const POINTS=[
{id:'osaka-tenmangu',cat:'temple',name:'大阪天満宮',lat:34.6961,lng:135.5125,mark:'社',get:'天満歴史カード候補',rule:'GPS到達＋歩行判定',radius:90},
{id:'temma-station',cat:'station',name:'JR 天満駅',lat:34.7049,lng:135.5113,mark:'駅',get:'交通カード候補',rule:'GPS到達＋歩行判定',radius:90},
{id:'ogimachi-park',cat:'rest',name:'扇町公園｜休憩POINT',lat:34.7051,lng:135.5088,mark:'休',get:'休憩POINT記録',rule:'GPS到達＋歩行判定',radius:100},
{id:'kanan-road',cat:'road',name:'道の駅かなん',lat:34.4927,lng:135.6328,mark:'道',get:'駅守将カード候補',rule:'GPS到達＋歩行判定',radius:120},
{id:'pilot-shop',cat:'shop',name:'店舗POINT｜PILOT仮登録',lat:34.7037,lng:135.5104,mark:'店',get:'店舗PARTNERカード',rule:'GPS到達＋歩行判定',radius:80,shop:'店情報・おすすめメニューをここに表示。本番は許諾済み店舗データへ差替。'},
{id:'pilot-water',cat:'water',name:'給水POINT｜PILOT仮登録',lat:34.7027,lng:135.5094,mark:'水',get:'WATER / 回復カード',rule:'GPS到達＋歩行判定',radius:80},
{id:'pilot-sug',cat:'sug',name:'S.u.G POINT｜PILOT仮登録',lat:34.7017,lng:135.5109,mark:'S',get:'S.u.G CHECK IN',rule:'GPS到達＋歩行判定',radius:80},
{id:'pilot-aed',cat:'aed',name:'AED POINT｜PILOT仮登録',lat:34.7057,lng:135.5101,mark:'＋',get:'AED LOCATION記録',rule:'GPS到達＋歩行判定',radius:80},
{id:'pilot-river',cat:'river',name:'川の駅POINT｜PILOT仮登録',lat:34.6938,lng:135.5158,mark:'川',get:'川の駅カード候補',rule:'GPS到達＋歩行判定',radius:100},
{id:'pilot-bus',cat:'bus',name:'市バスPOINT｜PILOT仮登録',lat:34.7040,lng:135.5074,mark:'巴',get:'CITY BUS交通カード候補',rule:'GPS到達＋歩行判定',radius:80},
{id:'pilot-taxi',cat:'taxi',name:'タクシーPOINT｜PILOT仮登録',lat:34.7045,lng:135.5120,mark:'車',get:'TAXI交通カード候補',rule:'GPS到達＋歩行判定',radius:80},
{id:'pilot-history',cat:'history',name:'歴史地点｜PILOT仮登録',lat:34.6970,lng:135.5110,mark:'城',get:'歴史カード候補',rule:'GPS到達＋歩行判定',radius:90},
...Array.from({length:10},(_,i)=>({id:`temma-manhole-${i+1}`,cat:'manhole',name:`天満マンホール ${i+1}/10｜PILOT`,lat:34.7000+(i%5)*0.0007,lng:135.5078+Math.floor(i/5)*0.0015,mark:'蓋',get:`天満マンホール #${String(i+1).padStart(2,'0')}`,rule:'GPS到達＋歩行判定',radius:65,manhole:true}))
];
function load(){try{const x=JSON.parse(localStorage.getItem(STORE)||'{}');return {owned:Array.isArray(x.owned)?x.owned:[],buddy:x.buddy||'chibi-masashige'}}catch(e){return {owned:[],buddy:'chibi-masashige'}}}function save(s){localStorage.setItem(STORE,JSON.stringify(s))}
let state=load(),map,userMarker,userPos=null,lastPos=null,lastTs=null,speedKmh=null,walkMeters=0,selected=null,watchId=null,markers=new Map(),activeCat='all',toastTimer=null;
map=L.map('map',{zoomControl:false,attributionControl:true}).setView([34.704,135.511],15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const avatarIcon=L.divIcon({className:'',html:'<div class="avatarWrap"><div class="avatarHalo"></div><div class="samurai"><div class="kabuto"></div><div class="face"></div><div class="body"></div></div></div>',iconSize:[52,60],iconAnchor:[26,54]});
function markerIcon(p){const done=state.owned.includes(p.id);return L.divIcon({className:'',html:`<div class="marker m-${p.cat} ${done?'done':''}">${CATEGORIES[p.cat][2]}</div>`,iconSize:[39,39],iconAnchor:[20,20]})}
function renderMarkers(){markers.forEach(m=>map.removeLayer(m));markers.clear();POINTS.filter(p=>activeCat==='all'||p.cat===activeCat).forEach(p=>{const m=L.marker([p.lat,p.lng],{icon:markerIcon(p)}).addTo(map).on('click',()=>openPoint(p));markers.set(p.id,m)})}
function renderFilters(){const box=document.getElementById('filters');box.innerHTML='';Object.entries(CATEGORIES).forEach(([id,c])=>{const b=document.createElement('button');b.className='chip'+(activeCat===id?' on':'');b.textContent=c[1];b.onclick=()=>{activeCat=id;renderFilters();renderMarkers()};box.appendChild(b)})}
function hav(a,b){const R=6371000,t=Math.PI/180,dLat=(b.lat-a.lat)*t,dLon=(b.lng-a.lng)*t,la1=a.lat*t,la2=b.lat*t;const q=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function fmtDist(m){if(m==null)return '--';return m<1000?`${Math.round(m)} m`:`${(m/1000).toFixed(1)} km`}
function onPosition(pos){const now=pos.timestamp||Date.now(),cur={lat:pos.coords.latitude,lng:pos.coords.longitude};if(lastPos&&lastTs){const d=hav(lastPos,cur),dt=Math.max(1,(now-lastTs)/1000),calc=d/dt*3.6;speedKmh=(pos.coords.speed!=null&&pos.coords.speed>=0)?pos.coords.speed*3.6:calc;if(speedKmh<=MAX_WALK_SPEED&&d<120)walkMeters+=d}lastPos=cur;lastTs=now;userPos=cur;if(!userMarker){userMarker=L.marker([cur.lat,cur.lng],{icon:avatarIcon,zIndexOffset:1000}).addTo(map);map.setView([cur.lat,cur.lng],17)}else userMarker.setLatLng([cur.lat,cur.lng]);updateStatus();if(selected)updateSheet()}
function onGpsError(e){const s=document.getElementById('status');s.className='status bad';s.textContent='GPS取得不可｜Safariの位置情報を確認'}
function startGps(){if(!navigator.geolocation){onGpsError();return}if(watchId!=null)navigator.geolocation.clearWatch(watchId);watchId=navigator.geolocation.watchPosition(onPosition,onGpsError,{enableHighAccuracy:true,maximumAge:1000,timeout:15000})}
function updateStatus(){const s=document.getElementById('status'),sp=speedKmh==null?'--':speedKmh.toFixed(1);s.className='status';s.innerHTML=`GPS <b>LIVE</b>｜${sp} km/h｜歩行 ${Math.round(walkMeters)}m`}
function openPoint(p){selected=p;document.getElementById('sheet').classList.add('on');updateSheet()}
function updateSheet(){if(!selected)return;const p=selected,d=userPos?hav(userPos,{lat:p.lat,lng:p.lng}):null,owned=state.owned.includes(p.id),speedOk=speedKmh==null||speedKmh<=MAX_WALK_SPEED,walkOk=walkMeters>=REQUIRED_WALK_METERS,arrived=d!=null&&d<=p.radius;document.getElementById('sheetType').textContent=CATEGORIES[p.cat][0];document.getElementById('sheetName').textContent=p.name;document.getElementById('sheetPhoto').textContent=p.mark;document.getElementById('sheetDistance').textContent=fmtDist(d);document.getElementById('sheetSpeed').textContent=speedKmh==null?'--':`${speedKmh.toFixed(1)} km/h`;document.getElementById('sheetWalk').textContent=`${Math.round(walkMeters)}/${REQUIRED_WALK_METERS}m`;document.getElementById('sheetGet').innerHTML=`<b>GET</b><br>${p.get}${owned?'<br><span style="color:#7be49a">✓ COLLECTION登録済み</span>':''}`;document.getElementById('sheetRule').innerHTML=`<b>QUEST条件</b><br>${p.rule}<br>到達範囲 ${p.radius}m｜速度 ${MAX_WALK_SPEED}km/h以下｜この起動中の歩行 ${REQUIRED_WALK_METERS}m以上`;document.getElementById('shopInfo').innerHTML=p.shop?`<div class="shopInfo"><b>SHOP INFO</b><br>${p.shop}</div>`:'';const claim=document.getElementById('claim');claim.textContent=owned?'GET済み':arrived&&speedOk&&walkOk?'CARD GET':'GPS CHECK';claim.disabled=owned;claim.dataset.ready=arrived&&speedOk&&walkOk?'1':'0'}
function claimSelected(){if(!selected||!userPos)return toast('GPS位置情報を取得中');const d=hav(userPos,{lat:selected.lat,lng:selected.lng});if(d>selected.radius)return toast(`あと約${Math.max(0,Math.round(d-selected.radius))}m`);if(speedKmh!=null&&speedKmh>MAX_WALK_SPEED)return toast('高速移動中は取得できません');if(walkMeters<REQUIRED_WALK_METERS)return toast(`歩行判定 あと${Math.ceil(REQUIRED_WALK_METERS-walkMeters)}m`);if(!state.owned.includes(selected.id)){state.owned.push(selected.id);save(state)}markers.get(selected.id)?.setIcon(markerIcon(selected));document.getElementById('sheet').classList.remove('on');document.getElementById('rewardMark').textContent=selected.mark;document.getElementById('rewardName').textContent=selected.get;document.getElementById('reward').classList.add('on');renderCollection()}
function renderCollection(){const total=POINTS.length,owned=state.owned.length,mans=POINTS.filter(p=>p.manhole),gotM=mans.filter(p=>state.owned.includes(p.id)).length;document.getElementById('collectionCount').textContent=`MAP CARD ${owned} / ${total}｜既存QUESTカードは従来COLLECTIONを維持`;document.getElementById('manholeProgress').innerHTML=`<b>マンホール大量収集</b><br>天満マンホール ${gotM}/10｜地図マーカーも取得済み表示へ切替`;document.getElementById('collectionGrid').innerHTML=POINTS.map(p=>`<div class="card ${state.owned.includes(p.id)?'':'lock'}"><div class="art">${state.owned.includes(p.id)?p.mark:'？'}</div><b>${state.owned.includes(p.id)?p.get:'未取得'}</b><small>${CATEGORIES[p.cat][1]}｜${p.name}</small></div>`).join('')}
function toast(t){clearTimeout(toastTimer);const b=document.getElementById('toast');b.textContent=t;b.classList.add('on');toastTimer=setTimeout(()=>b.classList.remove('on'),1800)}
