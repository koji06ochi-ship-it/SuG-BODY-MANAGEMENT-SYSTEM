<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>S.u.G QUEST V26.5.211</title><style>html,body{margin:0;height:100%;background:#070708;color:#f3d98b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{position:fixed;inset:0 0 72px 0;width:100%;height:calc(100% - 72px);border:0;background:#080809}.flowbar{position:fixed;left:0;right:0;bottom:0;z-index:9999;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:#09090bf2;border-top:1px solid #69552d;display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.flowbtn{border:0;border-radius:12px;background:linear-gradient(180deg,#ecd27f,#b78a32);color:#090909;font-weight:1000;font-size:13px;padding:12px 10px}.walkbtn{border:1px solid #4f9bb3;border-radius:12px;background:linear-gradient(180deg,#153b47,#0b222a);color:#8deaff;font-weight:1000;font-size:13px;padding:12px 10px}.status{border:1px solid #44454c;border-radius:12px;background:#18181c;color:#bbb;font-size:10px;padding:10px 12px;min-width:86px;text-align:center}.status.done{color:#8be0aa;border-color:#315e44;background:#0f1813}@media(max-width:410px){.flowbtn,.walkbtn{font-size:11px;padding:11px 7px}.status{font-size:9px;min-width:70px;padding:9px 7px}}</style></head><body><iframe id="app" src="./quest-v26.5.200.html?v=26.5.211&fresh=1" title="S.u.G QUEST"></iframe><div class="flowbar"><button id="openFlow" class="flowbtn">TODAY FLOW →</button><button id="openWalk" class="walkbtn">WALK QUEST →</button><div id="flowStatus" class="status">未完了</div></div><script>(()=>{const frame=document.getElementById('app'),status=document.getElementById('flowStatus'),q=new URLSearchParams(location.search),embedded=q.get('embedded')==='1';const today=()=>new Date().toISOString().slice(0,10);function sessions(){try{return JSON.parse(localStorage.getItem('sug_training_sessions_v1')||'[]')}catch(_e){return[]}}function completedToday(){return sessions().some(r=>String(r?.at||'').slice(0,10)===today()&&(r?.flowClosedAt||r?.completion==='complete'||Number(r?.completedSets)>0))}function sync(){const done=completedToday();status.textContent=done?'トレ完了':'未完了';status.classList.toggle('done',done);if(!done)return;try{const doc=frame.contentDocument,btn=doc&&doc.getElementById('training');if(btn&&/未完了/.test(btn.textContent||'')){btn.click();const save=doc.getElementById('saveToday');if(save)save.click()}}catch(_e){}}document.getElementById('openFlow').onclick=()=>{const u='./?entry=member&v=26.5.211&flow=1&return=hub&fresh='+Date.now();if(embedded)location.href=u;else location.href=u};document.getElementById('openWalk').onclick=()=>{location.href='./walk-quest.html?v=26.5.211'+(embedded?'&embedded=1':'')+'&fresh='+Date.now()};frame.addEventListener('load',()=>setTimeout(sync,300));window.addEventListener('pageshow',()=>setTimeout(sync,250));window.addEventListener('storage',sync);setInterval(sync,1200);sync()})()</script></body></html>
