<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070604"><title>S.u.G QUEST</title><style>:root{--g:#d9ae50;--g2:#ffe6a0;--bg:#060504;--line:#574521;--mut:#a89d86}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -5%,#2a1d09,#080705 35%,#040403);color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif}.app{max-width:500px;margin:auto;padding:16px 14px 92px}.top{display:flex;justify-content:space-between;align-items:center;color:var(--g2);font-weight:900;letter-spacing:.08em}.tag{font-size:9px;color:#a99872;margin-top:3px}.hero{margin-top:17px}.hero h1{font-size:28px;margin:0}.hero p{font-size:11px;color:#bdb29e;line-height:1.6}.walkrow{display:grid;grid-template-columns:116px 1fr;gap:13px;align-items:center;margin-top:14px}.ring{width:116px;height:116px;border-radius:50%;display:grid;place-items:center;text-align:center;background:conic-gradient(#65dc84 0 63%,#25261f 63%);position:relative}.ring:after{content:'';position:absolute;inset:9px;background:#070705;border-radius:50%}.ring div{z-index:1}.ring b{font-size:24px}.ring small{display:block;color:var(--g2);font-size:9px}.target{border:1px solid #4d3b1d;border-radius:15px;padding:11px;background:linear-gradient(145deg,#171007,#0a0907)}.target small{color:#9c8f75}.target b{display:block;font-size:16px;color:var(--g2);margin:3px 0}.areas{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:14px 0}.area{border:1px solid #39362d;background:#0d0c0a;color:#aaa;padding:9px 2px;border-radius:10px;font-size:9px;font-weight:800}.area.on{background:linear-gradient(#f2d47e,#b98c31);color:#080704;border-color:#ffe8a1}.progress{display:block;font-size:8px;margin-top:3px}.sec{border:1px solid #443719;border-radius:18px;background:linear-gradient(#12100c,#090806);padding:12px;margin-top:11px}.sectop{display:flex;justify-content:space-between;align-items:center}.sec h2{font-size:14px;color:var(--g2);margin:0}.cats{display:flex;gap:6px;overflow:auto;margin:10px 0}.cat{white-space:nowrap;border:1px solid #3b362c;background:#090806;color:#aaa;border-radius:999px;padding:7px 10px;font-size:9px}.cat.on{color:#080704;background:var(--g2)}.featured{display:grid;grid-template-columns:minmax(0,1fr) 118px;gap:12px;align-items:center;padding:12px;border:1px solid #6d5526;border-radius:17px;background:linear-gradient(135deg,#1c1207,#080706);box-shadow:0 0 25px #d5a84314}.featured .face{width:100%;aspect-ratio:2/3}.fcopy h3{font-size:20px;margin:5px 0}.fcopy p{font-size:9px;line-height:1.6;color:#b4a994}.req{margin-top:9px;padding:9px;border:1px solid #40351f;border-radius:11px;background:#090806}.req div{font-size:9px;margin:5px 0}.bar{height:6px;border-radius:6px;background:#292720;overflow:hidden}.bar i{display:block;height:100%;background:#67dc83}.remain{color:var(--g2);font-weight:900}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{border:0;background:none;color:#fff;padding:0;text-align:left}.face{position:relative;aspect-ratio:2/3;border-radius:13px;overflow:hidden;border:2px solid #b28a38;box-shadow:0 7px 18px #0008;background:radial-gradient(circle at 50% 28%,#58351d,#130e09 67%)}.face:before,.face:after{content:'';position:absolute;inset:5px;border:1px solid #e1b95b88;border-radius:9px;pointer-events:none}.face:after{inset:10px;border-color:#80622688}.face .type{position:absolute;top:12px;left:14px;font:800 8px Georgia;color:#f7d77e;letter-spacing:.12em}.face .num{position:absolute;top:28px;left:14px;width:35px;height:35px;display:grid;place-items:center;transform:rotate(45deg);background:#6d100c;border:1px solid #d6a74b;font:bold 14px Georgia}.face .num span{transform:rotate(-45deg)}.portrait{position:absolute;inset:64px 12px 68px;display:grid;place-items:center;border-radius:8px;background:radial-gradient(circle,#70451d,#17100a 70%);font-size:54px;font-family:serif;color:#e6c36c;text-shadow:0 2px 14px #000}.spotface{background:linear-gradient(#173523,#0b1c12)}.spotface .portrait{background:linear-gradient(#466d42,#172619);font-size:42px}.histface{background:linear-gradient(#292217,#100d08)}.face .name{position:absolute;left:14px;right:14px;bottom:31px;text-align:center;font-weight:1000;font-size:15px}.face .id{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#c7a453;font:700 7px Georgia;letter-spacing:.1em}.face.locked{filter:saturate(.45) brightness(.52)}.face.locked .lockmark{display:grid}.lockmark{display:none;position:absolute;z-index:5;inset:0;place-items:center;background:#0002;font-size:12px;font-weight:900;letter-spacing:.12em}.tilemeta{padding:7px 2px 2px}.tilemeta b{font-size:12px}.tilemeta small{display:block;color:#a99e88;font-size:8px;margin-top:2px}.ready .face{box-shadow:0 0 26px #f2c75c55}.ready .tilemeta small{color:#84df9e}.bottom{position:fixed;bottom:0;left:0;right:0;background:#080706f7;border-top:1px solid #332a18;display:flex;justify-content:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}.nav{width:min(500px,100%);display:grid;grid-template-columns:repeat(5,1fr);text-align:center;color:#888;font-size:9px}.nav b{display:block;font-size:18px}.nav .on{color:var(--g2)}button{font:inherit}</style></head><body><div class="app"><header class="top"><div>S.u.G QUEST<div class="tag">HISTORY × WALK × DISCOVERY</div></div><div>◈ <span id="points">0</span>pt</div></header><section class="hero"><h1>歩けば、出会える。</h1><p>その土地を歩いた人だけが、その土地のカードを手に入れられる。</p><div class="walkrow"><div class="ring"><div><b id="steps">3,160</b><small>/ 5,000歩</small><small id="remainTop">あと1,840歩</small></div></div><div class="target"><small>TODAY'S TARGET</small><b id="targetName">楠木正成</b><span class="remain" id="targetRemain">あと1,840歩</span><small style="display:block;margin-top:5px">歩数＋GPS＋QUESTで解放</small></div></div></section><div class="areas" id="areas"></div><section class="sec"><div class="sectop"><h2 id="areaTitle">河南町編</h2><small id="areaProg">6/18枚</small></div><div class="cats" id="cats"></div><div id="featured"></div></section><section class="sec"><div class="sectop"><h2>カードコレクション</h2><small>欲しいカードを選ぶ</small></div><div class="grid" id="cards"></div></section></div><div class="bottom"><div class="nav"><div class="on"><b>⌂</b>ホーム</div><div><b>⌖</b>マップ</div><div><b>▣</b>クエスト</div><div><b>◈</b>カード</div><div><b>♙</b>マイページ</div></div></div><script>const data={天満:{p:'12/24',pc:63,c:[['菅原道真','人物',5000,'道','TM-PRS-001'],['大阪天満宮','SPOT',3000,'天','TM-SPT-001'],['天満つくし','グルメ',3000,'蕎','TM-FOD-001']]},太子町:{p:'3/16',pc:21,c:[['聖徳太子','人物',5000,'太','TS-PRS-001'],['叡福寺','史跡',4000,'寺','TS-HST-001'],['太子温泉','回復',3000,'湯','TS-RCV-001']]},河南町:{p:'6/18',pc:42,c:[['楠木正成','人物',5000,'楠','MK-KN-002'],['平石城跡','史跡',4000,'城','MK-HST-001'],['持尾城跡','史跡',4000,'城','MK-HST-002'],['道の駅かなん','SPOT',3000,'菜','S01-SPT-0103'],['磐船大神社','史跡',5000,'磐','MK-HST-003']]},千早赤阪村:{p:'8/20',pc:55,c:[['楠木正成','人物',5000,'楠','CA-PRS-001'],['楠木正行','人物',5000,'行','CA-PRS-002'],['赤阪城跡','史跡',4000,'城','CA-HST-001'],['千早城跡','史跡',5000,'城','CA-HST-002']]}};const labels=['すべて','人物','史跡','SPOT','グルメ','回復','交通'];let current='河南町',filter='すべて',steps=3160,target=0;const face=(c,left)=>`<div class="face ${c[1]==='SPOT'?'spotface':c[1]==='史跡'?'histface':''} ${left?'locked':''}"><div class="type">${c[1]} CARD</div><div class="num"><span>${String(target+1).padStart(2,'0')}</span></div><div class="portrait">${c[3]}</div><div class="name">${c[0]}</div><div class="id">${c[4]}</div><div class="lockmark">LOCKED</div></div>`;function renderAreas(){areas.innerHTML=Object.entries(data).map(([n,v])=>`<button class="area ${n===current?'on':''}" onclick="current='${n}';filter='すべて';target=0;render()">${n}<span class="progress">${v.p}枚<br>${v.pc}%</span></button>`).join('')}function renderCats(){cats.innerHTML=labels.map(x=>`<button class="cat ${filter===x?'on':''}" onclick="filter='${x}';render()">${x}</button>`).join('')}function render(){renderAreas();renderCats();const d=data[current];areaTitle.textContent=current+'編';areaProg.textContent=d.p+'枚・'+d.pc+'%';let list=d.c.filter(c=>filter==='すべて'||c[1]===filter);if(!list.length){cards.innerHTML='<small>このカテゴリは準備中</small>';featured.innerHTML='';return}if(target>=list.length)target=0;const f=list[target],left=Math.max(0,f[2]-steps),pct=Math.min(100,steps/f[2]*100);targetName.textContent=f[0];targetRemain.textContent=left?'あと'+left.toLocaleString()+'歩':'歩数条件達成';featured.innerHTML=`<div class="featured"><div class="fcopy"><small>${f[1]} CARD</small><h3>${f[0]}</h3><p>カードを取るために、その土地を歩く。到着だけでは解放されない。</p><div class="req"><div>👣 歩数　<b>${Math.round(steps).toLocaleString()} / ${f[2].toLocaleString()}</b></div><div class="bar"><i style="width:${pct}%"></i></div><div>📍 GPS CHECK　0 / 1</div><div>▣ QUEST　0 / 1</div><div class="remain">${left?'あと '+left.toLocaleString()+'歩':'✓ 歩数達成 → GPS CHECKへ'}</div></div></div>${face(f,left)}</div>`;cards.innerHTML=list.map((c,i)=>{const l=Math.max(0,c[2]-steps);return `<button class="tile ${l?'':'ready'}" onclick="target=${i};render();window.scrollTo({top:430,behavior:'smooth'})">${face(c,l)}<div class="tilemeta"><b>${c[0]}</b><small>${l?'あと '+l.toLocaleString()+'歩':'歩数達成・GPSへ'}</small></div></button>`}).join('')}function health(p){if(p&&Number.isFinite(+p.steps)){steps=Math.max(0,+p.steps);document.getElementById('steps').textContent=Math.round(steps).toLocaleString();document.getElementById('remainTop').textContent=steps<5000?'あと'+Math.round(5000-steps).toLocaleString()+'歩':'歩数条件達成';render()}}window.addEventListener('sug:native-health',e=>health(e.detail));try{health(window.__SUG_NATIVE_HEALTH__||JSON.parse(localStorage.getItem('sug_native_health_v1')||'null'))}catch(e){}render();</script></body></html>
