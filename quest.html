<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070604"><title>S.u.G QUEST</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -5%,#2a1d09,#080705 35%,#040403);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:500px;margin:auto;padding:16px 14px 92px}.top{display:flex;justify-content:space-between;color:#ffe6a0;font-weight:900}.sub{font-size:9px;color:#a99872}h1{font-size:28px;margin:18px 0 5px}.lead{font-size:11px;color:#bdb29e}.walk{display:grid;grid-template-columns:116px 1fr;gap:12px;align-items:center;margin:15px 0}.ring{width:116px;height:116px;border-radius:50%;display:grid;place-items:center;text-align:center;background:conic-gradient(#65dc84 0 63%,#25261f 63%);position:relative}.ring:after{content:"";position:absolute;inset:9px;border-radius:50%;background:#070705}.ring>div{z-index:1}.ring b{font-size:24px}.ring small{display:block;font-size:9px;color:#ffe6a0}.target{border:1px solid #4d3b1d;border-radius:15px;padding:12px;background:#100c07}.target small{color:#9c8f75}.target b{display:block;color:#ffe6a0;font-size:18px;margin:4px 0}.areas{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:14px 0}.area{border:1px solid #39362d;background:#0d0c0a;color:#aaa;padding:9px 2px;border-radius:10px;font-size:9px;font-weight:800}.area.on{background:linear-gradient(#f2d47e,#b98c31);color:#080704}.area span{display:block;font-size:8px;margin-top:3px}.sec{border:1px solid #443719;border-radius:18px;background:linear-gradient(#12100c,#090806);padding:12px;margin-top:11px}.sectop{display:flex;justify-content:space-between;align-items:center}h2{font-size:14px;color:#ffe6a0;margin:0}.cats{display:flex;gap:6px;overflow:auto;margin:10px 0}.cat{white-space:nowrap;border:1px solid #3b362c;background:#090806;color:#aaa;border-radius:999px;padding:7px 10px;font-size:9px}.cat.on{color:#080704;background:#ffe6a0}.featured{display:grid;grid-template-columns:1fr 130px;gap:12px;align-items:center;border:1px solid #6d5526;border-radius:17px;padding:12px}.featured h3{font-size:20px;margin:5px 0}.featured p,.req{font-size:9px;color:#b4a994;line-height:1.6}.req{padding:9px;border:1px solid #40351f;border-radius:11px;background:#090806}.bar{height:6px;background:#292720;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:#67dc83}.remain{color:#ffe6a0;font-weight:900}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{border:0;background:none;color:white;padding:0;text-align:left}.face{position:relative;aspect-ratio:2/3;border-radius:13px;overflow:hidden;border:2px solid #b28a38;background:#16110b;box-shadow:0 7px 18px #0008}.face img{width:100%;height:100%;object-fit:cover;display:block}.face.locked img{filter:brightness(.36) saturate(.45)}.lock{display:none;position:absolute;inset:0;place-items:center;font-size:13px;font-weight:900;letter-spacing:.12em;background:#0003}.face.locked .lock{display:grid}.placeholder{height:100%;display:grid;place-items:center;font-size:44px;color:#c8a34d;background:radial-gradient(circle,#523319,#130e09 70%)}.tilemeta{padding:7px 2px}.tilemeta b{font-size:12px}.tilemeta small{display:block;font-size:8px;color:#a99e88}.bottom{position:fixed;bottom:0;left:0;right:0;background:#080706f7;border-top:1px solid #332a18;display:flex;justify-content:center;padding:9px 0 calc(9px + env(safe-area-inset-bottom))}.nav{width:min(500px,100%);display:grid;grid-template-columns:repeat(5,1fr);text-align:center;color:#888;font-size:9px}.nav b{display:block;font-size:18px}.nav .on{color:#ffe6a0}button{font:inherit}
</style></head><body><div class="app"><header class="top"><div>S.u.G QUEST<div class="sub">HISTORY × WALK × DISCOVERY</div></div><div>◈ 0pt</div></header><h1>歩けば、出会える。</h1><div class="lead">その土地を歩いた人だけが、その土地のカードを手に入れられる。</div><div class="walk"><div class="ring"><div><b id="steps">3,160</b><small>/ 5,000歩</small><small id="remainTop">あと1,840歩</small></div></div><div class="target"><small>TODAY'S TARGET</small><b id="targetName">楠木正成</b><div id="targetRemain" class="remain">あと1,840歩</div><small>歩数＋GPS＋QUESTで解放</small></div></div><div class="areas" id="areas"></div><section class="sec"><div class="sectop"><h2 id="areaTitle">河南町編</h2><small id="areaProg">6/18枚・42%</small></div><div class="cats" id="cats"></div><div id="featured"></div></section><section class="sec"><div class="sectop"><h2>カードコレクション</h2><small>欲しいカードを選ぶ</small></div><div class="grid" id="cards"></div></section></div><div class="bottom"><div class="nav"><div class="on"><b>⌂</b>ホーム</div><div><b>⌖</b>マップ</div><div><b>▣</b>クエスト</div><div><b>◈</b>カード</div><div><b>♙</b>マイページ</div></div></div><script>
const IMG={};
async function loadCardArt(){
  const defs=[["MK-KN-002","./assets/quest/masashige-card-b64.txt"],["S01-SPT-0103","./assets/quest/kanan-card-b64.txt"]];
  await Promise.all(defs.map(async ([id,url])=>{try{const r=await fetch(url+"?v=20260904");if(r.ok)IMG[id]="data:image/webp;base64,"+(await r.text()).trim()}catch(e){}}));
  render();
}
const data={"天満":{p:"12/24",pc:63,c:[["菅原道真","人物",5000,"道","TM-PRS-001"],["大阪天満宮","SPOT",3000,"天","TM-SPT-001"],["天満つくし","グルメ",3000,"蕎","TM-FOD-001"]]},"太子町":{p:"3/16",pc:21,c:[["聖徳太子","人物",5000,"太","TS-PRS-001"],["叡福寺","史跡",4000,"寺","TS-HST-001"],["太子温泉","回復",3000,"湯","TS-RCV-001"]]},"河南町":{p:"6/18",pc:42,c:[["楠木正成","人物",5000,"楠","MK-KN-002"],["平石城跡","史跡",4000,"城","MK-HST-001"],["持尾城跡","史跡",4000,"城","MK-HST-002"],["道の駅かなん","SPOT",3000,"菜","S01-SPT-0103"],["磐船大神社","史跡",5000,"磐","MK-HST-003"]]},"千早赤阪村":{p:"8/20",pc:55,c:[["楠木正成","人物",5000,"楠","CA-PRS-001"],["楠木正行","人物",5000,"行","CA-PRS-002"],["赤阪城跡","史跡",4000,"城","CA-HST-001"],["千早城跡","史跡",5000,"城","CA-HST-002"]]}};
const labels=["すべて","人物","史跡","SPOT","グルメ","回復","交通"];let current="河南町",filter="すべて",steps=3160,target=0;
function face(c,left){let body=IMG[c[4]]?`<img src="${IMG[c[4]]}" alt="${c[0]}">`:`<div class="placeholder">${c[3]}</div>`;return `<div class="face ${left?"locked":""}">${body}<div class="lock">LOCKED</div></div>`}
function renderAreas(){areas.innerHTML=Object.entries(data).map(([n,v])=>`<button class="area ${n===current?"on":""}" onclick="current='${n}';filter='すべて';target=0;render()">${n}<span>${v.p}枚<br>${v.pc}%</span></button>`).join("")}
function renderCats(){cats.innerHTML=labels.map(x=>`<button class="cat ${x===filter?"on":""}" onclick="filter='${x}';target=0;render()">${x}</button>`).join("")}
function render(){renderAreas();renderCats();const d=data[current];areaTitle.textContent=current+"編";areaProg.textContent=d.p+"枚・"+d.pc+"%";let list=d.c.filter(c=>filter==="すべて"||c[1]===filter);if(!list.length){featured.innerHTML="<small>このカテゴリは準備中</small>";cards.innerHTML="";return}if(target>=list.length)target=0;const f=list[target],left=Math.max(0,f[2]-steps),pct=Math.min(100,steps/f[2]*100);targetName.textContent=f[0];targetRemain.textContent=left?`あと${left.toLocaleString()}歩`:"歩数条件達成";featured.innerHTML=`<div class="featured"><div><small>${f[1]} CARD</small><h3>${f[0]}</h3><p>カードを取るために、その土地を歩く。到着だけでは解放されない。</p><div class="req">👣 ${Math.round(steps).toLocaleString()} / ${f[2].toLocaleString()}歩<div class="bar"><i style="width:${pct}%"></i></div>📍 GPS CHECK 0/1<br>▣ QUEST 0/1<br><span class="remain">${left?"あと "+left.toLocaleString()+"歩":"✓ 歩数達成 → GPS CHECKへ"}</span></div></div>${face(f,left)}</div>`;cards.innerHTML=list.map((c,i)=>{const l=Math.max(0,c[2]-steps);return `<button class="tile" onclick="target=${i};render();window.scrollTo({top:430,behavior:'smooth'})">${face(c,l)}<div class="tilemeta"><b>${c[0]}</b><small>${l?"あと "+l.toLocaleString()+"歩":"歩数達成・GPSへ"}</small></div></button>`}).join("")}
function health(p){if(p&&Number.isFinite(+p.steps)){steps=Math.max(0,+p.steps);document.getElementById("steps").textContent=Math.round(steps).toLocaleString();document.getElementById("remainTop").textContent=steps<5000?`あと${Math.round(5000-steps).toLocaleString()}歩`:"歩数条件達成";render()}}
window.addEventListener("sug:native-health",e=>health(e.detail));try{health(window.__SUG_NATIVE_HEALTH__||JSON.parse(localStorage.getItem("sug_native_health_v1")||"null"))}catch(e){}render();loadCardArt();
</script></body></html>
