<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070604"><title>S.u.G QUEST</title><style>:root{--g:#e2bd61;--g2:#ffe49a;--bg:#070604;--panel:#11100d;--line:#4d4025;--mut:#9b927f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -5%,#30230e,#090806 34%,#050504);color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif}.app{max-width:500px;margin:auto;padding:16px 14px 92px}.top{display:flex;justify-content:space-between;align-items:center;color:var(--g2);font-weight:900;letter-spacing:.08em}.tag{font-size:10px;color:#aa9a77;margin-top:3px}.hero{margin-top:18px}.hero h1{font-size:29px;line-height:1.18;margin:0}.hero p{color:#b9af9b;font-size:12px}.ring{margin:17px auto;width:154px;height:154px;border-radius:50%;display:grid;place-items:center;text-align:center;background:conic-gradient(#62db82 0 63%,#292a25 63%);position:relative}.ring:after{content:'';position:absolute;inset:10px;border-radius:50%;background:#080806}.ring div{z-index:1}.ring b{font-size:30px}.ring small{display:block;color:var(--g2)}.areas{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}.area{border:1px solid #39362e;background:#0d0d0b;color:#aaa;padding:9px 3px;border-radius:10px;font-size:10px;font-weight:800}.area.on{background:linear-gradient(#f1d37c,#b98c32);color:#090704;border-color:#ffe8a0}.progress{font-size:9px;display:block;margin-top:3px}.sec{border:1px solid var(--line);border-radius:18px;background:linear-gradient(#15130e,#0b0a08);padding:13px;margin-top:12px}.sec h2{font-size:13px;color:var(--g2);margin:0 0 10px}.cats{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.cat{white-space:nowrap;border:1px solid #3c382d;background:#0a0907;color:#aaa;border-radius:999px;padding:7px 10px;font-size:9px}.cat.on{color:#090704;background:var(--g2)}.card{display:grid;grid-template-columns:82px 1fr;gap:11px;padding:10px;border:1px solid #42371f;border-radius:13px;background:#0a0907;margin-top:8px}.art{height:96px;border-radius:9px;border:1px solid #765d29;background:linear-gradient(145deg,#4a2d13,#17100a);display:grid;place-items:center;font-size:37px}.card h3{margin:2px 0;font-size:16px}.card p{margin:4px 0;color:#a9a08e;font-size:9px;line-height:1.5}.bar{height:6px;border-radius:6px;background:#292720;overflow:hidden}.bar i{display:block;height:100%;background:#68db83}.remain{font-size:10px;color:var(--g2);margin-top:6px}.lock{opacity:.45}.spot{display:flex;gap:8px;overflow:auto}.spot div{min-width:105px;border:1px solid #3b3528;border-radius:11px;padding:9px;background:#0b0a08;font-size:10px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#090806f5;border-top:1px solid #332b1a;display:flex;justify-content:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}.nav{width:min(500px,100%);display:grid;grid-template-columns:repeat(5,1fr);text-align:center;font-size:9px;color:#888}.nav b{display:block;font-size:18px}.nav .on{color:var(--g2)}button{font:inherit}</style></head><body><div class="app"><header class="top"><div>S.u.G QUEST<div class="tag">HISTORY × WALK × DISCOVERY</div></div><div>◈ <span id="points">0</span>pt</div></header><section class="hero"><h1>歩けば、出会える。</h1><p>その土地を歩いた人だけが、その土地のカードを手に入れられる。</p><div class="ring"><div><b id="steps">3,160</b><small>/ 5,000歩</small><small id="remain">あと1,840歩</small></div></div></section><div class="areas" id="areas"></div><section class="sec"><h2 id="areaTitle">河南町編</h2><div class="cats"><button class="cat on">すべて</button><button class="cat">人物</button><button class="cat">史跡</button><button class="cat">SPOT</button><button class="cat">グルメ</button><button class="cat">回復</button><button class="cat">交通</button></div><div id="cards"></div></section><section class="sec"><h2>近くのSPOT</h2><div class="spot" id="spots"></div></section></div><div class="bottom"><div class="nav"><div class="on"><b>⌂</b>ホーム</div><div><b>⌖</b>マップ</div><div><b>▣</b>クエスト</div><div><b>◈</b>カード</div><div><b>♙</b>マイページ</div></div></div><script>const data={天満:{p:'12/24',pc:63,cards:[['菅原道真','人物','5000'],['大阪天満宮','SPOT','3000'],['天満つくし','グルメ','3000']]},太子町:{p:'3/16',pc:21,cards:[['聖徳太子','人物','5000'],['叡福寺','史跡','4000'],['太子温泉','回復','3000']]},河南町:{p:'6/18',pc:42,cards:[['楠木正成','人物','5000'],['平石城跡','史跡','4000'],['持尾城跡','史跡','4000'],['道の駅かなん','SPOT','3000'],['磐船大神社','史跡','5000']]},千早赤阪村:{p:'8/20',pc:55,cards:[['楠木正成','人物','5000'],['楠木正行','人物','5000'],['赤阪城跡','史跡','4000'],['千早城跡','史跡','5000']]}};let current='河南町',steps=3160;function area(){areas.innerHTML=Object.entries(data).map(([n,v])=>`<button class="area ${n===current?'on':''}" onclick="current='${n}';render()">${n}<span class="progress">${v.p}枚<br>${v.pc}%</span></button>`).join('')}function render(){area();areaTitle.textContent=current+'編';cards.innerHTML=data[current].cards.map((c,i)=>{let need=+c[2],left=Math.max(0,need-steps),pct=Math.min(100,steps/need*100);return `<div class="card ${left?'':'ready'}"><div class="art">${c[1]==='人物'?'⚔':c[1]==='SPOT'?'🏠':'🏯'}</div><div><small>${c[1]} CARD</small><h3>${c[0]}</h3><p>歩数 + GPS + QUESTでカード解放</p><div class="bar"><i style="width:${pct}%"></i></div><div class="remain">${left?'あと '+left.toLocaleString()+'歩':'✓ 歩数達成・GPS CHECKへ'}</div></div></div>`}).join('');spots.innerHTML=data[current].cards.slice(1,4).map(c=>`<div><b>${c[0]}</b><br><small>${c[1]} CARD</small></div>`).join('')}function health(p){if(p&&Number.isFinite(+p.steps)){steps=Math.max(0,+p.steps);document.getElementById('steps').textContent=Math.round(steps).toLocaleString();document.getElementById('remain').textContent=steps<5000?'あと '+Math.round(5000-steps).toLocaleString()+'歩':'歩数条件達成';render()}}window.addEventListener('sug:native-health',e=>health(e.detail));try{health(window.__SUG_NATIVE_HEALTH__||JSON.parse(localStorage.getItem('sug_native_health_v1')||'null'))}catch(e){}render();</script></body></html>
