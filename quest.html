<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020202"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>S.u.G QUEST</title><style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="questFrame" src="./quest-v3.html?v=home-masashige-detail-20260906c"></iframe><script>
const frame=document.getElementById('questFrame');

function installTenmaFoodQuest(doc){
  if(!doc||doc.querySelector('[data-tenma-food-installed]'))return;
  const marker=doc.createElement('meta');marker.dataset.tenmaFoodInstalled='';doc.head.appendChild(marker);

  const style=doc.createElement('style');
  style.textContent=`
    .tenmaFoodHomeCard{margin-top:10px!important;border-color:#b88936!important;box-shadow:0 0 16px #c9973b33!important;background:linear-gradient(135deg,#181006,#050403)!important}
    .tenmaFoodHomeCard .thumb{background:radial-gradient(circle at 35% 30%,#9d6f25,#241607 48%,#050403 100%);color:#ffe19a;font:700 34px Georgia,'Yu Mincho',serif}
    .tenmaFoodHomeCard h3{color:#ffe19a!important}.tenmaFoodHomeCard .mut{color:#c9c1b1!important}
    .tenmaFoodAreaCard{border-color:#b88936!important;box-shadow:0 0 18px #c9973b26}
    .tenmaFoodAreaCard .scene{display:grid;place-items:center;background:radial-gradient(circle at 40% 30%,#a97928,#2b1909 48%,#050403 100%);color:#ffe19a;font:700 54px Georgia,'Yu Mincho',serif;text-shadow:0 3px 16px #000}
    .tenmaFoodAreaCard .areaText h3{font-size:21px!important}
    .tenmaFoodOverlay{position:fixed;z-index:99999;inset:0;overflow:auto;background:#020202;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 12px calc(40px + env(safe-area-inset-bottom));font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif}
    .tenmaFoodTop{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:42px 1fr 42px;align-items:center;padding:7px 0 13px;background:linear-gradient(#020202 78%,#02020200)}
    .tenmaFoodBack{border:0;background:none;color:#f4d079;font-size:32px;text-align:left;padding:0 5px}.tenmaFoodTitle{text-align:center;color:#f4d079;font:700 24px Georgia,'Yu Mincho',serif}
    .tenmaFoodHero{padding:20px 16px;border:1px solid #8b682e;border-radius:16px;background:radial-gradient(circle at 25% 10%,#5c3b13,#15100a 48%,#050403 100%);box-shadow:0 10px 28px #0008}
    .tenmaFoodHero small{color:#d7b86d;font-weight:800;letter-spacing:.12em}.tenmaFoodHero h2{margin:7px 0 6px;color:#ffe19a;font-size:28px}.tenmaFoodHero p{margin:0;color:#d8d0c0;font-size:11px;line-height:1.7}
    .tenmaFoodProgress{display:flex;justify-content:space-between;align-items:end;margin:15px 0 7px}.tenmaFoodProgress b{font:700 30px Georgia,serif}.tenmaFoodProgress span{font-size:10px;color:#b7ad98}
    .tenmaFoodBar{height:8px;border:1px solid #755a2a;background:#1e211c;border-radius:10px;overflow:hidden}.tenmaFoodBar i{display:block;width:0;height:100%;background:linear-gradient(90deg,#73e86e,#08c85b)}
    .tenmaFoodRules{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0 16px}.tenmaFoodRule{padding:10px 6px;border:1px solid #4f4229;border-radius:10px;background:#090909;text-align:center}.tenmaFoodRule b{display:block;color:#f1cd76;font-size:11px}.tenmaFoodRule span{display:block;margin-top:4px;color:#aaa;font-size:8px}
    .tenmaFoodSlots{display:grid;gap:8px}.tenmaFoodSlot{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:9px;padding:10px;border:1px solid #4f4229;border-radius:12px;background:linear-gradient(135deg,#12100b,#050504)}
    .tenmaFoodNo{width:38px;height:38px;display:grid;place-items:center;border:1px solid #8b682e;border-radius:50%;color:#f4d079;font:700 15px Georgia,serif}.tenmaFoodSlot h3{margin:0;color:#e8dfcd;font-size:12px}.tenmaFoodSlot p{margin:3px 0 0;color:#8f887a;font-size:9px}.tenmaFoodLock{text-align:center;color:#8f887a;font-size:17px}.tenmaFoodSlot.secret{border-color:#7b6031;background:radial-gradient(circle at 15% 50%,#2b210f,#050504 56%)}.tenmaFoodSlot.secret h3{color:#d8b85f;letter-spacing:.08em}
  `;
  doc.head.appendChild(style);

  function openFood(){
    let overlay=doc.getElementById('tenmaFoodQuestOverlay');
    if(!overlay){
      overlay=doc.createElement('section');overlay.id='tenmaFoodQuestOverlay';overlay.className='tenmaFoodOverlay';
      overlay.innerHTML=`<div class="tenmaFoodTop"><button class="tenmaFoodBack" type="button">‹</button><div class="tenmaFoodTitle">S.u.G QUEST</div><div></div></div><div class="tenmaFoodHero"><small>TENMA FOOD WALK</small><h2>天満 食べ歩きQUEST</h2><p>食べたい・体験したいを「歩く理由」に。天満の10スポットを、自分のペースで巡るQUEST。</p><div class="tenmaFoodProgress"><b>0 / 10</b><span>SHOP CARD</span></div><div class="tenmaFoodBar"><i></i></div></div><div class="tenmaFoodRules"><div class="tenmaFoodRule"><b>STEP</b><span>歩数を記録</span></div><div class="tenmaFoodRule"><b>GPS</b><span>現地到達</span></div><div class="tenmaFoodRule"><b>QUEST</b><span>条件クリア</span></div></div><div class="tenmaFoodSlots">${Array.from({length:9},(_,i)=>`<div class="tenmaFoodSlot"><div class="tenmaFoodNo">${String(i+1).padStart(2,'0')}</div><div><h3>連携店舗 選定中</h3><p>SHOP / FOOD / EXPERIENCE</p></div><div class="tenmaFoodLock">🔒</div></div>`).join('')}<div class="tenmaFoodSlot secret"><div class="tenmaFoodNo">10</div><div><h3>SECRET QUEST</h3><p>LAST BOSS / LOCKED</p></div><div class="tenmaFoodLock">?</div></div></div>`;
      overlay.querySelector('.tenmaFoodBack').addEventListener('click',()=>overlay.style.display='none');doc.body.appendChild(overlay);
    }
    overlay.style.display='block';overlay.scrollTop=0;
  }
  doc.defaultView.openTenmaFoodQuest=openFood;

  const today=doc.querySelector('.today');
  if(today&&!doc.querySelector('.tenmaFoodHomeCard')){
    const card=doc.createElement('button');card.type='button';card.className='today tenmaFoodHomeCard';
    card.innerHTML='<div class="thumb">食</div><div><h3>天満 食べ歩きQUEST</h3><div class="mut">10店舗を自由に巡る｜STEP＋GPS＋QUEST</div></div><div style="color:#f4d079;font-size:22px">›</div>';
    card.addEventListener('click',openFood);today.insertAdjacentElement('afterend',card);
  }

  const areaList=doc.querySelector('#areaList');
  if(areaList&&!areaList.querySelector('.tenmaFoodAreaCard')){
    const card=doc.createElement('button');card.type='button';card.className='areaCard tenmaFoodAreaCard';
    card.innerHTML='<div class="scene">食</div><div class="areaText"><h3>天満 食べ歩きQUEST</h3><p>食・体験・街歩き。10スポットを自由に巡る</p><div class="nums"><b>0/10</b><b>選定中</b></div><div class="prog"><i style="width:0%"></i></div></div>';
    card.addEventListener('click',openFood);areaList.appendChild(card);
  }
}

function installCardCollection(doc){
  if(!doc||doc.querySelector('[data-card-flip-installed]'))return;
  const marker=doc.createElement('meta');marker.dataset.cardFlipInstalled='';doc.head.appendChild(marker);
  const style=doc.createElement('style');
  style.textContent=`
  .cardCollectionOverlay{position:fixed;z-index:100000;inset:0;display:none;overflow:auto;background:#020202;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 14px calc(110px + env(safe-area-inset-bottom));font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif}
  .cardCollectionHead{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:42px 1fr 42px;align-items:center;padding:6px 0 12px;background:linear-gradient(#020202 75%,#02020200)}
  .cardCollectionBack{border:0;background:none;color:#f4d079;font-size:32px;text-align:left}.cardCollectionTitle{text-align:center;color:#f4d079;font:700 23px Georgia,'Yu Mincho',serif}.cardCollectionHint{text-align:center;color:#9e947f;font-size:9px;margin-bottom:12px}
  .flipCardWrap{width:min(350px,92vw);height:min(520px,137vw);max-height:580px;margin:0 auto 18px;perspective:1400px}.flipCard{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .58s cubic-bezier(.2,.75,.2,1);cursor:pointer}.flipCard.flipped{transform:rotateY(180deg)}
  .flipFace{position:absolute;inset:0;overflow:hidden;border:2px solid #b98e3c;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 12px 35px #000c,0 0 22px #d9a93f22;background:#070605}.flipBack{transform:rotateY(180deg);overflow:auto;background:radial-gradient(circle at 50% 0,#28391d,#0b0c08 34%,#050403 70%);padding:19px 17px 24px}
  .protoFront{height:100%;display:flex;flex-direction:column;padding:22px;background:radial-gradient(circle at 50% 12%,#244229,#0d1b12 35%,#070605 70%);text-align:center}.protoFrame{flex:1;border:1px solid #b98e3c;border-radius:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:18px;background:linear-gradient(155deg,#101914,#071009 55%,#050403)}
  .protoType{color:#e8bd58;font:700 12px Georgia,serif;letter-spacing:.16em}.protoName{margin:13px 0;color:#fff1c7;font:700 29px Georgia,'Yu Mincho',serif;line-height:1.25}.protoSub{color:#c9b77d;font-size:11px;line-height:1.7}.protoId{margin-top:14px;color:#e8bd58;font:700 11px monospace}.protoTap{margin-top:15px;color:#9f947f;font-size:9px}
  .masashigeFront{position:relative;height:100%;background-image:linear-gradient(180deg,#0000 45%,#050403ee 90%),url('./assets/quest/kanan-person-card-scenes-20260904.webp?v=card-front-20260907');background-size:300% 300%;background-position:50% 50%;background-repeat:no-repeat}.masashigeFront:after{content:'楠木正成';position:absolute;left:16px;right:16px;bottom:25px;color:#ffe19a;font:700 30px Georgia,'Yu Mincho',serif;text-shadow:0 2px 8px #000}.masashigeFront .crest{position:absolute;right:13px;top:13px;width:92px;height:72px;object-fit:contain;background:#fff;border:2px solid #d8ab49;border-radius:11px;padding:5px}
  .backKicker{color:#d6b765;font:700 9px Arial,sans-serif;letter-spacing:.16em}.flipBack h2{margin:6px 0 13px;color:#ffe19a;font:700 23px Georgia,'Yu Mincho',serif}.backSection{margin:11px 0;padding:10px 11px;border:1px solid #5b4726;border-radius:10px;background:#0c0b08cc}.backSection b{display:block;margin-bottom:5px;color:#e8bd58;font-size:10px;letter-spacing:.06em}.backSection p,.backSection li{color:#e7ddca;font-size:10px;line-height:1.65}.backSection p{margin:0}.backSection ul{margin:0;padding-left:17px}.sourceLine{margin-top:12px;padding-top:9px;border-top:1px solid #4a391d;color:#a79d88;font-size:8px;line-height:1.55}.sourceLine a{color:#d9bc72}.cardDots{display:flex;justify-content:center;gap:8px;margin:8px 0 18px}.cardDot{width:9px;height:9px;border:1px solid #8b682e;border-radius:50%;background:#17130c}.cardDot.on{background:#e8bd58}.cardNav{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-width:350px;margin:0 auto}.cardNav button{padding:11px;border:1px solid #6c552e;border-radius:10px;background:#0d0b08;color:#f4d079;font-weight:800}.cardNav button:disabled{opacity:.3}.verifiedBadge{display:inline-block;margin-left:5px;padding:2px 5px;border:1px solid #4c8b55;border-radius:9px;color:#9df0a9;font-size:7px;vertical-align:middle}
  `;
  doc.head.appendChild(style);

  let cards=[];let index=0;let overlay=null;
  function esc(s){return String(s==null?'':s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
  function list(items){return '<ul>'+items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'}
  function sources(card){const arr=(card.back.sources||[]);return '<div class="sourceLine">SOURCE｜'+esc(card.back.sourceLabel||'公開情報')+'<br>'+arr.map((u,i)=>'<a href="'+esc(u)+'" target="_blank" rel="noopener">資料'+(i+1)+'</a>').join(' ・ ')+'</div>'}
  function front(card){if(card.id==='kusunoki-masashige')return '<div class="masashigeFront"><img class="crest" src="./assets/quest/kikusui-kusunoki-masanari-20260904.jpg?v=canonical-20260904b" alt="菊水紋"></div>';
    const sub=card.id==='S01-SHP-0102'?'厳選牛 × ホルモン × 天満焼肉':'天満の提携SHOP QUEST';
    return '<div class="protoFront"><div class="protoFrame"><div class="protoType">SHOP CARD</div><div class="protoName">'+esc(card.name)+'</div><div class="protoSub">'+esc(sub)+'</div><div class="protoId">'+esc(card.id)+'</div></div><div class="protoTap">TAP → 裏面を見る</div></div>';
  }
  function back(card){const b=card.back;if(card.type==='SHOP')return '<div class="backKicker">SHOP DETAIL <span class="verifiedBadge">SOURCE CHECKED</span></div><h2>'+esc(card.name)+'</h2><div class="backSection"><b>おすすめ</b>'+list(b.recommended||[])+'</div><div class="backSection"><b>STAFF PICK</b><p>'+esc(b.staffPick)+'</p></div><div class="backSection"><b>おすすめ店員さん</b><p>'+esc(b.staff)+'</p></div><div class="backSection"><b>店のストーリー</b><p>'+esc(b.story)+'</p></div><div class="backSection"><b>アクセス</b><p>'+esc(b.access)+'</p></div><div class="backSection"><b>QUEST / CARD GET</b><p>'+esc(b.quest)+'</p></div>'+sources(card);
    return '<div class="backKicker">PERSON DETAIL <span class="verifiedBadge">● 公的資料確認</span></div><h2>'+esc(card.name)+'</h2><div class="backSection"><b>何をした人物？</b><p>'+esc(b.summary)+'</p></div><div class="backSection"><b>主な経歴</b>'+list(b.career||[])+'</div><div class="backSection"><b>関連する場所</b>'+list(b.places||[])+'</div><div class="backSection"><b>地域との関係</b><p>'+esc(b.localRelation)+'</p></div><div class="backSection"><b>家紋／シンボル</b><p>'+esc(b.emblem)+'</p></div><div class="backSection"><b>QUEST / CARD GET</b><p>'+esc(b.quest)+'</p></div>'+sources(card);
  }
  function render(){if(!overlay||!cards.length)return;const c=cards[index];const flip=overlay.querySelector('.flipCard');flip.classList.remove('flipped');flip.innerHTML='<div class="flipFace flipFront">'+front(c)+'</div><div class="flipFace flipBack">'+back(c)+'</div>';overlay.querySelectorAll('.cardDot').forEach((d,i)=>d.classList.toggle('on',i===index));overlay.querySelector('[data-prev]').disabled=index===0;overlay.querySelector('[data-next]').disabled=index===cards.length-1;}
  async function openCollection(){if(!overlay){overlay=doc.createElement('section');overlay.className='cardCollectionOverlay';overlay.id='cardCollectionOverlay';overlay.innerHTML='<div class="cardCollectionHead"><button class="cardCollectionBack" type="button">‹</button><div class="cardCollectionTitle">CARD COLLECTION</div><div></div></div><div class="cardCollectionHint">カードをタップすると表 ⇄ 裏｜裏面は公開情報で裏取り</div><div class="flipCardWrap"><div class="flipCard"></div></div><div class="cardDots"><span class="cardDot"></span><span class="cardDot"></span><span class="cardDot"></span></div><div class="cardNav"><button data-prev>‹ 前のカード</button><button data-next>次のカード ›</button></div>';doc.body.appendChild(overlay);overlay.querySelector('.cardCollectionBack').addEventListener('click',()=>overlay.style.display='none');overlay.querySelector('.flipCard').addEventListener('click',e=>{if(e.target.closest('a'))return;e.currentTarget.classList.toggle('flipped')});overlay.querySelector('[data-prev]').addEventListener('click',()=>{if(index>0){index--;render()}});overlay.querySelector('[data-next]').addEventListener('click',()=>{if(index<cards.length-1){index++;render()}})}
    try{const r=await fetch('./assets/quest/card-backs-20260907.json?v=remove-tsukushi-20260908');if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();cards=d.cards||[]}catch(e){cards=[]}
    if(!cards.length)return;overlay.style.display='block';overlay.scrollTop=0;render();}
  doc.defaultView.openSUGCardCollection=openCollection;
  const navButtons=doc.querySelectorAll('.bottom .nav button');if(navButtons[3]){navButtons[3].setAttribute('onclick','openSUGCardCollection()');navButtons[3].onclick=null;navButtons[3].addEventListener('click',openCollection)}
}

frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;if(!doc)return;
  const fix=doc.createElement('script');fix.textContent="window.openHomeMasashige=async function(){if(typeof chosen!=='undefined')chosen='河南町';if(typeof render==='function')render();if(typeof activateArea==='function')activateArea('河南町');if(typeof loadPersons==='function')await loadPersons();if(typeof openPerson==='function')openPerson('kusunoki-masashige')};";doc.body.appendChild(fix);
  const today=doc.querySelector('.today');if(today)today.setAttribute('onclick','openHomeMasashige()');
  installTenmaFoodQuest(doc);
  installCardCollection(doc);
  if(!doc.querySelector('script[data-tenma-persons]')){
    const css=doc.createElement('link');css.rel='stylesheet';css.href='./assets/quest/tenma-person-collection-20260906.css?v=tenma-persons-20260906b';css.dataset.tenmaPersons='';doc.head.appendChild(css);
    const script=doc.createElement('script');script.src='./assets/quest/tenma-person-collection-20260906.js?v=masashige-card-fix-20260907a';script.dataset.tenmaPersons='';doc.body.appendChild(script);
  }
});
</script></body></html>
