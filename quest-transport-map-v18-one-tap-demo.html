<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050403">
<title>S.u.G QUEST｜ONE TAP FIELD DEMO V18</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;overflow:hidden}iframe{position:fixed;inset:0;border:0;width:100%;height:100%;display:block;background:#000}.demoBtn{position:fixed;z-index:3000;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(350px,calc(100vw - 28px));border:1px solid #d4a74b;border-radius:999px;padding:14px 18px;background:linear-gradient(180deg,#f0d17d,#ae7f28);color:#171006;font-weight:1000;font-size:12px;letter-spacing:.06em;box-shadow:0 16px 36px #000c,0 0 26px #d8ad4b44;display:none}.demoBtn:disabled{opacity:.45}.stage{position:fixed;z-index:4000;inset:0;display:none;align-items:center;justify-content:center;padding:calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 9%,#3a2a0f,#080604 45%,#000 82%)}.stage.on{display:flex}.sheet{width:min(390px,94vw);text-align:center}.eyebrow{color:#d9b45d;font-size:9px;font-weight:900;letter-spacing:.2em}.big{margin:8px 0 5px;color:#fff0bd;font:700 30px Georgia,'Yu Mincho',serif}.sub{color:#b9ad99;font-size:10px;line-height:1.65}.pulse{width:84px;height:84px;margin:18px auto;border:2px solid #d5ad55;border-radius:50%;display:grid;place-items:center;color:#ffe29a;font-size:34px;box-shadow:0 0 34px #d5ad5544;animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 50px #d5ad5577}}.cardWrap{width:min(330px,82vw);aspect-ratio:3/4.7;margin:12px auto 0;perspective:1500px}.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .72s cubic-bezier(.2,.8,.2,1)}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;border:2px solid #d1a447;border-radius:22px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 20px 50px #000d,0 0 36px #d1a44733}.front{background:#080604;display:flex;flex-direction:column}.art{position:relative;flex:1;background:url('./assets/quest/tenma-michizane-20260906.webp?v=v18c') center top/cover no-repeat}.art:after{content:'';position:absolute;inset:38% 0 0;background:linear-gradient(#0000,#070504f0 88%)}.frontMeta{position:absolute;left:14px;right:14px;top:14px;display:flex;justify-content:space-between;z-index:2}.pill{padding:5px 8px;border:1px solid #b78b39;border-radius:999px;background:#080604d9;color:#f0c96d;font-size:8px;font-weight:900}.no{color:#d6ccb8;font:700 8px monospace;padding:6px}.frontBottom{position:relative;padding:12px 16px 18px;background:#070504}.name{color:#fff0c1;font:700 28px Georgia,'Yu Mincho',serif}.desc{margin-top:5px;color:#c5baa5;font-size:9px;line-height:1.55}.get{margin-top:10px;color:#8ff1a8;font-size:8px;font-weight:900;letter-spacing:.14em}.back{transform:rotateY(180deg);padding:16px;text-align:left;background:radial-gradient(circle at 50% 0,#24321c,#0b0c08 37%,#050403 74%)}.back h2{margin:5px 0 10px;color:#ffe4a0;font:700 25px Georgia,'Yu Mincho',serif}.metaRow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.mini{padding:4px 7px;border:1px solid #5c4924;border-radius:999px;color:#cbbd9e;font-size:7px;font-weight:800}.section{margin:7px 0;padding:9px 10px;border:1px solid #57441f;border-radius:11px;background:#0b0906d9}.section b{display:block;margin-bottom:4px;color:#e3bb60;font-size:8px;letter-spacing:.1em}.section p{margin:0;color:#e4dbc9;font-size:9px;line-height:1.55}.progress{display:flex;gap:5px;justify-content:center;margin:14px 0 0}.dot{width:6px;height:6px;border-radius:50%;background:#4b4234}.dot.on{background:#e2bd65;box-shadow:0 0 12px #e2bd6599}.album{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;margin:18px auto 0;padding:12px;border:1px solid #675126;border-radius:14px;background:#0a0806;text-align:left}.thumb{height:108px;border:1px solid #9a7532;border-radius:10px;background:url('./assets/quest/tenma-michizane-20260906.webp?v=v18c') center top/cover no-repeat}.album b{color:#f3d17d;font-size:12px}.album p{margin:5px 0 0;color:#b5ab9b;font-size:9px;line-height:1.55}.nextBox{margin-top:18px;padding:16px;border:1px solid #7c622d;border-radius:16px;background:linear-gradient(145deg,#171107,#090705)}.nextBox .tag{color:#93e8ac;font-size:8px;font-weight:900;letter-spacing:.14em}.nextBox h3{margin:7px 0;color:#fff0bd;font:700 25px Georgia,'Yu Mincho',serif}.nextBox p{margin:0;color:#c5b9a3;font-size:10px;line-height:1.65}.route{margin-top:12px;padding-top:10px;border-top:1px solid #443719;color:#e7c978!important}.done{margin-top:12px;color:#8f877a;font-size:8px}
</style>
</head>
<body>
<iframe id="app" src="./quest-transport-map-v16-deep-mission-fix.html?v=one-tap-v18c-20260907" allow="geolocation"></iframe>
<button id="fallbackBtn" class="demoBtn">PILOT FIELD TEST｜ONE TAP</button>
<div id="stage" class="stage"><div class="sheet" id="sheet"></div></div>
<script>
const BASE='sugQuestTransportV2',PILOT='sugQuestFieldV10',SEEN='sugQuestRevealSeenV11',DEMO='sugQuestV18DemoSeen';
const MICHIZANE_ART='./assets/quest/tenma-michizane-20260906.webp?v=v18c';
const app=document.getElementById('app'),fallbackBtn=document.getElementById('fallbackBtn'),stage=document.getElementById('stage'),sheet=document.getElementById('sheet');
let timers=[],installed=false,running=false;
function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t}
function read(k,f='{}'){try{return JSON.parse(localStorage.getItem(k)||f)}catch(e){return JSON.parse(f)}}
function write(k,v){localStorage.setItem(k,JSON.stringify(v))}
function findElementDeep(doc,id,depth=0){if(!doc||depth>14)return null;try{const own=doc.getElementById(id);if(own)return own;for(const frame of [...doc.querySelectorAll('iframe')]){try{const found=findElementDeep(frame.contentDocument,id,depth+1);if(found)return found}catch(e){}}}catch(e){}return null}
function walkDocs(doc,out=[],depth=0){if(!doc||depth>14)return out;out.push(doc);try{for(const f of [...doc.querySelectorAll('iframe')]){try{if(f.contentDocument)walkDocs(f.contentDocument,out,depth+1)}catch(e){}}}catch(e){}return out}
function patchMichizane(){for(const d of walkDocs(document,[])){try{if(d?.head&&!d.getElementById('sug-v18c-michizane')){const st=d.createElement('style');st.id='sug-v18c-michizane';st.textContent=`.card[data-id="13"] .art{background-image:linear-gradient(180deg,rgba(0,0,0,.03),rgba(0,0,0,.16)),url('${MICHIZANE_ART}')!important;background-position:center 18%!important;background-size:cover!important;background-repeat:no-repeat!important;color:transparent!important;text-shadow:none!important;font-size:0!important}#front .hero.sugMichizaneArt{background-image:linear-gradient(180deg,rgba(0,0,0,.03),rgba(0,0,0,.16)),url('${MICHIZANE_ART}')!important;background-position:center 16%!important;background-size:cover!important;background-repeat:no-repeat!important;color:transparent!important;text-shadow:none!important;font-size:0!important}`;d.head.appendChild(st)}const gridArt=d.querySelector('.card[data-id="13"] .art');if(gridArt&&gridArt.dataset.michizane!=='1'){gridArt.dataset.michizane='1';gridArt.textContent='';gridArt.setAttribute('aria-label','菅原道真カードアート')}const no=d.querySelector('#front .frontNo')?.textContent?.trim();if(no==='S01-13'){const hero=d.querySelector('#front .hero');if(hero&&hero.dataset.michizane!=='1'){hero.dataset.michizane='1';hero.textContent='';hero.classList.add('sugMichizaneArt');hero.setAttribute('aria-label','菅原道真カードアート')}const back=d.getElementById('back');if(back&&back.dataset.michizane!=='1'){back.dataset.michizane='1';back.innerHTML=`<div class="backType">S01-13 / PERSON</div><h2>菅原道真</h2><div class="section"><b>WHAT MOVED?</b><p>WATER / PEOPLE / GOODS / KNOWLEDGE・CULTURE</p></div><div class="section"><b>NEXT ROUTE</b><p>大阪天満宮 → 天満マンホール → 大川 → 堂島川 → 大阪湾</p></div><div class="section"><b>REGION / STATUS</b><p>TENMA｜GPS・5,000歩・人物QUEST CLEAR｜CARD COLLECTION保存済み。</p></div>`}}}catch(e){}}}
function cleanAccidentalKanan(){const b=read(BASE),p=read(PILOT,'{"steps":{},"quests":{},"got":{}}');if(!b.kanan&&!p.got?.['01']&&(p.steps?.kanan||0)===5000&&p.quests?.['kanan-person']){if(p.steps)delete p.steps.kanan;if(p.quests)delete p.quests['kanan-person'];write(PILOT,p)}}
function commitTenma(){cleanAccidentalKanan();const b=read(BASE);b.tenma=true;write(BASE,b);const p=read(PILOT,'{"steps":{},"quests":{},"got":{}}');p.steps=p.steps||{};p.quests=p.quests||{};p.got=p.got||{};p.steps.tenma=Math.max(Number(p.steps.tenma||0),5000);p.quests['tenma-person']=true;p.got['13']=true;write(PILOT,p);const s=read(SEEN,'[]');if(!s.includes('13'))s.push('13');write(SEEN,s);write(DEMO,{last:'13',at:Date.now(),mode:'pilot-one-tap'});try{app.contentWindow.location.reload()}catch(e){}}
function dots(n){return `<div class="progress">${[1,2,3,4].map(x=>`<span class="dot ${x<=n?'on':''}"></span>`).join('')}</div>`}
function stepGPS(){sheet.innerHTML=`<div class="eyebrow">PILOT FIELD CHECK</div><div class="pulse">◎</div><div class="big">TENMA GPS KEY</div><div class="sub">現地GPSの代わりに、天満到着KEYをテスト投入。<br>本番は対象地点180m以内でCHECK-IN。</div>${dots(1)}`}
function stepMission(){sheet.innerHTML=`<div class="eyebrow">MISSION COMPLETE</div><div class="pulse">✓</div><div class="big">5,000 STEPS<br>S01-13 CLEAR</div><div class="sub">菅原道真｜PERSON<br>GPS・歩数・QUEST CLEARを統合判定。</div>${dots(2)}`}
function stepCard(){sheet.innerHTML=`<div class="eyebrow">MISSION COMPLETE</div><div class="big">CARD GET</div><div class="cardWrap"><div id="card" class="card"><div class="face front"><div class="art"><div class="frontMeta"><span class="pill">PERSON</span><span class="no">S01-13</span></div></div><div class="frontBottom"><div class="name">菅原道真</div><div class="desc">天満の学問・水・都市の入口。</div><div class="get">TRANSPORT COLLECTION｜GET</div></div></div><div class="face back"><div class="eyebrow">CARD BACK</div><h2>菅原道真</h2><div class="metaRow"><span class="mini">TENMA</span><span class="mini">PERSON</span><span class="mini">S01-13</span><span class="mini">GET</span></div><div class="section"><b>WHAT MOVED?</b><p>WATER / PEOPLE / GOODS / KNOWLEDGE・CULTURE</p></div><div class="section"><b>NEXT ROUTE</b><p>大阪天満宮 → 大川 → 堂島川 → 大阪湾</p></div><div class="section"><b>MISSION STATUS</b><p>天満GPS・5,000歩・人物QUEST CLEAR。COLLECTIONへ保存済み。</p></div></div></div></div>${dots(3)}`;later(()=>document.getElementById('card')?.classList.add('flipped'),1350)}
function stepCollection(){sheet.innerHTML=`<div class="eyebrow">COLLECTION UPDATED</div><div class="big">1 / 24 GET</div><div class="album"><div class="thumb"></div><div><b>S01-13｜菅原道真</b><p>PERSON｜TENMA<br>取得済みとしてCOLLECTIONへ反映。</p></div></div>${dots(4)}`}
function stepNext(){sheet.innerHTML=`<div class="eyebrow">NEXT QUEST</div><div class="nextBox"><div class="tag">INFRA / MANHOLE</div><h3>S01-14<br>天満マンホール探索</h3><p>次は地上の歴史から地下インフラへ。マンホールをINFRA KEYにして、天満の「運搬」を追う。</p><p class="route">大阪天満宮 → 天満マンホール → 大川・堂島川 → SEASON 02「街から海へ」</p></div><div class="done">このあと自動でQUEST画面へ戻ります</div>${dots(4)}`}
function finish(){stage.classList.remove('on');running=false;const p=findElementDeep(document,'pilotBtn');if(p){p.disabled=false;p.textContent='PILOT FIELD TEST｜ONE TAP'}fallbackBtn.disabled=false;fallbackBtn.textContent='もう一度｜ONE TAP DEMO';patchMichizane()}
function run(){if(running)return;running=true;timers.forEach(clearTimeout);timers=[];const p=findElementDeep(document,'pilotBtn');if(p)p.disabled=true;fallbackBtn.disabled=true;stage.classList.add('on');commitTenma();stepGPS();later(stepMission,1200);later(stepCard,2400);later(stepCollection,5200);later(stepNext,6500);later(finish,11200)}
function installPilot(){const p=findElementDeep(document,'pilotBtn');if(!p)return false;p.textContent='PILOT FIELD TEST｜ONE TAP';p.dataset.v18='1';p.onclick=(e)=>{e.preventDefault();e.stopPropagation();run()};fallbackBtn.style.display='none';installed=true;return true}
fallbackBtn.onclick=run;
cleanAccidentalKanan();
app.addEventListener('load',()=>{let n=0;const t=setInterval(()=>{n++;patchMichizane();if(installPilot()||n>100){clearInterval(t);if(!installed)fallbackBtn.style.display='block'}},100)});
later(()=>{if(!installed&&!findElementDeep(document,'pilotBtn'))fallbackBtn.style.display='block'},2200);
setInterval(patchMichizane,900);
</script>
</body>
</html>
