<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1118">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<title>S.u.G QUEST｜MAP V2</title>
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<style>
:root{--gold:#e3b84d;--gold2:#ffe39a;--ink:#f8f4e9;--dark:#0b0f14;--green:#35c76f;--red:#dc4f44;--orange:#ee9037;--blue:#4b79ca;--gray:#5f6469}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1118;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink)}
button{font:inherit}
#map{position:fixed;inset:0 0 calc(78px + env(safe-area-inset-bottom)) 0;background:#cdd8cf}
.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{display:none}
.maplibregl-canvas{filter:saturate(.9) contrast(.98)}
.topbar{position:fixed;z-index:30;left:0;right:0;top:0;padding:calc(9px + env(safe-area-inset-top)) 12px 18px;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,rgba(8,14,21,.94),rgba(8,14,21,.72) 72%,transparent);pointer-events:none}
.logo{width:45px;height:45px;flex:none;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 30%,#263546,#0d151e 68%);color:var(--gold2);font:700 22px Georgia,"Yu Mincho",serif;box-shadow:0 8px 22px #0005}
.brand{min-width:0;flex:1}.brand b{display:block;color:#f4cf70;font:700 22px Georgia,"Yu Mincho",serif;letter-spacing:.045em;white-space:nowrap}.brand span{display:block;margin-top:1px;color:#ecedea;font-size:7px;font-weight:800;letter-spacing:.07em;opacity:.9;white-space:nowrap}
.metrics{display:flex;gap:5px}.metric{height:33px;padding:0 10px;border:1px solid #ffffff33;border-radius:999px;background:#0d141cdd;display:flex;align-items:center;gap:5px;font-size:10px;font-weight:900;box-shadow:0 5px 16px #0004}.metric i{font-style:normal;color:var(--gold)}
.area{position:fixed;z-index:28;left:12px;top:calc(75px + env(safe-area-inset-top));padding:8px 11px;border:1px solid #b68d3d;border-radius:11px;background:rgba(255,248,229,.94);color:#32240d;font-size:10px;font-weight:900;box-shadow:0 6px 18px #0002;backdrop-filter:blur(8px)}.area b{color:#9b6e13}
.menu{position:fixed;z-index:28;right:12px;top:calc(77px + env(safe-area-inset-top));width:44px;height:44px;border:1px solid #d8ae52;border-radius:50%;background:#111923e8;color:#f5d87e;font-size:20px;box-shadow:0 7px 18px #0004}
.recenter{position:fixed;z-index:28;right:13px;bottom:calc(174px + env(safe-area-inset-bottom));width:52px;height:52px;border:2px solid #d5aa50;border-radius:50%;background:#111923ea;color:#fff;font-size:23px;box-shadow:0 8px 20px #0005}
.modeBtn{position:fixed;z-index:28;right:14px;bottom:calc(236px + env(safe-area-inset-bottom));width:48px;height:48px;border:1px solid #d5aa50;border-radius:50%;background:#111923e8;color:#f4d079;font-size:17px;box-shadow:0 8px 20px #0004}
.next{position:fixed;z-index:27;left:12px;right:78px;bottom:calc(91px + env(safe-area-inset-bottom));min-height:76px;display:grid;grid-template-columns:58px 1fr 44px;gap:10px;align-items:center;padding:8px 9px;border:1px solid #b1883a;border-radius:17px;background:rgba(255,250,239,.95);color:#15130f;box-shadow:0 12px 28px #0004;backdrop-filter:blur(12px)}
.nextIcon{width:58px;height:58px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#5c4720,#1d170d);color:#ffe29b;font:700 27px Georgia,"Yu Mincho",serif}.next small{display:block;color:#7b6c54;font-size:8px;font-weight:900;letter-spacing:.08em}.next h3{margin:2px 0 3px;font-size:15px;line-height:1.2}.next p{margin:0;color:#756c5f;font-size:9px;line-height:1.35}.nextGo{width:40px;height:40px;border:0;border-radius:50%;background:#171a18;color:#f3cb68;font-size:24px}.nextGo.ready{background:#188c45;color:#fff;box-shadow:0 0 0 5px #36d87824}
.bottom{position:fixed;z-index:31;left:0;right:0;bottom:0;height:calc(78px + env(safe-area-inset-bottom));padding:7px 6px env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);background:linear-gradient(180deg,#121613f8,#060807);border-top:1px solid #8f6c2e;box-shadow:0 -8px 24px #0004}.nav{border:0;background:none;color:#d2cdc1;font-size:8px;font-weight:900;letter-spacing:.02em}.nav i{display:block;margin-bottom:3px;font-style:normal;font-size:23px}.nav.on{color:#f4cb68}.nav.on:after{content:"";display:block;width:52%;height:3px;margin:5px auto 0;border-radius:3px;background:#efc656}
.pinWrap{position:relative;display:grid;justify-items:center;transform:translateY(-4px);cursor:pointer}.pinLabel{margin-bottom:4px;padding:5px 7px;border:1px solid #fff9;border-radius:9px;background:#fffdf8;color:#171512;font-size:9px;font-weight:900;white-space:nowrap;box-shadow:0 3px 10px #0003}.pin{position:relative;width:45px;height:45px;border:3px solid #fff;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:20px;font-weight:900;box-shadow:0 0 0 3px var(--pin),0 7px 15px #0005;background:var(--pin)}.pin:after{content:"";position:absolute;width:10px;height:10px;bottom:-9px;left:50%;transform:translateX(-50%) rotate(45deg);background:var(--pin);border-right:2px solid #fff;border-bottom:2px solid #fff}.pinMini{margin-top:7px;padding:2px 6px;border-radius:999px;background:#111c;color:#fff;font-size:7px;font-weight:900;white-space:nowrap}.spot-shrine{--pin:#d84d43}.spot-history{--pin:#4a74c5}.spot-food{--pin:#ed9136}.spot-experience{--pin:#8c5bb7}.spot-manhole{--pin:#5a6066}
.player{position:relative;width:82px;height:98px;transform-origin:50% 100%;animation:idle 2.4s ease-in-out infinite;filter:drop-shadow(0 8px 5px #0005)}
.player svg{width:100%;height:100%;overflow:visible}.player:after{content:"";position:absolute;left:50%;bottom:-7px;width:76px;height:32px;transform:translateX(-50%);border:2px solid #79d9ff;border-radius:50%;background:#64cfff2a;box-shadow:0 0 0 9px #64cfff16,0 0 20px #32bfff88;z-index:-1}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.sheet{position:fixed;z-index:60;left:10px;right:10px;bottom:calc(84px + env(safe-area-inset-bottom));padding:12px;border:1px solid #a77d31;border-radius:20px;background:#0d1219f3;box-shadow:0 18px 45px #0009;backdrop-filter:blur(14px);transform:translateY(140%);transition:.24s ease;color:#fff}.sheet.on{transform:translateY(0)}.sheetTop{display:flex;align-items:center;gap:10px}.sheetBadge{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;background:#241c10;color:#ffe09a;font-size:22px;font-weight:900}.sheetText{flex:1;min-width:0}.sheetText b{display:block;color:#f5d77e;font-size:15px}.sheetText span{display:block;margin-top:3px;color:#aeb5bb;font-size:9px}.sheetClose{width:34px;height:34px;border:0;border-radius:50%;background:#ffffff10;color:#fff;font-size:18px}.sheetActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.sheetActions button{height:43px;border-radius:12px;font-weight:900}.routeBtn{border:1px solid #5e6b77;background:#111923;color:#dce7ee}.questBtn{border:1px solid #e3bd62;background:linear-gradient(#e2bd62,#a97822);color:#160f05}.questBtn.ready{border-color:#5bea89;background:linear-gradient(#46d578,#188b45);color:#fff}
.toast{position:fixed;z-index:90;left:50%;bottom:calc(176px + env(safe-area-inset-bottom));max-width:82vw;transform:translate(-50%,18px);opacity:0;padding:10px 14px;border-radius:999px;background:#0b1016e8;color:#fff;font-size:9px;font-weight:900;box-shadow:0 8px 24px #0006;transition:.2s;pointer-events:none;text-align:center}.toast.on{opacity:1;transform:translate(-50%,0)}
.loader{position:fixed;z-index:100;inset:0;display:grid;place-items:center;background:#0a1119;color:#f5d278;text-align:center}.loader b{display:block;font:700 25px Georgia,serif}.loader span{display:block;margin-top:8px;color:#aab4bd;font-size:9px;letter-spacing:.12em}.loader.hide{opacity:0;pointer-events:none;transition:.35s}
@media(max-width:365px){.brand b{font-size:19px}.metric{padding:0 7px}.next{right:70px}.pinLabel{font-size:8px}.player{width:74px;height:90px}}
</style>
</head>
<body>
<div id="map"></div>
<div class="loader" id="loader"><div><b>S.u.G QUEST</b><span>MAP LOADING...</span></div></div>
<header class="topbar"><div class="logo">S</div><div class="brand"><b>S.u.G QUEST</b><span>歩くほど、好きなまちが見えてくる</span></div><div class="metrics"><div class="metric"><i>S</i><span>1,240</span></div><div class="metric"><i>⌁</i><span id="steps">8,532</span></div></div></header>
<div class="area">📍 天満エリア　<b>QUEST 3 / 10</b></div>
<button class="menu" id="menuBtn" aria-label="menu">☰</button>
<button class="modeBtn" id="modeBtn" aria-label="tilt">◇</button>
<button class="recenter" id="recenter" aria-label="current location">➤</button>
<section class="next" id="nextCard"><div class="nextIcon" id="nextIcon">刀</div><div><small>NEXT QUEST</small><h3 id="nextName">國重刃物店</h3><p id="nextMeta">地図を読み込み中...</p></div><button class="nextGo" id="nextGo">›</button></section>
<nav class="bottom"><button class="nav on"><i>⌖</i>MAP</button><button class="nav" id="navQuest"><i>⚑</i>QUEST</button><button class="nav" id="navCollection"><i>▣</i>COLLECTION</button><button class="nav" id="navShop"><i>店</i>SHOP</button><button class="nav" id="navMy"><i>♙</i>MY PAGE</button></nav>
<section class="sheet" id="sheet"><div class="sheetTop"><div class="sheetBadge" id="sheetBadge">刀</div><div class="sheetText"><b id="sheetName"></b><span id="sheetMeta"></span></div><button class="sheetClose" id="sheetClose">×</button></div><div class="sheetActions"><button class="routeBtn" id="routeBtn">地図で見る</button><button class="questBtn" id="questBtn">QUEST START</button></div></section>
<div class="toast" id="toast"></div>
<script>
const TENMA=[135.5119,34.7017];
const spots=[
 {id:'kunishige',name:'國重刃物店',type:'history',icon:'刀',coord:[135.5118,34.6987],quest:true},
 {id:'tenmangu',name:'大阪天満宮',type:'shrine',icon:'鳥',coord:[135.512634,34.695530],quest:true},
 {id:'ryo',name:'焼肉ホルモン瞭',type:'food',icon:'肉',coord:[135.5115,34.7038],quest:true},
 {id:'tsukushi',name:'天満つくし D-Wish',type:'experience',icon:'蕎',coord:[135.5138264,34.7045485],quest:true},
 {id:'manhole',name:'マンホールSPOT',type:'manhole',icon:'◎',coord:[135.5144,34.7022],quest:false}
];
let map,userCoord=null,userMarker=null,selected=null,routeSourceReady=false,pitchMode=true;
const loader=document.getElementById('loader'),sheet=document.getElementById('sheet'),toastEl=document.getElementById('toast');
function toast(t){toastEl.textContent=t;toastEl.classList.add('on');clearTimeout(window.__toast);window.__toast=setTimeout(()=>toastEl.classList.remove('on'),1800)}
function hav(a,b){const R=6371000,dLat=(b[1]-a[1])*Math.PI/180,dLon=(b[0]-a[0])*Math.PI/180;const x=Math.sin(dLat/2)**2+Math.cos(a[1]*Math.PI/180)*Math.cos(b[1]*Math.PI/180)*Math.sin(dLon/2)**2;return Math.round(R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)))}
function fmtDist(m){return m<1000?m+' m':(m/1000).toFixed(1)+' km'}
function chibiHTML(){return `<div class="player"><svg viewBox="0 0 90 110" aria-hidden="true"><ellipse cx="45" cy="92" rx="23" ry="11" fill="#101b2b"/><path d="M27 51 Q18 67 24 91 L37 83 L45 103 L54 83 L67 91 Q72 68 63 51Z" fill="#10192b" stroke="#d1a33e" stroke-width="2"/><rect x="31" y="50" width="28" height="35" rx="9" fill="#121a2a" stroke="#d9ad47" stroke-width="2"/><path d="M32 59H58M31 68H59M34 77H56" stroke="#cf9d35" stroke-width="2"/><circle cx="45" cy="38" r="22" fill="#f5c6a7" stroke="#2b2119" stroke-width="2"/><path d="M23 37Q25 15 45 14Q67 14 68 38Q61 25 48 27Q37 23 23 37Z" fill="#202027"/><path d="M24 27Q45 9 66 27L62 16L50 22L45 8L39 22L27 16Z" fill="#141b2a" stroke="#e3b64b" stroke-width="3"/><path d="M45 7L39 19M45 7L45 19M45 7L51 19M45 7L33 21M45 7L57 21" stroke="#efc659" stroke-width="3" stroke-linecap="round"/><circle cx="45" cy="22" r="5" fill="#dba93f"/><circle cx="37" cy="39" r="3" fill="#432c22"/><circle cx="54" cy="39" r="3" fill="#432c22"/><path d="M40 48Q45 52 50 48" fill="none" stroke="#a05e54" stroke-width="1.5" stroke-linecap="round"/><path d="M26 57L13 81" stroke="#d9ae4a" stroke-width="4"/><path d="M64 58L77 79" stroke="#d9ae4a" stroke-width="4"/><path d="M64 56L80 43" stroke="#2a2522" stroke-width="5"/><path d="M64 56L80 43" stroke="#e2b54c" stroke-width="1.5"/></svg></div>`}
function markerHTML(s){const el=document.createElement('div');el.className='pinWrap spot-'+s.type;el.innerHTML=`<span class="pinLabel">${s.name}</span><span class="pin">${s.icon}</span><span class="pinMini">SPOT</span>`;el.addEventListener('click',e=>{e.stopPropagation();selectSpot(s,true)});return el}
function makeCircle(center,r=180,steps=60){const coords=[];const lat=center[1]*Math.PI/180;const dLat=r/111320,dLon=r/(111320*Math.cos(lat));for(let i=0;i<=steps;i++){const a=i/steps*Math.PI*2;coords.push([center[0]+Math.cos(a)*dLon,center[1]+Math.sin(a)*dLat])}return {type:'Feature',geometry:{type:'Polygon',coordinates:[coords]}}}
function lineFeature(a,b){return {type:'Feature',geometry:{type:'LineString',coordinates:[a,b]}}}
function setRoute(s){if(!s)return;const from=userCoord||TENMA;if(map.getSource('quest-route'))map.getSource('quest-route').setData(lineFeature(from,s.coord));map.easeTo({center:s.coord,zoom:16.8,pitch:58,bearing:-12,duration:900});}
function selectSpot(s,openSheet=false){selected=s;const d=userCoord?hav(userCoord,s.coord):null;document.getElementById('nextIcon').textContent=s.icon;document.getElementById('nextName').textContent=s.name;document.getElementById('nextMeta').textContent=d!=null?`現在地から ${fmtDist(d)}${d<=180?' ・ GPS圏内':''}`:'GPSを許可すると距離を表示';const go=document.getElementById('nextGo');go.classList.toggle('ready',d!=null&&d<=180);document.getElementById('sheetBadge').textContent=s.icon;document.getElementById('sheetName').textContent=s.name;document.getElementById('sheetMeta').textContent=d!=null?`現在地から ${fmtDist(d)} ｜ 判定半径 180m`:'位置情報を許可すると距離を計算';const qb=document.getElementById('questBtn');qb.classList.toggle('ready',d!=null&&d<=180);qb.textContent=d!=null&&d<=180?'GPS CHECK → MISSION':'QUEST START';if(openSheet)sheet.classList.add('on');if(map.getSource('quest-route'))map.getSource('quest-route').setData(lineFeature(userCoord||TENMA,s.coord));}
function nearest(){if(!userCoord)return spots[0];return spots.filter(s=>s.quest).map(s=>({s,d:hav(userCoord,s.coord)})).sort((a,b)=>a.d-b.d)[0].s}
function refreshNearest(){selectSpot(nearest(),false)}
function updateUser(c,accuracy){userCoord=c;if(!userMarker){const el=document.createElement('div');el.innerHTML=chibiHTML();userMarker=new maplibregl.Marker({element:el.firstElementChild,anchor:'bottom'}).setLngLat(c).addTo(map)}else userMarker.setLngLat(c);if(map.getSource('quest-range'))map.getSource('quest-range').setData(makeCircle(c,180));refreshNearest();}
function gps(){if(!navigator.geolocation){toast('この端末はGPSに対応していません');return}navigator.geolocation.getCurrentPosition(p=>{const c=[p.coords.longitude,p.coords.latitude];updateUser(c,p.coords.accuracy);map.easeTo({center:c,zoom:17.2,pitch:60,bearing:-12,duration:1000});toast('現在地を取得しました')},()=>toast('位置情報を許可してください'),{enableHighAccuracy:true,timeout:9000,maximumAge:4000})}
map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:TENMA,zoom:15.7,pitch:58,bearing:-12,maxPitch:75,attributionControl:false,antialias:true});
map.dragRotate.enable();map.touchZoomRotate.enableRotation();
map.on('load',()=>{
 loader.classList.add('hide');
 try{if(map.getSource('openmaptiles')&&!map.getLayer('sug-3d-buildings'))map.addLayer({id:'sug-3d-buildings',source:'openmaptiles','source-layer':'building',type:'fill-extrusion',minzoom:14,paint:{'fill-extrusion-color':['interpolate',['linear'],['get','render_height'],0,'#d6d0c3',40,'#b9b4aa',100,'#a6a39c'],'fill-extrusion-height':['coalesce',['get','render_height'],['get','height'],8],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':.62}})}catch(e){}
 map.addSource('quest-range',{type:'geojson',data:makeCircle(TENMA,180)});map.addLayer({id:'quest-range-fill',type:'fill',source:'quest-range',paint:{'fill-color':'#43b9ff','fill-opacity':.10}});map.addLayer({id:'quest-range-line',type:'line',source:'quest-range',paint:{'line-color':'#52c8ff','line-width':2,'line-opacity':.55}});
 map.addSource('quest-route',{type:'geojson',data:lineFeature(TENMA,spots[0].coord)});map.addLayer({id:'quest-route-line',type:'line',source:'quest-route',paint:{'line-color':'#e0b64e','line-width':4,'line-opacity':.72,'line-dasharray':[1.2,1.2]}});
 spots.forEach(s=>new maplibregl.Marker({element:markerHTML(s),anchor:'bottom'}).setLngLat(s.coord).addTo(map));
 refreshNearest();
 if(navigator.geolocation)navigator.geolocation.watchPosition(p=>updateUser([p.coords.longitude,p.coords.latitude],p.coords.accuracy),()=>{}, {enableHighAccuracy:true,maximumAge:5000,timeout:15000});
});
map.on('click',()=>sheet.classList.remove('on'));
document.getElementById('recenter').onclick=gps;
document.getElementById('modeBtn').onclick=()=>{pitchMode=!pitchMode;map.easeTo({pitch:pitchMode?58:0,bearing:pitchMode?-12:0,duration:600});document.getElementById('modeBtn').textContent=pitchMode?'◇':'□'};
document.getElementById('menuBtn').onclick=()=>toast('MAPを主役に固定。メニューは次段階で接続');
document.getElementById('sheetClose').onclick=()=>sheet.classList.remove('on');
document.getElementById('routeBtn').onclick=()=>{setRoute(selected||nearest());sheet.classList.remove('on')};
function startQuest(){const s=selected||nearest();const d=userCoord?hav(userCoord,s.coord):null;localStorage.setItem('sug_map_selected_spot',s.id);localStorage.setItem('sug_map_selected_name',s.name);localStorage.setItem('sug_map_selected_at',new Date().toISOString());if(d!=null&&d<=180)localStorage.setItem('sug_map_arrival_key',s.id);location.href='./quest-live.html'}
document.getElementById('questBtn').onclick=startQuest;
document.getElementById('nextGo').onclick=()=>{const s=selected||nearest();const d=userCoord?hav(userCoord,s.coord):null;if(d!=null&&d<=180)startQuest();else{setRoute(s);toast(d==null?'GPSボタンで現在地を取得':'あと '+fmtDist(d)+'。近づくとGPS CHECK')}};
document.getElementById('nextCard').onclick=e=>{if(e.target.closest('button'))return;selectSpot(selected||nearest(),true)};
document.getElementById('navQuest').onclick=()=>location.href='./quest-live.html';
document.getElementById('navCollection').onclick=()=>{location.href='./quest-live.html#collection'};
document.getElementById('navShop').onclick=()=>toast('SHOPはMAP完成後に接続');
document.getElementById('navMy').onclick=()=>location.href='./quest-member.html';
const savedSteps=localStorage.getItem('sug_member_steps');if(savedSteps)document.getElementById('steps').textContent=Number(savedSteps).toLocaleString('ja-JP');
</script>
</body>
</html>
