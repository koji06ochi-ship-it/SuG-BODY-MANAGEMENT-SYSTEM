<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050403">
<title>S.u.G QUEST｜DEEP MISSION FIX V16</title>
<style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<iframe id="app" src="./quest-transport-map-v15-arrival-state-test.html?v=deep-mission-v16-20260907" allow="geolocation"></iframe>
<script>
const app=document.getElementById('app');

function findElementDeep(doc,id,depth=0){
  if(!doc||depth>12)return null;
  try{
    const own=doc.getElementById(id);
    if(own)return own;
    const frames=[...doc.querySelectorAll('iframe')];
    for(const frame of frames){
      try{
        const found=findElementDeep(frame.contentDocument,id,depth+1);
        if(found)return found;
      }catch(e){}
    }
  }catch(e){}
  return null;
}

function getV13(){
  try{
    const v15=app.contentDocument;
    const f14=v15?.getElementById('app');
    const v14=f14?.contentDocument;
    const f13=v14?.getElementById('app');
    if(!f13?.contentWindow||!f13?.contentDocument)return null;
    return {w:f13.contentWindow,d:f13.contentDocument};
  }catch(e){return null}
}

function openMissionDeep(v13doc){
  const btn=findElementDeep(v13doc,'missionBtn');
  if(btn){btn.click();return true}
  return false;
}

function install(){
  const r=getV13();
  if(!r||r.w.__sugV16)return false;
  r.w.__sugV16=true;
  r.w.openMission=function(){
    try{const p=r.d.getElementById('panel');if(p)p.classList.remove('on')}catch(e){}
    if(!openMissionDeep(r.d)){
      setTimeout(()=>openMissionDeep(r.d),250);
    }
  };
  return true;
}

app.addEventListener('load',()=>{
  let n=0;
  const t=setInterval(()=>{n++;if(install()||n>80)clearInterval(t)},120);
});
</script>
</body>
</html>
