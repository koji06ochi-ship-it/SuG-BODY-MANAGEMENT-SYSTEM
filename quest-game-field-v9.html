<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#7ea5b7"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><title>S.u.G QUEST V9</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;background:#8cb0bd}canvas{position:fixed;inset:0;width:100%;height:100%}.hud{position:fixed;z-index:5;inset:0;pointer-events:none}.logo{position:absolute;left:14px;top:calc(10px + env(safe-area-inset-top));width:250px;padding:9px 13px;background:linear-gradient(#f5e6bd,#d4bb7f);border:3px solid #51351b;border-radius:5px;box-shadow:0 5px 13px #0006;color:#20150d}.logo b{font:900 21px Georgia,"Yu Mincho",serif}.logo small{display:block;font-size:9px;font-weight:900}.area{position:absolute;right:14px;top:calc(10px + env(safe-area-inset-top));width:124px;padding:8px;background:#241a11e8;border:2px solid #c79b49;border-radius:7px;color:#f4d99a}.area b{font:900 14px "Yu Mincho",serif}.area small{display:block;font-size:9px}.gps{position:absolute;left:14px;top:calc(82px + env(safe-area-inset-top));padding:7px 10px;background:#191712e8;border:2px solid #c69b48;border-radius:999px;color:#f4dda6;font-size:9px;font-weight:900}.locate{pointer-events:auto;position:absolute;right:16px;top:calc(87px + env(safe-area-inset-top));width:52px;height:52px;border-radius:50%;background:#171713;border:3px solid #d3aa52;color:#f2d57a;font-size:22px}.next{position:absolute;left:15px;bottom:calc(88px + env(safe-area-inset-bottom));width:min(315px,76vw);padding:9px 12px;background:linear-gradient(#f5e7c0,#d5bc80);border:3px solid #52361c;border-radius:6px;box-shadow:0 7px 18px #0007;color:#21150d}.next small{font-weight:900;color:#78532b}.next b{display:block;font:900 19px "Yu Mincho",serif}.next span{font-size:11px;font-weight:800}.bottom{pointer-events:auto;position:absolute;left:0;right:0;bottom:0;height:78px;padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);background:linear-gradient(#191713f8,#080b0df8);border-top:3px solid #977136}.nav{border:0;border-right:1px solid #594627;background:transparent;color:#d6bb77;font-size:8px;font-weight:900}.nav b{display:block;font-size:21px}.nav.on{background:#312514;color:#ffe19b}.sheet{pointer-events:auto;position:absolute;z-index:8;left:0;right:0;bottom:-75vh;max-height:64vh;overflow:auto;padding:15px 16px calc(90px + env(safe-area-inset-bottom));background:linear-gradient(#f5e8c4,#d6bf89);border-top:4px solid #51351b;border-radius:20px 20px 0 0;transition:.2s;color:#2a1c10}.sheet.on{bottom:0}.close{float:right;border:0;border-radius:50%;width:38px;height:38px;background:#21170f;color:#f4da94;font-size:20px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{padding:13px;border-radius:9px;border:2px solid #56391c;font-weight:900}.go{background:#dfbe70}.claim{background:#243e2d;color:#d8f2df}</style></head><body><canvas id="game"></canvas><div class="hud"><div class="logo"><b>S.u.G QUEST</b><small>歩いてつなぐ、歴史とカラダ</small></div><div class="area"><b>天満エリア</b><small id="prog">QUEST 0 / 6</small></div><div id="gps" class="gps">GPS待機中</div><button id="locate" class="locate">◎</button><div class="next"><small>NEXT QUEST</small><b id="nextName">近くのQUEST POINT</b><span id="nextDist">GPSで探索中</span></div><nav class="bottom"><button class="nav on"><b>⛩</b>MAP</button><button id="quest" class="nav"><b>▤</b>QUEST</button><button id="collection" class="nav"><b>◇</b>COLLECTION</button><button class="nav"><b>店</b>SHOP</button><button id="body" class="nav"><b>＋</b>BODY</button></nav><section id="sheet" class="sheet"><button id="close" class="close">×</button><h2 id="sheetName"></h2><p id="sheetText"></p><div class="actions"><button id="go" class="btn go">ここへ行く</button><button id="claim" class="btn claim">GPS CHECK</button></div></section></div><script>
const cv=document.getElementById('game'),x=cv.getContext('2d'),D=devicePixelRatio||1;function resize(){cv.width=innerWidth*D;cv.height=innerHeight*D;x.setTransform(D,0,0,D,0,0);draw()}addEventListener('resize',resize);const STORE='sugQuestMapHomeV1',MAX=12,REQ=15;let state;try{state=JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){state={}}if(!Array.isArray(state.owned))state.owned=[];const save=()=>localStorage.setItem(STORE,JSON.stringify(state));const P=[{id:'osaka-tenmangu',n:'大阪天満宮',lat:34.6961,lng:135.5125,m:'⛩',r:90},{id:'temma-station',n:'JR 天満駅',lat:34.7049,lng:135.5113,m:'駅',r:90},{id:'ogimachi',n:'扇町公園',lat:34.7051,lng:135.5088,m:'休',r:100},{id:'shop-pilot',n:'店舗POINT',lat:34.7041,lng:135.5095,m:'店',r:90},{id:'water-pilot',n:'給水POINT',lat:34.7033,lng:135.5078,m:'水',r:90},{id:'sug-pilot',n:'S.u.G POINT',lat:34.7024,lng:135.5102,m:'S',r:90}];let user={lat:34.7032,lng:135.5105},real=false,last=null,walk=0,speed=null,selected=null,hit=[];function hav(a,b){const R=6371000,p=Math.PI/180,d1=(b.lat-a.lat)*p,d2=(b.lng-a.lng)*p,z=Math.sin(d1/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(z))}function project(p){let dx=(p.lng-user.lng)*90000,dy=(p.lat-user.lat)*111000;let scale=1.0;return {x:innerWidth/2+dx*.75,y:innerHeight*.60-dy*.42,scale:Math.max(.62,Math.min(1.18,1-dy/1800))}}function rr(a,b,c,d,r){x.beginPath();x.roundRect(a,b,c,d,r);x.fill()}function draw(){let W=innerWidth,H=innerHeight;x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#8bb6c5');g.addColorStop(.23,'#c5d0a0');g.addColorStop(1,'#b8aa78');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#8eb67e';x.beginPath();x.moveTo(0,H*.24);x.lineTo(W,H*.18);x.lineTo(W,H);x.lineTo(0,H);x.fill();x.fillStyle='#739b62';for(let i=0;i<14;i++){let yy=H*.25+i*55;x.fillRect(0,yy,W,22)}x.strokeStyle='#d8cda5';x.lineWidth=16;for(let i=-3;i<8;i++){x.beginPath();x.moveTo(W*.5+i*75,H*.18);x.lineTo(W*.5+i*125,H*.88);x.stroke()}x.strokeStyle='#eadfbd';x.lineWidth=7;for(let i=-3;i<8;i++){x.beginPath();x.moveTo(W*.5+i*75,H*.18);x.lineTo(W*.5+i*125,H*.88);x.stroke()}x.fillStyle='#a9cbd2';x.beginPath();x.moveTo(0,H*.31);x.bezierCurveTo(W*.25,H*.28,W*.68,H*.34,W,H*.27);x.lineTo(W,H*.34);x.bezierCurveTo(W*.7,H*.41,W*.25,H*.34,0,H*.39);x.fill();x.fillStyle='#6f915e';for(let i=0;i<30;i++){let bx=(i*83)%W,by=H*.30+((i*137)%Math.max(1,H*.48)),bw=28+(i%4)*9,bh=18+(i%3)*7;x.fillRect(bx,by,bw,bh)}x.fillStyle='#335b3b';for(let i=0;i<18;i++){let tx=(i*119)%W,ty=H*.28+((i*97)%Math.max(1,H*.46));x.beginPath();x.arc(tx,ty,7+(i%4),0,7);x.fill()}x.fillStyle='#4d6846';x.font='900 22px Yu Mincho';x.fillText('大阪城',W*.72,H*.22);x.font='900 15px Yu Mincho';x.fillText('扇町公園',W*.08,H*.47);x.fillText('天神橋筋商店街',W*.63,H*.57);hit=[];let sorted=P.map(p=>({...p,q:project(p)})).sort((a,b)=>a.q.y-b.q.y);for(const p of sorted)drawPoint(p);drawHero();}
function drawPoint(p){let q=p.q,s=q.scale,ww=62*s,hh=94*s;x.save();x.translate(q.x,q.y);x.shadowColor='#0008';x.shadowBlur=9;x.fillStyle=state.owned.includes(p.id)?'#b6aa88':'#f0dfb0';x.strokeStyle='#4d3119';x.lineWidth=3*s;rr(-ww/2,-hh,ww,hh-16*s,5);x.strokeRect(-ww/2,-hh,ww,hh-16*s);x.shadowBlur=0;x.fillStyle='#21160f';x.beginPath();x.arc(0,-36*s,19*s,0,7);x.fill();x.fillStyle='#f0cf69';x.textAlign='center';x.font=`900 ${16*s}px Yu Mincho`;x.fillText(p.m,0,-30*s);x.fillStyle='#25180f';x.font=`900 ${12*s}px Yu Mincho`;let name=p.n.replace('POINT','');x.fillText(name,0,-65*s);x.fillStyle='#c73425';x.beginPath();x.arc(0,-5*s,8*s,0,7);x.fill();x.strokeStyle='#f0c45d';x.stroke();x.restore();hit.push({p,x:q.x,y:q.y-hh/2,r:42*s})}function drawHero(){let W=innerWidth,H=innerHeight,cx=W/2,cy=H*.68;x.save();x.translate(cx,cy);x.fillStyle='#45c9f033';x.strokeStyle='#65dcff';x.lineWidth=3;x.beginPath();x.ellipse(0,42,60,18,0,0,7);x.fill();x.stroke();x.shadowColor='#0008';x.shadowBlur=10;x.fillStyle='#101217';rr(-35,-70,70,43,18);x.strokeStyle='#d9ad45';x.lineWidth=5;x.strokeRect(-33,-68,66,39);x.beginPath();x.moveTo(-28,-63);x.lineTo(-48,-95);x.moveTo(28,-63);x.lineTo(48,-95);x.stroke();x.fillStyle='#e1b18b';rr(-21,-29,42,39,11);x.fillStyle='#17110d';x.beginPath();x.arc(-8,-14,2,0,7);x.arc(8,-14,2,0,7);x.fill();x.fillStyle='#132b4b';rr(-31,8,62,58,8);x.strokeStyle='#d0a23e';x.lineWidth=4;x.strokeRect(-29,10,58,54);x.fillStyle='#f0cf69';x.font='900 21px Yu Mincho';x.textAlign='center';x.fillText('菊',0,45);x.fillStyle='#19130f';x.save();x.rotate(.28);rr(34,-1,8,67,4);x.restore();x.restore()}
function nearest(){let z=P.map(p=>[p,hav(user,p)]).sort((a,b)=>a[1]-b[1])[0];nextName.textContent=z[0].n;nextDist.textContent=`あと 約${Math.round(z[1])}m`;return z}function pos(g){let n={lat:g.coords.latitude,lng:g.coords.longitude,t:g.timestamp};if(last){let ds=hav(last,n),dt=(n.t-last.t)/1000,calc=dt>0?ds/dt*3.6:null;speed=g.coords.speed!=null?g.coords.speed*3.6:calc;if(dt>0&&ds<120&&speed!=null&&speed<=MAX)walk+=ds}last=n;user=n;real=true;gps.textContent=`GPS LIVE｜${speed==null?'--':speed.toFixed(1)} km/h｜歩行 ${Math.round(walk)}m`;nearest();draw()}navigator.geolocation?.watchPosition(pos,()=>gps.textContent='GPS取得不可',{enableHighAccuracy:true,maximumAge:1000,timeout:15000});cv.addEventListener('click',e=>{for(const h of hit){if(Math.hypot(e.clientX-h.x,e.clientY-h.y)<h.r){selected=h.p;sheetName.textContent=h.p.n;let d=hav(user,h.p);sheetText.textContent=`距離 約${Math.round(d)}m ／ GPS到達・${MAX}km/h以下・歩行${REQ}mでCARD GET`;sheet.classList.add('on');break}}});close.onclick=()=>sheet.classList.remove('on');go.onclick=()=>selected&&(location.href=`https://maps.apple.com/?daddr=${selected.lat},${selected.lng}&dirflg=w`);claim.onclick=()=>{if(!selected||!real)return alert('GPS取得中');let d=hav(user,selected);if(d>selected.r)return alert(`あと約${Math.round(d-selected.r)}m`);if(speed!=null&&speed>MAX)return alert('高速移動中は取得できません');if(walk<REQ)return alert(`歩行判定 あと${Math.ceil(REQ-walk)}m`);if(!state.owned.includes(selected.id)){state.owned.push(selected.id);save();prog.textContent=`QUEST ${state.owned.length} / ${P.length}`;sheet.classList.remove('on');draw();alert('CARD GET! '+selected.n)}else alert('取得済み')};locate.onclick=()=>{nearest();draw()};quest.onclick=()=>location.href='./quest-battle-mvp-v20.html?v=game-v9';body.onclick=()=>location.href='./index.html?v=game-v9';collection.onclick=()=>alert(`MAP CARD ${state.owned.length}/${P.length}`);prog.textContent=`QUEST ${state.owned.length} / ${P.length}`;resize();nearest();
</script></body></html>
